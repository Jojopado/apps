<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>控盤台</title>
<style>
:root{--bg:#120f17;--card:#1d1824;--card2:#272030;--line:#352c40;--text:#f1edf6;--sub:#9a8fab;--accent:#ff9f43;--up:#ff4d5e;--down:#1fc67a}
:root[data-theme="light"]{--bg:#f5f3f8;--card:#fff;--card2:#efebf4;--line:#ddd5e7;--text:#1d1726;--sub:#6c6280}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:1100px;margin:0 auto;padding:12px 16px 60px}
h1{font-size:20px;margin:6px 0 10px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--sub);font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.b{padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card2);cursor:pointer}
.b.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.b.go{background:var(--accent);border-color:var(--accent);color:#1a1005;font-weight:800}
.b.red{background:var(--up);border-color:var(--up);color:#fff}
.b.grn{background:var(--down);border-color:var(--down);color:#fff}
label{display:block;color:var(--sub);font-size:12px;margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--card2)}
input[type=range]{padding:0}
input[type=checkbox]{width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
td,th{padding:4px 5px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
th{color:var(--sub);font-weight:600}
.scroll{max-height:340px;overflow:auto}
.stat{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{padding:3px 10px;border-radius:999px;background:var(--card2);font-weight:700}
#gate{max-width:320px;margin:20vh auto;text-align:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="gate"><h1>🎛️ 控盤台</h1><input id="pw" type="password" inputmode="numeric" placeholder="密碼"><div class="btns" style="justify-content:center"><button class="b go" id="pwBtn">進入</button></div><div class="sub" id="pwMsg"></div></div>
<main id="app" style="display:none">
  <h1>🎛️ 操盤人生・控盤台</h1>
  <div class="card" style="margin-bottom:12px"><div class="stat" id="status"></div></div>
  <div class="cols">
    <div class="card">
      <h2>🕒 市場</h2>
      <div class="btns"><button class="b" data-mode="test">測試：全天開盤</button><button class="b" data-mode="real">真實時間（週一～五 09:00–13:30）</button></div>
      <div class="btns"><button class="b" id="pauseBtn">暫停交易</button><button class="b" id="autoBtn">自動新聞</button></div>
      <label>波動倍率 <b id="volV">1.0</b>×（1 = 真實股市）</label>
      <input type="range" id="vol" min="0.2" max="5" step="0.1" value="1">
      <div class="btns"><button class="b" id="volBtn">套用波動</button></div>
    </div>
    <div class="card">
      <h2>🌡️ 大盤氣氛</h2>
      <div class="btns"><button class="b" data-reg="bull">🐂 多頭</button><button class="b" data-reg="flat">😐 盤整</button><button class="b" data-reg="bear">🐻 空頭</button></div>
      <div class="row2"><div><label>崩盤／噴出持續（分）</label><input id="regMin" type="number" value="8" min="1" max="120"></div><div><label>結束後變成</label><select id="regAfter"><option value="bear">空頭</option><option value="flat">盤整</option><option value="bull">多頭</option></select></div></div>
      <div class="btns"><button class="b red" data-reg="crash">💥 崩盤（約 -1.5%/分）</button><button class="b grn" data-reg="rally">🚀 噴出（約 +1%/分）</button></div>
    </div>
    <div class="card">
      <h2>🎚️ 個股力道（主力進出）</h2>
      <label>股票</label><select id="bSym"></select>
      <label>方向與力道：每小時 <b id="bRateV">+0%</b></label>
      <input type="range" id="bRate" min="-30" max="30" step="1" value="0">
      <div class="row2"><div><label>持續（分）</label><input id="bMin" type="number" value="30"></div><div><label>立刻跳動（%）</label><input id="jPct" type="number" value="5"></div></div>
      <div class="btns"><button class="b go" id="biasBtn">套用力道</button><button class="b" id="biasStop">停止力道</button><button class="b" id="jumpBtn">立刻跳動</button></div>
    </div>
    <div class="card">
      <h2>📰 發新聞</h2>
      <div class="row2"><div><label>影響對象</label><select id="nTgt"></select></div><div><label>標籤</label><select id="nTag"><option>快訊</option><option>傳聞</option><option>總經</option><option>產業</option><option>財報</option></select></div></div>
      <label>標題（玩家看得到）</label><input id="nTitle" maxlength="80" placeholder="例：星核科技拿下史上最大訂單">
      <label>內文（選填）</label><textarea id="nBody" rows="2" maxlength="300"></textarea>
      <div class="row2"><div><label>股價反應（%）</label><input id="nImp" type="number" value="5"></div><div><label>幾分鐘內反應完</label><input id="nMin" type="number" value="1" step="0.5"></div></div>
      <label><input type="checkbox" id="nFake"> 假消息：<input id="nRev" type="number" value="5" style="width:60px;display:inline-block"> 分鐘後自動發澄清並跌回去（只限個股）</label>
      <div class="btns"><button class="b go" id="newsBtn">發布</button></div>
    </div>
    <div class="card">
      <h2>📊 公布財報</h2>
      <label>股票</label><select id="eSym"></select>
      <div class="row2"><div><label>市場預期營收成長（%）</label><input id="eExp" type="number" value="10"></div><div><label>實際（%）</label><input id="eAct" type="number" value="18"></div></div>
      <div class="sub">股價看的是「實際 − 預期」；小幅超預期有機會「利多出盡」反而跌。</div>
      <div class="btns"><button class="b go" id="earnBtn">公布</button></div>
    </div>
    <div class="card">
      <h2>⏳ 排程中的事件</h2><div id="pending" class="sub">—</div>
      <h2 style="margin-top:12px">🎚️ 生效中的力道</h2><div id="biasList" class="sub">—</div>
    </div>
  </div>
  <div class="cols" style="margin-top:12px">
    <div class="card"><h2>📈 股價</h2><div class="scroll"><table id="pxTbl"></table></div></div>
    <div class="card"><h2>👀 玩家（<span id="pCount">0</span>）</h2><div class="scroll"><table id="plTbl"></table></div></div>
    <div class="card"><h2>💰 玩家押在哪（持股市值）</h2><div class="scroll"><table id="exTbl"></table></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>☠️ 危險區</h2><div class="sub">清空整個遊戲：所有玩家、股價、K 線重來。</div><div class="btns"><button class="b" id="wipeAsk">清空遊戲…</button><button class="b red" id="wipeYes" style="display:none">真的清空</button></div></div>
</main>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
(function(){
'use strict';
var SD = window.STOCK_DATA, G = SD.GAME, DB = G.DB, COMP = SD.COMPANIES, SEC = SD.SECTORS;
var BY = {}; COMP.forEach(function(c){ BY[c.sym] = c; });
var SECBY = {}; SEC.forEach(function(s){ SECBY[s.id] = s; });
var HASH = '83610c19fdd981f65d63d42099f77f73cafe707c4419dfa9ce786920b0d9fb7b';
var M = null, A = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(v){ return v == null ? '—' : '$' + Math.round(v).toLocaleString('en-US'); }
function pct(v){ return (v > 0 ? '+' : '') + (v*100).toFixed(2) + '%'; }
function cls(v){ return v > 1e-9 ? 'up' : v < -1e-9 ? 'down' : 'flat'; }
var tt; function toast(m){ var e = $('toast'); e.textContent = m; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ e.classList.remove('show'); }, 1800); }
function cmd(o){ return fetch(DB + '/cmd.json', {method:'POST', body: JSON.stringify(o)}).then(function(r){ toast(r.ok ? '✅ 已送出（3 秒內生效）' : '❌ 失敗'); }).catch(function(){ toast('❌ 網路錯誤'); }); }
function sha(s){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }); }
function enter(){ $('gate').style.display = 'none'; $('app').style.display = ''; boot(); }
try{ if(sessionStorage.getItem('stk_adm') === HASH) setTimeout(enter, 0); }catch(e){}
$('pwBtn').onclick = function(){ sha('stk:' + $('pw').value.trim()).then(function(h){ if(h === HASH){ try{ sessionStorage.setItem('stk_adm', HASH); }catch(e){} enter(); } else $('pwMsg').textContent = '密碼不對'; }); };
$('pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('pwBtn').click(); });

function listen(path, cb){
  var cur = null;
  function setAt(obj, p, d){ var parts = p.split('/').filter(Boolean); if(!parts.length) return d; obj = obj && typeof obj === 'object' ? obj : {}; var o = obj; for(var i=0;i<parts.length-1;i++){ if(!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {}; o = o[parts[i]]; } if(d === null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]] = d; return obj; }
  function open(){ var es = new EventSource(DB + '/' + path + '.json');
    es.addEventListener('put', function(e){ var d = JSON.parse(e.data); cur = setAt(cur, d.path, d.data); cb(cur); });
    es.addEventListener('patch', function(e){ var d = JSON.parse(e.data); Object.keys(d.data || {}).forEach(function(k){ cur = setAt(cur, d.path + '/' + k, d.data[k]); }); cb(cur); });
    es.onerror = function(){ if(es.readyState === 2) setTimeout(open, 3000); }; }
  open();
}

function boot(){
  var opts = COMP.map(function(c){ return '<option value="' + c.sym + '">' + c.sym + ' ' + esc(c.name) + '</option>'; }).join('');
  $('bSym').innerHTML = opts; $('eSym').innerHTML = opts;
  $('nTgt').innerHTML = '<option value="all">🌐 整個市場</option>' + SEC.map(function(s){ return '<option value="' + s.id + '">' + s.icon + ' ' + esc(s.name) + '（產業）</option>'; }).join('') + opts;
  $('vol').oninput = function(){ $('volV').textContent = (+this.value).toFixed(1); };
  $('bRate').oninput = function(){ $('bRateV').textContent = (this.value > 0 ? '+' : '') + this.value + '%'; };
  listen('market', function(d){ M = d; draw(); });
  listen('adm', function(d){ A = d; draw(); });
  setInterval(draw, 5000);
}

document.addEventListener('click', function(ev){
  var t = ev.target.closest('button'); if(!t) return;
  var a;
  if((a = t.getAttribute('data-mode'))){ cmd({type:'mode', mode:a}); return; }
  if((a = t.getAttribute('data-reg'))){
    var timed = a === 'crash' || a === 'rally';
    cmd({type:'regime', name:a, min: timed ? +$('regMin').value || 8 : 0, after: $('regAfter').value}); return;
  }
  switch(t.id){
    case 'pauseBtn': cmd({type:'pause', v: !(M && M.paused)}); break;
    case 'autoBtn': cmd({type:'autonews', v: !!(A && A.noAuto)}); break;
    case 'volBtn': cmd({type:'vol', v: +$('vol').value}); break;
    case 'biasBtn': cmd({type:'bias', sym: $('bSym').value, rate: (+$('bRate').value)/100, min: +$('bMin').value || 30}); break;
    case 'biasStop': cmd({type:'bias', sym: $('bSym').value, rate: 0}); break;
    case 'jumpBtn': cmd({type:'jump', sym: $('bSym').value, pct: +$('jPct').value || 0, min: 0.2}); break;
    case 'newsBtn':
      if(!$('nTitle').value.trim()){ toast('請寫標題'); return; }
      cmd({type:'news', tgt: $('nTgt').value, tag: $('nTag').value, title: $('nTitle').value.trim(), body: $('nBody').value.trim(), impact: +$('nImp').value || 0, min: +$('nMin').value || 1, fake: $('nFake').checked, revMin: +$('nRev').value || 5});
      $('nTitle').value = ''; $('nBody').value = ''; break;
    case 'earnBtn': cmd({type:'earn', sym: $('eSym').value, exp: +$('eExp').value, act: +$('eAct').value}); break;
    case 'wipeAsk': $('wipeYes').style.display = ''; break;
    case 'wipeYes': cmd({type:'wipe'}); $('wipeYes').style.display = 'none'; break;
  }
});

var REG = {bull:'🐂 多頭', flat:'😐 盤整', bear:'🐻 空頭', crash:'💥 崩盤', rally:'🚀 噴出'};
function draw(){
  if(!M) return;
  var alive = Date.now() - M.t < 30000;
  var reg = A && A.regime ? A.regime : {name:'flat'};
  var ic = M.idx / (M.idxPrev || M.idx) - 1;
  $('status').innerHTML = '<span class="pill" style="color:' + (alive ? 'var(--down)' : 'var(--up)') + '">' + (alive ? '● 引擎運作中' : '⚠️ 引擎沒在跑') + '</span>' +
    '<span class="pill">' + (M.open ? '交易中' : M.paused ? '暫停' : '收盤') + '</span><span class="pill">' + (M.mode === 'test' ? '測試：全天' : '真實時間') + '</span>' +
    '<span class="pill">' + (REG[reg.name] || reg.name) + (reg.until ? '・剩 ' + Math.max(0, Math.round((reg.until - Date.now())/60000)) + ' 分' : '') + '</span>' +
    '<span class="pill">波動 ' + (A ? A.volMul : 1) + '×</span><span class="pill">自動新聞 ' + (A && A.noAuto ? '關' : '開') + '</span>' +
    '<span class="pill ' + cls(ic) + '">指數 ' + (+M.idx).toFixed(2) + '（' + pct(ic) + '）</span>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-mode]'), function(b){ b.classList.toggle('on', b.getAttribute('data-mode') === M.mode); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-reg]'), function(b){ b.classList.toggle('on', b.getAttribute('data-reg') === reg.name); });
  $('pauseBtn').textContent = M.paused ? '▶️ 恢復交易' : '⏸ 暫停交易';
  $('autoBtn').textContent = '自動新聞：' + (A && A.noAuto ? '關（按一下打開）' : '開（按一下關掉）');
  var rows = COMP.map(function(c){ var p = M.px[c.sym], pv = (M.prev || {})[c.sym] || p; return {c:c, p:p, v:p/pv - 1}; }).sort(function(a,b){ return b.v - a.v; });
  $('pxTbl').innerHTML = '<tr><th>股票</th><th>產業</th><th>股價</th><th>漲跌</th></tr>' + rows.map(function(r){ return '<tr><td>' + r.c.sym + ' ' + esc(r.c.name) + '</td><td>' + SECBY[r.c.sec].icon + '</td><td>' + r.p + '</td><td class="' + cls(r.v) + '">' + pct(r.v) + '</td></tr>'; }).join('');
  if(!A) return;
  var pl = A.players || [];
  $('pCount').textContent = pl.length;
  $('plTbl').innerHTML = '<tr><th>玩家</th><th>總資產</th><th>現金</th><th>持股</th></tr>' + pl.map(function(p){ var pos = Object.keys(p.pos || {}).map(function(s){ return s + '×' + p.pos[s]; }).join(' '); return '<tr><td>' + esc(p.name) + (p.resets ? ' 💸' + p.resets : '') + '</td><td>' + money(p.nw) + '</td><td>' + money(p.cash) + '</td><td style="text-align:left;font-size:11px">' + esc(pos || '—') + (p.open ? '（委託 ' + p.open + '）' : '') + '</td></tr>'; }).join('');
  var ex = Object.keys(A.expo || {}).map(function(s){ return [s, A.expo[s]]; }).sort(function(a,b){ return b[1] - a[1]; });
  $('exTbl').innerHTML = '<tr><th>股票</th><th>玩家持股市值</th></tr>' + (ex.length ? ex.map(function(e){ return '<tr><td>' + e[0] + ' ' + esc((BY[e[0]]||{}).name) + '</td><td>' + money(e[1]) + '</td></tr>'; }).join('') : '<tr><td colspan="2" class="sub">還沒有人持股</td></tr>');
  $('pending').innerHTML = (A.pending || []).length ? A.pending.map(function(p){ return '・' + Math.max(0, Math.round((p.at - Date.now())/1000)) + ' 秒後：' + esc(p.title) + (p.sym ? '（' + p.sym + (p.pct ? ' ' + pct(p.pct) : '') + '）' : ''); }).join('<br>') : '沒有';
  var bl = Object.keys(A.bias || {});
  $('biasList').innerHTML = bl.length ? bl.map(function(s){ var b = A.bias[s]; return '・' + s + ' 每小時 ' + pct(b.rate) + '，剩 ' + Math.max(0, Math.round((b.until - Date.now())/60000)) + ' 分'; }).join('<br>') : '沒有';
}
})();
</script>
</body>
</html>
