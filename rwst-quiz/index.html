<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RWST 期中測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --fg:#18202C; --muted:#5B6676; --line:#DCE1E8;
  --accent:#2450C4; --accent-soft:#E6ECFA;
  --good:#1D7F52; --good-soft:#E3F3EA; --bad:#B83A26; --bad-soft:#FBE9E5; --warn:#9A6B00;
  --sans:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1A2029; --fg:#E6EAF0; --muted:#97A2B2; --line:#2C3542;
  --accent:#86A6FF; --accent-soft:#1F2B47; --good:#5CC994; --good-soft:#163326; --bad:#F08B76; --bad-soft:#3A1F1A; --warn:#E3B341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --fg:#E6EAF0; --muted:#97A2B2; --line:#2C3542;
  --accent:#86A6FF; --accent-soft:#1F2B47; --good:#5CC994; --good-soft:#163326; --bad:#F08B76; --bad-soft:#3A1F1A; --warn:#E3B341; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 64px max(16px,env(safe-area-inset-right))}
h1{font-size:1.5rem;margin:0 0 4px;font-weight:600}
h2{font-size:1.1rem;margin:28px 0 10px;font-weight:600}
.sub{color:var(--muted);font-size:.9rem;margin:0}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modes{display:grid;gap:12px;margin-top:20px}
.mode{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.mode b{display:block;font-size:1.05rem;font-weight:600}
.mode span{color:var(--muted);font-size:.88rem}
.mode .n{float:right;font-family:var(--mono);font-size:.85rem;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left))) 16px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) 10px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.bar .grow{flex:1}
.bar .back{font-family:var(--sans);padding:6px 12px;min-height:36px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex;flex:1}
.meter i{display:block;height:100%}.meter .g{background:var(--good)}.meter .b{background:var(--bad)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.q .meta{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.q .stem{font-weight:500;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .l{font-family:var(--mono);font-weight:500;color:var(--muted);flex:none;width:1.4em}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default;color:inherit}
.tfrow{display:flex;gap:8px}.tfrow .opt{justify-content:center}
input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input.ok{border-color:var(--good);background:var(--good-soft)}input.no{border-color:var(--bad);background:var(--bad-soft)}
textarea{min-height:70px;resize:vertical}
.exp{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:.92rem}
.exp .v{font-weight:600}.exp .v.ok{color:var(--good)}.exp .v.no{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hint{color:var(--muted);font-size:.85rem}
.score{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.score .big{font-size:2.4rem;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;width:100%}
.card .term{font-size:1.5rem;font-weight:600}
.card .zh{color:var(--muted);margin-top:6px}
.card .def{margin-top:14px;font-size:1rem}
.selfck{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem}
.selfck input{width:20px;height:20px}
.sec-title{font-size:1rem;font-weight:600;margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// k: kind (tf / sc / mc / fill)；t: 章節；q: 題目；e: 解析
// tf: a = true/false
// sc: o = 選項，第一個是正確答案（顯示時會打亂）
// mc: o = 選項，前面加 * 的是正確答案（顯示時會打亂）
// fill: a = 可接受答案（不分大小寫）
const TOPICS={M0:"M0 倫理與 AI",J:"M1 期刊與指標",S:"M1 Title～Intro／3C",R:"M1 Methods～Conclusion",A:"M1 致謝與文獻",B:"M2 Abstract 時態"};
const BANK=[
// ===================== 是非 =====================
{k:"tf",t:"J",q:"The best journal for a paper is always the one with the highest impact factor.",a:false,e:"Best journal = strong fit between your paper, the journal, and its readers. Fit first, metrics second."},
{k:"tf",t:"J",q:"JIF measures citation rate over a 2-year publication window.",a:true,e:"JIF（Web of Science）＝2 年；CiteScore（Scopus）＝4 年。"},
{k:"tf",t:"J",q:"CiteScore is a metric provided by Web of Science.",a:false,e:"CiteScore 是 Scopus 的。WoS 只有 JIF、JCI。"},
{k:"tf",t:"J",q:"SJR, SNIP, and CiteScore are all Scopus-based metrics.",a:true,e:"Scopus 三個：CiteScore、SJR、SNIP。"},
{k:"tf",t:"J",q:"Raw JIFs can be compared directly across unrelated disciplines.",a:false,e:"DO NOT compare raw JIFs across unrelated disciplines."},
{k:"tf",t:"J",q:"JIF should not be treated as a measure of an individual paper's quality.",a:true,e:"Metrics describe journals, not individual papers."},
{k:"tf",t:"J",q:"Between 2005 and 2024, Asia's share of global scientific publishing increased from 23% to 49%.",a:true,e:"Asia +26 pp；North America 32%→16%；Europe 39%→26%。"},
{k:"tf",t:"J",q:"Europe's share of scientific articles increased between 2005 and 2024.",a:false,e:"Europe 39% → 26%（−13 pp）。"},
{k:"tf",t:"J",q:"According to Marv Bauer, 27% of papers in a journal were not cited within 5 years.",a:true,e:"Elsevier 編輯 Marv Bauer：27% 五年內零引用，令人 disconcerting。"},
{k:"tf",t:"J",q:"Citation counts are the only indicator of a paper's impact.",a:false,e:"Citation counts are only ONE indicator of impact."},
{k:"tf",t:"J",q:"Same research presented to a different audience may need a different presentation.",a:true,e:"Same research, different audience → different presentation."},
{k:"tf",t:"S",q:"\"A Study of…\" is a recommended way to begin a research paper title.",a:false,e:"\"A Study of…\" 是 words that add little value，要刪掉。"},
{k:"tf",t:"S",q:"A good abstract should be able to stand alone.",a:true,e:"Abstract can stand alone，讀者不看全文也懂。"},
{k:"tf",t:"S",q:"Using uncommon abbreviations in keywords helps make a paper unique and easier to find.",a:false,e:"Avoid uncommon abbreviations；要 specific, searchable, standard terminology。"},
{k:"tf",t:"S",q:"The Introduction should include a broad literature review of the entire field.",a:false,e:"Don't write a broad literature review of the entire field；只放最相關的前人研究。"},
{k:"tf",t:"S",q:"\"This is the first study…\" is an example of an unsupported claim of novelty that should be avoided.",a:true,e:"Introduction 的 Don't：unsupported novelty / priority claims。"},
{k:"tf",t:"S",q:"Coherent means \"no unnecessary words\".",a:false,e:"Concise = no unnecessary words；Coherent = easy to follow。"},
{k:"tf",t:"S",q:"\"Due to the fact that\" can usually be replaced with \"because\".",a:true,e:"Due to the fact that → because；In order to → to。"},
{k:"tf",t:"S",q:"Researchers should use their name consistently across publications (e.g., always \"David Chen\").",a:true,e:"Use your name consistently；用 ORCID iD 把著作連在一起。"},
{k:"tf",t:"R",q:"The Results section should interpret the meaning of findings extensively.",a:false,e:"Present the evidence clearly; interpret its meaning in the Discussion."},
{k:"tf",t:"R",q:"Figures are best for exact values, while tables are best for trends.",a:false,e:"反過來：figures for trends, tables for exact values。"},
{k:"tf",t:"R",q:"You should report only significant or favourable results.",a:false,e:"Results 的 Avoid：reporting only significant or favourable results。"},
{k:"tf",t:"R",q:"Every figure and table should be referred to in the text.",a:true,e:"Refer to every figure and table in the text."},
{k:"tf",t:"R",q:"New datasets or methods may be introduced in the Discussion if they support the argument.",a:false,e:"Discussion 和 Conclusion 都不可以引入新方法、新資料、新結果。"},
{k:"tf",t:"R",q:"Treating correlation as causation should be avoided in the Discussion.",a:true,e:"Avoid confusing correlation with causation."},
{k:"tf",t:"R",q:"\"More research is needed.\" is a good, specific statement of future work.",a:false,e:"太模糊。要具體，例如 \"Future research should explore model compression techniques to reduce computational cost.\""},
{k:"tf",t:"R",q:"In Methods, past tense is usually used for procedures actually performed.",a:true,e:"做過的步驟用過去式；已確立的方法、公式、系統特性用現在式。"},
{k:"tf",t:"R",q:"Data should be displayed simply because you have them.",a:false,e:"Do not display data simply because you have them."},
{k:"tf",t:"R",q:"The Conclusion synthesizes the overall message, while the Discussion interprets individual findings.",a:true,e:"Discussion：interprets individual findings；Conclusion：synthesizes the overall message。"},
{k:"tf",t:"A",q:"A technician who only configured the GPU cluster should be acknowledged rather than listed as an author.",a:true,e:"沒有參與設計、分析、改稿 → Acknowledgement，不是作者。"},
{k:"tf",t:"A",q:"You do not need permission before naming individuals in the Acknowledgements.",a:false,e:"Obtain permission before naming individuals."},
{k:"tf",t:"A",q:"Output from a reference manager can be used without manual checking.",a:false,e:"可以用 reference manager，但要 check the output manually。"},
{k:"tf",t:"A",q:"If an original study is available, you should cite it instead of a blog that summarizes it.",a:true,e:"Avoid citing secondary sources when the original source is available."},
{k:"tf",t:"A",q:"Every in-text citation must have a matching entry in the reference list.",a:true,e:"Every in-text citation has a matching reference."},
{k:"tf",t:"M0",q:"Asking AI to \"paraphrase this so Turnitin cannot detect it\" is an appropriate use.",a:false,e:"用 AI 躲抄襲偵測是 inappropriate。"},
{k:"tf",t:"M0",q:"Asking AI to explain academic vocabulary is normally acceptable.",a:true,e:"屬於 Use GAI According to Its Purpose（一般可接受）。"},
{k:"tf",t:"M0",q:"Translating an entire paper into academic English with AI is normally acceptable.",a:false,e:"\"Translate this entire paper into academic English.\" 通常不行；查單字、比較說法可以。"},
{k:"tf",t:"M0",q:"You may cite a source that AI summarized for you even if you have not read it yourself.",a:false,e:"Do not cite a source that you have not checked yourself. AI is not a substitute for the original source."},
{k:"tf",t:"M0",q:"Brainstorming and suggesting outlines with AI are allowed with acknowledgement.",a:true,e:"Use AI-Assisted Writing Carefully：Allowed with Acknowledgement。"},
{k:"tf",t:"M0",q:"Uploading unpublished manuscripts to a generative AI tool is acceptable as long as you cite the tool.",a:false,e:"Protect Research Data and IP：unpublished manuscripts 不可上傳。"},
{k:"tf",t:"M0",q:"The student remains responsible for every sentence, claim, citation, and reference submitted.",a:true,e:"12. The Student Remains Responsible。"},
{k:"tf",t:"M0",q:"Contract cheating means having another person complete your academic work for you.",a:true,e:"Academic integrity 三種違規：Plagiarism、Fabrication、Contract cheating。"},
{k:"tf",t:"B",q:"For very short abstracts, Purpose and Methods may be combined.",a:true,e:"Abstract Reduction → P+M。"},
{k:"tf",t:"B",q:"Tense in an abstract should be chosen by section alone, not by sentence function.",a:false,e:"Choose tense according to function and level of generality, not section alone."},
{k:"tf",t:"B",q:"\"The algorithm uses an attention mechanism.\" correctly uses present tense to describe how an established model works.",a:true,e:"M 的現在式用法：how the model works。"},
{k:"tf",t:"B",q:"\"Accuracy increases as the amount of training data increases.\" uses present tense because it states a general pattern.",a:true,e:"R 的現在式：general facts / patterns。"},
{k:"tf",t:"B",q:"In \"The results shows improved efficiency.\", the verb agrees correctly with the subject.",a:false,e:"results 是複數，要 showed（或 show）。"},
{k:"tf",t:"B",q:"Background sentences in an abstract typically use present or present perfect tense.",a:true,e:"B：Present（established facts）／Present perfect（previous research still relevant）。"},
{k:"tf",t:"B",q:"The Conclusion element of an abstract answers the question \"so what?\".",a:true,e:"C = What do the findings mean? Why do they matter?（so what?）"},

// ===================== 單選 =====================
{k:"sc",t:"S",q:"In the 3C principle, which one means \"no unnecessary words\"?",o:["Concise","Clear","Coherent","Correct"],e:"Clear = easy to understand；Concise = no unnecessary words；Coherent = easy to follow。"},
{k:"sc",t:"S",q:"Coherent means:",o:["Easy to follow","Easy to understand","No unnecessary words","Easy to cite"],e:"Coherent：one main idea per paragraph、句子間有邏輯推進。"},
{k:"sc",t:"S",q:"Writing \"blockchain ledger\" instead of \"system\" improves which C?",o:["Clear","Concise","Coherent","Creative"],e:"Clear：用具體詞代替模糊詞。"},
{k:"sc",t:"S",q:"\"Due to the fact that\" should be replaced with:",o:["because","in order to","therefore","basically"],e:"Due to the fact that → because。"},
{k:"sc",t:"S",q:"What should replace \"I think / I believe\" in academic writing?",o:["Evidence or passive voice","\"I strongly feel\"","\"Basically\"","\"It is important to note\""],e:"I think / I believe → 用證據或被動語態。"},
{k:"sc",t:"S",q:"How should a sentence beginning with \"There is / There are\" be revised?",o:["Start with the real subject","Add \"really\"","Use \"It is important to note\"","Keep it unchanged"],e:"There is / There are → 用真正的主詞開頭。"},
{k:"sc",t:"S",q:"Which advice matches the filler \"a little / a bit\"?",o:["Use specific quantifiers","Be direct","Replace with a stronger adjective","Replace with because"],e:"A little / A bit → specific quantifiers；Kind of / Sort of → be direct；Very → stronger adjective。"},
{k:"sc",t:"S",q:"Which title is the best?",o:["Machine Learning Approaches for Real-Time Cyberattack Detection","A Study on Different Aspects of Cybersecurity","An Investigation into Some Aspects of Artificial Intelligence","Some Thoughts on Computers"],e:"A good title = maximum clarity with no unnecessary words。"},
{k:"sc",t:"S",q:"Why is \"An Investigation into Some Aspects of Artificial Intelligence\" a weak title?",o:["It is vague and contains words that add little value","It is too specific","It is phrased as a question","It states the main finding"],e:"\"An Investigation into\"、\"Some Aspects\" 都是空話。"},
{k:"sc",t:"S",q:"What does an ORCID iD help with?",o:["Distinguishing researchers with similar names and linking their publications","Measuring a journal's impact","Checking plagiarism","Formatting references"],e:"ORCID iD：區分同名研究者，換名字或單位後還能把著作連在一起。"},
{k:"sc",t:"S",q:"Accurate author information ensures correct attribution, discoverability, and ___.",o:["accountability","novelty","impact factor","readability"],e:"…correct attribution, discoverability, and accountability."},
{k:"sc",t:"S",q:"Which abstract sentence is better?",o:["This paper proposes a graph-based clustering algorithm for large-scale social network analysis, achieving a 15% improvement in runtime compared with k-means.","This paper presents a new algorithm for data mining which is very powerful and useful for many applications.","This paper talks about some algorithms.","This paper is very important for data mining."],e:"具體方法＋量化結果＋比較基準。"},
{k:"sc",t:"S",q:"Which keyword set is the most effective?",o:["Blockchain consensus, Proof-of-stake, Distributed ledger, Cryptocurrency security","Technology, Computer, Internet, Data","System, Method, Result, Paper","A novel and efficient approach for secure distributed systems"],e:"Technology / Computer… 太廣；最後一個是過長片語。"},
{k:"sc",t:"S",q:"In the Introduction funnel, what comes right after \"Problem, limitation, or inconsistency\"?",o:["Research gap","Broad research context","Study contribution","What previous research tells us"],e:"Broad context → Previous research → Problem → Gap → Purpose → Contribution。"},
{k:"sc",t:"S",q:"What is the LAST step of the Introduction funnel?",o:["Study contribution","Research gap","Broad research context","Purpose, question, or hypothesis"],e:"漏斗由廣到窄，最後是 Study contribution。"},
{k:"sc",t:"S",q:"\"However, resource allocation remains a major challenge due to dynamic workloads.\" In the cloud example, this sentence states the:",o:["Problem","Broad context","Purpose","Contribution"],e:"However 開頭 → problem，從 what we know 轉到 what we still need to know。"},
{k:"sc",t:"S",q:"Which should NOT appear in the Introduction?",o:["Detailed methods, results, or conclusions","The research question or hypothesis","The research gap","Definitions of unfamiliar abbreviations"],e:"Don't present detailed methods, results, or conclusions。"},
{k:"sc",t:"S",q:"Title, Abstract, and Keywords must be clear and accurate mainly because they affect:",o:["Discoverability and indexing","The impact factor","Reproducibility","Peer review time"],e:"攸關 discoverability and indexing。"},
{k:"sc",t:"S",q:"In the article structure, what comes right after Keywords?",o:["Main text (Introduction…)","Abstract","Acknowledgements","References"],e:"Title → Authors → Abstract → Keywords → Main text → Acknowledgements → References → Supplementary material。"},
{k:"sc",t:"S",q:"\"Deep learning models are also widely used in medical image classification.\" inserted into a paragraph about students using GenAI for writing is mainly a problem of:",o:["Coherence","Clarity","Concision","Citation"],e:"跟主題無關、打斷論證 → coherence 問題。"},
{k:"sc",t:"J",q:"Which metric provides field-normalised citation impact in Web of Science?",o:["JCI","JIF","SJR","CiteScore"],e:"JCI = Journal Citation Indicator（WoS，field-normalised）。"},
{k:"sc",t:"J",q:"CiteScore measures citation impact using a ___ window.",o:["4-year","1-year","2-year","5-year"],e:"CiteScore 4 年；JIF 2 年。"},
{k:"sc",t:"J",q:"Which metric weights citations by source prestige?",o:["SJR","SNIP","JIF","JCI"],e:"SJR = SCImago Journal Rank：weighted by source prestige。"},
{k:"sc",t:"J",q:"Which metric adjusts citation impact for field differences in Scopus?",o:["SNIP","SJR","JIF","CiteScore"],e:"SNIP = Source Normalized Impact per Paper。"},
{k:"sc",t:"J",q:"Which database provides JIF?",o:["Web of Science","Scopus","Google Scholar","ORCID"],e:"JIF、JCI → Web of Science。"},
{k:"sc",t:"J",q:"According to the course data, which region produced about 49% of scientific articles in 2024?",o:["Asia","North America","Europe","South America"],e:"Asia 23% → 49%。"},
{k:"sc",t:"J",q:"North America's share of scientific articles in 2024 was about:",o:["16%","32%","26%","49%"],e:"North America 32% → 16%。"},
{k:"sc",t:"J",q:"The two major trends in scientific publishing are globalization and ___.",o:["rationalization","digitalization","privatization","localization"],e:"Globalization of Scientific Publishing／Rationalization in Standardization and Research Evaluation。"},
{k:"sc",t:"J",q:"In the class activity, why should Journal B (JIF 4.5, high topic fit) be chosen over Journal A (JIF 8.2, low topic fit)?",o:["Fit first, metrics second","Lower JIF journals are easier","Journal A is not Q1","Journal B is cheaper"],e:"兩本都是 Q1，B 的 topic fit 高、類似論文多、讀者對 → fit first。"},
{k:"sc",t:"J",q:"Journals seek research that is rigorous, relevant, ethical, and ___.",o:["clearly communicated","very long","highly cited by the author","novel in every sentence"],e:"Journals seek rigorous, relevant, ethical, and clearly communicated research."},
{k:"sc",t:"J",q:"Which of the following is NOT wanted by journals?",o:["Unnecessary duplication without clear added value","Fit with the journal's scope","Rigorous methods","Research integrity"],e:"Not wanted：duplication、limited relevance、outdated、unsupported conclusions、insufficient evidence。"},
{k:"sc",t:"J",q:"\"Write for the field. Format for the ___.\"",o:["journal","reader","supervisor","conference"],e:"Guide for Authors 的結論句。"},
{k:"sc",t:"J",q:"\"Metrics describe journals. They do not replace ___.\"",o:["critical judgement","peer review","citations","authors"],e:"Metrics describe journals. They do not replace critical judgement."},
{k:"sc",t:"R",q:"Use figures for ___ and tables for ___.",o:["trends / exact values","exact values / trends","methods / results","results / methods"],e:"Figures for trends, tables for exact values。"},
{k:"sc",t:"R",q:"Accuracy, precision, recall, F1-score, and latency belong to which part of Methods?",o:["Evaluation metrics","Datasets and preprocessing","Software and versions","Experimental setup"],e:"CIFAR-10 等是 datasets；PyTorch 是 software；hardware/hyperparameters 是 experimental setup。"},
{k:"sc",t:"R",q:"Hardware, hyperparameters, and simulation environment belong to:",o:["Experimental setup","Evaluation metrics","Algorithms or models","Statistical analysis"],e:"Experimental setup。"},
{k:"sc",t:"R",q:"The main goal of the Methods section is to provide enough detail for others to understand, evaluate, and ___ the study.",o:["reproduce","cite","publish","review"],e:"understand, evaluate, and reproduce。"},

iously published."], ["Citation", "引用", "A reference in the text to a source that was used."], ["Globalization (of publishing)", "全球化", "Scientific publishing becoming international; Asia now produces nearly half of publications."], ["Rationalization", "合理化", "Standardized, metric-based evaluation of research focusing on quality and impact."], ["Peer review", "同儕審查", "Evaluation of a manuscript by experts in the same field before publication."], ["Aims and scope", "期刊宗旨與範圍", "The topics and article types a journal publishes."], ["Journal metrics", "期刊指標", "Quantitative indicators of a journal's citation influence, visibility, and position in a field."], ["Journal Impact Factor (JIF)", "影響係數", "Web of Science metric: citation rate over a 2-year publication window."], ["Journal Citation Indicator (JCI)", "—", "Web of Science metric: field-normalised citation impact."], ["CiteScore", "—", "Scopus metric: citation impact using a 4-year window."], ["SJR (SCImago Journal Rank)", "—", "Scopus metric: citation impact weighted by source prestige."], ["SNIP (Source Normalized Impact per Paper)", "—", "Scopus metric: citation impact adjusted for field differences."], ["Quartile", "分區", "Ranking of journals in a field into four groups (Q1 = top 25%)."], ["Guide for Authors", "作者須知", "A journal's rules on structure, length, style, references, figures, and declarations."], ["Discoverability / Indexing", "可被搜尋／收錄", "How easily a paper can be found by readers and included in databases."], ["Affiliation", "服務單位", "The institution an author belongs to, written with its official name."], ["ORCID iD", "研究者識別碼", "A unique, persistent identifier that distinguishes researchers and links their publications."], ["Corresponding author", "通訊作者", "The author responsible for communication with the journal and readers."], ["Abstract", "摘要", "A concise stand-alone summary of the paper's background, purpose, methods, results, and conclusion."], ["Keywords", "關鍵字", "Specific, searchable terms that represent the main concepts of a paper."], ["IMRaD", "—", "Introduction, Methods, Results, and Discussion: the standard structure of a research paper."], ["Research gap", "研究缺口", "What previous research has not yet addressed and the current study aims to fill."], ["Hypothesis", "假設", "A testable prediction about the relationship between variables."], ["Introduction funnel", "漏斗結構", "Moving from broad context to previous research, gap, purpose, and contribution."], ["Reproducibility", "可重現性", "Others can repeat the study with the same methods and obtain similar results."], ["Baseline", "基準方法", "A standard method used for comparison with the proposed method."], ["Ablation study", "消融實驗", "Removing parts of a model to test each part's contribution."], ["Hyperparameter", "超參數", "A setting chosen before training, e.g., learning rate or number of epochs."], ["Evaluation metrics", "評估指標", "Measures of performance, e.g., accuracy, precision, recall, F1-score, latency."], ["Supplementary material", "補充資料", "Additional data or analyses provided outside the main paper."], ["Generalizability", "可推廣性", "The extent to which results apply beyond the tested data or conditions."], ["Limitation", "研究限制", "A weakness of the study that affects interpretation or generalizability."], ["Correlation vs. causation", "相關 vs 因果", "Two variables changing together does not prove that one causes the other."], ["Implication", "意涵", "What the findings mean in technical, practical, or theoretical terms."], ["Acknowledgements", "致謝", "Credit for support that does not qualify for authorship, including funding."], ["Self-citation", "自我引用", "Citing one's own previous work; excessive self-citation should be avoided."], ["Secondary source", "二手來源", "A source that reports on original research, e.g., a blog or review summary."], ["Reference manager", "文獻管理工具", "Software that formats references; its output must still be checked manually."], ["DOI", "數位物件識別碼", "Digital Object Identifier: a permanent link to a publication."], ["Cautious language (hedging)", "保留語氣", "Words like suggest, indicate, may, can that avoid overstating claims."], ["Modal verbs", "情態動詞", "Verbs such as may, might, can, could used for cautious implications."], ["Present perfect", "現在完成式", "Used for previous research still relevant (Several studies have investigated…)."]];
const KIND={tf:"是非",sc:"單選",mc:"複選",fill:"填空",term:"名詞解釋"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/["“”.,;:!?()]/g,"").replace(/\s+/g," ").trim();
BANK.forEach((q,i)=>q.id="q"+i);
const store={get(k,d){try{const v=localStorage.getItem("rwst_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("rwst_"+k,JSON.stringify(v))}catch(e){}}};

// 把一題準備成可作答的物件（選項打亂）
function prep(q){
  const p={...q};
  if(q.k==="sc"){const o=q.o.map((t,i)=>({t,c:i===0}));p.opts=shuffle(o)}
  if(q.k==="mc"){p.opts=shuffle(q.o.map(t=>({t:t.replace(/^\*/,""),c:t.startsWith("*")})))}
  if(q.k==="tf"){p.opts=[{t:"True",c:q.a===true},{t:"False",c:q.a===false}]}
  return p;
}
function grade(p,ans){
  if(p.k==="fill") return ans!=null && p.a.map(norm).includes(norm(ans));
  if(p.k==="mc"){if(!ans||!ans.size)return false;return p.opts.every((o,i)=>o.c===ans.has(i))}
  return ans!=null && p.opts[ans].c;
}
function answerText(p){
  if(p.k==="fill") return p.a[0];
  return p.opts.filter(o=>o.c).map(o=>o.t).join("；");
}

function runPractice(list,title){

    $("#bk").onclick=home;
    renderQ($("#qbox"),p,{instant:true,num:i+1,onDone:(right)=>{

}

// 畫一題；instant=true 時作答後立刻顯示對錯
function renderQ(box,p,{instant,num,onDone,onChange}){
  const L="ABCDE";
  const el=document.createElement("div");el.className="q";
  el.innerHTML=`<div class="meta"><span>${num?num+". ":""}${KIND[p.k]}</span><span>${TOPICS[p.t]||""}</span></div><p class="stem">${esc(p.q)}</p>`;
  const body=document.createElement("div");el.appendChild(body);box.appendChild(el);
  p.ans=p.k==="mc"?new Set():null;
  const finish=()=>{
    const right=grade(p,p.ans);
    showResult(el,p,right);
    onDone&&onDone(right);
  };
  if(p.k==="fill"){
    body.innerHTML=`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文答案">${instant?'<div class="row"><button class="btn primary">確認</button></div>':""}`;
    const inp=body.querySelector("input");
    inp.oninput=()=>{p.ans=inp.value;onChange&&onChange()};
    if(instant){const b=body.querySelector("button");const go=()=>{if(!inp.value.trim())return;inp.disabled=true;b.remove();finish()};b.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};setTimeout(()=>inp.focus({preventScroll:true}),50)}
    p.finish=finish;return el;
  }
  const wrapO=document.createElement("div");wrapO.className=p.k==="tf"?"tfrow":"opts";body.appendChild(wrapO);
  p.opts.forEach((o,idx)=>{
    const b=document.createElement("button");b.className="opt";b.setAttribute("aria-pressed","false");
    b.innerHTML=p.k==="tf"?`${o.t==="True"?"⭕ True":"❌ False"}`:`<span class="l">${L[idx]}</span><span>${esc(o.t)}</span>`;
    b.onclick=()=>{
      if(p.k==="mc"){p.ans.has(idx)?p.ans.delete(idx):p.ans.add(idx);b.setAttribute("aria-pressed",p.ans.has(idx));onChange&&onChange();return}
      p.ans=idx;wrapO.querySelectorAll(".opt").forEach((x,j)=>x.setAttribute("aria-pressed",j===idx));onChange&&onChange();
      if(instant){lock(el);finish()}
    };
    wrapO.appendChild(b);
  });
  if(p.k==="mc"){
    const h=document.createElement("p");h.className="hint";h.style.margin="8px 0 0";h.textContent="複選：選出所有正確答案"+(instant?"，再按確認":"");body.appendChild(h);
    if(instant){const r=document.createElement("div");r.className="row";r.innerHTML='<button class="btn primary">確認</button>';body.appendChild(r);
      r.querySelector("button").onclick=()=>{if(!p.ans.size)return;lock(el);r.remove();finish()}}
  }
  p.finish=finish;return el;
}
function lock(el){el.querySelectorAll("button.opt,input,textarea").forEach(x=>x.disabled=true)}
function showResult(el,p,right){
  if(p.k==="fill"){const inp=el.querySelector("input");inp.disabled=true;inp.classList.add(right?"ok":"no")}
  else el.querySelectorAll(".opt").forEach((b,i)=>{
    const sel=p.k==="mc"?p.ans.has(i):p.ans===i,c=p.opts[i].c;
    b.setAttribute("aria-pressed","false");
    if(sel&&c)b.classList.add("ok");else if(sel&&!c)b.classList.add("no");else if(c)b.classList.add("miss");
  });
  const ex=document.createElement("div");ex.className="exp";
  ex.innerHTML=`<span class="v ${right?"ok":"no"}">${right?"✓ 答對":"✗ 答錯"}</span>${right?"":`　正解：<b>${esc(answerText(p))}</b>`}<div>${esc(p.e)}</div>`;
  el.appendChild(ex);
}

function pick(k,n){return shuffle(BANK.filter(q=>q.k===k)).slice(0,n).map(prep)}
function exam(){
  clearInterval(timer);
  const secs=[
    {k:"term",title:"I. Terminology 名詞解釋（10 × 1 分）",pts:1,items:shuffle(TERMS).slice(0,10).map(([t,zh,d])=>({k:"term",t:"",q:t,zh,def:d}))},
    {k:"tf",title:"II. True / False 是非（10 × 1 分）",pts:1,items:pick("tf",10)},
    {k:"sc",title:"III. Single Choice 單選（15 × 2 分）",pts:2,items:pick("sc",15)},
    {k:"mc",title:"IV. Multiple Choice 複選（5 × 4 分）",pts:4,items:pick("mc",5)},
    {k:"fill",title:"V. Fill in the Blanks 填空（10 × 3 分）",pts:3,items:pick("fill",10)},
  ];
  let left=80*60,submitted=false;
  app.innerHTML=`<div class="bar"><button class="btn back" id="bk">← 首頁</button><span id="tm">80:00</span><span class="grow"></span><span id="cnt">0/50</span><button class="btn primary" id="sub" style="min-height:36px;padding:6px 12px">交卷</button></div>
  <div id="res"></div><div id="paper"></div>`;
  const paper=$("#paper");
  const answered=()=>secs.reduce((a,s)=>a+s.items.filter(p=>p.k==="term"?(p.txt||"").trim():p.k==="mc"?p.ans&&p.ans.size:p.k==="fill"?(p.ans||"").trim():p.ans!=null).length,0);
  const upd=()=>{$("#cnt").textContent=answered()+"/50"};
  let n=0;
  secs.forEach(s=>{
    const h=document.createElement("div");h.className="sec-title";h.textContent=s.title;paper.appendChild(h);
    s.items.forEach(p=>{
      n++;
      if(p.k==="term"){
        const el=document.createElement("div");el.className="q";
        el.innerHTML=`<div class="meta"><span>${n}. 名詞解釋</span></div><p class="stem">Define: <b>${esc(p.q)}</b></p><textarea placeholder="用英文寫定義（交卷後對照參考答案自己評分）"></textarea>`;
        const ta=el.querySelector("textarea");ta.oninput=()=>{p.txt=ta.value;upd()};
        p.el=el;paper.appendChild(el);
      } else p.el=renderQ(paper,p,{instant:false,num:n,onChange:upd});
    });
  });
  const tick=()=>{left--;const m=Math.max(0,left)/60|0,sx=Math.max(0,left)%60;$("#tm").textContent=`${m}:${String(sx).padStart(2,"0")}`;if(left<=300)$("#tm").style.color="var(--bad)";if(left<=0)submit(true)};
  timer=setInterval(tick,1000);
  $("#bk").onclick=()=>{if(submitted||!answered()||confirmLeave())home()};
  function confirmLeave(){ // 不用瀏覽器 confirm，改成按兩次
    const b=$("#bk");if(b.dataset.armed){return true}b.dataset.armed=1;b.textContent="再按一次離開";setTimeout(()=>{b.textContent="← 首頁";delete b.dataset.armed},2500);return false}
  $("#sub").onclick=()=>{
    const b=$("#sub");const un=50-answered();
    if(un>0&&!b.dataset.armed){b.dataset.armed=1;b.textContent=`還有 ${un} 題沒寫，再按一次交卷`;setTimeout(()=>{if(!submitted){b.textContent="交卷";delete b.dataset.armed}},3000);return}
    submit(false);
  };
  function submit(auto){
    if(submitted)return;submitted=true;clearInterval(timer);
    $("#sub").remove();
    const per={};let auto_=0;
    secs.forEach(s=>{
      per[s.k]={got:0,max:s.items.length*s.pts,ok:0,n:s.items.length,pts:s.pts};
      s.items.forEach(p=>{
        if(p.k==="term"){
          const ta=p.el.querySelector("textarea");ta.disabled=true;
          const ex=document.createElement("div");ex.className="exp";
          ex.innerHTML=`<b>${esc(p.q)}</b>（${esc(p.zh)}）<div>${esc(p.def)}</div><label class="selfck"><input type="checkbox"> 我的定義有寫到重點（+1 分）</label>`;
          p.el.appendChild(ex);ex.querySelector("input").onchange=e=>{p.self=e.target.checked;summary()};
          return;
        }
        lock(p.el);const right=grade(p,p.ans);p.right=right;showResult(p.el,p,right);
        if(right){per[s.k].ok++;per[s.k].got+=s.pts;wrong.delete(p.id)}else wrong.add(p.id);
      });
    });
    saveWrong();
    function summary(){
      const t=secs[0].items.filter(p=>p.self).length;per.term.ok=t;per.term.got=t;
      const total=Object.values(per).reduce((a,v)=>a+v.got,0);
      $("#res").innerHTML=`<div class="score"><div class="hint">${auto?"時間到，自動交卷":"模擬考成績"}（用時 ${Math.round((80*60-Math.max(0,left))/60)} 分鐘）</div>
      <div class="big">${total} <span style="font-size:1rem;color:var(--muted)">/ 100</span></div>
      <table><tr><th>題型</th><th class="r">答對</th><th class="r">得分</th></tr>
      ${secs.map(s=>`<tr><td>${KIND[s.k]}</td><td class="r">${per[s.k].ok}/${per[s.k].n}</td><td class="r">${per[s.k].got}/${per[s.k].max}</td></tr>`).join("")}</table>
      <p class="hint">名詞解釋請往下對照參考答案，自己勾選有寫到重點的題目，分數會即時更新。答錯的題目已收進錯題本（${wrong.size} 題）。</p>
      <div class="row"><button class="btn primary" id="again">再考一份（新題目）</button><button class="btn" id="home2">回首頁</button></div></div>`;
      $("#again").onclick=exam;$("#home2").onclick=home;
    }
    summary();scrollTop();
  }
  scrollTop();
}

// ================= 術語卡 =================
function cardsSetup(){
  let dir="en";
  app.innerHTML=`<div class="bar"><button class="btn back" id="bk">← 首頁</button></div>
  <h1>術語卡</h1><p class="sub">看正面想答案，點卡片翻面，再自評。</p>
  <h2>正面顯示</h2><div class="chips" id="cd">
  <button class="chip" data-v="en" aria-pressed="true">英文術語 → 想定義</button>
  <button class="chip" data-v="def" aria-pressed="false">英文定義 → 想術語（練填空）</button></div>
  <div class="row"><button class="btn primary" id="go">開始（${TERMS.length} 張）</button></div>`;
  $("#cd").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{dir=c.dataset.v;$("#cd").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c))});
  $("#bk").onclick=home;
  $("#go").onclick=()=>runCards(shuffle(TERMS),dir);
  scrollTop();
}
function runCards(deck,dir){
  let i=0,known=0;const again=[];
  const show=()=>{
    if(i>=deck.length){
      app.innerHTML=`<div class="bar"><button class="btn back" id="bk">← 首頁</button></div><div class="score"><div class="hint">術語卡</div><div class="big">${known} / ${deck.length}</div><div class="hint">會的比例 ${Math.round(known/deck.length*100)}%</div>
      <div class="row">${again.length?`<button class="btn primary" id="ag">只複習不會的 ${again.length} 張</button>`:""}<button class="btn" id="all">全部重來</button></div></div>`;
      $("#bk").onclick=home;if($("#ag"))$("#ag").onclick=()=>runCards(shuffle(again),dir);$("#all").onclick=()=>runCards(shuffle(TERMS),dir);return;
    }
    const [t,zh,d]=deck[i];let flipped=false;
    app.innerHTML=`<div class="bar"><button class="btn back" id="bk">← 首頁</button><span>${i+1}/${deck.length}</span><div class="meter"><i class="g" style="width:${known/deck.length*100}%"></i></div><span>會 ${known}</span></div>
    <button class="card" id="cd">${dir==="en"?`<div class="term">${esc(t)}</div>`:`<div class="def">${esc(d)}</div>`}<div class="hint" style="margin-top:14px">點一下翻面</div></button>
    <div class="row" id="rate" hidden><button class="btn" id="no" style="flex:1">😵 不會</button><button class="btn primary" id="yes" style="flex:1">😎 會</button></div>`;
    $("#bk").onclick=home;
    $("#cd").onclick=()=>{if(flipped)return;flipped=true;$("#cd").innerHTML=`<div class="term">${esc(t)}</div><div class="zh">${esc(zh)}</div><div class="def">${esc(d)}</div>`;$("#rate").hidden=false};
    $("#yes").onclick=()=>{known++;i++;show()};
    $("#no").onclick=()=>{again.push(deck[i]);i++;show()};
  };
  show();
}
home();
</script>
