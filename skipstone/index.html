<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>磨石打水漂</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#12262d;color:#f4f1e8;font-family:system-ui,"Microsoft JhengHei","PingFang TC",sans-serif}
#unity-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#12262d}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#12262d}
#load h1{margin:0;font-size:34px;letter-spacing:.08em}
#load p{margin:0;font-size:15px;opacity:.7}
#bar{width:min(60vw,360px);height:10px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
#fill{height:100%;width:0;background:#ffcf7a;transition:width .15s}
#err{position:fixed;left:12px;right:12px;bottom:12px;padding:10px;border-radius:10px;background:#5a1f1a;font-size:13px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="load"><h1>磨石打水漂</h1><div id="bar"><div id="fill"></div></div><p id="msg">載入中…第一次會比較久</p></div>
<div id="err"></div>
<script src="Build/Web.loader.js"></script>
<script>
  var canvas = document.getElementById("unity-canvas");
  function showErr(m) { var e = document.getElementById("err"); e.style.display = "block"; e.textContent = m; }
  var config = {
    dataUrl: "Build/Web.data.unityweb",
    frameworkUrl: "Build/Web.framework.js.unityweb",
    codeUrl: "Build/Web.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "BluePudding",
    productName: "SkipStone",
    productVersion: "0.2.0",
    autoSyncPersistentDataPath: true,
    matchWebGLToCanvasSize: true,
    showBanner: function (msg, type) { if (type === "error") showErr(msg); }
  };
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  createUnityInstance(canvas, config, function (p) {
    document.getElementById("fill").style.width = Math.round(p * 100) + "%";
  }).then(function (inst) {
    window.unityInstance = inst; document.getElementById("load").style.display = "none"; document.title = "磨石打水漂"; canvas.focus();
  }).catch(function (m) { showErr("開不起來：" + m); document.getElementById("msg").textContent = "載入失敗"; });
</script>
</body>
</html>
