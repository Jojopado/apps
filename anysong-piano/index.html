<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d17">
<title>換你彈 AnySong Piano</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0b0d17;--panel:#161928;--panel2:#20243a;--ink:#f2f3f8;--mute:#9aa0b6;--cyan:#5ee7ff;--pink:#ff7ac6;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.screen{display:none;position:fixed;inset:0;overflow-y:auto}
.screen.on{display:block}
.wrap{max-width:520px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:34px;margin:6px 0 4px;letter-spacing:.02em}
.sub{color:var(--mute);margin:0 0 22px;line-height:1.55}
.primary{display:block;width:100%;padding:17px;border-radius:14px;background:var(--cyan);color:#06222b;font-weight:700;font-size:18px}
.drop-note{color:var(--mute);font-size:13px;text-align:center;margin:9px 0 26px}
h2{font-size:14px;color:var(--mute);font-weight:600;margin:0 0 8px}
.song{display:flex;gap:8px;margin-bottom:8px}
.song-main{flex:1;min-width:0;text-align:left;background:var(--panel);border-radius:12px;padding:13px 14px}
.song-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song-main small{color:var(--mute)}
.song-del{background:var(--panel);border-radius:12px;padding:0 13px;color:var(--mute);font-size:13px;white-space:nowrap}
.song-del.armed{background:#6b2337;color:#fff}
.credit{color:#6d7288;font-size:12px;line-height:1.6;margin-top:26px}
.credit a{color:inherit}
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.work{width:100%;max-width:380px;text-align:center}
.work h2{font-size:20px;color:var(--ink);margin-bottom:16px}
.track{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
#work-bar{height:100%;width:0;background:var(--cyan);transition:width .25s}
#work-sub{color:var(--mute);font-size:14px;margin:12px 0 24px;min-height:20px;overflow-wrap:anywhere}
.ghost{padding:11px 22px;border-radius:11px;background:var(--panel2)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.top .ghost{padding:8px 13px;font-size:14px}
#setup-title{font-size:24px;margin:10px 0 2px;overflow-wrap:anywhere}
#setup-meta{color:var(--mute);margin:0 0 20px}
.seg{display:grid;gap:8px;margin-bottom:8px}
.seg.two{grid-template-columns:1fr 1fr}.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg button{background:var(--panel);border-radius:12px;padding:13px 6px;font-weight:600;border:2px solid transparent;line-height:1.3}
.seg button small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px}
.seg button[aria-pressed=true]{border-color:var(--cyan);background:#12303c}
#mode-hint{color:var(--mute);font-size:14px;margin:0 0 20px;line-height:1.5}
.block{margin-bottom:20px}
.slider{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.slider label{width:76px;flex:none}
.slider input{flex:1;min-width:0;accent-color:var(--cyan)}
.slider output,.slider .n{width:58px;flex:none;text-align:right;color:var(--mute);font-size:13px}
.dim{opacity:.45}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.actions .ghost{padding:0}
#midi-btn{display:block;margin:14px auto 0;color:var(--mute);font-size:14px;text-decoration:underline;padding:8px}
#play{overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;align-items:center;gap:10px;pointer-events:none}
#hud-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.75);font-size:14px}
#hud-score{font-weight:700;font-variant-numeric:tabular-nums}
#pause{pointer-events:auto;width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.1);font-size:15px}
#hud-track{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.08)}
#hud-bar{height:100%;width:0;background:var(--pink)}
#hint{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:22px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
#hint.on{opacity:1}
.overlay{display:none;position:absolute;inset:0;background:rgba(6,8,16,.82);align-items:center;justify-content:center;flex-direction:column;gap:10px}
.overlay.on{display:flex}
.overlay button{width:200px;padding:14px;border-radius:12px;background:var(--panel2);font-weight:600}
.overlay button.go{background:var(--cyan);color:#06222b}
.overlay .danger{background:none;color:var(--mute)}
#res-title{font-size:24px;margin:0 0 4px;text-align:center}
.res-rank{font-size:82px;font-weight:800;color:var(--cyan);text-align:center;line-height:1.15}
.res-line{text-align:center;color:var(--ink);font-size:17px;margin:4px 0 16px;line-height:1.5}
.res-table{margin:0 auto 22px;border-collapse:collapse;color:var(--mute)}
.res-table td{padding:4px 12px}.res-table td:nth-child(even){color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.res-btns{display:grid;gap:8px;max-width:300px;margin:0 auto}
.res-btns button{padding:14px;border-radius:12px;background:var(--panel2);font-weight:600}
.res-btns .go{background:var(--cyan);color:#06222b}
#toast{position:fixed;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));margin:auto;max-width:420px;background:#2c3150;padding:13px 16px;border-radius:12px;text-align:center;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:none}
#loading{display:none;position:fixed;inset:0;background:rgba(6,8,16,.7);align-items:center;justify-content:center;z-index:8}
#loading.on{display:flex}
</style>
</head>
<body>
<section id="home" class="screen">
  <div class="wrap">
    <h1>換你彈</h1>
    <p class="sub">丟一首歌進來，它會變成鋼琴譜，你按下去的每一下都是那首歌。</p>
    <button id="pick" class="primary">選一首歌</button>
    <input id="file" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" hidden>
    <p class="drop-note">電腦也可以直接把音檔拖進來。音樂只在這台裝置處理，不會上傳。</p>
    <h2>我的歌</h2>
    <div id="library"></div>
    <p class="credit">轉譜模型 <a href="https://github.com/spotify/basic-pitch" target="_blank" rel="noopener">Spotify Basic Pitch</a>（Apache-2.0）。鋼琴音色 Salamander Grand Piano，Alexander Holm（CC BY 3.0）。</p>
  </div>
</section>

<section id="work" class="screen">
  <div class="center"><div class="work">
    <h2 id="work-title">讀取音樂中</h2>
    <div class="track"><div id="work-bar"></div></div>
    <p id="work-sub"></p>
    <button id="work-cancel" class="ghost">取消</button>
  </div></div>
</section>

<section id="prep" class="screen">
  <div class="wrap">
    <div class="top"><button id="setup-back" class="ghost">‹ 換一首</button></div>
    <h1 id="setup-title"></h1>
    <p id="setup-meta"></p>
    <h2>玩法</h2>
    <div class="seg two">
      <button data-mode="free">自由彈</button>
      <button data-mode="fall">落下音符</button>
    </div>
    <p id="mode-hint"></p>
    <h2>難度</h2>
    <div class="seg three block">
      <button data-level="easy">只彈旋律<small></small></button>
      <button data-level="normal">旋律＋和弦<small></small></button>
      <button data-level="full">盡量全部<small></small></button>
    </div>
    <h2>聲音</h2>
    <div class="block">
      <div class="slider"><label for="vol-piano">鋼琴</label><input id="vol-piano" type="range" min="0" max="1.4" step="0.05"><span class="n"></span></div>
      <div class="slider" id="back-row"><label for="vol-back">原曲</label><input id="vol-back" type="range" min="0" max="1" step="0.05"><span class="n" id="back-note"></span></div>
      <div class="slider" id="offset-row"><label for="offset">按鍵校準</label><input id="offset" type="range" min="-200" max="200" step="5"><output id="offset-val"></output></div>
    </div>
    <div class="actions">
      <button id="auto" class="ghost">先聽自動彈</button>
      <button id="start" class="primary">開始彈</button>
    </div>
    <button id="midi-btn">連接 MIDI 電子琴</button>
  </div>
</section>

<section id="play" class="screen">
  <canvas id="stage"></canvas>
  <div id="hud-track"><div id="hud-bar"></div></div>
  <div id="hud"><span id="hud-name"></span><span id="hud-score"></span><button id="pause" aria-label="暫停">❚❚</button></div>
  <div id="hint"></div>
  <div id="pause-menu" class="overlay">
    <button id="resume" class="go">繼續</button>
    <button id="restart">重新開始</button>
    <button id="quit" class="danger">離開這首</button>
  </div>
</section>

<section id="result" class="screen">
  <div class="center"><div style="width:100%">
    <h1 id="res-title"></h1>
    <div id="res-body"></div>
    <div class="res-btns">
      <button id="again" class="go">再彈一次</button>
      <button id="res-setup">換難度或玩法</button>
      <button id="res-home">換一首歌</button>
    </div>
  </div></div>
</section>

<div id="loading"><div>準備鋼琴中…</div></div>
<div id="toast" role="status"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
