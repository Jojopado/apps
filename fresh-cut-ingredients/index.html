<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Cut Ingredients – 3D Model Viewer</title>
<meta name="description" content="Browse every ingredient and every cut state of the Fresh Cut Ingredients 3D pack for Unity.">
<style>
  :root{
    --ink:#1f1d1a; --muted:#7b746a; --line:rgba(31,29,26,.10);
    --card:rgba(255,255,255,.82); --accent:#b8441f; --accent-soft:rgba(184,68,31,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(120% 90% at 55% 45%,#f7f4ef 0%,#ece7df 55%,#ddd6cb 100%)}
  canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
  .card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(40,30,20,.08)}

  /* brand */
  #brand{position:fixed;left:20px;top:18px;z-index:3}
  #brand h1{margin:0;font-size:19px;letter-spacing:-.2px;font-weight:700}
  #brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}

  /* ingredient list */
  #list{position:fixed;left:20px;top:78px;bottom:20px;width:232px;z-index:3;padding:10px;overflow:auto}
  .group{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 8px 6px}
  .group:first-child{margin-top:4px}
  .ing{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;background:none;border-radius:10px;
    cursor:pointer;text-align:left;color:inherit;font:inherit}
  .ing:hover{background:rgba(31,29,26,.05)}
  .ing.on{background:var(--accent-soft)}
  .ing img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#e8e2d8;flex:none}
  .ing b{display:block;font-weight:600;font-size:14px}
  .ing span{display:block;color:var(--muted);font-size:12px}
  .ing.on b{color:var(--accent)}

  /* info */
  #info{position:fixed;right:20px;top:18px;z-index:3;padding:14px 16px;min-width:230px}
  #info .t{font-size:22px;font-weight:700;letter-spacing:-.3px}
  #info .s{color:var(--accent);font-weight:600;margin-top:1px}
  #info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0 0;font-size:12.5px}
  #info dt{color:var(--muted)}
  #info dd{margin:0;font-variant-numeric:tabular-nums}
  #info code{font:12px ui-monospace,SFMono-Regular,Consolas,monospace;background:rgba(31,29,26,.06);padding:1px 5px;border-radius:5px}

  /* states */
  #states{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:3;display:flex;gap:6px;padding:8px;
    max-width:calc(100vw - 560px);overflow-x:auto}
  .st{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:76px;padding:6px 4px 7px;border:0;border-radius:10px;
    background:none;cursor:pointer;color:inherit;font:inherit;font-size:12px}
  .st img{width:58px;height:58px;border-radius:8px;object-fit:cover;background:#e8e2d8;border:2px solid transparent}
  .st:hover{background:rgba(31,29,26,.05)}
  .st.on img{border-color:var(--accent)}
  .st.on{color:var(--accent);font-weight:600}
  .st kbd{font:10px ui-monospace,Consolas,monospace;color:var(--muted)}

  /* tools */
  #tools{position:fixed;right:20px;bottom:20px;z-index:3;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:12px}
  #tools .row{display:flex;gap:6px}
  #tools button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer;font:inherit;color:inherit}
  #tools button.on{border-color:var(--accent);color:var(--accent);background:#fff7f3}
  #tools .hint{color:var(--muted);line-height:1.5}
  #tools a{color:var(--accent);text-decoration:none;font-weight:600}

  #loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;color:var(--muted);font-size:13px;
    pointer-events:none;opacity:0;transition:opacity .2s}
  #loading.show{opacity:1}

  @media (max-width:900px){
    #list{top:auto;bottom:auto;left:0;right:0;top:64px;width:auto;height:66px;display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;
      border-radius:0;border-left:0;border-right:0;padding:6px 10px}
    .group{display:none}
    .ing{flex:none;width:auto;padding:4px 8px}
    .ing span{display:none}
    #info{top:auto;bottom:118px;right:10px;min-width:0;padding:10px 12px}
    #info dl{display:none}
    #info .t{font-size:17px}
    #states{max-width:calc(100vw - 20px);bottom:10px}
    #tools{display:none}
    #brand{left:12px;top:12px}
  }
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<header id="brand">
  <h1>Fresh Cut Ingredients</h1>
  <p>Every ingredient, whole and cut · 3D pack for Unity</p>
</header>
<nav id="list" class="card" aria-label="Ingredients"></nav>
<section id="info" class="card" aria-live="polite">
  <div class="t" id="iName">–</div>
  <div class="s" id="iState">–</div>
  <dl>
    <dt>Size</dt><dd id="iSize">–</dd>
    <dt>Pieces</dt><dd id="iPieces">–</dd>
    <dt>Triangles</dt><dd id="iTris">–</dd>
    <dt>Prefab</dt><dd><code id="iPrefab">–</code></dd>
  </dl>
</section>
<div id="states" class="card" role="tablist" aria-label="Cut states"></div>
<aside id="tools" class="card">
  <div class="row">
    <button id="bRotate" class="on" title="R">Auto-rotate</button>
    <button id="bWire" title="W">Wireframe</button>
    <button id="bReset" title="F">Reset view</button>
  </div>
  <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan<br>← → ingredient · ↑ ↓ cut state</div>
  <div class="hint">Every piece is a separate object in Unity.<br><a href="https://jojopado.github.io/apps/bluepudding/" target="_blank" rel="noopener">More packs by BluePudding →</a></div>
</aside>
<div id="loading">Loading…</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(32, 1, 0.002, 20);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.maxPolarAngle = Math.PI * 0.49;

const sun = new THREE.DirectionalLight(0xfff3e6, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0002;
sun.shadow.normalBias = 0.0004;
sun.shadow.radius = 6;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xfff8ee, 0xb8a990, 0.5));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const loader = new GLTFLoader();
const texLoader = new THREE.TextureLoader();
const holder = new THREE.Group();
scene.add(holder);

let man, cur = { i: 0, s: 0 }, wire = false, token = 0;
const mats = {}, glbs = {};

function tex(url, srgb) {
  const t = texLoader.load(url);
  t.flipY = false;                       // glTF UV 慣例
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function material(item) {
  if (!mats[item.id]) {
    mats[item.id] = new THREE.MeshStandardMaterial({
      map: tex(item.tex.Albedo, true), normalMap: tex(item.tex.Normal, false),
      roughnessMap: tex(item.tex.ORM, false), roughness: 1, metalness: 0,
    });
  }
  return mats[item.id];
}
function loadGLB(url) {
  if (!glbs[url]) glbs[url] = new Promise((ok, bad) => loader.load(url, g => ok(g.scene), undefined, bad));
  return glbs[url];
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

// ---- 相機對準
let fly = null;
function frame(obj, instant) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.length() / 2, 0.02);
  const narrow = innerWidth < 900;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (narrow ? 1.45 : 1.18);
  const dir = new THREE.Vector3(0.62, 0.55, 1.0).normalize();
  const to = c.clone().add(dir.multiplyScalar(dist));
  controls.minDistance = r * 0.9;
  controls.maxDistance = r * 8;
  sun.position.copy(c).add(new THREE.Vector3(r * 3, r * 6, r * 2.5));
  sun.target.position.copy(c);
  const sc = sun.shadow.camera;
  sc.left = sc.bottom = -r * 2.2; sc.right = sc.top = r * 2.2;
  sc.near = r * 0.5; sc.far = r * 14;
  sc.updateProjectionMatrix();
  if (instant) { camera.position.copy(to); controls.target.copy(c); return; }
  fly = { t: 0, p0: camera.position.clone(), p1: to, c0: controls.target.clone(), c1: c };
}

// ---- 介面
const $ = id => document.getElementById(id);
function buildList() {
  const nav = $("list");
  let last = null;
  man.items.forEach((it, i) => {
    if (it.category !== last) {
      const g = document.createElement("div");
      g.className = "group"; g.textContent = it.category; nav.appendChild(g); last = it.category;
    }
    const b = document.createElement("button");
    b.className = "ing"; b.dataset.i = i;
    const th = it.states[0].thumb ? `<img src="${it.states[0].thumb}" alt="">` : "";
    b.innerHTML = `${th}<div><b>${it.label}</b><span>${it.states.length} states · ${it.states.reduce((a, s) => a + s.pieces, 0)} pieces</span></div>`;
    b.onclick = () => show(i, 0);
    nav.appendChild(b);
  });
}
function buildStates(it) {
  const box = $("states");
  box.innerHTML = "";
  it.states.forEach((s, k) => {
    const b = document.createElement("button");
    b.className = "st"; b.setAttribute("role", "tab");
    b.innerHTML = `${s.thumb ? `<img src="${s.thumb}" alt="">` : ""}<span>${s.label}</span>`;
    b.onclick = () => show(cur.i, k);
    box.appendChild(b);
  });
}
function mark() {
  document.querySelectorAll(".ing").forEach(b => b.classList.toggle("on", +b.dataset.i === cur.i));
  document.querySelectorAll(".st").forEach((b, k) => { b.classList.toggle("on", k === cur.s); b.setAttribute("aria-selected", k === cur.s); });
  const on = document.querySelector(".st.on");
  if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
}

async function show(i, s) {
  const changedIng = i !== cur.i || !$("states").children.length;
  cur = { i, s };
  const it = man.items[i], st = it.states[s];
  if (changedIng) buildStates(it);
  mark();
  $("iName").textContent = it.label;
  $("iState").textContent = st.label;
  $("iSize").textContent = it.note || "–";
  $("iPieces").textContent = st.pieces;
  $("iTris").textContent = st.tris.toLocaleString("en-US");
  $("iPrefab").textContent = st.unity;
  history.replaceState(null, "", `#${it.id}/${st.id}`);
  const my = ++token;
  const ld = setTimeout(() => $("loading").classList.add("show"), 150);
  const src = await loadGLB(st.file);
  clearTimeout(ld);
  $("loading").classList.remove("show");
  if (my !== token) return;
  const obj = src.clone(true);
  const m = material(it);
  obj.traverse(o => { if (o.isMesh) { o.material = m; o.castShadow = true; o.receiveShadow = true; } });
  holder.clear();
  holder.add(obj);
  frame(obj, !show.once);
  show.once = true;
  // 預先載入隔壁的狀態
  [it.states[s + 1], it.states[s - 1]].forEach(n => n && loadGLB(n.file));
}

function step(di, ds) {
  const n = man.items.length;
  if (di) show((cur.i + di + n) % n, 0);
  else {
    const k = man.items[cur.i].states.length;
    show(cur.i, (cur.s + ds + k) % k);
  }
}
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") step(1, 0);
  else if (e.key === "ArrowLeft") step(-1, 0);
  else if (e.key === "ArrowDown") step(0, 1);
  else if (e.key === "ArrowUp") step(0, -1);
  else if (e.key === "r" || e.key === "R") $("bRotate").click();
  else if (e.key === "w" || e.key === "W") $("bWire").click();
  else if (e.key === "f" || e.key === "F") $("bReset").click();
  else if (/^[1-9]$/.test(e.key)) { const k = +e.key - 1; if (k < man.items[cur.i].states.length) show(cur.i, k); }
  else return;
  e.preventDefault();
});
$("bRotate").onclick = e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.classList.toggle("on", controls.autoRotate); };
$("bWire").onclick = e => { wire = !wire; Object.values(mats).forEach(m => m.wireframe = wire); e.currentTarget.classList.toggle("on", wire); };
$("bReset").onclick = () => holder.children[0] && frame(holder.children[0], false);

function loop(t) {
  requestAnimationFrame(loop);
  if (fly) {
    fly.t = Math.min(1, fly.t + 0.06);
    const k = 1 - Math.pow(1 - fly.t, 3);
    camera.position.lerpVectors(fly.p0, fly.p1, k);
    controls.target.lerpVectors(fly.c0, fly.c1, k);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  renderer.render(scene, camera);
}

resize();
man = await (await fetch("manifest.json")).json();
buildList();
let start = [0, 0];
const h = decodeURIComponent(location.hash.slice(1)).split("/");
const hi = man.items.findIndex(d => d.id === h[0]);
if (hi >= 0) { start = [hi, Math.max(0, man.items[hi].states.findIndex(s => s.id === h[1]))]; }
await show(start[0], start[1]);
requestAnimationFrame(loop);
canvas.focus();
</script>
</body>
</html>
