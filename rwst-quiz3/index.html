<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RWST 小考 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --fg:#18202C; --muted:#5B6676; --line:#DCE1E8;
  --accent:#2450C4; --accent-soft:#E6ECFA;
  --good:#1D7F52; --good-soft:#E3F3EA; --bad:#B83A26; --bad-soft:#FBE9E5; --warn:#9A6B00;
  --sans:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161D; --surface:#1A2029; --fg:#E6EAF0; --muted:#97A2B2; --line:#2C3542;
  --accent:#86A6FF; --accent-soft:#1F2B47; --good:#5CC994; --good-soft:#163326; --bad:#F08B76; --bad-soft:#3A1F1A; --warn:#E3B341; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161D; --surface:#1A2029; --fg:#E6EAF0; --muted:#97A2B2; --line:#2C3542;
  --accent:#86A6FF; --accent-soft:#1F2B47; --good:#5CC994; --good-soft:#163326; --bad:#F08B76; --bad-soft:#3A1F1A; --warn:#E3B341; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 64px max(16px,env(safe-area-inset-right))}
h1{font-size:1.5rem;margin:0 0 4px;font-weight:600}
h2{font-size:1.1rem;margin:28px 0 10px;font-weight:600}
.sub{color:var(--muted);font-size:.9rem;margin:0}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modes{display:grid;gap:12px;margin-top:20px}
.mode{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer}
.mode b{display:block;font-size:1.05rem;font-weight:600}
.mode span{color:var(--muted);font-size:.88rem}
.mode .n{float:right;font-family:var(--mono);font-size:.85rem;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left))) 16px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) 10px;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.bar .grow{flex:1}
.bar .back{font-family:var(--sans);padding:6px 12px;min-height:36px}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex;flex:1}
.meter i{display:block;height:100%}.meter .g{background:var(--good)}.meter .b{background:var(--bad)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.q .meta{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;flex-wrap:wrap}
.q .stem{font-weight:500;margin:0 0 12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt .l{font-family:var(--mono);font-weight:500;color:var(--muted);flex:none;width:1.4em}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default;color:inherit}
.tfrow{display:flex;gap:8px}.tfrow .opt{justify-content:center}
input[type=text],textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input.ok{border-color:var(--good);background:var(--good-soft)}input.no{border-color:var(--bad);background:var(--bad-soft)}
textarea{min-height:70px;resize:vertical}
.exp{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:.92rem}
.exp .v{font-weight:600}.exp .v.ok{color:var(--good)}.exp .v.no{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hint{color:var(--muted);font-size:.85rem}
.score{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.score .big{font-size:2.4rem;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
td.r,th.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;width:100%}
.card .term{font-size:1.5rem;font-weight:600}
.card .zh{color:var(--muted);margin-top:6px}
.card .def{margin-top:14px;font-size:1rem}
.selfck{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:.9rem}
.selfck input{width:20px;height:20px}
.sec-title{font-size:1rem;font-weight:600;margin:24px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// k: kind (tf / sc / mc / fill)；t: 章節；q: 題目；e: 解析
// tf: a = true/false
// sc: o = 選項，第一個是正確答案（顯示時會打亂）
// mc: o = 選項，前面加 * 的是正確答案（顯示時會打亂）
// fill: a = 可接受答案（不分大小寫）
const TOPICS={"F": "五階段總覽", "S1": "Stage I 背景", "S2": "Stage II 文獻", "S3": "Stage III 缺口", "S4": "Stage IV 目的", "S5": "Stage V＋助動詞"};
const BANK=[{"k": "sc", "t": "F", "q": "What is the correct order of the five stages of an Introduction?", "o": ["Background → Literature → Gap → Purpose → Contribution", "Background → Gap → Literature → Purpose → Contribution", "Literature → Background → Gap → Contribution → Purpose", "Purpose → Background → Literature → Gap → Contribution"], "e": "p3：背、文、缺、目、貢。"}, {"k": "sc", "t": "F", "q": "Which metaphor describes the flow of an Introduction?", "o": ["Universe → Galaxy → Star", "Star → Galaxy → Universe", "Seed → Tree → Forest", "Galaxy → Star → Universe"], "e": "p3：由大到小，General → Specific。"}, {"k": "sc", "t": "F", "q": "The funnel diagram for an Introduction moves from ____.", "o": ["general to specific", "specific to general", "old to recent", "simple to complex"], "e": "p3 漏斗圖：GENERAL → SPECIFIC。"}, {"k": "sc", "t": "F", "q": "“What is still unknown, unresolved, or inadequate?” is the question for which stage?", "o": ["Research Gap", "Background", "Purpose", "Contribution"], "e": "p39：Gap 的問題。"}, {"k": "sc", "t": "F", "q": "“Why does the study matter?” is the question for which stage?", "o": ["Contribution / Significance", "Purpose", "Literature Review", "Background"], "e": "p39：Contribution 的問題。"}, {"k": "sc", "t": "F", "q": "“What is the broader context?” is the question for which stage?", "o": ["Background", "Research Gap", "Literature Review", "Purpose"], "e": "p39：Background 的問題。"}, {"k": "sc", "t": "F", "q": "“What do we already know?” is the question for which stage?", "o": ["Literature Review", "Background", "Purpose", "Contribution"], "e": "p39：Literature Review 的問題。"}, {"k": "sc", "t": "F", "q": "“What does this study investigate?” is the question for which stage?", "o": ["Purpose", "Contribution", "Research Gap", "Background"], "e": "p39：Purpose 的問題。"}, {"k": "sc", "t": "F", "q": "In “Context → Existing knowledge → Gap → Response → Contribution”, “Response” corresponds to ____.", "o": ["Purpose", "Background", "Literature Review", "Significance"], "e": "p39：Response 是對 gap 的回應，也就是研究目的。"}, {"k": "sc", "t": "F", "q": "Identify the stage: “However, most current detectors fail in heavy rain.”", "o": ["Stage III – Gap", "Stage I – Background", "Stage II – Literature", "Stage V – Contribution"], "e": "However＋不足之處＝Gap。"}, {"k": "sc", "t": "F", "q": "Identify the stage: “Wearable sensors are widely used in health care.”", "o": ["Stage I – Background", "Stage III – Gap", "Stage IV – Purpose", "Stage V – Contribution"], "e": "現在式的一般事實＝Background。"}, {"k": "sc", "t": "F", "q": "Identify the stage: “Recent studies have applied deep learning to sleep analysis.”", "o": ["Stage II – Literature", "Stage I – Background", "Stage III – Gap", "Stage IV – Purpose"], "e": "Recent studies have…＝文獻回顧。"}, {"k": "sc", "t": "F", "q": "Identify the stage: “This study aims to evaluate battery life in cold weather.”", "o": ["Stage IV – Purpose", "Stage V – Contribution", "Stage II – Literature", "Stage III – Gap"], "e": "aims to＝目的。"}, {"k": "sc", "t": "F", "q": "Identify the stage: “The findings could inform the design of safer robots.”", "o": ["Stage V – Contribution", "Stage IV – Purpose", "Stage I – Background", "Stage III – Gap"], "e": "could＋價值＝貢獻。"}, {"k": "sc", "t": "F", "q": "Which sentence should come immediately AFTER the research gap?", "o": ["This paper proposes a lightweight model for edge devices.", "Edge devices are widely used in factories.", "Several authors have studied edge devices (2, 4).", "Early studies focused on desktop computers (Lin, 1990)."], "e": "Gap 之後是 Purpose。"}, {"k": "mc", "t": "F", "q": "Which are stages of an Introduction? (Select all)", "o": ["*Background", "*Research Gap", "*Contribution", "Data Analysis", "Acknowledgments"], "e": "五階段：Background、Literature、Gap、Purpose、Contribution。"}, {"k": "sc", "t": "S1", "q": "Stage I should move in which order?", "o": ["General area → Subarea → Topic", "Topic → Subarea → General area", "Subarea → General area → Topic", "Topic → General area → Subarea"], "e": "p5。"}, {"k": "sc", "t": "S1", "q": "Which is the correct Stage I progression?", "o": ["motor skills → baseball batting → visual search strategies", "visual search strategies → baseball batting → motor skills", "baseball batting → motor skills → visual search strategies", "visual search strategies → motor skills → baseball batting"], "e": "p5 的例子。"}, {"k": "sc", "t": "S1", "q": "Which information flow connects ideas smoothly in Stage I?", "o": ["old-to-new", "new-to-old", "specific-to-general", "effect-to-cause"], "e": "p5：old-to-new information flow。"}, {"k": "sc", "t": "S1", "q": "“The system detects noise. This detection runs in real time.” The link between the sentences is ____.", "o": ["word derivation", "implied old information", "a citation", "a modal auxiliary"], "e": "detects → detection＝衍生字。"}, {"k": "sc", "t": "S1", "q": "“Copper is a useful metal. It conducts heat well.” The link is a ____.", "o": ["pronoun", "word derivation", "signal word", "modal auxiliary"], "e": "It 指 Copper。"}, {"k": "sc", "t": "S1", "q": "“Water cools and loses heat. Generally, this happens at night.” The word “this” is a ____.", "o": ["pointing word", "derivation", "reporting verb", "tentative verb"], "e": "this 指前一句整件事。"}, {"k": "sc", "t": "S1", "q": "“Malaria is a serious disease. The incidence varies each year.” The link is ____.", "o": ["implied old information", "word repetition", "word derivation", "a pointing word"], "e": "省略 [of malaria]，讀者能自行補上（同 p8）。"}, {"k": "sc", "t": "S1", "q": "“Ice covers many lakes. Although river ice is thin, it matters.” The repeated word “ice” is an example of ____.", "o": ["word repetition", "implied old information", "author prominence", "hedging"], "e": "重複 ice（同 p6）。"}, {"k": "sc", "t": "S1", "q": "Which tense is used for established facts in Stage I?", "o": ["simple present", "simple past", "past perfect", "future"], "e": "p9：established facts / current knowledge。"}, {"k": "sc", "t": "S1", "q": "Which tense is used for past developments that remain relevant now?", "o": ["present perfect", "simple past", "past perfect", "simple present"], "e": "p9。"}, {"k": "sc", "t": "S1", "q": "Choose the best form: “In recent years, many security standards ____ in the literature.”", "o": ["have been proposed", "propose", "had proposed", "will be proposed"], "e": "In recent years → present perfect。"}, {"k": "sc", "t": "S1", "q": "Choose the best form: “Managers often ____ it useful to set coding rules.” (current knowledge)", "o": ["find", "found", "had found", "would have found"], "e": "現況、事實 → simple present。"}, {"k": "mc", "t": "S1", "q": "Which techniques create old-to-new flow? (Select all)", "o": ["*Word repetition and derivation", "*Pronouns and pointing words", "*Implied old information", "Modal auxiliaries", "Chronological citation"], "e": "p5 三種。"}, {"k": "sc", "t": "S2", "q": "Which is NOT a purpose of the literature review?", "o": ["To review every past study", "To show familiarity with past studies", "To build credibility", "To establish the gap"], "e": "p10：Do not review everything。"}, {"k": "sc", "t": "S2", "q": "How should you select literature for Stage II?", "o": ["Choose what is needed to establish the gap", "Include all available publications", "Use only the oldest publications", "Choose only studies that you wrote"], "e": "p10。"}, {"k": "sc", "t": "S2", "q": "As citations become more specific, the tense usually moves to ____.", "o": ["simple past", "present perfect", "simple present", "future"], "e": "p10：先 present / present perfect，再到 simple past。"}, {"k": "sc", "t": "S2", "q": "“Data synchronization is critical for consistency (Chou, 2016).” Which citation form is this?", "o": ["Information prominent", "Weak author prominent", "Author prominent", "General statement"], "e": "作者只在括號裡，焦點是資訊。"}, {"k": "sc", "t": "S2", "q": "“Several authors have studied blockchain speed (4, 7).” Which citation form is this?", "o": ["Weak author prominent", "Information prominent", "Author prominent", "Implied information"], "e": "Several authors have studied＝weak author prominent。"}, {"k": "sc", "t": "S2", "q": "“Wang (2021) found that the model was slow.” Which citation form is this?", "o": ["Author prominent", "Weak author prominent", "Information prominent", "General statement"], "e": "作者名當主詞。"}, {"k": "sc", "t": "S2", "q": "“Very few studies have explored quantum routing.” Which form is this?", "o": ["General statement", "Author prominent", "Information prominent", "Statement of purpose"], "e": "p21：general statement，可帶出 gap。"}, {"k": "sc", "t": "S2", "q": "In information-prominent citation, the focus is on ____.", "o": ["the information, not the researcher", "the researcher, not the information", "the year of publication", "the journal name"], "e": "p15。"}, {"k": "sc", "t": "S2", "q": "Information-prominent citation of a FACT uses ____.", "o": ["simple present", "simple past", "past perfect", "future"], "e": "p14：fact → simple present。"}, {"k": "sc", "t": "S2", "q": "Information-prominent citation of a TREND or CHANGE uses ____.", "o": ["present perfect", "simple present", "simple past", "past perfect"], "e": "p14：trend / change → present perfect。"}, {"k": "sc", "t": "S2", "q": "Weak author-prominent citations usually use ____.", "o": ["present perfect", "simple past", "simple present", "future"], "e": "p14。"}, {"k": "sc", "t": "S2", "q": "General statements about research usually use ____.", "o": ["present perfect", "simple past", "simple present", "past perfect"], "e": "p14。"}, {"k": "sc", "t": "S2", "q": "Author-prominent citations usually use ____.", "o": ["simple past", "present perfect", "simple present", "future"], "e": "p14。"}, {"k": "sc", "t": "S2", "q": "Which citation form typically appears LATER in Stage II?", "o": ["Author prominent", "Information prominent", "Weak author prominent", "General statement"], "e": "p14：Later citations＝author prominent。"}, {"k": "sc", "t": "S2", "q": "The tense rules for citation in the slides are best described as ____.", "o": ["common tendencies", "fixed rules", "rules for journals only", "rules for abstracts only"], "e": "p14 註：These are common tendencies, not fixed rules。"}, {"k": "sc", "t": "S2", "q": "Choose the best form: “The use of 5G ____ urban growth [1, 3].” (trend)", "o": ["has accelerated", "accelerated", "had accelerated", "accelerating"], "e": "趨勢 → present perfect。"}, {"k": "sc", "t": "S2", "q": "Citations listed as quantitative, then qualitative, then hybrid methods are ____.", "o": ["grouped by approach", "ordered from distant to close", "ordered chronologically", "ordered alphabetically"], "e": "p17。"}, {"k": "sc", "t": "S2", "q": "Citations moving from broad theory to studies most like yours are ____.", "o": ["ordered from distant to close", "grouped by approach", "ordered chronologically", "grouped by author"], "e": "p18。"}, {"k": "sc", "t": "S2", "q": "“Early studies… By the 2000s… More recently…” shows which order?", "o": ["Chronological", "Grouped by approach", "Distant to close", "Information prominent"], "e": "p19：最早到最新。"}, {"k": "sc", "t": "S2", "q": "How should you choose the order of citations?", "o": ["By what best supports your argument", "By alphabetical order", "By the number of authors", "By journal impact factor"], "e": "p16。"}, {"k": "sc", "t": "S2", "q": "To emphasize that a finding is STILL accepted, use ____.", "o": ["past reporting verb + present finding", "past reporting verb + past finding", "tentative verb + may/could", "present perfect + future finding"], "e": "p22：showed that X is…"}, {"k": "sc", "t": "S2", "q": "To limit a finding to ONE particular study, use ____.", "o": ["past reporting verb + past finding", "past reporting verb + present finding", "tentative verb + may/could", "present verb + present finding"], "e": "p22：reported that… produced…"}, {"k": "sc", "t": "S2", "q": "To show tentativeness about a study’s claim, use ____.", "o": ["tentative verb + may/could + base verb", "past reporting verb + past finding", "past reporting verb + present finding", "present perfect + past finding"], "e": "p22：suggested that… may improve…"}, {"k": "sc", "t": "S2", "q": "“Lee (2018) showed that encryption is effective.” This implies that the finding ____.", "o": ["is still valid now", "applies only to that study", "is uncertain", "has been rejected"], "e": "p23：showed that X is…＝作者認為現在仍成立。"}, {"k": "sc", "t": "S2", "q": "“Kao (2022) reported that the tool produced errors in that dataset.” The writer ____.", "o": ["ties the claim to that study", "presents a universal fact", "shows a future trend", "states a research purpose"], "e": "p23：刻意限定在原研究。"}, {"k": "sc", "t": "S2", "q": "“Sato (2023) suggested that the method may improve privacy.” The writer ____.", "o": ["avoids overclaiming", "makes a strong claim", "reports a certain fact", "rejects the finding"], "e": "p23：signals uncertainty and avoids overclaiming。"}, {"k": "sc", "t": "S2", "q": "Choose the best form: “Hsu (2023) suggested that the design ____ cost.” (tentative)", "o": ["may reduce", "reduced", "reduces", "had reduced"], "e": "suggested → may/could＋原形。"}, {"k": "sc", "t": "S2", "q": "Choose the best form: “Chiu (2020) found that the model ____ higher accuracy than the baseline.” (past result)", "o": ["achieved", "may achieve", "will achieve", "achieving"], "e": "p22：found＋past finding。"}, {"k": "sc", "t": "S2", "q": "Which is a tentative verb?", "o": ["hypothesized", "reported", "observed", "noted"], "e": "p23：proposed、suggested、hypothesized。"}, {"k": "sc", "t": "S2", "q": "Which is a (stronger) reporting verb?", "o": ["showed", "suggested", "proposed", "hypothesized"], "e": "p23：found、showed、reported、noted、observed。"}, {"k": "mc", "t": "S2", "q": "Which are tentative verbs? (Select all)", "o": ["*proposed", "*suggested", "*hypothesized", "found", "observed"], "e": "p23。"}, {"k": "mc", "t": "S2", "q": "Which citation forms usually use the present perfect? (Select all)", "o": ["*Weak author prominent", "*General statements", "*Information prominent (trend)", "Author prominent", "Information prominent (fact)"], "e": "p14。"}, {"k": "mc", "t": "S2", "q": "Which are ways of ordering citations in the slides? (Select all)", "o": ["*By approach", "*Distant to close", "*Chronological", "Alphabetical", "By sample size"], "e": "p16。"}, {"k": "sc", "t": "S3", "q": "What is the main function of Stage III?", "o": ["To highlight gaps or unanswered questions", "To summarize the results", "To state practical value", "To describe the procedure"], "e": "p11。"}, {"k": "sc", "t": "S3", "q": "Which word signals a gap?", "o": ["However", "Therefore", "Similarly", "Furthermore"], "e": "p11：however、in contrast。"}, {"k": "sc", "t": "S3", "q": "Earlier studies reached opposite results. What kind of gap is this?", "o": ["Contradictory findings", "Methodological gap", "Contextual gap", "Practical gap"], "e": "p11。"}, {"k": "sc", "t": "S3", "q": "A topic has been studied in cities but never in rural areas. What kind of gap is this?", "o": ["Contextual gap", "Methodological gap", "Contradictory findings", "Practical gap"], "e": "情境沒做過＝contextual gap（依名稱判斷）。"}, {"k": "sc", "t": "S3", "q": "Earlier studies all relied on a weak measuring technique. What kind of gap is this?", "o": ["Methodological gap", "Contextual gap", "Contradictory findings", "Practical gap"], "e": "方法不足＝methodological gap（依名稱判斷）。"}, {"k": "sc", "t": "S3", "q": "What is the structure of Gap Pattern 1?", "o": ["Signal word + Gap + Topic", "Signal word + Previous work + Gap + Topic", "Topic + Gap + Previous work", "Purpose + Gap + Value"], "e": "p25。"}, {"k": "sc", "t": "S3", "q": "What is the structure of Gap Pattern 2?", "o": ["Signal word + Previous work + Gap + Topic", "Signal word + Gap + Topic", "Gap + Purpose + Topic", "Your research + Modal + Value"], "e": "p25：先承認前人研究。"}, {"k": "sc", "t": "S3", "q": "“However, little is known about drone noise.” This is ____.", "o": ["Pattern 1", "Pattern 2", "Report orientation", "Weak author prominent"], "e": "直接點 gap。"}, {"k": "sc", "t": "S3", "q": "“Although many studies have examined drones, few address noise.” This is ____.", "o": ["Pattern 2", "Pattern 1", "Research orientation", "Author prominent"], "e": "Although＋前人研究＋gap。"}, {"k": "sc", "t": "S3", "q": "Which tenses are used for the gap in Pattern 1?", "o": ["present or present perfect", "simple past or past perfect", "future or simple past", "past perfect or future"], "e": "p25。"}, {"k": "sc", "t": "S3", "q": "Choose the best word: “However, ____ studies have been done on this topic.”", "o": ["few", "little", "much", "less"], "e": "studies 可數 → few。"}, {"k": "sc", "t": "S3", "q": "Choose the best word: “But ____ information is available on this topic.”", "o": ["little", "few", "many", "several"], "e": "information 不可數 → little。"}, {"k": "sc", "t": "S3", "q": "Choose the best word: “____ much research has been devoted to e-learning, little has explored its cost.”", "o": ["Although", "However", "But", "Therefore"], "e": "一句內先承認再轉折 → Although。"}, {"k": "mc", "t": "S3", "q": "Which are types of research gap? (Select all)", "o": ["*Knowledge gap", "*Methodological gap", "*Practical gap", "Budget gap", "Citation gap"], "e": "p11：knowledge、methodological、contextual、contradictory findings、practical。"}, {"k": "mc", "t": "S3", "q": "Which keywords are listed for signaling a gap in Pattern 1? (Select all)", "o": ["*few", "*little", "*limited", "many", "should"], "e": "p26。"}, {"k": "sc", "t": "S4", "q": "Report orientation focuses on ____.", "o": ["the document", "the investigation", "the participants", "the literature"], "e": "p28：what the paper does。"}, {"k": "sc", "t": "S4", "q": "Research orientation focuses on ____.", "o": ["the investigation itself", "the document itself", "the readers", "the references"], "e": "p28：what the researchers did。"}, {"k": "sc", "t": "S4", "q": "Report orientation uses which tense?", "o": ["present or future", "simple past", "past perfect", "present perfect only"], "e": "p12、p28。"}, {"k": "sc", "t": "S4", "q": "Research orientation uses which tense?", "o": ["past", "present", "future", "present perfect"], "e": "p12、p28。"}, {"k": "sc", "t": "S4", "q": "Which sentence is report-oriented?", "o": ["The aim of the present paper is to compare two models.", "The purpose of this study was to compare two models.", "This investigation compared two models.", "This research was done to compare two models."], "e": "paper＋is。"}, {"k": "sc", "t": "S4", "q": "Which sentence is research-oriented?", "o": ["The purpose of this study was to test a sensor.", "The aim of this thesis is to test a sensor.", "This paper will examine a sensor.", "This report describes a sensor."], "e": "study＋was。"}, {"k": "sc", "t": "S4", "q": "Which subject normally fits report orientation?", "o": ["this thesis", "this investigation", "this research", "this study"], "e": "p29：thesis / paper / report。"}, {"k": "sc", "t": "S4", "q": "Which subject normally fits research orientation?", "o": ["this investigation", "this paper", "this thesis", "this report"], "e": "p30：study / investigation / research。"}, {"k": "sc", "t": "S4", "q": "Choose the best form: “The purpose of this study ____ to determine whether caching reduced delay.” (research orientation)", "o": ["was", "is", "will be", "has been"], "e": "研究取向 → 過去式。"}, {"k": "sc", "t": "S4", "q": "Choose the best form: “The objective of this report ____ to describe caching methods.”", "o": ["is", "was", "had been", "were"], "e": "report 取向 → 現在式。"}, {"k": "sc", "t": "S4", "q": "A purpose statement based on a Yes/No question uses ____.", "o": ["if + modal auxiliary", "a noun phrase without if", "simple past only", "a citation"], "e": "p28。"}, {"k": "sc", "t": "S4", "q": "A purpose statement based on an information question uses ____.", "o": ["an infinitive or noun phrase", "if + modal auxiliary", "whether + would", "a signal word"], "e": "p28：no if。"}, {"k": "sc", "t": "S4", "q": "Question: “Is method A suitable for task B?” The best purpose statement is: The purpose of this study is to determine ____.", "o": ["if A would be suitable for B", "is A suitable for B", "what A is suitable for B", "the suitable of A B"], "e": "p31：Yes/No → if＋would。"}, {"k": "sc", "t": "S4", "q": "Question: “What is the status of solar power in Peru?” The best purpose statement is: This paper reports on ____.", "o": ["the status of solar power in Peru", "if solar power would be in Peru", "what is the status of solar power in Peru", "whether the status is solar power"], "e": "p31：information question → noun phrase。"}, {"k": "sc", "t": "S4", "q": "“What are the groundwater characteristics of the Animas Basin?” is what type of question?", "o": ["Information question", "Yes/No question", "Tag question", "Rhetorical gap"], "e": "What 開頭（p37）。"}, {"k": "sc", "t": "S4", "q": "Research-oriented purpose for “What are the groundwater characteristics of the Basin?”", "o": ["The purpose of this study was to determine the groundwater characteristics of the Basin.", "The purpose of this study was to determine if the groundwater would be the Basin.", "The aim of this paper is to describe the groundwater characteristics of the Basin.", "This report will describe the groundwater characteristics of the Basin."], "e": "research＝study＋was，且 information question 不用 if。"}, {"k": "mc", "t": "S4", "q": "Which phrases show report orientation? (Select all)", "o": ["*The aim of the present paper…", "*The purpose of this thesis…", "*The objective of this report…", "This investigation…", "This research…"], "e": "p29。"}, {"k": "sc", "t": "S5", "q": "What is the main function of Stage V?", "o": ["To show practical or theoretical contribution", "To point out what is unknown", "To review past studies", "To give general background"], "e": "p13。"}, {"k": "sc", "t": "S5", "q": "Why are modal auxiliaries used in Stage V?", "o": ["For hedging / tentativeness", "To show past time", "To cite authors", "To signal contrast"], "e": "p13。"}, {"k": "sc", "t": "S5", "q": "The structure of a contribution statement is ____.", "o": ["Your research + Modal aux + Value", "Signal word + Gap + Topic", "Author + Past verb + Finding", "Purpose + if + Modal aux"], "e": "p32。"}, {"k": "sc", "t": "S5", "q": "“This method may help reduce traffic accidents.” Which orientation is this?", "o": ["Practical", "Theoretical", "Report", "Research"], "e": "解決實際問題＝practical。"}, {"k": "sc", "t": "S5", "q": "“This study may provide a framework for evaluating models.” Which orientation is this?", "o": ["Theoretical", "Practical", "Report", "Research"], "e": "學術貢獻＝theoretical（同 p33）。"}, {"k": "sc", "t": "S5", "q": "Which order goes from SURE to TENTATIVE?", "o": ["will → would → should → may → could", "will → should → would → could → may", "could → may → should → would → will", "would → will → may → should → could"], "e": "p34 圖。"}, {"k": "sc", "t": "S5", "q": "Which modal is the MOST tentative on the scale?", "o": ["could", "may", "should", "would"], "e": "p34：COULD 最靠近 TENTATIVE。"}, {"k": "sc", "t": "S5", "q": "Which modal shows the STRONGEST certainty?", "o": ["will", "would", "should", "may"], "e": "p34：WILL 最靠近 SURE。"}, {"k": "sc", "t": "S5", "q": "Which modals are listed for Stage IV?", "o": ["will, would", "should, may", "may, could", "could, should"], "e": "p34。"}, {"k": "sc", "t": "S5", "q": "Which modals are listed for Stage V?", "o": ["should, may, could", "will, would, may", "will, should, could", "would, will, should"], "e": "p34。"}, {"k": "sc", "t": "S5", "q": "Which modal expresses a recommendation or expected benefit?", "o": ["should", "would", "will", "may"], "e": "p35。"}, {"k": "sc", "t": "S5", "q": "Which modal expresses a hypothetical or conditional situation?", "o": ["would", "will", "should", "may"], "e": "p35。"}, {"k": "sc", "t": "S5", "q": "Which modal makes a strong prediction or a statement about document content?", "o": ["will", "could", "may", "would"], "e": "p35：This paper will examine…"}, {"k": "sc", "t": "S5", "q": "Which modal expresses possibility or a cautious claim?", "o": ["may", "will", "should", "would"], "e": "p35。"}, {"k": "sc", "t": "S5", "q": "Which modal expresses a possible contribution or potential application?", "o": ["could", "will", "would", "should"], "e": "p35。"}, {"k": "sc", "t": "S5", "q": "Choose the best modal: “This paper ____ examine three scheduling methods.”", "o": ["will", "could", "may", "should"], "e": "說明文件內容 → will（同 p35）。"}, {"k": "sc", "t": "S5", "q": "Choose the best modal: “The study was made to determine whether solar heating ____ be competitive.”", "o": ["would", "will", "should", "may"], "e": "Stage IV、was made to determine whether → would（同 p38）。"}, {"k": "sc", "t": "S5", "q": "Which sentence makes the most cautious claim?", "o": ["The results could affect land prices.", "The results will affect land prices.", "The results should affect land prices.", "The results affect land prices."], "e": "could 最保留。"}, {"k": "sc", "t": "S5", "q": "Which sentence is a hedged contribution statement?", "o": ["The findings may improve network security.", "The findings prove network security.", "The findings improved all networks.", "The findings always secure networks."], "e": "may＝hedging。"}, {"k": "mc", "t": "S5", "q": "Which are the two orientations of Stage V? (Select all)", "o": ["*Practical", "*Theoretical", "Report", "Research"], "e": "p32；report / research 是 Stage IV。"}, {"k": "mc", "t": "S5", "q": "Which modals are “more cautious” in the slides? (Select all)", "o": ["*may", "*could", "will", "would"], "e": "p34：may / could = more cautious。"}];

const KIND={tf:"是非",sc:"單選",mc:"複選",fill:"填空",term:"名詞解釋"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/["“”.,;:!?()]/g,"").replace(/\s+/g," ").trim();
BANK.forEach((q,i)=>q.id="q"+i);
const store={get(k,d){try{const v=localStorage.getItem("rwst3_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("rwst3_"+k,JSON.stringify(v))}catch(e){}}};
let wrong=new Set(store.get("wrong",[]));
const saveWrong=()=>store.set("wrong",[...wrong]);
let timer=null;
const app=$("#app");
const scrollTop=()=>window.scrollTo(0,0);

// 把一題準備成可作答的物件（選項打亂）
function prep(q){
  const p={...q};
  if(q.k==="sc"){const o=q.o.map((t,i)=>({t,c:i===0}));p.opts=shuffle(o)}
  if(q.k==="mc"){p.opts=shuffle(q.o.map(t=>({t:t.replace(/^\*/,""),c:t.startsWith("*")})))}
  if(q.k==="tf"){p.opts=[{t:"True",c:q.a===true},{t:"False",c:q.a===false}]}
  return p;
}
function grade(p,ans){
  if(p.k==="fill") return ans!=null && p.a.map(norm).includes(norm(ans));
  if(p.k==="mc"){if(!ans||!ans.size)return false;return p.opts.every((o,i)=>o.c===ans.has(i))}
  return ans!=null && p.opts[ans].c;
}
function answerText(p){
  if(p.k==="fill") return p.a[0];
  return p.opts.filter(o=>o.c).map(o=>o.t).join("；");
}

// ================= 首頁 =================
function home(){
  clearInterval(timer);
  const cnt=k=>BANK.filter(q=>q.k===k).length;
  app.innerHTML=`
  <h1>科技論文寫作 Pop Quiz 3</h1>
  <p class="sub">11/25（三）小考｜Module 3 Introduction 全部 40 頁｜題庫 ${BANK.length} 題（單選 ${cnt("sc")}、複選 ${cnt("mc")}）</p>
  <div class="modes">
    <button class="mode" data-m="exam"><span class="n">20 題</span><b>📝 模擬小考</b><span>隨機單選 18 題＋複選 2 題，每題 5 分，交卷後看詳解</span></button>
    <button class="mode" data-m="practice"><span class="n">${BANK.length} 題</span><b>🎯 分階段練習</b><span>選階段和題型，一題一題作答，馬上看對錯</span></button>
    <button class="mode" data-m="wrong"><span class="n">${wrong.size} 題</span><b>📕 錯題本</b><span>答錯的題目會自動收進來，答對就移出</span></button>
  </div>
  <p class="hint" style="margin-top:12px">題目依投影片規則自編，解析標的 p 是投影片頁碼。紀錄只存在這台裝置的瀏覽器裡。</p>`;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>({exam,practice:practiceSetup,wrong:wrongStart})[b.dataset.m]());
  scrollTop();
}

// ================= 分階段練習 =================
let pSel={t:new Set(Object.keys(TOPICS)),k:new Set(["sc","mc"])};
function practiceSetup(){
  const n=()=>BANK.filter(q=>pSel.t.has(q.t)&&pSel.k.has(q.k)).length;
  app.innerHTML=`<div class="bar"><button class="btn back" id="bk">← 首頁</button><span class="grow"></span></div>
  <h1>分階段練習</h1><p class="sub">點選要練的範圍（可多選）</p>
  <h2>階段</h2><div class="chips" id="ct">${Object.entries(TOPICS).map(([k,v])=>`<button class="chip" data-v="${k}" aria-pressed="${pSel.t.has(k)}">${v}</button>`).join("")}</div>
  <h2>題型</h2><div class="chips" id="ck">${["sc","mc"].map(k=>`<button class="chip" data-v="${k}" aria-pressed="${pSel.k.has(k)}">${KIND[k]}</button>`).join("")}</div>
  <div class="row"><button class="btn primary" id="go"></button></div>`;
  const upd=()=>{const c=n();$("#go").textContent=`開始（${c} 題）`;$("#go").disabled=!c};
  [["#ct","t"],["#ck","k"]].forEach(([sel,key])=>$(sel).querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const s=pSel[key],v=c.dataset.v; s.has(v)?s.delete(v):s.add(v); c.setAttribute("aria-pressed",s.has(v)); upd();}));
  $("#bk").onclick=home; upd();
  $("#go").onclick=()=>runPractice(shuffle(BANK.filter(q=>pSel.t.has(q.t)&&pSel.k.has(q.k))),"分階段練習");
  scrollTop();
}
function wrongStart(){
  const list=BANK.filter(q=>wrong.has(q.id));
  if(!list.length){app.innerHTML=`<div class="bar"><button class="btn back" id="bk">← 首頁</button></div><h1>錯題本</h1><p class="sub">目前沒有錯題 👍 去寫模擬考或分階段練習吧。</p>`;$("#bk").onclick=home;return}
  runPractice(shuffle(list),"錯題本");
}
function runPractice(list,title){
  let i=0,ok=0,bad=0;
  const show=()=>{
    if(i>=list.length) return done();
    const p=prep(list[i]);
    app.innerHTML=`<div class="bar"><button class="btn back" id="bk">← 首頁</button><span>${i+1}/${list.length}</span>
      <div class="meter"><i class="g" style="width:${ok/list.length*100}%"></i><i class="b" style="width:${bad/list.length*100}%"></i></div><span>✓${ok} ✗${bad}</span></div>
      <div id="qbox"></div>`;
    $("#bk").onclick=home;
    renderQ($("#qbox"),p,{instant:true,num:i+1,onDone:(right)=>{
      right?ok++:bad++;
      if(right) wrong.delete(p.id); else wrong.add(p.id); saveWrong();
      const nx=document.createElement("div");nx.className="row";
      nx.innerHTML=`<button class="btn primary" id="nx">${i+1<list.length?"下一題 →":"看結果"}</button>`;
      $("#qbox .q").appendChild(nx);$("#nx").focus({preventScroll:true});
      $("#nx").onclick=()=>{i++;show()};
    }});
    scrollTop();
  };
  const done=()=>{
    app.innerHTML=`<div class="bar"><button class="btn back" id="bk">← 首頁</button></div>
    <div class="score"><div class="hint">${title}</div><div class="big">${ok} / ${list.length}</div><div class="hint">答對率 ${Math.round(ok/list.length*100)}%｜錯題本現在有 ${wrong.size} 題</div>
    <div class="row"><button class="btn primary" id="again">再練一次（重新打亂）</button>${wrong.size?'<button class="btn" id="wr">練錯題</button>':""}</div></div>`;
    $("#bk").onclick=home;$("#again").onclick=()=>runPractice(shuffle(list),title);
    if($("#wr"))$("#wr").onclick=wrongStart;
  };
  show();
}

// 畫一題；instant=true 時作答後立刻顯示對錯
function renderQ(box,p,{instant,num,onDone,onChange}){
  const L="ABCDE";
  const el=document.createElement("div");el.className="q";
  el.innerHTML=`<div class="meta"><span>${num?num+". ":""}${KIND[p.k]}</span><span>${TOPICS[p.t]||""}</span></div><p class="stem">${esc(p.q)}</p>`;
  const body=document.createElement("div");el.appendChild(body);box.appendChild(el);
  p.ans=p.k==="mc"?new Set():null;
  const finish=()=>{
    const right=grade(p,p.ans);
    showResult(el,p,right);
    onDone&&onDone(right);
  };
  if(p.k==="fill"){
    body.innerHTML=`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文答案">${instant?'<div class="row"><button class="btn primary">確認</button></div>':""}`;
    const inp=body.querySelector("input");
    inp.oninput=()=>{p.ans=inp.value;onChange&&onChange()};
    if(instant){const b=body.querySelector("button");const go=()=>{if(!inp.value.trim())return;inp.disabled=true;b.remove();finish()};b.onclick=go;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();go()}};setTimeout(()=>inp.focus({preventScroll:true}),50)}
    p.finish=finish;return el;
  }
  const wrapO=document.createElement("div");wrapO.className=p.k==="tf"?"tfrow":"opts";body.appendChild(wrapO);
  p.opts.forEach((o,idx)=>{
    const b=document.createElement("button");b.className="opt";b.setAttribute("aria-pressed","false");
    b.innerHTML=p.k==="tf"?`${o.t==="True"?"⭕ True":"❌ False"}`:`<span class="l">${L[idx]}</span><span>${esc(o.t)}</span>`;
    b.onclick=()=>{
      if(p.k==="mc"){p.ans.has(idx)?p.ans.delete(idx):p.ans.add(idx);b.setAttribute("aria-pressed",p.ans.has(idx));onChange&&onChange();return}
      p.ans=idx;wrapO.querySelectorAll(".opt").forEach((x,j)=>x.setAttribute("aria-pressed",j===idx));onChange&&onChange();
      if(instant){lock(el);finish()}
    };
    wrapO.appendChild(b);
  });
  if(p.k==="mc"){
    const h=document.createElement("p");h.className="hint";h.style.margin="8px 0 0";h.textContent="複選：選出所有正確答案"+(instant?"，再按確認":"");body.appendChild(h);
    if(instant){const r=document.createElement("div");r.className="row";r.innerHTML='<button class="btn primary">確認</button>';body.appendChild(r);
      r.querySelector("button").onclick=()=>{if(!p.ans.size)return;lock(el);r.remove();finish()}}
  }
  p.finish=finish;return el;
}
function lock(el){el.querySelectorAll("button.opt,input,textarea").forEach(x=>x.disabled=true)}
function showResult(el,p,right){
  if(p.k==="fill"){const inp=el.querySelector("input");inp.disabled=true;inp.classList.add(right?"ok":"no")}
  else el.querySelectorAll(".opt").forEach((b,i)=>{
    const sel=p.k==="mc"?p.ans.has(i):p.ans===i,c=p.opts[i].c;
    b.setAttribute("aria-pressed","false");
    if(sel&&c)b.classList.add("ok");else if(sel&&!c)b.classList.add("no");else if(c)b.classList.add("miss");
  });
  const ex=document.createElement("div");ex.className="exp";
  ex.innerHTML=`<span class="v ${right?"ok":"no"}">${right?"✓ 答對":"✗ 答錯"}</span>${right?"":`　正解：<b>${esc(answerText(p))}</b>`}<div>${esc(p.e)}</div>`;
  el.appendChild(ex);
}

// ================= 模擬考 =================
function pick(k,n){return shuffle(BANK.filter(q=>q.k===k)).slice(0,n).map(prep)}
function exam(){
  clearInterval(timer);
  const secs=[
    {k:"sc",title:"I. Single Choice 單選（18 × 5 分）",pts:5,items:pick("sc",18)},
    {k:"mc",title:"II. Multiple Choice 複選（2 × 5 分）",pts:5,items:pick("mc",2)},
  ];
  let left=20*60,submitted=false;
  app.innerHTML=`<div class="bar"><button class="btn back" id="bk">← 首頁</button><span id="tm">20:00</span><span class="grow"></span><span id="cnt">0/20</span><button class="btn primary" id="sub" style="min-height:36px;padding:6px 12px">交卷</button></div>
  <div id="res"></div><div id="paper"></div>`;
  const paper=$("#paper");
  const answered=()=>secs.reduce((a,s)=>a+s.items.filter(p=>p.k==="term"?(p.txt||"").trim():p.k==="mc"?p.ans&&p.ans.size:p.k==="fill"?(p.ans||"").trim():p.ans!=null).length,0);
  const upd=()=>{$("#cnt").textContent=answered()+"/20"};
  let n=0;
  secs.forEach(s=>{
    const h=document.createElement("div");h.className="sec-title";h.textContent=s.title;paper.appendChild(h);
    s.items.forEach(p=>{
      n++;
      if(p.k==="term"){
        const el=document.createElement("div");el.className="q";
        el.innerHTML=`<div class="meta"><span>${n}. 名詞解釋</span></div><p class="stem">Define: <b>${esc(p.q)}</b></p><textarea placeholder="用英文寫定義（交卷後對照參考答案自己評分）"></textarea>`;
        const ta=el.querySelector("textarea");ta.oninput=()=>{p.txt=ta.value;upd()};
        p.el=el;paper.appendChild(el);
      } else p.el=renderQ(paper,p,{instant:false,num:n,onChange:upd});
    });
  });
  const tick=()=>{left--;const m=Math.max(0,left)/60|0,sx=Math.max(0,left)%60;$("#tm").textContent=`${m}:${String(sx).padStart(2,"0")}`;if(left<=300)$("#tm").style.color="var(--bad)";if(left<=0)submit(true)};
  timer=setInterval(tick,1000);
  $("#bk").onclick=()=>{if(submitted||!answered()||confirmLeave())home()};
  function confirmLeave(){ // 不用瀏覽器 confirm，改成按兩次
    const b=$("#bk");if(b.dataset.armed){return true}b.dataset.armed=1;b.textContent="再按一次離開";setTimeout(()=>{b.textContent="← 首頁";delete b.dataset.armed},2500);return false}
  $("#sub").onclick=()=>{
    const b=$("#sub");const un=20-answered();
    if(un>0&&!b.dataset.armed){b.dataset.armed=1;b.textContent=`還有 ${un} 題沒寫，再按一次交卷`;setTimeout(()=>{if(!submitted){b.textContent="交卷";delete b.dataset.armed}},3000);return}
    submit(false);
  };
  function submit(auto){
    if(submitted)return;submitted=true;clearInterval(timer);
    $("#sub").remove();
    const per={};let auto_=0;
    secs.forEach(s=>{
      per[s.k]={got:0,max:s.items.length*s.pts,ok:0,n:s.items.length,pts:s.pts};
      s.items.forEach(p=>{
        if(p.k==="term"){
          const ta=p.el.querySelector("textarea");ta.disabled=true;
          const ex=document.createElement("div");ex.className="exp";
          ex.innerHTML=`<b>${esc(p.q)}</b>（${esc(p.zh)}）<div>${esc(p.def)}</div><label class="selfck"><input type="checkbox"> 我的定義有寫到重點（+1 分）</label>`;
          p.el.appendChild(ex);ex.querySelector("input").onchange=e=>{p.self=e.target.checked;summary()};
          return;
        }
        lock(p.el);const right=grade(p,p.ans);p.right=right;showResult(p.el,p,right);
        if(right){per[s.k].ok++;per[s.k].got+=s.pts;wrong.delete(p.id)}else wrong.add(p.id);
      });
    });
    saveWrong();
    function summary(){
      
      const total=Object.values(per).reduce((a,v)=>a+v.got,0);
      $("#res").innerHTML=`<div class="score"><div class="hint">${auto?"時間到，自動交卷":"模擬考成績"}（用時 ${Math.round((20*60-Math.max(0,left))/60)} 分鐘）</div>
      <div class="big">${total} <span style="font-size:1rem;color:var(--muted)">/ 100</span></div>
      <table><tr><th>題型</th><th class="r">答對</th><th class="r">得分</th></tr>
      ${secs.map(s=>`<tr><td>${KIND[s.k]}</td><td class="r">${per[s.k].ok}/${per[s.k].n}</td><td class="r">${per[s.k].got}/${per[s.k].max}</td></tr>`).join("")}</table>
      <p class="hint">往下滑可看每題詳解。答錯的題目已收進錯題本（${wrong.size} 題）。</p>
      <div class="row"><button class="btn primary" id="again">再考一份（新題目）</button><button class="btn" id="home2">回首頁</button></div></div>`;
      $("#again").onclick=exam;$("#home2").onclick=home;
    }
    summary();scrollTop();
  }
  scrollTop();
}

home();
</script>
</body>
</html>
