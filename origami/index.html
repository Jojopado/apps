<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="在手機上一步一步摺真正的摺紙：基本功、小狗、南瓜燈、天鵝、企鵝。">
<meta name="theme-color" content="#2D5A4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="摺紙動物園">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232D5A4A'/%3E%3Cpath d='M12 44 32 12 52 44Z' fill='%23F4C93A'/%3E%3Cpath d='M32 12 52 44 32 36Z' fill='%23FBF8F0'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232D5A4A'/%3E%3Cpath d='M12 44 32 12 52 44Z' fill='%23F4C93A'/%3E%3Cpath d='M32 12 52 44 32 36Z' fill='%23FBF8F0'/%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>摺紙動物園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* layout: one-screen app — animal picker (圖鑑) over a workbench: header strip, cutting mat, tool tray */
:root{
  --desk:#E4E2DA; --tray:#F3F1EA; --ink:#26292A; --ink-2:#646A68; --line:#CFCBC0;
  --chip:#FFFFFF; --press:#E9E6DC; --good:#2F7D4F; --mat:#2D5A4A; --gold:#D9A21B;
  --font-d:"Klee One","Noto Sans TC",system-ui,sans-serif;
  --font-b:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#171B1A; --tray:#212625; --ink:#E9E8E2; --ink-2:#9EA5A2; --line:#363D3B;
  --chip:#2A302F; --press:#333A38; --good:#6CC08E; --gold:#E9B935; color-scheme:dark }}
:root[data-theme="dark"]{
  --desk:#171B1A; --tray:#212625; --ink:#E9E8E2; --ink-2:#9EA5A2; --line:#363D3B;
  --chip:#2A302F; --press:#333A38; --good:#6CC08E; --gold:#E9B935; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--font-b);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 8px;gap:10px;box-sizing:border-box}
.top{display:flex;align-items:center;gap:10px}
.back{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;height:40px;padding:0 10px;font:500 13px var(--font-b);cursor:pointer;display:flex;align-items:center;gap:2px;flex:none}
.title{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.title b{font-family:var(--font-d);font-weight:600;font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.target{display:flex;align-items:center;gap:8px}
.target canvas{width:54px;height:54px;border-radius:8px;background:var(--mat);display:block}
.meter{display:flex;flex-direction:column;align-items:flex-end;min-width:56px}
.meter small{font-size:11px;color:var(--ink-2);letter-spacing:.06em}
.meter strong{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.meter strong.ok{color:var(--good)}
.stage{flex:1;position:relative;min-height:0;border-radius:14px;overflow:hidden;background:var(--mat)}
#mat{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(14,30,24,.72);color:#F2EFE4;font:600 18px var(--font-b);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.zoom button:active{background:rgba(14,30,24,.9)}
.zoom button span{font-size:11px;font-weight:500}
.coach{position:absolute;left:12px;right:12px;top:10px;color:#F2EFE4;font-size:13px;line-height:1.5;
  background:rgba(14,30,24,.6);padding:8px 10px;border-radius:8px;pointer-events:none}
.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.hud span{background:rgba(14,30,24,.72);color:#F2EFE4;font-size:12px;padding:4px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.hud span.fine{background:#FF7A59;color:#2A1208;font-weight:700}
.readout{position:absolute;left:10px;bottom:8px;color:rgba(242,239,228,.75);font-size:11.5px;font-variant-numeric:tabular-nums;pointer-events:none;letter-spacing:.03em}
.cry{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-family:var(--font-d);font-weight:600;font-size:30px;color:#FFF7E0;
  text-shadow:0 2px 0 rgba(0,0,0,.25);pointer-events:none;animation:cry 1.4s ease-out forwards}
@keyframes cry{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.08)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(14,22,20,.88);color:#F4F1E8;
  padding:8px 12px;border-radius:8px;font-size:13px;max-width:86%;text-align:center;pointer-events:none}
.tray{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.step{position:absolute;left:10px;right:10px;top:10px;background:rgba(250,248,240,.95);color:#26292A;border-radius:10px;padding:8px 10px;
  font-size:13px;line-height:1.55;box-shadow:0 2px 10px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:5px}
.step .chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.step .chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#E8E4D8;color:#3C3F3D;border:0;font-family:inherit;cursor:default}
.step .chip.no{background:#FF7A59;color:#2A1208;font-weight:700;cursor:pointer}
.step .n{font-weight:700;font-variant-numeric:tabular-nums}
.step .x{margin-left:auto;border:0;background:none;color:#646A68;font-size:12px;cursor:pointer;padding:2px 4px}
.typelist{display:flex;flex-direction:column;gap:8px}
.typeopt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font:inherit}
.typeopt.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.typeopt svg{width:64px;height:28px;flex:none}
.typeopt b{font-size:15px}
.typeopt span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.src{font-size:12.5px;color:var(--ink-2)}
.src a{color:var(--ink)}
.lessons{display:grid;grid-template-columns:repeat(5,minmax(128px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.secthead h2{margin:0;font-size:16px;font-weight:700}
.secthead span{font-size:12px;color:var(--ink-2)}
.tool{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:7px 2px 6px;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:3px;font:500 12px var(--font-b);cursor:pointer}
.tool svg{width:20px;height:20px}
.tool:active{background:var(--press)}
.tool[disabled]{opacity:.4}
.tool.on{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.tool.go{background:var(--good);color:#fff;border-color:var(--good)}
.tool .stk{width:22px;height:22px;display:block}
button:focus-visible,input:focus-visible{outline:2px solid var(--good);outline-offset:2px}

/* 圖鑑首頁 */
.home{position:fixed;inset:0;background:var(--desk);z-index:4;overflow:auto}
.home-in{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:14px}
.home h1{margin:0;font-family:var(--font-d);font-weight:600;font-size:30px;line-height:1.15;text-wrap:balance}
.home .lead{margin:0;color:var(--ink-2);font-size:14px;line-height:1.6;max-width:36em}
.dex{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-2)}
.dex b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;cursor:pointer;color:inherit;font:inherit;text-align:left;position:relative}
.card canvas{width:100%;max-width:100%;aspect-ratio:1;border-radius:10px;background:var(--mat);display:block}
.card .nm{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:0 2px}
.card .nm b{font-family:var(--font-d);font-weight:600;font-size:18px}
.card .meta{font-size:11.5px;color:var(--ink-2);padding:0 2px;display:flex;justify-content:space-between;gap:6px}
.card .tag{position:absolute;top:14px;left:14px;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(14,30,24,.65);color:#F2EFE4}
.card .tag.got{background:var(--gold);color:#3A2A00;font-weight:700}
.card.free{border-style:dashed}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px;white-space:nowrap}
.stars .off{color:var(--line)}
.mine{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.mine figure{margin:0;flex:none;width:96px;display:flex;flex-direction:column;gap:4px;align-items:center}
.mine canvas{width:96px;height:96px;border-radius:10px;background:var(--mat)}
.mine figcaption{font-size:12px;color:var(--ink-2);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home h2{margin:6px 0 0;font-size:15px;font-weight:700}

.sheet{position:fixed;inset:0;background:rgba(10,16,14,.5);display:flex;align-items:flex-end;justify-content:center;z-index:6}
.panel{background:var(--tray);color:var(--ink);width:100%;max-width:720px;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.panel h2{margin:0;font-family:var(--font-d);font-weight:600;font-size:24px}
.panel p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.6}
.pick-top{display:flex;gap:14px;align-items:center}
.pick-top canvas{width:132px;height:132px;border-radius:12px;background:var(--mat);flex:none}
.pick-top div{min-width:0;display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--tray);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.label{font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.row{display:flex;gap:10px}
.btn{flex:1;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:12px;font:500 15px var(--font-b);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.done-top{display:flex;gap:14px;align-items:center;min-width:0}
.done-top canvas{width:150px;height:150px;border-radius:12px;background:var(--mat);flex:none}
.big{font-size:38px;font-variant-numeric:tabular-nums;font-weight:700;line-height:1}
.field{display:flex;flex-direction:column;gap:6px}
.field input{width:100%;min-width:0;box-sizing:border-box;font:500 16px var(--font-b);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
@media (max-width:380px){.title b{font-size:18px}.tool{font-size:10.5px}.tool svg{width:18px;height:18px}.pick-top canvas{width:110px;height:110px}.done-top canvas{width:120px;height:120px}}
@media (prefers-reduced-motion: reduce){.cry{animation:none;opacity:0}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="back" id="homeBtn" type="button" aria-label="回到圖鑑"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>圖鑑</button>
    <div class="title"><b id="lvName">小狗</b><span id="lvSub">範例 4 摺 · 普通</span></div>
    <div class="target" id="targetBox">
      <canvas id="thumb" width="108" height="108" aria-label="目標形狀"></canvas>
      <div class="meter"><small>相似度</small><strong id="score">–</strong></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="mat"></canvas>
    <div class="coach" id="coach" hidden></div>
    <div class="step" id="stepCard" hidden></div>
    <div class="hud" id="hud" hidden></div>
    <div class="zoom"><button id="zIn" type="button" aria-label="放大">＋</button><button id="zOut" type="button" aria-label="縮小">－</button><button id="zFit" type="button" aria-label="看全部"><span>全部</span></button></div>
    <div class="readout" id="readout">150 × 150 mm 標準紙</div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <div class="tray" id="foldTray">
    <button class="tool" id="undo" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>復原</button>
    <button class="tool" id="typeBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path id="typeIcon" d="M2 12h20" stroke-dasharray="4 3"/><path d="M7 7l5-4 5 4" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="typeLbl">谷摺</span></button>
    <button class="tool" id="scopeBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9h16v10H4z" opacity=".4"/><path d="M4 5h16v10H4z"/></svg><span id="scopeLbl">全部層</span></button>
    <button class="tool" id="flip" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7 3 12l5 5"/><path d="m16 7 5 5-5 5"/></svg>翻面</button>
    <button class="tool" id="rot" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg>旋轉</button>
    <button class="tool" id="hint" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/></svg><span id="hintLbl">提示</span></button>
  </div>
  <div class="tray" id="stickerTray" hidden></div>
</div>

<div class="home" id="home">
  <div class="home-in">
    <h1>今天摺什麼？</h1>
    <p class="lead">先學基本功，再照真正的摺紙教學一步一步摺。摺好的作品會收進你的圖鑑。</p>
    <div class="secthead"><h2>基本功</h2><span id="lessonCount">0 / 5 學會</span></div>
    <div class="lessons" id="lessonGrid"></div>
    <div class="secthead"><h2>作品</h2><span>圖鑑 <b id="dexCount">0 / 1</b></span></div>
    <div class="grid" id="animalGrid"></div>
    <h2 id="mineTitle" hidden>我自己創作的</h2>
    <div class="mine" id="mineList" hidden></div>
  </div>
</div>

<div class="sheet" id="pick" hidden>
  <div class="panel">
    <div class="pick-top">
      <canvas id="pickCanvas" width="264" height="264"></canvas>
      <div>
        <h2 id="pickName">小狗</h2>
        <span class="stars" id="pickStars"></span>
        <p id="pickInfo">範例 4 摺 · 普通</p>
      </div>
    </div>
    <p id="pickTip"></p>
    <p class="src" id="pickSrc" hidden></p>
    <div class="label">選紙的顏色（正面）</div>
    <div class="swatches" id="swatches"></div>
    <div class="row">
      <button class="btn" id="pickCancel" type="button">再看看</button>
      <button class="btn primary" id="pickGo" type="button">開始摺</button>
    </div>
  </div>
</div>

<div class="sheet" id="done" hidden>
  <div class="panel">
    <div class="done-top">
      <canvas id="doneCanvas" width="300" height="300"></canvas>
      <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
        <h2 id="doneTitle">小狗摺好了</h2>
        <div class="big" id="donePct">96%</div>
        <span class="stars" id="doneStars"></span>
        <p id="doneInfo">用了 4 摺（範例 4 摺）</p>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="keep" type="button">繼續修</button>
      <button class="btn primary" id="collect" type="button">收進圖鑑</button>
    </div>
  </div>
</div>

<div class="sheet" id="typeSheet" hidden>
  <div class="panel">
    <h2>選摺法</h2>
    <p>摺紙圖用不同的線代表不同摺法：谷線是虛線、山線是一長兩點的點虛線。拖曳時紙上的預覽線也照這個畫。</p>
    <div class="typelist" id="typeList"></div>
    <div class="row"><button class="btn" id="typeClose" type="button">關閉</button></div>
  </div>
</div>

<div class="sheet" id="nameSheet" hidden>
  <div class="panel">
    <div class="done-top">
      <canvas id="nameCanvas" width="300" height="300"></canvas>
      <div class="field" style="flex:1;min-width:0">
        <h2>幫牠取名字</h2>
        <label class="label" for="petName">名字</label>
        <input id="petName" maxlength="12" autocomplete="off">
      </div>
    </div>
    <div class="row">
      <button class="btn" id="nameBack" type="button">再貼一下</button>
      <button class="btn primary" id="nameSave" type="button">收進圖鑑</button>
    </div>
  </div>
</div>

<script id="engine">
/* ---------- 摺紙引擎 v2：摺痕圖＋層序求解 ----------
   每一片紙（facet）記住它在原始正方形上的形狀 sh，以及目前的仿射變換 T（只會是旋轉／平移／鏡射）。
   world 位置 = T(sh)；翻了奇數次（det(T)<0）就看到另一面。
   paper.order 記錄每一對重疊的片誰在上面；每次摺完用求解器重新算，規則：
     ① 平的摺痕兩邊算同一張紙：跨過摺痕的別層，不能一上一下夾住它（對兩邊的上下關係一樣）
     ② 摺起來的摺痕像夾餅：跨過摺痕的別層不能插到夾餅中間
     ③ 三片有共同重疊區時，上下關係不能繞成一圈
   決定不了的，照谷摺／山摺的意圖猜，猜錯就回溯。 */
const R2 = Math.SQRT2;
let FID = 1;
const EPS = 1e-9;

/* ---- 仿射變換 [a,b,c,d,e,f]：x' = a x + c y + e、y' = b x + d y + f ---- */
const I2 = [1,0,0,1,0,0];
function aff(T,p){ return [T[0]*p[0]+T[2]*p[1]+T[4], T[1]*p[0]+T[3]*p[1]+T[5]]; }
function mul(A,B){ return [A[0]*B[0]+A[2]*B[1], A[1]*B[0]+A[3]*B[1], A[0]*B[2]+A[2]*B[3], A[1]*B[2]+A[3]*B[3], A[0]*B[4]+A[2]*B[5]+A[4], A[1]*B[4]+A[3]*B[5]+A[5]]; }
function inv(T){ const D=T[0]*T[3]-T[1]*T[2], a=T[3]/D, b=-T[1]/D, c=-T[2]/D, d=T[0]/D; return [a,b,c,d,-(a*T[4]+c*T[5]),-(b*T[4]+d*T[5])]; }
function reflM(P,n){ const a=1-2*n[0]*n[0], b=-2*n[0]*n[1], d=1-2*n[1]*n[1], k=2*(P[0]*n[0]+P[1]*n[1]); return [a,b,b,d,k*n[0],k*n[1]]; }
const det=T=>T[0]*T[3]-T[1]*T[2];
const ROTT=[0,1,-1,0,0,0], FLIPT=[-1,0,0,1,0,0];

function sd(q,P,n){ return (q[0]-P[0])*n[0] + (q[1]-P[1])*n[1]; }
function reflect(q,P,n){ const d = sd(q,P,n); return [q[0]-2*d*n[0], q[1]-2*d*n[1]]; }
function polyArea(p){ let a=0; for(let i=0;i<p.length;i++){ const u=p[i], v=p[(i+1)%p.length]; a += u[0]*v[1]-v[0]*u[1]; } return a/2; }
function foldLine(s,t){
  const dx=s[0]-t[0], dy=s[1]-t[1], L=Math.hypot(dx,dy);
  return {P:[(s[0]+t[0])/2, (s[1]+t[1])/2], n:[dx/L, dy/L]};
}

/* ---- 紙 ---- */
function newPaper(kind, colorUp=false){
  const sh = kind === 'diamond' ? [[0,R2],[-R2,0],[0,-R2],[R2,0]] : [[-1,1],[-1,-1],[1,-1],[1,1]];
  return derive({facets:[{id:FID++, sh, nb:[-1,-1,-1,-1], T:I2.slice()}], order:new Map(), colorUp, refs:[]});
}
// 由 sh/T 算出畫圖與評分用的欄位：pts（world）、c（朝上是不是彩色面）、z（由 order 拓樸排序）
function derive(p){
  for(const f of p.facets){ f.pts=f.sh.map(q=>aff(f.T,q)); if(det(f.T)<0) f.pts.reverse(); f.c = p.colorUp ? det(f.T)>0 : det(f.T)<0; }
  assignZ(p);
  return p;
}
const pkey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
// order 的值：+1 表示 id 小的那片在上面
function above(p,a,b){ const v=p.order.get(pkey(a,b)); if(v===undefined) return 0; return a<b ? v : -v; }
function assignZ(p){
  const ids=p.facets.map(f=>f.id), idx=new Map(ids.map((id,i)=>[id,i])), indeg=ids.map(()=>0), out=ids.map(()=>[]);
  for(const [k,v] of p.order){ const [a,b]=k.split('|').map(Number); if(!idx.has(a)||!idx.has(b)) continue;
    const lo = v>0 ? b : a, hi = v>0 ? a : b; out[idx.get(lo)].push(idx.get(hi)); indeg[idx.get(hi)]++; }
  const q=[]; indeg.forEach((d,i)=>{ if(!d) q.push(i); });
  let z=0; const seen=new Set();
  while(q.length || seen.size<ids.length){
    if(!q.length){ // 有環：挑一個沒處理的硬放（理論上不該發生）
      for(let i=0;i<ids.length;i++) if(!seen.has(i)){ q.push(i); break; } }
    const i=q.shift(); if(seen.has(i)) continue; seen.add(i); p.facets[i].z=z++;
    for(const j of out[i]) if(--indeg[j]===0) q.push(j);
  }
}
function copyPaper(p){ return {facets:p.facets.map(f=>({id:f.id, sh:f.sh, nb:f.nb.slice(), T:f.T.slice(), pts:f.pts, c:f.c, z:f.z})), order:new Map(p.order), colorUp:p.colorUp, refs:p.refs}; }
// 一般的摺會改變紙的結構，複合摺用的參考狀態（cref）只在連續的複合步驟之間沿用

/* ---- 切開：沿 world 直線切一片，邊的鄰居一起記好（切口 = CUT） ---- */
function reversePoly(pts,nb){ const L=pts.length; return {pts:pts.slice().reverse(), nb:pts.map((_,j)=>nb[((L-2-j)%L+L)%L])}; }
const CUT=-2;
function cleanLabeled(list){
  let o=[];
  for(const e of list){ const l=o[o.length-1]; if(l && Math.hypot(l.p[0]-e.p[0], l.p[1]-e.p[1]) <= 1e-9) o[o.length-1]=e; else o.push(e); }
  while(o.length>1){ const a=o[0], b=o[o.length-1]; if(Math.hypot(a.p[0]-b.p[0], a.p[1]-b.p[1]) <= 1e-9){ o[0]={p:a.p, nb:a.nb}; o.pop(); } else break; }
  if(o.length<3) return null;
  const pts=o.map(e=>e.p); if(Math.abs(polyArea(pts)) <= 1e-7) return null;
  return {pts, nb:o.map(e=>e.nb)};
}
function splitPoly(pts,nb,P,n){
  const pos=[], neg=[], E=1e-9;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length], e=nb[i], da=sd(a,P,n), db=sd(b,P,n);
    const sa=da>E?1:da<-E?-1:0, sb=db>E?1:db<-E?-1:0;
    const m = (sa*sb<0) ? (()=>{ const t=da/(da-db); return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; })() : null;
    for(const [side,out] of [[1,pos],[-1,neg]]){
      const A=sa*side, B=sb*side;
      if(A>=0){
        if(B>=0) out.push({p:a, nb:e});
        else if(A>0){ out.push({p:a, nb:e}); out.push({p:m, nb:CUT}); }
        else out.push({p:a, nb:CUT});
      } else if(B>0) out.push({p:m, nb:e});
    }
  }
  return [cleanLabeled(pos), cleanLabeled(neg)];
}
// 在 world 直線上切開 sel 裡的片（sel=null 表示全部），回傳新紙＋每片新片的來源與在線的哪一側
function cutPaper(paper,P,n,sel){
  const pieces=[], map=new Map();
  for(const f of paper.facets){
    const w=f.sh.map(q=>aff(f.T,q));
    if(sel && !sel.has(f.id)){ const side=sideOf(w,P,n); const q={id:f.id, sh:f.sh, nb:f.nb.slice(), T:f.T, src:f.id, side}; pieces.push(q); map.set(f.id,{[side>0?'pos':'neg']:q, only:q}); continue; }
    const [pos,neg]=splitPoly(w,f.nb,P,n), ent={}, Ti=inv(f.T), whole=!(pos&&neg);   // 沒被切開的片保留原本的 id
    if(pos){ const q={id:whole?f.id:FID++, sh:whole?f.sh:pos.pts.map(x=>aff(Ti,x)), nb:whole?f.nb.slice():pos.nb, T:f.T, src:f.id, side:1}; pieces.push(q); ent.pos=q; }
    if(neg){ const q={id:whole?f.id:FID++, sh:whole?f.sh:neg.pts.map(x=>aff(Ti,x)), nb:whole?f.nb.slice():neg.nb, T:f.T, src:f.id, side:-1}; pieces.push(q); ent.neg=q; }
    map.set(f.id, ent);
  }
  for(const q of pieces){
    const ent0=map.get(q.src), other = q.side>0 ? ent0.neg : ent0.pos;
    q.nb = q.nb.map((x,i)=>{
      if(x===CUT) return other ? other.id : -1;
      if(x<0) return -1;
      const ent=map.get(x); if(!ent) return -1;
      if(ent.pos && ent.neg){ const a=aff(q.T,q.sh[i]), b=aff(q.T,q.sh[(i+1)%q.sh.length]), d=sd([(a[0]+b[0])/2,(a[1]+b[1])/2],P,n);
        return (d>1e-9 ? ent.pos : d<-1e-9 ? ent.neg : (q.side>0?ent.neg:ent.pos)).id; }
      return (ent.pos||ent.neg).id;
    });
  }
  // 舊的上下關係搬到新片上
  const order=new Map();
  for(let i=0;i<pieces.length;i++) for(let j=i+1;j<pieces.length;j++){
    const a=pieces[i], b=pieces[j]; if(a.src===b.src) continue;
    const v=above(paper,a.src,b.src); if(v) order.set(pkey(a.id,b.id), a.id<b.id ? v : -v);
  }
  return {facets:pieces, order, colorUp:paper.colorUp, refs:paper.refs};
}
function sideOf(w,P,n){ let s=0; for(const q of w){ const d=sd(q,P,n); if(Math.abs(d)>Math.abs(s)) s=d; } return s>0?1:-1; }

/* ---- 幾何：凸多邊形交集 ---- */
function clipPoly(subj,clip){
  let out=subj; const ccw=polyArea(clip)>0;
  for(let i=0;i<clip.length && out.length;i++){
    const A=clip[i], B=clip[(i+1)%clip.length], inp=out; out=[];
    const side=q=>{ const v=(B[0]-A[0])*(q[1]-A[1])-(B[1]-A[1])*(q[0]-A[0]); return ccw?v:-v; };
    for(let k=0;k<inp.length;k++){
      const P=inp[k], Q=inp[(k+1)%inp.length], sp=side(P), sq=side(Q);
      if(sp>=-1e-12) out.push(P);
      if((sp>1e-12&&sq<-1e-12)||(sp<-1e-12&&sq>1e-12)){ const t=sp/(sp-sq); out.push([P[0]+(Q[0]-P[0])*t, P[1]+(Q[1]-P[1])*t]); }
    }
  }
  return out;
}
const overlapArea=(a,b)=>{ const c=clipPoly(a,b); return c.length>=3 ? Math.abs(polyArea(c)) : 0; };
// 線段有沒有穿過多邊形內部（不算只碰到邊）
function segCrossesInterior(poly,a,b){
  const ccw=polyArea(poly)>0; let t0=0, t1=1;
  for(let i=0;i<poly.length;i++){
    const A=poly[i], B=poly[(i+1)%poly.length];
    const f=q=>{ const v=(B[0]-A[0])*(q[1]-A[1])-(B[1]-A[1])*(q[0]-A[0]); return ccw?v:-v; };
    const fa=f(a), fb=f(b);
    if(fa<=1e-9 && fb<=1e-9) return false;
    if(fa<=1e-9 || fb<=1e-9){ const t=fa/(fa-fb); if(fa<=1e-9) t0=Math.max(t0,t); else t1=Math.min(t1,t); }
  }
  return t1-t0>1e-6;
}

/* ---- 層序求解 ----
   hints：Map(pairKey → 建議值)；hard：Map(pairKey → 必須值)。回傳完整的 order。 */
function solveLayers(p, hard, hints){
  const F=p.facets, n=F.length, W=F.map(f=>f.sh.map(q=>aff(f.T,q)));
  W.forEach((w,i)=>{ if(polyArea(w)<0) W[i]=w.slice().reverse(); });
  const pairs=[], pidx=new Map();
  const ov=[]; for(let i=0;i<n;i++) ov.push(new Set());
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
    if(overlapArea(W[i],W[j])>1e-6){ const a=F[i].id, b=F[j].id, k=pkey(a,b); pidx.set(k,pairs.length); pairs.push([a,b]); ov[i].add(j); ov[j].add(i); }
  }
  const iOf=new Map(F.map((f,i)=>[f.id,i]));
  // 變數 v[k]：+1 = 小 id 在上
  const val=new Int8Array(pairs.length);
  const varOf=(a,b)=>{ const k=pidx.get(pkey(a,b)); return k===undefined ? null : {k, s: a<b?1:-1}; };
  // 等式限制：o(A,X) == o(B,X)
  const eqs=pairs.map(()=>[]);
  const addEq=(x,y)=>{ if(!x||!y||x.k===y.k) return; eqs[x.k].push([x.s, y.k, y.s]); eqs[y.k].push([y.s, x.k, x.s]); };
  for(let i=0;i<n;i++){ const f=F[i];
    for(let e=0;e<f.sh.length;e++){ const nbId=f.nb[e]; if(nbId<0 || nbId<f.id) continue; const j=iOf.get(nbId); if(j===undefined) continue;
      const a=aff(f.T,f.sh[e]), b=aff(f.T,f.sh[(e+1)%f.sh.length]);
      for(const x of ov[i]){ if(x===j || !ov[j].has(x)) continue;
        if(segCrossesInterior(W[x],a,b)) addEq(varOf(f.id,F[x].id), varOf(nbId,F[x].id)); } } }
  // 兩條攤平的摺痕疊在同一處：兩張紙在這裡各自是平的，左右兩半的上下關係必須一樣（否則會穿過去）
  { const flats=[];
    for(let i=0;i<n;i++){ const f=F[i];
      for(let e=0;e<f.sh.length;e++){ const nbId=f.nb[e]; if(nbId<0 || nbId<f.id) continue; const j=iOf.get(nbId); if(j===undefined) continue;
        if(Math.sign(det(f.T))!==Math.sign(det(F[j].T))) continue;
        flats.push({i, j, a:aff(f.T,f.sh[e]), b:aff(f.T,f.sh[(e+1)%f.sh.length])}); } }
    for(let x=0;x<flats.length;x++) for(let y=x+1;y<flats.length;y++){ const A=flats[x], B=flats[y];
      const dx=A.b[0]-A.a[0], dy=A.b[1]-A.a[1], L=Math.hypot(dx,dy); if(L<1e-9) continue;
      const nrm=[-dy/L,dx/L]; if(Math.abs(sd(B.a,A.a,nrm))>1e-7 || Math.abs(sd(B.b,A.a,nrm))>1e-7) continue;
      const u=q=>((q[0]-A.a[0])*dx+(q[1]-A.a[1])*dy)/L, lo=Math.max(0,Math.min(u(B.a),u(B.b))), hi=Math.min(L,Math.max(u(B.a),u(B.b)));
      if(hi-lo<1e-6) continue;
      const side=k=>{ const w=W[k], c=w.reduce((s,q)=>[s[0]+q[0]/w.length,s[1]+q[1]/w.length],[0,0]); return Math.sign(sd(c,A.a,nrm)); };
      const A1=side(A.i)>0?A.i:A.j, A2=A1===A.i?A.j:A.i, B1=side(B.i)>0?B.i:B.j, B2=B1===B.i?B.j:B.i;
      if(!ov[A1].has(B1) || !ov[A2].has(B2)) continue;
      addEq(varOf(F[A1].id,F[B1].id), varOf(F[A2].id,F[B2].id));
    } }
  // 三片共同重疊：遞移
  const tris=[];
  for(const [a,b] of pairs){ const ia=iOf.get(a), ib=iOf.get(b); const ab=clipPoly(W[ia],W[ib]); if(ab.length<3) continue;
    // 只用索引判斷（ia<ib<ic），每組三片剛好算一次；之前混用 id 會漏掉一些三片組合 → 層序出現循環
    for(const ic of ov[ia]){ if(ic<=ib || !ov[ib].has(ic)) continue;
      if(overlapArea(ab,W[ic])>1e-6) tris.push([a,b,F[ic].id]); } }
  const triOf=pairs.map(()=>[]); tris.forEach((t,ti)=>{ for(const [x,y] of [[t[0],t[1]],[t[1],t[2]],[t[0],t[2]]]) triOf[pidx.get(pkey(x,y))].push(ti); });
  const get=(a,b)=>{ const v=varOf(a,b); return v ? val[v.k]*v.s : 0; };
  const trail=[];
  function set(k,v,queue){ if(val[k]===v) return true; if(val[k]!==0) return false; val[k]=v; trail.push(k); queue.push(k); return true; }
  function propagate(queue){
    while(queue.length){ const k=queue.pop(), v=val[k];
      for(const [s1,k2,s2] of eqs[k]){ if(!set(k2, v*s1*s2, queue)) return false; }
      for(const ti of triOf[k]){ const t=tris[ti];
        // 遞移：x 在 y 上、y 在 z 上 ⇒ x 在 z 上（六種排列都檢查）
        for(const [x,y,z] of [[t[0],t[1],t[2]],[t[0],t[2],t[1]],[t[1],t[0],t[2]],[t[1],t[2],t[0]],[t[2],t[0],t[1]],[t[2],t[1],t[0]]]){
          if(get(x,y)===1 && get(y,z)===1){ const w=varOf(x,z); if(!set(w.k, w.s, queue)) return false; } }
      }
    }
    return true;
  }
  function undoTo(len){ while(trail.length>len) val[trail.pop()]=0; }
  // 先放必須的
  const q0=[];
  const dbg=m=>{ if(typeof SOLVE_LOG!=='undefined') SOLVE_LOG.push(m); };
  for(const [k,v] of hard){ const i=pidx.get(k); if(i===undefined) continue; if(!set(i,v,q0)){ dbg('hard-conflict '+k); return null; } }
  if(!propagate(q0)){ dbg('hard-propagate'); if(typeof SOLVE_DUMP!=='undefined') SOLVE_DUMP.push({p,hard}); return null; }
  // 回溯搜尋：先照提示猜
  const orderVars=pairs.map((_,i)=>i).sort((x,y)=>(hints.has(pkey(...pairs[y]))?1:0)-(hints.has(pkey(...pairs[x]))?1:0));
  let steps=0;
  function dfs(pos){
    while(pos<orderVars.length && val[orderVars[pos]]!==0) pos++;
    if(pos>=orderVars.length) return true;
    if(++steps>20000) return false;
    const k=orderVars[pos], h=hints.get(pkey(...pairs[k]))||1;
    for(const v of [h,-h]){ const mark=trail.length, q=[]; if(set(k,v,q) && propagate(q) && dfs(pos+1)) return true; undoTo(mark); }
    return false;
  }
  if(!dfs(0)){ dbg('dfs '+steps); return null; }
  const order=new Map(); pairs.forEach(([a,b],i)=>order.set(pkey(a,b), val[i]));
  return order;
}

/* ---- 選片：flap = 手指下最上面那片在線那一側所連著的那一團 ---- */
function pickTop(list,s,P){
  const dx=P[0]-s[0], dy=P[1]-s[1], L=Math.hypot(dx,dy)||1; let best=null;
  for(const a of [0,.5,-.5,1,-1]) for(const r of [.02,.05]){
    const cs=Math.cos(a), sn=Math.sin(a), q=[s[0]+(dx*cs-dy*sn)/L*r, s[1]+(dx*sn+dy*cs)/L*r];
    for(const f of list) if((!best || f.z>best.z) && pip(f.pts,q[0],q[1])) best=f;
  }
  return best;
}
// 沿相鄰關係找連著的一團；剛好落在摺線上的邊是「鉸鏈」，不跨過去（這樣才能把一片沿舊摺痕打開）
function component(list,seed,P,n){
  const byId=new Map(list.map(q=>[q.id,q])), seen=new Set([seed.id]), st=[seed];
  while(st.length){ const q=st.pop();
    q.nb.forEach((x,i)=>{ const r=byId.get(x); if(!r || seen.has(x)) return;
      if(P){ const a=aff(q.T,q.sh[i]), b=aff(q.T,q.sh[(i+1)%q.sh.length]); if(Math.abs(sd(a,P,n))<1e-7 && Math.abs(sd(b,P,n))<1e-7) return; }
      seen.add(x); st.push(r); }); }
  return seen;
}

/* ---- 一次摺：沿 world 直線，把 positive 側（全部或那一團）翻過去 ----
   type：valley 谷摺、mountain 山摺、crease 摺痕、outside 外翻、inside 內翻 */
function foldByPoints(paper,s,t,opt){
  if(Math.hypot(s[0]-t[0], s[1]-t[1]) < 1e-6) return null;
  const o = opt && typeof opt==='object' ? opt : {type: opt?'mountain':'valley'};
  const type=o.type||'valley', {P,n}=foldLine(s,t);
  // 先全部切開（為了找一團），之後沒動到的片不需要留下切痕，但留著也只是平的摺痕
  const cut=derive(cutPaper(paper,P,n,null));
  const posList=cut.facets.filter(f=>f.side>0);
  let moveSet;
  if(o.scope==='flap'){ const seed=pickTop(posList,s,P); if(!seed) return null; moveSet=component(posList,seed,P,n); }
  else moveSet=new Set(posList.map(f=>f.id));
  if(!moveSet.size || moveSet.size===cut.facets.length) return null;
  // 只有真的被摺到的層才留下摺痕：重新切一次，只切到動到的那些原始片
  const srcs=new Set(cut.facets.filter(f=>moveSet.has(f.id)).map(f=>f.src));
  const cut2=derive(cutPaper(paper,P,n,srcs)), mv2=new Set();
  const key=f=>f.src+':'+f.side, want=new Set(cut.facets.filter(f=>moveSet.has(f.id)).map(key));
  for(const f of cut2.facets) if(srcs.has(f.src) && want.has(key(f))) mv2.add(f.id);
  const before=copyPaper(cut2); moveSet=mv2;
  return applyMove(before, [{ids:moveSet, M:reflM(P,n)}], type, {P,n,preview:o.preview, orig:paper});
}
/* 套用一組剛體移動（每組 ids 乘上 M），再求層序。type 決定新摺痕（鉸鏈）上誰在上面。 */
function applyMove(before, groups, type, info={}){
  const p=copyPaper(before), moved=new Map(), touched=new Set();
  for(const g of groups) for(const id of g.ids) touched.add(id);
  if(type!=='crease') for(const g of groups) for(const f of p.facets) if(g.ids.has(f.id)){ f.T=mul(g.M,f.T); moved.set(f.id,g); }
  derive(p);
  const hard=new Map(), hints=new Map();
  const zOf=new Map(before.facets.map(f=>[f.id,f.z]));
  const movedZ=[...moved.keys()].map(id=>zOf.get(id)).sort((a,b)=>a-b);
  const split=movedZ.length ? movedZ[Math.floor(movedZ.length/2)] : 0;
  const isFront=id=>zOf.get(id)>=split;
  // 每一片移動的，跟原本相鄰、現在疊起來的（鉸鏈）：依摺法決定上下
  const hingeWant=(m,st)=>{ // 回傳 +1 = m 在 st 上面
    if(type==='valley') return 1; if(type==='mountain') return -1;
    if(type==='outside') return isFront(m)?1:-1;
    if(type==='inside') return isFront(m)?-1:1;
    return 1; };
  const byId=new Map(p.facets.map(f=>[f.id,f]));
  for(const f of p.facets){
    const fm=moved.get(f.id);
    for(const x of f.nb){ if(x<0) continue; const g=byId.get(x); if(!g) continue;
      const gm=moved.get(x); if(fm===gm) continue;
      if(Math.sign(det(f.T))===Math.sign(det(g.T))) continue; // 攤平的不用管
      if(fm && !gm){ const v=hingeWant(f.id,x); hard.set(pkey(f.id,x), f.id<x?v:-v); }
    } }
  // 沒動的兩片：維持原樣；同一組動的兩片：鏡射就上下顛倒
  for(const a of p.facets) for(const b of p.facets){ if(a.id>=b.id) continue;
    const v=above(before,a.id,b.id); const ga=moved.get(a.id), gb=moved.get(b.id);
    if(!ga && !gb){ if(v) hard.set(pkey(a.id,b.id), a.id<b.id?v:-v); }
    else if(ga && ga===gb){ if(v){
      // 內外翻摺：前半疊、後半疊各自翻，同一半內上下顛倒，兩半之間維持原樣
      const rev = (type==='outside'||type==='inside') ? (isFront(a.id)===isFront(b.id)) : det(ga.M)<0;
      const r = rev ? -v : v; hard.set(pkey(a.id,b.id), a.id<b.id?r:-r); } }
    else { const m = ga ? a : b, want = (type==='mountain'||(type==='inside'))?-1:1; let w = m===a ? want : -want;
      // 複合動作：翻過越多次（谷摺）的那片放上面
      if(info.depth && ga && gb){ const da=info.depth.get(a.id)||0, db=info.depth.get(b.id)||0; if(da!==db) w = (da>db?1:-1)*want; }
      hints.set(pkey(a.id,b.id), a.id<b.id?w:-w); }
  }
  if(info.extraHard) for(const [k,v] of info.extraHard) hard.set(k,v);
  if(info.preview){ // 拖曳預覽：不求解，直接用提示
    for(const [k,v] of hints) if(!hard.has(k)) hard.set(k,v);
    p.order=hard; assignZ(p);
  } else {
    let order=solveLayers(p,hard,hints);
    if(!order && typeof SOLVE_LOG!=='undefined') SOLVE_LOG.push('fallback');
    if(!order){ // 解不出來：放掉「維持原樣」以外的硬限制再試
      const h2=new Map(); for(const [k,v] of hard){ const [a,b]=k.split('|').map(Number); if(!moved.has(a)&&!moved.has(b)) h2.set(k,v); }
      order=solveLayers(p,h2,new Map([...hints,...hard]));
    }
    p.order=order||hard; assignZ(p);
  }
  for(const f of p.facets) if(moved.has(f.id)) f.moved=true;
  p.refs=carryRefs(info.orig||before,p);
  const stay=before.facets.filter(f=>!touched.has(f.id)).map(f=>({pts:f.pts,c:f.c,z:f.z})), move=before.facets.filter(f=>touched.has(f.id)).map(f=>({pts:f.pts,c:f.c,z:f.z}));
  return {res:p, parts:{stay,move}, P:info.P, n:info.n, groups:groups.length};
}
// 記號點存在「原始紙」座標上，跟著紙走（就算摺痕又打開也找得到）
function carryRefs(before,after){
  const out=(before.refs||[]).slice(), seen=new Set(out.map(e=>e.k));
  for(const f of before.facets){ const Ti=inv(f.T), L=f.sh.length;
    for(let i=0;i<L;i++){ const a=f.sh[i], b=f.sh[(i+1)%L];
      for(const [u,major] of [[0,1],[.5,1],[.25,0],[.75,0]]){ const q=[a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u], k=Math.round(q[0]*1e5)+','+Math.round(q[1]*1e5);
        if(!seen.has(k)){ seen.add(k); out.push({k, sh:q, major:!!major}); } } } }
  return out;
}
function flipPaper(p){ const q=copyPaper(p); for(const f of q.facets) f.T=mul(FLIPT,f.T); const o=new Map(); for(const [k,v] of q.order) o.set(k,-v); q.order=o; return derive(q); }
function rotPaper(p){ const q=copyPaper(p); for(const f of q.facets) f.T=mul(ROTT,f.T); return derive(q); }

/* 吸附點：每片的頂點、邊中點（主要）＋四分點（次要），加上留在紙上的記號 */
function snapPoints(paper){
  const map=new Map(), out=[];
  const add=(q,major)=>{ const k=Math.round(q[0]*1e5)+','+Math.round(q[1]*1e5);
    const o=map.get(k); if(o){ if(major) o.major=true; return; } const e={p:q, major}; map.set(k,e); out.push(e); };
  for(const f of paper.facets){ for(let i=0;i<f.pts.length;i++){
    const a=f.pts[i], b=f.pts[(i+1)%f.pts.length], L=(u)=>[a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u];
    add(a,true); add(L(.5),true); add(L(.25),false); add(L(.75),false);
  }}
  for(const e of (paper.refs||[])){ // 找出記號點現在在哪（落在哪一片紙上就用那片的變換）
    for(const f of paper.facets){ if(pipInc(f.sh,e.sh)){ add(aff(f.T,e.sh), e.major); break; } } }
  return out;
}
function pipInc(poly,q){ // 含邊界
  const ccw=polyArea(poly)>0;
  for(let i=0;i<poly.length;i++){ const A=poly[i], B=poly[(i+1)%poly.length], v=(B[0]-A[0])*(q[1]-A[1])-(B[1]-A[1])*(q[0]-A[0]); if((ccw?v:-v)<-1e-9) return false; }
  return true;
}

/* ---- 多條摺痕一起動（擠壓摺、旋轉摺、兔耳摺這類複合動作） ----
   rules：[{P,n, fold:true|false, keep?(f,g)}]：目前畫面上落在這條直線上的摺痕，要摺起來（true）或攤平（false）
   其他摺痕維持現狀。從 root 那片（不動）開始，沿相鄰關係一路推算每片的變換；推出矛盾（紙會撕破）就回傳 null。 */
// cur：要移動的那張紙（預設 = paper）。規則一律用 paper（例如攤平時）的位置判斷，算出目標位置後再從 cur 移過去；兩張紙的片 id 要相同。
function creaseMove(paper, rules, rootPt, type='valley', cur=null, opts={}){
  const byId=new Map(paper.facets.map(f=>[f.id,f]));
  const root=(opts.rootId!=null && byId.get(opts.rootId)) || pickTop(paper.facets, rootPt, [rootPt[0]+1e-3, rootPt[1]+1e-3]) || paper.facets.find(f=>pip(f.pts,rootPt[0],rootPt[1]));
  if(!root) return null;
  const Tn=new Map([[root.id, root.T]]), q=[root], par=new Map(), depth=new Map([[root.id,0]]), hinges=[]; creaseMove.par=par; creaseMove.root=root.id;
  const close=(A,B)=>A.every((v,i)=>Math.abs(v-B[i])<1e-6);
  while(q.length){ const f=q.shift(), Tf=Tn.get(f.id);
    for(let i=0;i<f.sh.length;i++){ const g=byId.get(f.nb[i]); if(!g) continue;
      const a=f.sh[i], b=f.sh[(i+1)%f.sh.length], wa=opts.sheet?a:aff(f.T,a), wb=opts.sheet?b:aff(f.T,b);   // sheet 模式：規則用原始紙座標判斷
      let folded = Math.sign(det(f.T))!==Math.sign(det(g.T)), mv=null;
      for(const r of rules) if(Math.abs(sd(wa,r.P,r.n))<1e-6 && Math.abs(sd(wb,r.P,r.n))<1e-6 && (!r.keep || r.keep(f,g,wa,wb))){ folded = r.fold==='toggle' ? !(Math.sign(det(f.T))!==Math.sign(det(g.T))) : r.fold; mv=r.fold===true?(r.mv||null):null; }
      if(mv) hinges.push([f.id,g.id,mv]);
      const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy), Rs=reflM(a,[-dy/L,dx/L]);
      const Tg = folded ? mul(Tf,Rs) : Tf;
      if(Tn.has(g.id)){ if(!close(Tn.get(g.id),Tg)){ creaseMove.conflict={f:f.id,g:g.id,folded,at:[(wa[0]+wb[0])/2,(wa[1]+wb[1])/2]}; return null; } }
      else { Tn.set(g.id,Tg); q.push(g); depth.set(g.id, depth.get(f.id)+(folded?1:0)); par.set(g.id,{from:f.id,folded,seg:[wa,wb]}); }
    } }
  if(Tn.size!==paper.facets.length) return null;
  // 根那片在 cur 裡的位置可能已經不同：整體對齊到 cur 的根
  const src=cur||paper, curRoot=src.facets.find(f=>f.id===root.id), fix=mul(curRoot.T, inv(root.T));
  for(const [id,T] of Tn) Tn.set(id, mul(fix,T));
  const groups=new Map();
  for(const f of src.facets){ const T2=Tn.get(f.id); if(!T2 || close(T2,f.T)) continue;
    const M=mul(T2,inv(f.T)), k=M.map(v=>v.toFixed(5)).join(',');
    if(!groups.has(k)) groups.set(k,{ids:new Set(), M}); groups.get(k).ids.add(f.id); }
  if(!groups.size) return null;
  // 山谷摺 → 鉸鏈兩片誰在上：谷摺（從紙原本朝上那面看）時，若 f 朝上那面對著我們，g 就疊在 f 上面
  const extra=new Map();
  for(const [a,b,mv] of hinges){ const fUp=det(Tn.get(a))>0, gAbove=(mv==='V')===fUp; extra.set(pkey(a,b), (a<b)===gAbove ? -1 : 1); }
  return applyMove(copyPaper(src), [...groups.values()], type, {orig:src, depth, extraHard:extra});
}

/* ---- 單點複合摺（例：南瓜燈第 10～12 步） ----
   step = {vertex:true, prep:[{s,t,type,scope}], X:[x,y], rays:[角度…], layerFrom:'ref'|'cur', root:[x,y]}
   先用 prep（沿舊摺痕打開）得到參考狀態 ref（片的編號不變），在 ref 上找出從 X 出發的每條摺痕，
   把 rays 裡的那幾條摺起來，再求位置與層序。ref 會掛在結果上（paper.cref），後面連續的複合步驟沿用。 */
function vertexRef(paper, step){
  if(paper.cref) return paper.cref;
  let ref=paper;
  for(const pr of (step.prep||[])){ const r=foldByPoints(ref, pr.s, pr.t, {type:pr.type, scope:pr.scope}); if(!r) return null; ref=r.res; }
  return ref;
}
function vertexFold(paper, step){
  const ref=vertexRef(paper, step); if(!ref) return null;
  const X=step.X, rays=[];
  for(const f of ref.facets) for(let i=0;i<f.pts.length;i++){ const a=f.pts[i], b=f.pts[(i+1)%f.pts.length];
    for(const [u,v] of [[a,b],[b,a]]) if(Math.hypot(u[0]-X[0],u[1]-X[1])<1e-6){
      const g=((Math.atan2(v[1]-X[1],v[0]-X[0])*180/Math.PI)+360)%360; if(!rays.some(x=>Math.abs(x-g)<1e-6)) rays.push(g); } }
  const sel=rays.filter(g=>step.rays.some(r=>Math.abs(((r-g+540)%360)-180)<0.5));
  if(sel.length!==step.rays.length) return null;
  const rules=sel.map(ang=>{ const t=ang*Math.PI/180, d=[Math.cos(t),Math.sin(t)];
    return {P:X, n:[-d[1],d[0]], fold:true, keep:(f,g,wa,wb)=>{ const m=[(wa[0]+wb[0])/2-X[0],(wa[1]+wb[1])/2-X[1]]; return m[0]*d[0]+m[1]*d[1]>1e-6; }}; });
  const out=creaseMove(ref, rules, step.root||[0,0.6], 'valley', step.layerFrom==='cur' ? paper : ref);
  if(!out) return null;
  out.res.cref=ref; out.compound=true; out.from=paper;
  return out;
}

/* ---- 教學用的複合步驟 ----
   segs：用「原始紙座標」列出的摺痕段 [[x0,y0],[x1,y1], 摺不摺, 'V'|'M']，一次決定這些段的狀態（收合、花瓣摺）
   region：只動原始紙上某個圓形區域裡的那幾層，沿一條線翻（脖子、尾巴、頭的內翻摺） */
function segRule(p0,p1,fold,mv){ const dx=p1[0]-p0[0], dy=p1[1]-p0[1], L=Math.hypot(dx,dy);
  return {P:p0, n:[-dy/L,dx/L], fold, mv:fold?mv:undefined, keep:(f,g,wa,wb)=>{ const u=q=>((q[0]-p0[0])*dx+(q[1]-p0[1])*dy)/(L*L); const ua=u(wa), ub=u(wb); return Math.min(ua,ub)>=-1e-6 && Math.max(ua,ub)<=1+1e-6; }}; }
function sheetFold(paper, step){
  // back：在背面朝上時摺，層序提示要用正面朝上的視角算（谷/山才不會顛倒）
  if(step.back){ const r=sheetFold(flipPaper(paper), {...step, back:false}); if(r) r.res=flipPaper(r.res); return r; }
  const r=creaseMove(paper, step.segs.map(([a,b,f,mv])=>segRule(a,b,f,mv)), step.root||[0,0], 'valley', paper, {sheet:true});
  if(r) r.compound=true; return r; }
function regionFold(paper, step){
  const {P,n}=foldLine(step.s,step.t), c=step.region.c, rad=step.region.r;
  const cen=f=>f.sh.reduce((a,v)=>[a[0]+v[0]/f.sh.length,a[1]+v[1]/f.sh.length],[0,0]);
  const ins=q=>Math.hypot(q[0]-c[0],q[1]-c[1])<rad;
  // any：紙片只要有一個角在圈內就算（摺痕少、紙片大的時候用）
  const ids=new Set(paper.facets.filter(f=>step.region.any?f.sh.some(ins):ins(cen(f))).map(f=>f.id));
  if(!ids.size) return null;
  const cut=derive(cutPaper(paper,P,n,ids)), mv=new Set(cut.facets.filter(f=>ids.has(f.src)&&f.side>0).map(f=>f.id));
  if(!mv.size) return null;
  const r=applyMove(copyPaper(cut),[{ids:mv,M:reflM(P,n)}],step.type||'valley',{P,n,orig:paper});
  if(r) r.compound=true; return r; }
function compoundStep(paper, step){
  if(step.vertex) return vertexFold(paper, step);
  if(step.segs) return sheetFold(paper, step);
  if(step.region) return regionFold(paper, step);
  return null; }

/* ---- 自由模式的複合摺（擠壓摺、花瓣摺…）----
   拖 s→t：摺線 L＝中垂線，只在最上面 k 層壓出 L；L 上的頂點（已有摺痕交會處）其他射線可以「打開／摺起」。
   從改動最少的組合開始試，找到讓 s 那一點真的落在 t、層序解得出來的狀態。hold＝另一隻手按住的點（那層不動）。 */
function smartFold(paper, s, t, opts={}){
  const {P,n}=foldLine(s,t), d=[n[1],-n[0]];
  const stackAt=q=>paper.facets.filter(f=>pip(f.pts,q[0],q[1])).sort((a,b)=>b.z-a.z);
  // 探測點：最上層那片裡面、靠近 s 的一點（直接往摺線走可能剛好貼著邊）
  const seed=pickTop(paper.facets,s,P); if(!seed) return null;
  const sc=seed.pts.reduce((a,v)=>[a[0]+v[0]/seed.pts.length,a[1]+v[1]/seed.pts.length],[0,0]), sl=Math.hypot(sc[0]-s[0],sc[1]-s[1])||1;
  const probe=[s[0]+(sc[0]-s[0])/sl*0.02, s[1]+(sc[1]-s[1])/sl*0.02], stack=stackAt(probe);
  if(!stack.length) return null;
  const seedSheet=aff(inv(stack[0].T), s);
  const results=[]; let tries=0;
  // 最上面 j 層＋跟它們「攤平相連」的片（同一層紙被舊摺痕切成好幾片）；探測點和它的對稱點都算
  const ax0=[t[0]-s[0],t[1]-s[1]], al0=Math.hypot(...ax0)||1, mirP=q=>{ const v=[q[0]-s[0],q[1]-s[1]], k2=(v[0]*ax0[0]+v[1]*ax0[1])/al0; return [s[0]+2*k2*ax0[0]/al0-v[0], s[1]+2*k2*ax0[1]/al0-v[1]]; };
  const stack2=stackAt(mirP(probe)), pById=new Map(paper.facets.map(f=>[f.id,f]));
  const layerSet=j=>{ const out=new Set([...stack.slice(0,j),...stack2.slice(0,j)].map(f=>f.id)), qq=[...out];
    while(qq.length){ const f=pById.get(qq.pop()); f.nb.forEach(x=>{ const g=pById.get(x); if(g && !out.has(x) && Math.sign(det(g.T))===Math.sign(det(f.T))){ out.add(x); qq.push(x); } }); }
    return out; };
  const maxK=Math.min(stack.length, opts.maxK||4);
  for(let k=1;k<=maxK;k++){
    const srcs=layerSet(k);
    // 跟這 k 層在 L 的同一側相連的片也一起壓（同一個摺片的別層）
    const cut=derive(cutPaper(paper,P,n,srcs)), byId=new Map(cut.facets.map(f=>[f.id,f]));
    const inK=new Set(cut.facets.filter(f=>srcs.has(f.src)).map(f=>f.id));
    // L 上的頂點：k 層裡的邊跟 L 的交點（不在紙邊上的）
    const Xs=[];
    for(const f of cut.facets){ if(!inK.has(f.id)) continue; const L=f.pts.length;
      for(let i=0;i<L;i++){ const a=f.pts[i]; if(Math.abs(sd(a,P,n))>1e-6) continue;
        if(!Xs.some(x=>Math.hypot(x[0]-a[0],x[1]-a[1])<1e-6)) Xs.push(a); } }
    // 每個頂點上已有的射線（不含 L 本身）
    const rays=[];
    for(const X of Xs) for(const f of cut.facets) for(let i=0;i<f.pts.length;i++){ if(f.nb[i]<0) continue;
      const a=f.pts[i], b=f.pts[(i+1)%f.pts.length];
      for(const [u,v] of [[a,b],[b,a]]) if(Math.hypot(u[0]-X[0],u[1]-X[1])<1e-6){
        const dir=[v[0]-X[0],v[1]-X[1]], L=Math.hypot(...dir); dir[0]/=L; dir[1]/=L;
        if(Math.abs(dir[0]*n[0]+dir[1]*n[1])<1e-6) continue;   // 沿著 L
        if(!rays.some(r=>Math.hypot(r.X[0]-X[0],r.X[1]-X[1])<1e-6 && Math.hypot(r.d[0]-dir[0],r.d[1]-dir[1])<1e-6)) rays.push({X,d:dir}); } }
    if(typeof SMART_DBG!=='undefined') SMART_DBG.push({k,Xs:Xs.map(x=>x.map(v=>+v.toFixed(3))),rays:rays.map(r=>[r.X.map(v=>+v.toFixed(3)),Math.round(Math.atan2(r.d[1],r.d[0])*180/Math.PI)])});
    // 左右對稱的射線綁在一起試（花瓣摺、兔耳摺都是對稱的）：對稱軸 = s→t 那條線
    const ax=[t[0]-s[0],t[1]-s[1]], al=Math.hypot(...ax); ax[0]/=al; ax[1]/=al;
    const mir=q=>{ const v=[q[0]-s[0],q[1]-s[1]], k2=v[0]*ax[0]+v[1]*ax[1]; return [s[0]+2*k2*ax[0]-v[0], s[1]+2*k2*ax[1]-v[1]]; };
    const mirD=v=>{ const k2=v[0]*ax[0]+v[1]*ax[1]; return [2*k2*ax[0]-v[0], 2*k2*ax[1]-v[1]]; };
    const groups=[], used=new Set();
    rays.forEach((r,i)=>{ if(used.has(i)) return; used.add(i); const X2=mir(r.X), d2=mirD(r.d);
      const j=rays.findIndex((q,jj)=>!used.has(jj) && Math.hypot(q.X[0]-X2[0],q.X[1]-X2[1])<1e-6 && Math.hypot(q.d[0]-d2[0],q.d[1]-d2[1])<1e-6);
      if(j>=0){ used.add(j); groups.push([i,j]); } else groups.push([i]); });
    const plans=[];

<script>

function sorted(fs){ return fs.slice().sort((a,b)=>a.z-b.z); }

/* 五官：世界座標的位置＋朝向，畫的時候以紙的單位縮放 */

function paperOf(opt){ return opt.color||paperColor; }

function morphFacets(from,to,u){

// 平常就在紙上顯示主要吸附點（角、邊中點、摺痕交點），方便對準
const dotCache=new WeakMap();

    else{
      chips+=`<button type="button" class="chip${h.type!==foldType?' no':''}" data-set-type="${h.type}">${TYPES[h.type].name}${h.type!==foldType?'（點我切換）':''}</button>`;
      chips+=`<button type="button" class="chip${h.scope!==scope?' no':''}" data-set-scope="${h.scope}">${h.scope==='flap'?'只摺這一片':'全部層'}${h.scope!==scope?'（點我切換）':''}</button>`;
      if(h.free) chips+=`<span class="chip">位置自己決定</span>`;
    }
    chips+=`<button class="x" type="button" id="stepX">${stepCollapsed?'展開':'收起'}</button>`;
    el.innerHTML=`<div class="chips">${chips}</div>`+(stepCollapsed?'':`<div>${st.text}</div>`+(hintOn&&!h.flip&&!h.rot&&!h.vertex?`<div style="font-size:12px;color:#5C6563">藍色圓圈按住 → 拖到箭頭尖端放開；藍色虛線框是摺好後那片的位置。</div>`:''));
  }
  el.hidden=false;
  el.querySelectorAll('[data-set-type]').forEach(b=>b.onclick=()=>setType(b.dataset.setType));
  el.querySelectorAll('[data-set-scope]').forEach(b=>b.onclick=()=>setScope(b.dataset.setScope));
  const x=$('stepX'); if(x) x.onclick=()=>{ stepCollapsed=!stepCollapsed; renderStepCard(); };
}
$('hint').onclick=()=>{
  if(lv.free){ enterStickers(); return; }
  const h=hintCache;
  if(!h){ showToast(lastMatch&&lastMatch.score>=.94?'已經摺好了':'目前的形狀跟範例對不上，先按「復原」退回去'); hintOn=false; draw(); return; }
  if(h.done){ showToast('步驟都做完了'); return; }
  if(h.flip){ showToast(`第 ${h.i+1} 步：按「翻面」把紙翻過來`); return; }
  if(h.rot){ showToast(`第 ${h.i+1} 步：按「旋轉」轉 90°`); return; }
  if(h.vertex){ showToast(`第 ${h.i+1} 步是複合摺：好幾條摺痕一起動。從圓圈沿箭頭拖到終點就會摺好`); return; }
  hintOn=!hintOn;
  if(hintOn) showToast(`第 ${h.i+1} 步：從圓圈拖到箭頭（${TYPES[h.type].name}・${h.scope==='flap'?'只摺這一片':'全部層'}）`);
  renderStepCard(); draw();
};

/* ---- 工具列 ---- */
$('undo').onclick=()=>{ if(anim||!history.length) return; paper=history.pop(); if(histFold.pop()) foldCount=Math.max(0,foldCount-1); afterChange(); };
function setType(t){ foldType=t; $('typeLbl').textContent=TYPES[t].name; $('typeBtn').classList.toggle('on',t!=='valley');
  $('typeIcon').setAttribute('stroke-dasharray', TYPES[t].dash.map(x=>(x/2.2).toFixed(1)).join(' ')); renderStepCard(); }
function setScope(v){ scope=v; $('scopeLbl').textContent=v==='flap'?'這一片':'全部層'; $('scopeBtn').classList.toggle('on',v==='flap'); renderStepCard(); }
function lineSvg(t){ return `<svg viewBox="0 0 64 28"><line x1="4" y1="16" x2="60" y2="16" stroke="currentColor" stroke-width="2.4" stroke-dasharray="${TYPES[t].dash.join(' ')}"/>`
  +(t==='crease'?'<path d="M22 9l10-5 10 5M22 23l10 4 10-4" fill="none" stroke="currentColor" stroke-width="1.6"/>':'')
  +(t==='outside'||t==='inside'?`<text x="32" y="8" font-size="8" text-anchor="middle" fill="currentColor">${t==='outside'?'往外包':'往內塞'}</text>`:'')+'</svg>'; }
function openTypeSheet(){
  const box=$('typeList'); box.innerHTML='';
  for(const t of Object.keys(TYPES)){
    const b=document.createElement('button'); b.type='button'; b.className='typeopt'+(t===foldType?' on':'');
    b.innerHTML=lineSvg(t)+`<div><b>${TYPES[t].name}</b><span>${TYPES[t].desc}</span></div>`;
    b.onclick=()=>{ setType(t); $('typeSheet').hidden=true; };
    box.append(b);
  }
  $('typeSheet').hidden=false;
}
$('typeBtn').onclick=openTypeSheet;
$('typeClose').onclick=()=>{ $('typeSheet').hidden=true; };
$('scopeBtn').onclick=()=>{ setScope(scope==='all'?'flap':'all'); showToast(scope==='flap'?'只摺這一片：只翻手指下最上面那片，和跟它連著的部分':'全部層：摺線那一側的所有層一起摺'); };
$('flip').onclick=()=>{ if(anim) return; history.push(paper); histFold.push(false); paper=flipPaper(paper); afterChange(); };
$('rot').onclick=()=>{ if(anim) return; history.push(paper); histFold.push(false); paper=rotPaper(paper); afterChange(); };
let toastT=0;
function showToast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(hideToast,2600); }
function hideToast(){ $('toast').hidden=true; }

/* ---- 自由創作：貼五官 ---- */
const STICKERS=[['eye','眼睛'],['nose','鼻子'],['mouth','嘴巴'],['blush','腮紅'],['whisk','鬍鬚'],['beak','嘴喙'],['ear','耳朵']];
function buildStickerTray(){
  const tr=$('stickerTray'); tr.innerHTML=''; tr.style.gridTemplateColumns='repeat(4,1fr)';
  for(const [t,label] of STICKERS){
    const b=document.createElement('button'); b.type='button'; b.className='tool'+(t===stickerType?' on':'');
    const c=document.createElement('canvas'); c.width=c.height=44; c.className='stk';
    const x=c.getContext('2d'); drawFace(x,[{t,p:[0,0]}],()=>[22,22],t==='snout'?90:120,{color:'#F4C93A'});
    b.append(c, document.createTextNode(label));
    b.onclick=()=>{ stickerType=t; buildStickerTray(); };
    tr.append(b);
  }
  const done=document.createElement('button'); done.type='button'; done.className='tool go'; done.textContent='完成';
  done.onclick=()=>{ if(!stickers.length){ showToast('先在紙上點一下，貼上眼睛'); return; } openNameSheet(); };
  tr.append(done);
}
function enterStickers(){
  if(!foldCount){ showToast('先摺幾下再來貼五官'); return; }
  stickerMode=true; $('foldTray').hidden=true; $('stickerTray').hidden=false; buildStickerTray(); $('stepCard').hidden=true;
  $('coach').textContent='點紙上的位置貼五官，再點一次貼好的會拿掉。鬍鬚和嘴喙會朝外。'; $('coach').hidden=false;
  draw();
}
function exitStickers(){ stickerMode=false; $('foldTray').hidden=false; $('stickerTray').hidden=true; $('coach').hidden=true; draw(); }
function placeSticker(f){
  const i=stickers.findIndex(s=>Math.hypot(s.p[0]-f[0], s.p[1]-f[1])<.09);
  if(i>=0){ stickers.splice(i,1); draw(); return; }
  if(!topAt(paper,f[0],f[1])){ showToast('要貼在紙上喔'); return; }
  const b=bbox(paper), cx=(b.x0+b.x1)/2;
  stickers.push({t:stickerType, p:f, dir:f[0]<cx?Math.PI:0});
  $('coach').hidden=true; draw();
}
function openNameSheet(){
  $('petName').value=`我的動物 ${book.mine.length+1} 號`;
  drawPet($('nameCanvas'), paper.facets, paperColor, stickers);
  $('nameSheet').hidden=false;
}
$('nameBack').onclick=()=>{ $('nameSheet').hidden=true; };
$('nameSave').onclick=()=>{
  const name=($('petName').value||'').trim()||'無名小動物';
  book.mine.unshift({name, color:paperColor, facets:paper.facets.map(f=>({pts:f.pts,z:f.z,c:f.c})), face:stickers.slice()});
  book.mine=book.mine.slice(0,12); saveBook();
  $('nameSheet').hidden=true; exitStickers(); openHome();
};

/* ---- 圖鑑首頁與選紙 ---- */
function openHome(justGot){
  const lg=$('lessonGrid'); lg.innerHTML=''; const learned=book.lessons||{};
  $('lessonCount').textContent=`${LESSONS.filter(l=>learned[l.id]).length} / ${LESSONS.length} 學會`;
  LESSONS.forEach((l,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='card';
    const c=document.createElement('canvas'); c.width=c.height=200;
    drawPet(c, buildStages(l).pop().facets, l.color, null);
    b.append(c);
    b.insertAdjacentHTML('beforeend',`<span class="tag${learned[l.id]?' got':''}">${learned[l.id]?'學會了':'第 '+(i+1)+' 課'}</span><div class="nm"><b style="font-size:15px">${l.name}</b></div><div class="meta"><span>${parOf(l)} 摺</span></div>`);
    b.onclick=()=>openPick(l);
    lg.append(b);
  });
  const g=$('animalGrid'); g.innerHTML='';
  const got=ANIMALS.filter(a=>book.animals[a.id]).length;
  $('dexCount').textContent=`${got} / ${ANIMALS.length}`;
  for(const a of ANIMALS.concat([FREE])){
    const b=document.createElement('button'); b.type='button'; b.className='card'+(a.free?' free':'');
    const c=document.createElement('canvas'); c.width=c.height=240;
    const rec=book.animals[a.id];
    if(rec) drawPet(c, rec.facets, rec.color, rec.face);
    else if(a.free) drawPet(c, startPaper(a).facets, a.color, null);
    else drawPet(c, buildStages(a).pop().facets, a.color, a.face);
    const folds=a.free?'':`${parOf(a)} 摺`;
    b.append(c);
    b.insertAdjacentHTML('beforeend', a.free
      ? `<span class="tag">自由</span><div class="nm"><b>${a.name}</b></div><div class="meta"><span>摺好再貼五官、取名字</span></div>`
      : `<span class="tag${rec?' got':''}">${rec?'已收集':'未收集'}</span><div class="nm"><b>${a.name}</b><span class="stars">${starHtml(rec?rec.stars:0)}</span></div><div class="meta"><span>${folds} · ${a.level}</span><span>${a.cry}</span></div>`);
    b.onclick=()=>openPick(a);
    g.append(b);
  }
  const ml=$('mineList'); ml.innerHTML='';
  $('mineTitle').hidden=$('mineList').hidden=!book.mine.length;
  for(const m of book.mine){
    const fig=document.createElement('figure'), c=document.createElement('canvas'); c.width=c.height=192;
    drawPet(c,m.facets,m.color,m.face);
    const cap=document.createElement('figcaption'); cap.textContent=m.name;
    fig.append(c,cap); ml.append(fig);
  }
  $('home').hidden=false;
}
let pickAnimal=null, pickColor=null;
function openPick(a){
  pickAnimal=a; pickColor=(book.animals[a.id]&&book.animals[a.id].color)||a.color;
  $('pickName').textContent=a.name;
  const rec=book.animals[a.id], learned=(book.lessons||{})[a.id];
  $('pickStars').innerHTML=a.free?'':starHtml(a.learn?(learned||0):(rec?rec.stars:0));
  const extra=a.steps?[a.steps.some(s=>s.flip)?'翻面':'', a.steps.some(s=>s.rot)?'旋轉':''].filter(Boolean).join('、'):'';
  $('pickInfo').textContent=a.free?'沒有目標形狀':`${a.learn?'基本功':a.level} · ${parOf(a)} 摺${extra?'＋'+extra:''}${a.colorUp?' · 彩色面朝上開始':''}`;
  $('pickTip').textContent=a.learn||a.tip;
  $('pickSrc').hidden=!(a.src||a.mine);
  if(a.src) $('pickSrc').innerHTML=a.src.url?`摺法參考：<a href="${a.src.url}" target="_blank" rel="noopener">${a.src.label}</a>`:a.src.label;
  else if(a.mine) $('pickSrc').textContent='暖身關：我自己設計的簡化摺法，不是傳統作品。';
  renderSwatches(); drawPickPreview();
  $('pick').hidden=false;
}
function drawPickPreview(){
  const a=pickAnimal;
  drawPet($('pickCanvas'), a.free?startPaper(a).facets:buildStages(a).pop().facets, pickColor, a.free?null:a.face);
}
function renderSwatches(){
  const box=$('swatches'); box.innerHTML='';
  for(const [hex,name] of COLORS){
    const b=document.createElement('button'); b.type='button'; b.className='sw'+(hex===pickColor?' on':''); b.style.background=hex;
    b.title=name; b.setAttribute('aria-label',name);
    b.onclick=()=>{ pickColor=hex; renderSwatches(); drawPickPreview(); };
    box.append(b);
  }
}
$('pickCancel').onclick=()=>{ $('pick').hidden=true; };
$('pickGo').onclick=()=>{ $('pick').hidden=true; $('home').hidden=true; loadAnimal(pickAnimal, pickColor); };
$('homeBtn').onclick=()=>{ if(stickerMode) exitStickers(); openHome(); };

function loadAnimal(a,color){
  lv=a; paperColor=color; stages=a.free?[startPaper(a)]:buildStages(a); target=stages[stages.length-1];
  paper=startPaper(a); history=[]; histFold=[]; foldCount=0; doneShown=false; alive=null; hintOn=false; lastMatch=null; stickers=[];
  $('lvName').textContent=a.name;
  $('lvSub').textContent=a.free?'自由創作 · 摺好按「完成」':`${a.learn?'基本功':a.level} · ${parOf(a)} 摺`;
  $('targetBox').style.visibility=a.free?'hidden':'visible';
  if(!a.free) drawPet($('thumb'), target.facets, color, null);
  $('hintLbl').textContent=a.free?'完成':'提示';
  $('hint').classList.toggle('go',!!a.free);
  userZoom=false; setType('valley'); setScope('all'); hideToast(); exitStickers(); stepCollapsed=false;
  if(a.free){ $('coach').textContent=a.tip; $('coach').hidden=false; }
  fitView(true); updateUndo(); updateReadout(); computeHint(); computeScore(); renderStepCard(); draw();
}

loadAnimal(LESSONS[0], LESSONS[0].color);
openHome();
</script>
