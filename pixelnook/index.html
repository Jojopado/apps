<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="像素小窩">
<meta name="theme-color" content="#18161f">
<title>像素小窩 PixelNook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="description" content="等角像素小鎮生活：打工、探索、收集，打造自己的小窩，再去參觀別人的房間。">
<style>
:root{--ink:#22283f;--paper:#fff8ec;--card:#fffdf8;--line:#e3d6bf;--accent:#ff9f5a;--accent2:#5aa9ff;--good:#3bb273;--bad:#e05a5a;
  --sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#18161f;color:var(--ink);overflow:hidden;overscroll-behavior:none;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
#cv{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
button{font:inherit;color:var(--ink);cursor:pointer;border:2px solid var(--ink);background:var(--card);border-radius:12px;
  padding:6px 12px;line-height:1.2;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{opacity:.45}
button.pri{background:var(--accent)}
button.blue{background:var(--accent2);color:#fff}
.hud{position:fixed;display:flex;gap:8px;align-items:center;z-index:5}
#hudL{top:calc(8px + var(--st));left:calc(8px + var(--sl));flex-direction:column;align-items:flex-start;gap:6px}
#hudR{top:calc(8px + var(--st));right:calc(8px + var(--sr))}
#hudB{bottom:calc(10px + var(--sb));right:calc(10px + var(--sr))}
.chip{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--ink)}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:#ffcf4a;border:2px solid #b07a12;box-shadow:inset -2px -2px 0 #e8a92a;vertical-align:-2px}
.card canvas,.slot canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.chip small{font-weight:400;color:#6b6450}
#name{font-size:15px}
#visitBar{position:fixed;top:calc(8px + var(--st));left:50%;transform:translateX(-50%);z-index:6;display:none;gap:8px;align-items:center}
#edit{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;background:rgba(255,248,236,.97);border-top:3px solid var(--ink);
  padding:6px calc(8px + var(--sr)) calc(6px + var(--sb)) calc(8px + var(--sl))}
#edit .tabs{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#edit .tabs button{padding:3px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
#edit .tabs button.on{background:var(--accent)}
#edit .tabs .sp{flex:1}
#bag{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;touch-action:pan-x;min-height:88px}
.slot{flex:0 0 auto;width:86px;height:84px;border:2px solid var(--ink);border-radius:10px;background:#fff;position:relative;display:flex;
  flex-direction:column;align-items:center;justify-content:flex-end;padding:2px;cursor:pointer}
.slot.on{outline:3px solid var(--accent);outline-offset:1px}
.slot canvas{flex:1;width:80px;min-height:0;object-fit:contain}
.slot .n{font-size:11px;line-height:1.1;text-align:center;max-width:82px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slot .c{position:absolute;top:2px;right:4px;font-size:12px;font-weight:700;background:var(--accent);border-radius:8px;padding:0 5px;border:1.5px solid var(--ink)}
.empty{color:#7a735f;font-size:13px;padding:24px 8px}
#selBar{position:fixed;z-index:7;display:none;gap:6px}
#selBar button{padding:5px 10px;font-size:13px}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(15,14,22,.55);padding:12px}
.modal.show{display:flex}
.box{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);width:min(760px,100%);
  max-height:calc(100% - 8px);display:flex;flex-direction:column;overflow:hidden}
.box h2{margin:0;font-size:18px;padding:10px 14px;border-bottom:2px solid var(--line);display:flex;align-items:center;gap:10px}
.box h2 .sp{flex:1}
.box .body{padding:10px 14px;overflow:auto;touch-action:pan-y}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cats button{padding:3px 10px;font-size:13px;box-shadow:0 2px 0 var(--ink)}
.cats button.on{background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;position:relative}
.card canvas{width:100%;height:90px;object-fit:contain}
.card .t{font-weight:700;font-size:14px}
.card .m{font-size:12px;color:#6b6450}
.card .row{display:flex;justify-content:space-between;align-items:center}
.card .sale{position:absolute;top:6px;left:6px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.card s{color:#9a927d;font-size:12px}
.tag{display:inline-block;font-size:11px;border:1.5px solid var(--ink);border-radius:6px;padding:0 5px;margin-right:4px;background:#fff}
.creator{display:flex;gap:14px;flex-wrap:wrap}
.creator .pv{flex:0 0 160px;display:flex;flex-direction:column;align-items:center;gap:6px}
.creator .pv canvas{width:160px;height:200px;image-rendering:pixelated;background:#f3e6cf;border:2px solid var(--ink);border-radius:12px}
.creator .opts{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.opt b{display:block;font-size:13px;margin-bottom:3px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;padding:0;border-radius:8px;box-shadow:0 2px 0 var(--ink)}
.sw button.on{outline:3px solid var(--accent);outline-offset:1px}
.sw button.txt{width:auto;padding:0 10px;font-size:13px}
input[type=text],input[type=password]{font:inherit;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;width:100%;background:#fff;-webkit-user-select:text;user-select:text}
.list .r{display:flex;align-items:center;gap:10px;padding:8px;border:2px solid var(--ink);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer}
.list .r .nm{font-weight:700;flex:1}
.list .r .st{font-size:13px;color:#6b6450}
#toast{white-space:pre-line;position:fixed;left:50%;top:calc(56px + var(--st));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:12px;font-size:14px;display:none;max-width:90%;text-align:center}
#rot{position:fixed;inset:0;z-index:40;background:#18161f;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.help{font-size:13px;color:#6b6450;line-height:1.7}
.qchip{position:relative;max-width:min(330px,52vw);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;cursor:pointer}
.badge{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;border:2px solid var(--ink)}
.qcard{display:flex;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:8px;margin-bottom:8px}
.qcard.done{opacity:.55}
.qk{flex:0 0 auto;font-size:12px;font-weight:700;background:var(--accent);border:1.5px solid var(--ink);border-radius:8px;padding:2px 6px}
.qm{flex:1;min-width:0}
.qd{font-size:13px;color:#6b6450}
.qbar{height:8px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;margin:4px 0;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--good)}
.qp{font-size:12px;color:#6b6450}
.colhead{display:flex;align-items:center;gap:10px;margin:10px 0 6px;border-bottom:2px solid var(--line);padding-bottom:4px}
.colhead span{font-size:13px;color:#6b6450}.colhead small{font-size:12px;color:#6b6450;margin-left:auto}.colhead button{margin-left:auto;padding:3px 10px;font-size:13px}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.colc{border:2px solid var(--ink);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:4px;font-size:12px;text-align:center}
.colc canvas{width:48px;height:48px}
.colc.lock{background:#efe8da;color:#8a8270}
.themeHead{display:flex;gap:10px;align-items:center;justify-content:space-between;border:2px solid var(--ink);border-radius:12px;background:#fff3d6;padding:8px 10px;margin-bottom:10px;flex-wrap:wrap}
.themeHead .tn{font-size:17px;font-weight:700;color:#c0621b}
.rank{font-weight:700;width:26px;text-align:center;font-size:16px}
.setRow{border-bottom:2px dashed var(--line);padding:10px 0}
.code{font-family:ui-monospace,Consolas,monospace;font-size:22px;font-weight:700;letter-spacing:2px;margin:4px 0;-webkit-user-select:text;user-select:text}
.tgl{margin-left:14px;font-size:15px}
.talk{width:min(640px,100%);padding:12px 14px;gap:10px}
.talkRow{display:flex;gap:12px;align-items:flex-start}
.talkPic{flex:0 0 76px;height:76px;border:2px solid var(--ink);border-radius:12px;background:#f3e6cf;display:flex;align-items:center;justify-content:center;overflow:hidden}
.talkPic canvas{width:70px;height:70px;image-rendering:pixelated}
.talkBody{flex:1;min-width:0}
.talkBody .role{font-size:12px;color:#6b6450;border:1.5px solid var(--ink);border-radius:6px;padding:0 5px;margin-left:4px}
.talkText{margin-top:6px;line-height:1.7;white-space:pre-line}
.talkOpts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.job{width:min(760px,100%);padding:10px 12px;gap:8px}
.jobTop{display:flex;gap:12px;align-items:center;font-size:15px}
.jobTop .sp{flex:1}
.jobMain{display:flex;gap:10px;flex-wrap:wrap}
.jobCust,.jobCup{flex:1 1 260px;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:8px;display:flex;gap:8px;align-items:center}
.jobCup{flex-direction:column;align-items:stretch}
.jobCust .face canvas{width:64px;height:64px}
.bubble{flex:1;display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 8px}
.bubble canvas{width:48px;height:48px}
.bubble b{font-size:18px}
.hint{font-size:12px;color:#6b6450;margin-top:2px}
.ico{image-rendering:pixelated}
.cup{display:flex;gap:4px;flex-wrap:wrap;min-height:58px;align-items:center;color:#7a735f;font-size:13px}
.ci{display:flex;flex-direction:column;align-items:center;font-size:11px}
.ci canvas{width:36px;height:36px}
.acts{display:flex;gap:8px;justify-content:flex-end}
.jobIngs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ing{display:flex;flex-direction:column;align-items:center;padding:4px 8px;min-width:70px}
.ing canvas{width:40px;height:40px}
.ing span{font-size:12px}
.jobMsg{text-align:center;min-height:22px;font-weight:700}
.jobMsg.good{color:var(--good)}.jobMsg.bad{color:var(--bad)}
.jobEnd{display:flex;flex-direction:column;gap:6px;padding:6px}
.jobEnd h3{margin:0 0 4px}
.jobEnd .row{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.jobEnd .row.big b{font-size:20px;color:#c07a12}
.jobEnd .note{font-size:13px;color:#6b6450}
.jobEnd button{align-self:flex-end;margin-top:6px}
.belt{border:2px solid var(--ink);border-radius:12px;background:#e8dcc4;padding:8px;position:relative}
.beltItems{display:flex;gap:10px;align-items:flex-end;min-height:84px}
.bi{display:flex;flex-direction:column;align-items:center;font-size:12px;opacity:.7}
.bi.first{opacity:1;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 8px;font-weight:700}
.beltBar{height:8px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;margin-top:6px;overflow:hidden}
.beltBar i{display:block;height:100%;background:var(--accent)}
.baskets{display:flex;gap:10px;justify-content:center}
.basket{display:flex;flex-direction:column;align-items:center;padding:6px 12px;min-width:110px}
.basket .bn{font-weight:700;font-size:13px}.bex{display:flex;gap:2px}
.cashMain{display:flex;gap:10px;flex-wrap:wrap}
.cashBox{flex:1 1 280px;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:8px;display:flex;flex-direction:column;gap:6px}
.cashBox.off{opacity:.5}
.goods,.change,.coins{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.good{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:4px 6px}
.good.done{opacity:.35}
.tot{font-size:14px}.tot b{font-size:18px}
.coinb{display:flex;flex-direction:column;align-items:center;font-size:12px;padding:3px 8px}
</style>
</head>
<body>
<canvas id="cv" width="800" height="480"></canvas>

<div class="hud" id="hudL">
  <div class="chip" id="name">—</div>
  <div class="chip" id="place" style="display:none">📍</div>
  <button class="chip qchip" id="qChip"><span id="qText">📋 任務</span><span class="badge" id="qBadge" style="display:none">0</span></button>
  <div style="display:flex;gap:6px">
    <div class="chip"><i class="coin"></i> <span id="coins">0</span></div>
    <div class="chip" title="舒適度：家具越多、同系列湊滿 3 件越高；每天領的金幣跟著變多">❤ <span id="comfort">0</span></div>
  </div>
</div>
<div class="hud" id="hudR">
  <button id="bVisit">👀 參觀</button>
  <button id="bBag">🎒 背包</button>
  <button id="bLook">🧑 角色</button>
  <button id="bSet" title="設定">⚙</button>
</div>
<div class="hud" id="hudB">
  <button id="bOut">🚪 出門</button>
  <button id="bEdit" class="pri">🛠 佈置</button>
  <button id="bShop" class="blue">🛋 家具店</button>
</div>
<div class="hud" id="hudCity" style="display:none;bottom:calc(10px + var(--sb));right:calc(10px + var(--sr))"><button id="bGoHome" class="pri">🏠 回家</button></div>
<div id="visitBar" class="hud">
  <div class="chip" id="vName">—</div>
  <button id="bLike">👍 按讚</button>
  <button id="bFav">☆ 收藏</button>
  <button id="bHome" class="pri">🏠 回家</button>
</div>

<div id="edit">
  <div class="tabs">
    <button data-tab="floor" class="on">家具</button>
    <button data-tab="wall">牆面</button>
    <button data-tab="paper">壁紙</button>
    <button data-tab="ground">地板</button>
    <span class="sp"></span>
    <span class="help" id="editHelp">點背包裡的東西 → 點房間放下；點家具可以移動、旋轉、收起</span>
    <button id="bDone" class="pri">完成</button>
  </div>
  <div id="bag"></div>
</div>
<div id="selBar" class="hud">
  <button id="bRot">↻ 旋轉</button>
  <button id="bStore">📦 收起</button>
  <button id="bDesel">✕</button>
</div>

<div class="modal" id="mShop"><div class="box">
  <h2>📖 家具型錄 <span class="sp"></span><span class="chip"><i class="coin"></i> <span id="shopCoins">0</span></span><button data-close>關閉</button></h2>
  <div class="body"><div class="cats" id="shopCats"></div><div class="grid" id="shopGrid"></div></div>
</div></div>

<div class="modal" id="mBuy"><div class="box" style="max-width:420px">
  <h2><span id="buyName">—</span> <span class="sp"></span><button data-close>關閉</button></h2>
  <div class="body"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <div id="buyPic" style="flex:0 0 140px;height:120px;display:grid;place-items:center;background:#fffaf0;border:2px solid var(--line);border-radius:12px"></div>
    <div style="flex:1 1 160px;display:flex;flex-direction:column;gap:6px"><div id="buyMeta" class="help"></div><div id="buyPrice" style="font-size:20px;font-weight:800"></div><div id="buyOwn" class="help"></div></div></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap"><button id="buySit">🪑 坐坐看</button><button id="buyCat">📖 看型錄</button><button class="pri" id="buyBtn">買下來</button></div>
  </div>
</div></div>
<div class="modal" id="mLook"><div class="box">
  <h2 id="lookTitle">🧑 我的角色 <span class="sp"></span><button data-close id="lookClose">關閉</button></h2>
  <div class="body">
    <div class="creator">
      <div class="pv"><canvas id="pv" width="80" height="100"></canvas>
        <div style="display:flex;gap:6px"><button id="pvL">◀</button><button id="pvR">▶</button></div></div>
      <div class="opts" id="lookOpts"></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:10px"><button id="lookRestore">我有帳號／存檔碼</button><button class="pri" id="lookOK">好了！</button></div>
  </div>
</div></div>

<div class="modal" id="mVisit"><div class="box">
  <h2>👀 去別人家參觀 <span class="sp"></span><button data-close>關閉</button></h2>
  <div class="body">
    <div class="cats" id="visitTabs">
      <button data-v="recent" class="on">最新</button><button data-v="theme">🏆 本週主題</button><button data-v="pop">本週人氣</button><button data-v="fav">⭐ 收藏</button><button data-v="rand">隨機</button>
    </div>
    <div class="list" id="visitList"></div>
  </div>
</div></div>

<div class="modal" id="mTalk"><div class="box talk">
  <div class="talkRow"><div id="talkPic" class="talkPic"></div>
    <div class="talkBody"><div><b id="talkName"></b> <span class="role" id="talkRole"></span></div><div id="talkText" class="talkText"></div></div></div>
  <div id="talkOpts" class="talkOpts"></div>
</div></div>
<div class="modal" id="mJob"><div class="box job" id="jobRoot"></div></div>
<div class="modal" id="mSet"><div class="box">
  <h2>⚙ 設定 <span class="sp"></span><button data-close>關閉</button></h2>
  <div class="body">
    <div class="setRow" id="acctRow"><b>👤 帳號</b>
      <div id="acctOut">
        <div class="help">註冊帳號後，在任何手機、平板、電腦輸入帳號密碼，都能接著玩同一份進度（會自動同步）。</div>
        <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap"><input type="text" id="acctUser" placeholder="帳號（英文小寫、數字、_，3～16 字）" maxlength="16" autocomplete="username" autocapitalize="off" style="flex:1 1 180px"><input type="password" id="acctPw" placeholder="密碼（至少 6 個字）" maxlength="64" autocomplete="current-password" style="flex:1 1 140px"></div>
        <div style="display:flex;gap:8px;margin-top:6px;justify-content:flex-end"><button id="acctReg">註冊新帳號</button><button class="pri" id="acctLogin">登入</button></div>
      </div>
      <div id="acctIn" style="display:none">
        <div>已登入：<b id="acctName"></b>　<span class="help" id="acctSync"></span></div>
        <div style="display:flex;gap:8px;margin-top:6px"><button id="acctPwBtn">🔑 改密碼</button><button id="acctOutBtn">登出</button></div>
        <div id="acctPwBox" style="display:none;gap:8px;margin-top:6px;flex-wrap:wrap"><input type="password" id="acctOld" placeholder="舊密碼" maxlength="64" style="flex:1 1 120px"><input type="password" id="acctNew" placeholder="新密碼（至少 6 個字）" maxlength="64" autocomplete="new-password" style="flex:1 1 120px"><button class="pri" id="acctPwOK">確定</button></div>
      </div>
    </div>
    <div class="setRow"><b>我的存檔碼</b><div class="code" id="setCode">—</div>
      <div class="help">換手機或清除瀏覽器資料時，用這組碼就能找回你的房間和所有進度。<b>請抄下來或截圖保存，不要給別人。</b></div>
      <div class="help" id="setBackup"></div>
      <div style="display:flex;gap:8px;margin-top:6px"><button id="copyCode">📋 複製</button><button id="backupNow">☁ 立即備份</button></div></div>
    <div class="setRow"><b>從存檔碼還原</b>
      <div style="display:flex;gap:8px;margin-top:6px"><input type="text" id="restoreIn" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" style="text-transform:uppercase"><button class="pri" id="restoreBtn">還原</button></div>
      <div id="restoreConfirm" style="display:none;flex-direction:column;gap:6px;margin-top:8px;border:2px solid var(--bad);border-radius:10px;padding:8px;background:#fff1ef">

    <div class="setRow"><b>聲音</b><label class="tgl"><input type="checkbox" id="setSfx"> 音效</label><label class="tgl"><input type="checkbox" id="setMusic"> 背景音樂</label></div>
    <div class="setRow help">像素小窩 PixelNook・全部美術與音樂由程式即時繪製／合成</div>
  </div>
</div></div>
