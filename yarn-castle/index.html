<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6e7d2">
<title>毛線城堡</title>
<style>
  :root { --bg:#f6e7d2; --ink:#5a4634; --p0:#f0923f; --p0d:#c9702a; --p1:#7a93c2; --p1d:#5a709c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif; overflow:hidden; touch-action:none; }
  #app { display:flex; flex-direction:column; height:100%; max-width:520px; margin:0 auto; padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom); }
  #top { display:flex; align-items:center; gap:8px; padding:6px 4px 4px; font-size:14px; }
  #top .title { font-weight:700; font-size:17px; letter-spacing:1px; }
  #top .round { margin-left:auto; opacity:.8; }
  #bar { height:16px; border-radius:8px; background:#e7d6bf; overflow:hidden; display:flex; margin:0 4px 6px; position:relative; font-size:11px; font-weight:700; color:#fff; }
  #bar .p0 { background:var(--p0); height:100%; transition:width .4s; text-align:left; padding-left:6px; line-height:16px; }
  #bar .p1 { background:var(--p1); height:100%; transition:width .4s; margin-left:auto; text-align:right; padding-right:6px; line-height:16px; }
  #cwrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { display:block; border-radius:14px; box-shadow:0 6px 18px rgba(90,70,52,.18); }
  #hint { text-align:center; font-size:13px; min-height:20px; padding:4px; opacity:.85; }
  #btns { display:flex; gap:8px; padding:4px 4px 10px; }
  button { flex:1; border:0; border-radius:12px; padding:12px 6px; font-size:15px; font-weight:700; color:#fff; background:var(--p0d); box-shadow:0 3px 0 rgba(0,0,0,.15); font-family:inherit; }
  button:active { transform:translateY(2px); box-shadow:none; }
  button.sec { background:#a08a70; }
  button:disabled { opacity:.45; box-shadow:none; }
  #overlay { position:fixed; inset:0; background:rgba(60,45,30,.55); display:flex; align-items:center; justify-content:center; padding:20px; }
  #overlay .card { background:#fff8ee; border-radius:18px; padding:22px 20px; max-width:360px; width:100%; line-height:1.7; font-size:15px; box-shadow:0 10px 30px rgba(0,0,0,.25); }
  #overlay h2 { margin:0 0 8px; font-size:22px; }
  #overlay ul { padding-left:20px; margin:8px 0 14px; }
  #overlay .big { font-size:34px; font-weight:800; text-align:center; margin:6px 0 10px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><span class="title">🧶 毛線城堡</span><span id="turnTxt"></span><span class="round" id="roundTxt"></span></div>
  <div id="bar"><div class="p0" id="bar0"></div><div class="p1" id="bar1"></div></div>
  <div id="cwrap"><canvas id="c"></canvas></div>
  <div id="hint"></div>
  <div id="btns">
    <button id="knotBtn">🪢 打結</button>
    <button id="endBtn" class="sec">結束回合</button>
    <button id="helpBtn" class="sec" style="flex:.5">？</button>
  </div>
</div>
<div id="overlay">
  <div class="card" id="helpCard">
    <h2>🧶 毛線城堡</h2>
    <div>你是<b style="color:var(--p0d)">橘貓隊</b>，對手是<b style="color:var(--p1d)">灰貓隊</b>。12 回合後，地毯誰的多誰贏。</div>
    <ul>
      <li><b>拖曳小貓</b>走最多 4 格，走過的地方會鋪毛線。</li>
      <li>毛線（加上自己的貓、地盤、牆邊）<b>圍起來的區域就是你的</b>，裡面不能有對手的貓或線。</li>
      <li><b>踩對手的毛線就剪斷</b>，他那一段白走。</li>
      <li>毛線用完要去撿<b>毛線球</b>。<b>打結</b>讓整條線剪不斷，但那隻貓這回合不能動（每局 2 次）。</li>
    </ul>
    <button id="startBtn">開始</button>
  </div>
  <div class="card hidden" id="endCard">
    <h2 id="endTitle">結束</h2>
    <div class="big" id="endScore"></div>
    <button id="againBtn">再來一局</button>
  </div>
</div>
<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const W = YC.W, H = YC.H;
  let s, cell = 36, ox = 0, oy = 0, dpr = 1;
  let drag = null;          // {cat, path:[], px,py}
  let selected = -1;        // cat id selected by tap (for knot)
  let flashes = [];         // {cells, color, until}
  let aiPaths = [];         // recently shown AI paths
  let busy = false;         // AI thinking / transition
  let fuzzLog = null;
  let lastMoveAt = 0;
  const P0 = '#f0923f', P1 = '#7a93c2', P0D = '#c9702a', P1D = '#5a709c';
  const col = o => o === 0 ? P0 : P1, cold = o => o === 0 ? P0D : P1D;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const wrap = $('cwrap');
    const aw = wrap.clientWidth - 8, ah = wrap.clientHeight - 8;
    cell = Math.floor(Math.min(aw / W, ah / H));
    if (!(cell > 8)) cell = 24;
    const cw = cell * W, ch = cell * H;
    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    ox = 0; oy = 0;
    draw();
  }

  function newGame(seed) {
    s = YC.newGame(seed || ((Date.now() % 100000) + 1));
    drag = null; selected = -1; flashes = []; aiPaths = []; busy = false;
    updateUI(); draw();
  }

  // ---------- drawing ----------
  function cc(i) { return [ox + (i % W) * cell + cell / 2, oy + ((i / W) | 0) * cell + cell / 2]; }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  function draw() {
    if (!s) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    const now = performance.now();
    // carpet
    ctx.fillStyle = '#efdcc0'; ctx.fillRect(0, 0, W * cell, H * cell);
    for (let i = 0; i < YC.N; i++) {
      const x = (i % W) * cell, y = ((i / W) | 0) * cell;
      ctx.fillStyle = ((i % W) + ((i / W) | 0)) % 2 ? '#edd8ba' : '#f3e3c9';
      ctx.fillRect(x, y, cell, cell);
      if (s.claim[i] !== -1) {
        ctx.fillStyle = s.claim[i] === 0 ? 'rgba(240,146,63,.55)' : 'rgba(122,147,194,.55)';
        ctx.fillRect(x, y, cell, cell);
        // little stitch pattern
        ctx.strokeStyle = s.claim[i] === 0 ? 'rgba(201,112,42,.35)' : 'rgba(90,112,156,.35)';
        ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo(x + cell * .25, y + cell * .5); ctx.lineTo(x + cell * .5, y + cell * .25); ctx.lineTo(x + cell * .75, y + cell * .5); ctx.lineTo(x + cell * .5, y + cell * .75); ctx.closePath(); ctx.stroke();
      }
    }
    // grid lines (subtle)
    ctx.strokeStyle = 'rgba(120,90,60,.10)'; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x++) { ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, H * cell); ctx.stroke(); }
    for (let y = 0; y <= H; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell); ctx.lineTo(W * cell, y * cell); ctx.stroke(); }
    // flashes
    flashes = flashes.filter(f => f.until > now);
    for (const f of flashes) {
      const a = Math.min(1, (f.until - now) / 500);
      ctx.fillStyle = f.color; ctx.globalAlpha = a * .7;
      for (const i of f.cells) { const x = (i % W) * cell, y = ((i / W) | 0) * cell; ctx.fillRect(x, y, cell, cell); }
      ctx.globalAlpha = 1;
    }
    // obstacles: sofa legs
    for (let i = 0; i < YC.N; i++) if (s.obst[i]) {
      const [x, y] = cc(i);
      ctx.fillStyle = 'rgba(0,0,0,.12)'; rr(x - cell * .34, y - cell * .28, cell * .68, cell * .68, cell * .18); ctx.fill();
      ctx.fillStyle = '#9c6b45'; rr(x - cell * .34, y - cell * .34, cell * .68, cell * .68, cell * .18); ctx.fill();
      ctx.fillStyle = '#b8835a'; rr(x - cell * .26, y - cell * .26, cell * .52, cell * .3, cell * .12); ctx.fill();
      ctx.strokeStyle = 'rgba(80,45,20,.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x - cell * .2, y + cell * .15); ctx.lineTo(x + cell * .2, y + cell * .15); ctx.stroke();
    }
    // yarn balls
    for (let i = 0; i < YC.N; i++) if (s.ball[i]) drawBall(cc(i), cell * .3, '#e36f8a');
    // yarn trails
    for (const c of s.cats) drawTrail(c);
    // AI path previews (dashed)
    for (const ap of aiPaths) {
      if (ap.until < now) continue;
      ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(90,112,156,.7)'; ctx.lineWidth = 3; ctx.beginPath();
      let [x0, y0] = cc(ap.from); ctx.moveTo(x0, y0);
      for (const ci of ap.path) { const [x, y] = cc(ci); ctx.lineTo(x, y); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    aiPaths = aiPaths.filter(a => a.until > now);
    // drag preview
    if (drag) {
      const c = s.cats[drag.cat];
      ctx.strokeStyle = 'rgba(201,112,42,.85)'; ctx.lineWidth = cell * .22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.setLineDash([cell * .3, cell * .22]);
      ctx.beginPath(); let [x0, y0] = cc(YC.idx(c.x, c.y)); ctx.moveTo(x0, y0);
      for (const ci of drag.path) { const [x, y] = cc(ci); ctx.lineTo(x, y); }
      ctx.stroke(); ctx.setLineDash([]);
      for (const ci of drag.path) { const [x, y] = cc(ci); ctx.fillStyle = 'rgba(240,146,63,.35)'; ctx.fillRect(x - cell / 2, y - cell / 2, cell, cell); }
      // steps left bubble
      const left = s.maxSteps - drag.path.length;
      const [hx, hy] = drag.path.length ? cc(drag.path[drag.path.length - 1]) : [x0, y0];
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx + cell * .32, hy - cell * .36, cell * .2, 0, 7); ctx.fill();
      ctx.fillStyle = P0D; ctx.font = 'bold ' + (cell * .26) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(left, hx + cell * .32, hy - cell * .35);
    }
    // cats
    for (const c of s.cats) drawCat(c);
  }

  function drawBall([x, y], r, color) {
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.arc(x + 1, y + r * .25, r, 0, 7); ctx.fill();
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = r * .18;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(x, y, r * 1.1, r * (0.25 + Math.abs(k) * .3), k * .5, 0, 7); ctx.stroke(); }
    ctx.restore();
  }

  function drawTrail(c) {
    if (!c.trail.length) return;
    const color = col(c.owner), dark = cold(c.owner);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // segments: trail cells in order, then the cat head. break where cells aren't adjacent (converted gaps)
    const pts = c.trail.map(ci => ({ ci, p: cc(ci) }));
    pts.push({ ci: YC.idx(c.x, c.y), p: cc(YC.idx(c.x, c.y)), head: true });
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass === 0 ? dark : color; ctx.lineWidth = pass === 0 ? cell * .3 : cell * .18;
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[i - 1];
        const adj = b && Math.abs((a.ci % W) - (b.ci % W)) + Math.abs(((a.ci / W) | 0) - ((b.ci / W) | 0)) === 1;
        if (!b || !adj) { ctx.moveTo(a.p[0], a.p[1]); if (!b || !adj) { ctx.lineTo(a.p[0] + .01, a.p[1]); } }
        else ctx.lineTo(a.p[0], a.p[1]);
      }
      ctx.stroke();
    }
    // knots
    for (const ci of c.trail) if (s.knot[ci]) {
      const [x, y] = cc(ci);
      ctx.fillStyle = dark; ctx.beginPath(); ctx.arc(x, y, cell * .17, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, cell * .1, 0, 7); ctx.stroke();
    }
  }

  function drawCat(c) {
    const [x, y] = cc(YC.idx(c.x, c.y));
    const r = cell * .36;
    const mine = c.owner === 0;
    const dim = c.moved && c.owner === s.turn;
    ctx.globalAlpha = dim ? .55 : 1;
    if (selected === c.id || (drag && drag.cat === c.id)) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 7); ctx.stroke();
    }
    const body = mine ? '#f4a855' : '#9aa9bf', dark = mine ? '#c9702a' : '#5a709c';
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(x, y + r * .9, r * .9, r * .35, 0, 0, 7); ctx.fill();
    // ears
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(x - r * .9, y - r * .2); ctx.lineTo(x - r * .75, y - r * 1.25); ctx.lineTo(x - r * .15, y - r * .8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + r * .9, y - r * .2); ctx.lineTo(x + r * .75, y - r * 1.25); ctx.lineTo(x + r * .15, y - r * .8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f7c9cf';
    ctx.beginPath(); ctx.moveTo(x - r * .72, y - r * .35); ctx.lineTo(x - r * .66, y - r * .95); ctx.lineTo(x - r * .3, y - r * .7); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + r * .72, y - r * .35); ctx.lineTo(x + r * .66, y - r * .95); ctx.lineTo(x + r * .3, y - r * .7); ctx.closePath(); ctx.fill();
    // head
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    // stripes
    ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1.5, r * .12); ctx.globalAlpha *= .6;
    ctx.beginPath(); ctx.moveTo(x - r * .25, y - r * .95); ctx.lineTo(x - r * .15, y - r * .55); ctx.moveTo(x, y - r); ctx.lineTo(x, y - r * .6); ctx.moveTo(x + r * .25, y - r * .95); ctx.lineTo(x + r * .15, y - r * .55); ctx.stroke();
    ctx.globalAlpha = dim ? .55 : 1;
    // eyes
    const sleepy = dim;
    ctx.fillStyle = '#3b2a1e';
    if (sleepy) { ctx.lineWidth = 2; ctx.strokeStyle = '#3b2a1e'; ctx.beginPath(); ctx.arc(x - r * .35, y - r * .05, r * .16, .1, Math.PI - .1); ctx.stroke(); ctx.beginPath(); ctx.arc(x + r * .35, y - r * .05, r * .16, .1, Math.PI - .1); ctx.stroke(); }
    else { ctx.beginPath(); ctx.ellipse(x - r * .35, y - r * .08, r * .13, r * .19, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(x + r * .35, y - r * .08, r * .13, r * .19, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x - r * .3, y - r * .15, r * .05, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(x + r * .4, y - r * .15, r * .05, 0, 7); ctx.fill(); }
    // nose + mouth
    ctx.fillStyle = '#e5868f'; ctx.beginPath(); ctx.moveTo(x, y + r * .22); ctx.lineTo(x - r * .1, y + r * .1); ctx.lineTo(x + r * .1, y + r * .1); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3b2a1e'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, y + r * .22); ctx.lineTo(x, y + r * .32); ctx.moveTo(x - r * .2, y + r * .4); ctx.quadraticCurveTo(x, y + r * .5, x, y + r * .32); ctx.quadraticCurveTo(x, y + r * .5, x + r * .2, y + r * .4); ctx.stroke();
    // whiskers
    ctx.strokeStyle = 'rgba(59,42,30,.6)'; ctx.lineWidth = 1;
    for (const sgn of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + sgn * r * .35, y + r * .2); ctx.lineTo(x + sgn * r * 1.05, y + r * .1); ctx.moveTo(x + sgn * r * .35, y + r * .3); ctx.lineTo(x + sgn * r * 1.05, y + r * .4); ctx.stroke(); }
    ctx.globalAlpha = 1;
    // yarn count badge
    const bx = x + r * .85, by = y + r * .85;
    ctx.fillStyle = c.yarn === 0 ? '#c44' : '#fff'; ctx.beginPath(); ctx.arc(bx, by, r * .36, 0, 7); ctx.fill();
    ctx.fillStyle = c.yarn === 0 ? '#fff' : dark; ctx.font = 'bold ' + Math.max(9, r * .42) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.yarn, bx, by + .5);
  }

  // ---------- UI state ----------
  function updateUI() {
    const sc = YC.score(s);
    $('bar0').style.width = (sc[0] / YC.N * 100) + '%'; $('bar0').textContent = sc[0];
    $('bar1').style.width = (sc[1] / YC.N * 100) + '%'; $('bar1').textContent = sc[1];
    $('roundTxt').textContent = '第 ' + Math.min(s.round, s.maxRound) + ' / ' + s.maxRound + ' 回合';
    $('turnTxt').textContent = s.over ? '' : (s.turn === 0 ? '🟠 你的回合' : '🔵 灰貓思考中…');
    const myTurn = s.turn === 0 && !s.over && !busy;
    const selCat = selected >= 0 ? s.cats[selected] : null;
    $('knotBtn').disabled = !(myTurn && selCat && !selCat.moved && selCat.trail.length > 0 && s.knotsLeft[0] > 0);
    $('knotBtn').textContent = '🪢 打結 ×' + s.knotsLeft[0];
    $('endBtn').disabled = !myTurn;
    let h = '';
    if (s.over) h = '遊戲結束';
    else if (!myTurn) h = '';
    else { const left = s.cats.filter(c => c.owner === 0 && !c.moved).length; h = left ? '拖曳小貓鋪毛線（還有 ' + left + ' 隻可以動）' : '全部動完了，結束回合'; if (selCat && !selCat.moved) h = '選了一隻貓：拖曳移動，或按「打結」保護牠的線'; }
    $('hint').textContent = h;
  }

  function consumeEvents(owner) {
    const now = performance.now();
    for (const e of s.events) {
      if (e.t === 'claim') flashes.push({ cells: e.cells, color: e.owner === 0 ? '#ffd27a' : '#bcd0ff', until: now + 900 });
      if (e.t === 'cut') flashes.push({ cells: e.cells, color: '#ff6b6b', until: now + 700 });
    }
    s.events.length = 0;
  }

  function finishIfOver() {
    if (!s.over) return false;
    const sc = YC.score(s);
    $('endTitle').textContent = s.winner === 0 ? '🎉 橘貓隊贏了！' : s.winner === 1 ? '😿 灰貓隊贏了' : '🤝 平手';
    $('endScore').innerHTML = '<span style="color:' + P0D + '">' + sc[0] + '</span> ： <span style="color:' + P1D + '">' + sc[1] + '</span>';
    $('helpCard').classList.add('hidden'); $('endCard').classList.remove('hidden'); $('overlay').classList.remove('hidden');
    return true;
  }

  function endPlayerTurn() {
    if (busy || s.over || s.turn !== 0) return;
    busy = true; selected = -1; drag = null;
    YC.endTurn(s); updateUI(); draw();
    if (finishIfOver()) { busy = false; return; }
    const run = () => {
      const moves = YC.aiTurn(s, 1, 1);
      const now = performance.now();
      for (const m of moves) {
        const c = s.cats[m.cat];
        // reconstruct start cell: first trail cell added? simpler: path start = cell before path[0]
        aiPaths.push({ from: prevCell(c, m.path), path: m.path, until: now + 1600 });
      }
      consumeEvents(1);
      YC.endTurn(s);
      busy = false;
      updateUI(); draw();
      finishIfOver();
    };
    if (fuzzLog) run(); else setTimeout(run, 350);
  }
  function prevCell(c, path) {
    // the cell the cat started from = neighbour of path[0] that is in trail end, else path[0]
    const p0 = path[0];
    for (let i = c.trail.length - 1; i >= 0; i--) {
      const t = c.trail[i];
      if (Math.abs((t % W) - (p0 % W)) + Math.abs(((t / W) | 0) - ((p0 / W) | 0)) === 1) return t;
    }
    return p0;
  }

  function maybeAutoEnd() {
    if (s.turn !== 0 || s.over) return;
    if (s.cats.every(c => c.owner !== 0 || c.moved)) { if (fuzzLog) endPlayerTurn(); else setTimeout(endPlayerTurn, 300); }
  }

  // ---------- input ----------
  function cellFromClient(cx, cy) {
    const rect = cv.getBoundingClientRect();
    const x = Math.floor((cx - rect.left) / cell), y = Math.floor((cy - rect.top) / cell);
    if (!YC.inb(x, y)) return -1;
    return YC.idx(x, y);
  }
  function onDown(cx, cy) {
    if (busy || !s || s.over || s.turn !== 0) return;
    const ci = cellFromClient(cx, cy);
    if (ci < 0) { selected = -1; updateUI(); draw(); return; }
    const c = YC.catAt(s, ci);
    if (c && c.owner === 0 && !c.moved) { drag = { cat: c.id, path: [], moved: false }; selected = c.id; }
    else { selected = -1; }
    updateUI(); draw();
  }
  function onMove(cx, cy) {
    if (!drag) return;
    const ci = cellFromClient(cx, cy);
    if (ci < 0) return;
    const c = s.cats[drag.cat];
    const head = drag.path.length ? drag.path[drag.path.length - 1] : YC.idx(c.x, c.y);
    if (ci === head) return;
    drag.moved = true;
    // backtrack
    const prev = drag.path.length >= 2 ? drag.path[drag.path.length - 2] : YC.idx(c.x, c.y);
    if (ci === prev) { drag.path.pop(); draw(); return; }
    // extend toward ci (fill skipped cells axis-wise, max 2 steps)
    let guard = 0;
    while (guard++ < 3 && drag.path.length < s.maxSteps) {
      const h = drag.path.length ? drag.path[drag.path.length - 1] : YC.idx(c.x, c.y);
      if (h === ci) break;
      const hx = h % W, hy = (h / W) | 0, tx = ci % W, ty = (ci / W) | 0;
      const cand = [];
      if (tx !== hx) cand.push(YC.idx(hx + Math.sign(tx - hx), hy));
      if (ty !== hy) cand.push(YC.idx(hx, hy + Math.sign(ty - hy)));
      let ok = false;
      for (const n of cand) {
        if (YC.validatePath(s, c, drag.path.concat([n])) === '') { drag.path.push(n); ok = true; break; }
      }
      if (!ok) break;
    }
    draw();
  }
  function onUp() {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.path.length) {
      const r = YC.applyMove(s, d.cat, d.path);
      if (!r.err) { consumeEvents(0); selected = -1; lastMoveAt = performance.now(); updateUI(); draw(); maybeAutoEnd(); return; }
    }
    updateUI(); draw();
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); onDown(e.clientX, e.clientY); });
  cv.addEventListener('pointermove', e => { if (e.buttons === 0 && e.pointerType === 'mouse') return; onMove(e.clientX, e.clientY); });
  cv.addEventListener('pointerup', e => { onUp(); });
  cv.addEventListener('pointercancel', e => { drag = null; draw(); });
  window.addEventListener('blur', () => { drag = null; draw(); });

  $('knotBtn').addEventListener('click', () => {
    if (busy || s.over || s.turn !== 0 || selected < 0) return;
    if (YC.knot(s, selected)) { consumeEvents(0); selected = -1; updateUI(); draw(); maybeAutoEnd(); }
  });
  $('endBtn').addEventListener('click', () => endPlayerTurn());
  $('helpBtn').addEventListener('click', () => { $('endCard').classList.add('hidden'); $('helpCard').classList.remove('hidden'); $('overlay').classList.remove('hidden'); });
  $('startBtn').addEventListener('click', () => { $('overlay').classList.add('hidden'); });
  $('againBtn').addEventListener('click', () => { $('overlay').classList.add('hidden'); newGame(); });

  // animation loop (only when flashes/aiPaths active)
  function tick() { if (flashes.length || aiPaths.length) draw(); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
  window.addEventListener('resize', resize);

  // ---------- kid fuzz: #fuzz=N&seed=S ----------
  function fuzz() {
    const q = new URLSearchParams(location.hash.slice(1));
    const n = +q.get('fuzz') || 0; if (!n) return;
    const seed = +q.get('seed') || 1;
    const rng = YC.mulberry(seed);
    fuzzLog = []; let errors = 0, games = 0, moves = 0;
    $('overlay').classList.add('hidden');
    newGame(seed);
    const rect = () => cv.getBoundingClientRect();
    const rp = () => { const r = rect(); return [r.left - 30 + rng() * (r.width + 60), r.top - 30 + rng() * (r.height + 60)]; };
    const origErr = window.onerror;
    window.onerror = (m) => { errors++; fuzzLog.push('onerror ' + m); };
    try {
      for (let i = 0; i < n; i++) {
        const a = rng();
        if (a < 0.6) { // random drag with wobble
          let [x, y] = rp(); onDown(x, y);
          const steps = 1 + Math.floor(rng() * 8);
          for (let k = 0; k < steps; k++) { x += (rng() - .5) * cell * 2.5; y += (rng() - .5) * cell * 2.5; onMove(x, y); }
          if (rng() < 0.9) onUp(); else { drag = null; }
        } else if (a < 0.7) { const [x, y] = rp(); onDown(x, y); onUp(); }
        else if (a < 0.8) { $('knotBtn').click(); }
        else if (a < 0.9) { $('endBtn').click(); }
        else if (a < 0.95) { onMove(...rp()); onUp(); }
        else { $('helpBtn').click(); $('startBtn').click(); }
        const errs = YC.checkInvariants(s);
        if (errs.length) { errors++; fuzzLog.push('step ' + i + ': ' + errs.join(';')); }
        if (drag && drag.path.length > s.maxSteps) { errors++; fuzzLog.push('drag too long'); }
        if (s.over) { games++; $('againBtn').click(); }
        moves++;
      }
    } catch (e) { errors++; fuzzLog.push('exception ' + (e && e.stack || e)); }
    window.onerror = origErr;
    const msg = 'FUZZ seed=' + seed + ' n=' + n + ' games=' + games + ' errors=' + errors + ' vp=' + innerWidth + 'x' + innerHeight + ' dpr=' + devicePixelRatio + ' app=' + $('app').clientWidth + ' cell=' + cell + (fuzzLog.length ? '\n' + fuzzLog.slice(0, 10).join('\n') : '');
    console.log(msg);
    $('hint').textContent = msg.split('\n')[0];
    window.__fuzz = { errors, games, log: fuzzLog, round: s.round, score: YC.score(s) };
  }

  // boot
  newGame();
  resize();
  setTimeout(resize, 50);
  try { if (localStorage.getItem('yc_seen')) { /* still show help; it's short */ } localStorage.setItem('yc_seen', '1'); } catch (e) {}
  fuzz();
})();
</script>
</body>
</html>
