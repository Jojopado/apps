<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>臺鐵資訊練習</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--mute:#5c6b7a;--line:#d8dfe6;--main:#1f4e79;--main2:#2f6ea5;--good:#1d7a46;--goodbg:#e6f5ec;--bad:#b3362d;--badbg:#fbeaea;--sel:#e6f0fa}
@media (prefers-color-scheme:dark){:root{--bg:#141a21;--card:#1e2730;--ink:#e8edf2;--mute:#9dabb8;--line:#33404d;--main:#7db4e6;--main2:#9ac7ef;--good:#6fd39a;--goodbg:#17352a;--bad:#f09a92;--badbg:#3a2222;--sel:#22384d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
#app{max-width:680px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:8px 0 2px;color:var(--main)}
h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;min-height:44px}
.btn.main{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.btn.main{color:#10202e}}
.btn:disabled{opacity:.45;cursor:default}
.subject{width:100%;text-align:left;display:block}
.subject b{display:block}
.subject small{color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px;min-height:44px}
.seg button.on{background:var(--sel);border-color:var(--main);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--main2);width:0}
.top{font-size:14px;color:var(--mute)}
.q{font-size:18px;font-weight:600;margin:4px 0 12px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;margin:0 0 8px;min-height:48px}
.opt.sel{background:var(--sel);border-color:var(--main)}
.opt.right{background:var(--goodbg);border-color:var(--good)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.fix{font-size:13px;color:var(--mute);margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px}
.grid button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:0;height:34px;font-size:13px}
.grid button.done{background:var(--sel)}
.grid button.cur{border-color:var(--main);border-width:2px}
.score{font-size:44px;font-weight:800;color:var(--main);margin:0}
.tag{font-size:13px;padding:2px 8px;border-radius:99px;background:var(--badbg);color:var(--bad)}
.tag.ok{background:var(--goodbg);color:var(--good)}
.link{background:none;border:0;color:var(--main2);text-decoration:underline;padding:6px 0}
</style>
</head>
<body><div id="app"></div>
<script>
const DATA={"net":{"name":"網路通訊與資通安全概要","q":[{"n":1,"q":"關於網路的主要目的，下列何者不正確?","o":["資源共享","提高可靠度","節省成本","限制資料交流的範圍"],"a":"D"},{"n":2,"q":"在網路連接設備中，哪一項設備工作於OSI模型中的第三層?","o":["集線器(Hub)","橋接器( Bridge)","路由器(Router)","交換式集線器(Switching Hub)"],"a":"C"},{"n":3,"q":"下列哪種網路拓樸(topology)結構，一旦中央設備故障，整個網路就會中斷?","o":["星型拓樸(Star topology)","匯流排拓樸(Bus topology)","網狀拓樸(Mesh topology)","環狀拓樸(Ring topology)"],"a":"A"},{"n":4,"q":"關於OSI七層模型，下列敘述何者錯誤?","o":["實體層負責數據的電氣特性","網路層負責定址和路由","傳輸層確保端對端的可靠傳輸","表現層負責路由選擇"],"a":"D"},{"n":5,"q":"下列何者不是廣播網路的特點?","o":["實體層負責數據的電氣特性","網路層負責定址和路由","傳輸層確保端對端的可靠傳輸","表現層負責路由選擇"],"a":"C","flag":1},{"n":6,"q":"關於網路分層設計的優點，下列何者錯誤？","o":["使整體網路架構模組化","降低系統維護複雜度","增加系統設計彈性","提高網路傳輸延遲"],"a":"D"},{"n":7,"q":"X.25協定的特點不包括下列何者？","o":["虛擬電路","錯誤控制","無連接服務","訪問控制"],"a":"C"},{"n":8,"q":"下列何者不是數位訊號的優點？","o":["具有較強的抗干擾性","可進行誤差檢測和修正","可以表示無窮多的連續數值","容易壓縮和處理"],"a":"C"},{"n":9,"q":"頻譜的作用為何？","o":["用來量測訊號的振幅","顯示信號在不同頻率下的強度分佈","測量訊號的相位差","計算訊號的傳輸速率"],"a":"B"},{"n":10,"q":"什麼是位元率(bit rate)？","o":["每秒傳輸的符號數量","每秒傳輸的位元數量","訊號的頻率","訊號的振幅"],"a":"B"},{"n":11,"q":"在數位資料轉換成數位訊號的編碼方式中，下列何者特點描述錯誤？","o":["RZ編碼在每個位元之間有明確的時鐘邊緣","NRZ-L編碼的傳輸效率比RZ高","NRZI碼在連續的0或1序列時容易發生時鐘恢復問題","曼徹斯特編碼不會有連續0或1的問題"],"a":"C"},{"n":12,"q":"漢明距離(Hamming distance)2可以做什麼？","o":["偵測一位元錯誤並修正","只能偵測一位元錯誤","可以修正兩位元錯誤","偵測兩位元錯誤並修正"],"a":"B"},{"n":13,"q":"下列何者不是同位位元檢查(Parity check)的特點？","o":["實現簡單","成本低","可以修正錯誤","只能偵測單一位元錯誤"],"a":"C"},{"n":14,"q":"SLIP協定的特色為何？","o":["提供錯誤檢測功能","可自動分配IP地址","支援多種網路協定","結構簡單易實現"],"a":"D"},{"n":15,"q":"在流量控制中使用滑動視窗協定的目的是什麼？","o":["增加傳輸速度","確保資料的完整性和順序性","減少封包大小","增加網路頻寬"],"a":"B"},{"n":16,"q":"在IEEE 802.3中，最小訊框長度為多少位元組？","o":["46","64","512","15"],"a":"B"},{"n":17,"q":"在CSMA/CD中，當檢測到碰撞時，節點會採取什麼動作？","o":["立即重新傳送","等待一個固定時間後重傳","放棄傳送","依據二元指數倒退演算法等待後重傳"],"a":"D"},{"n":18,"q":"802.11無線網路架構中， BSS代表什麼？","o":["Basic Station Service","Basic Service Set","Base Station System","Backup Service Statio"],"a":"B"},{"n":19,"q":"在IEEE 802.3中，100BASE-TX的最大傳輸距離為多少？","o":["100m","185m","500m","2000m"],"a 案進度的風險評估"],"a":"B"},{"n":46,"q":"在資訊系統開發專案中，系統交付的測試階段發現了一個關鍵功能的缺陷。為了 避免影響交付期限，哪一種處理方式最為合理？","o":["將缺陷記錄到缺陷清單中，並安排在下一版本修復","中止交付，優先修復所有缺陷","通知客戶，討論是否調整交付範圍或延後交付","暫時屏蔽該功能，保留其界面，但不提供該功能的具體實現"],"a":"C"},{"n":47,"q":"資源平衡的主要目的是什麼？","o":["減少資源浪費","優化專案範疇","調整專案進度","減少專案成本"],"a":"A"},{"n":48,"q":"預算編制的過程中，通常會參考什麼因素？","o":["資源需求","專案風險","資源調度","進度計劃"],"a":"A"},{"n":49,"q":"品質改進計劃的主要目的是什麼？","o":["提高專案效能品質","改善品質控制過程","減少品質成本","增加資源配置品質"],"a":"B"},{"n":50,"q":"在資訊系統開發專案中，下列哪一種工作依賴性類型表明後續工作必須等前置工 作完成後才能開始？","o":["開始到開始(Start-to-Start, SS)","完成到完成(Finish-to-Finish, FF)","完成到開始(Finish-to-Start, FS)","開始到完成(Start-to-Finish, SF)"],"a":"C"}]}};
const OLD='ABCD';
const K='tra-it-quiz-v1';
function load(){try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return {}}}
function save(s){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}}
let store=load();store.best=store.best||{};store.wrong=store.wrong||{};
let S=null,timer=null,mode='exam';
const app=document.getElementById('app');
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function btn(t,c,f){const b=el('button',c,t);b.onclick=f;return b}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ref(k,n){return k+':'+n}
function getQ(r){const [k,n]=r.split(':');const d=DATA[k];const q=d.q.find(x=>x.n==n);return q?Object.assign({k,name:d.name,r},q):null}
function wrongList(){return Object.keys(store.wrong).filter(getQ)}
function stop(){if(timer){clearInterval(timer);timer=null}}
function home(){
  stop();S=null;app.innerHTML='';
  app.append(el('h1',null,'臺鐵資訊練習'),el('p','sub','113 年第 2 次第 9 階事務員資訊真題，三科各 50 題'));
  app.append(el('h2',null,'模式'));
  const seg=el('div','seg');
  [['exam','模擬考（交卷才看答案）'],['learn','練習（選完就對答）']].forEach(([m,t])=>{const b=btn(t,mode==m?'on':'',()=>{mode=m;home()});seg.append(b)});
  app.append(seg);
  app.append(el('p','fix',mode=='exam'?'一科 50 題，限時 60 分鐘（練習用時間，不是官方規定）。':'不計時，每題立刻看到答案。'));
  app.append(el('h2',null,'選科目'));
  Object.keys(DATA).forEach(k=>{
    const b=btn('', 'btn subject',()=>start(DATA[k].q.map(q=>ref(k,q.n)),DATA[k].name,k));
    b.append(el('b',null,DATA[k].name));
    const best=store.best[k];b.append(el('small',null,best!=null?'最佳 '+best+' 分':'50 題｜尚未作答'));
    app.append(b,el('div',null,''));app.lastChild.style.height='8px';
  });
  const all=Object.keys(DATA).flatMap(k=>DATA[k].q.map(q=>ref(k,q.n)));
  const mix=btn('', 'btn subject',()=>start(shuffle(all).slice(0,30),'三科混合 30 題','mix'));
  mix.append(el('b',null,'三科混合 30 題'));mix.append(el('small',null,store.best.mix!=null?'最佳 '+store.best.mix+' 分':'隨機抽題'));app.append(mix);
  const w=wrongList();
  app.append(el('h2',null,'錯題本'));
  const c=el('div','card');
  c.append(el('div',null,w.length?`目前 ${w.length} 題`:'還沒有錯題，先考一科。'));
  if(w.length){const r=el('div','row');r.style.marginTop='10px';
    r.append(btn('重做錯題','btn main',()=>start(shuffle(w),'錯題本','wrong')));
    r.append(btn('清空','btn',()=>{store.wrong={};save(store);home()}));c.append(r)}
  app.append(c);
}
function start(list,title,key){
  const ms=mode=='exam'?Math.round(list.length*72000):0;
  S={list,title,key,i:0,ans:{},end:ms?Date.now()+ms:0,done:false};
  screen();
  if(ms)timer=setInterval(tick,1000);
}
function tick(){if(!S||S.done)return stop();const left=S.end-Date.now();if(left<=0){finish();return}
  const t=document.getElementById('time');if(t)t.textContent=fmt(left)}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function screen(){
  const q=getQ(S.list[S.i]);const learn=mode=='learn';const cur=S.ans[q.r];const show=learn&&cur!=null;
  app.innerHTML='';
  const top=el('div','row top');top.append(el('span',null,`${S.title}｜第 ${S.i+1}/${S.list.length} 題`));
  if(S.end){const t=el('span',null,fmt(S.end-Date.now()));t.id='time';top.append(t)}else top.append(btn('離開','link',home));
  app.append(top);
  const bar=el('div','bar');const fill=el('i');fill.style.width=(Object.keys(S.ans).length/S.list.length*100)+'%';bar.append(fill);app.append(bar);
  if(q.name!=S.title&&S.key!='wrong')app.append(el('div','fix',q.name));
  app.append(el('div','q',q.q));
  if(q.flag)app.append(el('div','fix','這題原卷的選項看起來有誤，可先跳過。'));
  q.o.forEach((o,i)=>{const L=OLD[i];let c='opt';
    if(show){if(L==q.a)c+=' right';else if(L==cur)c+=' wrong'}else if(cur==L)c+=' sel';
    app.append(btn(`(${L}) ${o}`,c,()=>{if(show||!S)return;S.ans[q.r]=L;if(learn){if(L!=q.a){store.wrong[q.r]=1}else delete store.wrong[q.r];save(store)}screen()}))});
  if(show)app.append(el('div','fix',cur==q.a?'答對':`答錯，正確答案是 ${q.a}`));
  const nav=el('div','nav');
  const p=btn('上一題','btn',()=>{if(!S)return;S.i--;screen()});p.disabled=S.i==0;nav.append(p);
  const last=S.i==S.list.length-1;
  nav.append(btn(last?'交卷':'下一題',last?'btn main':'btn',()=>{if(!S)return;if(last)finish();else{S.i++;screen()}}));
  app.append(nav);
  const g=el('div','grid');S.list.forEach((r,i)=>{const b=btn(String(i+1),(S.ans[r]?'done':'')+(i==S.i?' cur':''),()=>{if(!S)return;S.i=i;screen()});g.append(b)});app.append(g);
  if(S.end){const r=el('div','row');r.style.marginTop='12px';r.append(btn('交卷','btn main',finish),btn('放棄','link',home));app.append(r)}
}
function finish(){
  if(!S||S.done)return;S.done=true;stop();
  const qs=S.list.map(getQ);const wrong=qs.filter(q=>S.ans[q.r]!=q.a);
  const right=qs.length-wrong.length;const score=Math.round(right/qs.length*100);
  qs.forEach(q=>{if(S.ans[q.r]===q.a)delete store.wrong[q.r];else store.wrong[q.r]=1});
  if(S.key!='wrong')store.best[S.key]=Math.max(store.best[S.key]||0,score);
  save(store);
  app.innerHTML='';
  app.append(el('h1',null,'考完了'),el('p','sub',S.title));
  const c=el('div','card');c.append(el('p','score',score+' 分'),el('div',null,`答對 ${right}／${qs.length} 題，未作答 ${qs.filter(q=>!S.ans[q.r]).length} 題`));app.append(c);
  const r=el('div','nav');const list=S.list.slice(),title=S.title,key=S.key;
  r.append(btn('回首頁','btn',home));r.append(btn('再考一次','btn main',()=>start(list,title,key)));app.append(r);
  if(wrong.length){app.append(el('h2',null,`錯題 ${wrong.length} 題`));
    wrong.forEach(q=>{const b=el('div','card');
      b.append(el('div','fix',`${q.name} 第 ${q.n} 題`),el('div',null,q.q));
      const a=el('div');a.style.marginTop='6px';
      a.append(el('span','tag',`你選 ${S.ans[q.r]||'未答'}`));a.append(document.createTextNode(' '));
      a.append(el('span','tag ok',`答案 ${q.a}：${q.o[OLD.indexOf(q.a)]}`));b.append(a);
      if(q.flag)b.append(el('div','fix','這題原卷的選項看起來有誤。'));
      app.append(b)})}
  else app.append(el('p',null,'全對。'));
  S=null;
}
home();
</script>
