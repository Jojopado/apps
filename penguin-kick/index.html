<style>
:root{--ice:#9ee8ff;--deep:#0b3fb0;--ink:#0c1424}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#cfe6f7;font-family:'Noto Sans TC',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#app canvas{display:block;width:100vw;height:100vh}
.layer{position:fixed;inset:0;pointer-events:none}
#bars::before,#bars::after{content:"";position:absolute;left:0;right:0;height:0;background:#05070d;transition:height .28s cubic-bezier(.2,.9,.3,1)}
#bars::before{top:0}#bars::after{bottom:0}
#bars.on::before,#bars.on::after{height:11vh}
#tint{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(10,60,160,.55) 100%);opacity:0;transition:opacity .2s}
#speed{width:100vw;height:100vh}
#flash{background:#fff;opacity:0}
#swoosh{opacity:0}
#swoosh svg{width:100%;height:100%}
#swoosh path{fill:none;stroke-linecap:round;filter:drop-shadow(0 0 1.2px #bff3ff) drop-shadow(0 0 3px #47b9ff)}
.banner{position:fixed;left:0;right:0;text-align:center;pointer-events:none;opacity:0}
#banner{bottom:16vh}
.bn{position:relative;display:inline-block;font-family:'Ma Shan Zheng',serif;font-size:clamp(64px,13vw,170px);line-height:1;letter-spacing:.04em;transform:skewX(-8deg)}
.bn::before{content:attr(data-t);position:absolute;inset:0;color:#fff;-webkit-text-stroke:.16em #fff;filter:drop-shadow(0 0 .06em #0a2a80) drop-shadow(0 .05em 0 #061a55) drop-shadow(0 0 .25em #57c8ff);z-index:0}
.bn span{position:relative;z-index:1;background:linear-gradient(180deg,#eaffff 0%,#8fe3ff 30%,#2d8dff 62%,#0b3fb0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.025em #062a7a}
.sub{display:block;margin-top:.35em;font:900 clamp(13px,1.6vw,22px)/1 'Noto Sans TC',sans-serif;letter-spacing:.5em;color:#e9fbff;text-shadow:0 0 8px #2f9bff,0 2px 0 #062a7a}
#banner.show{animation:slam 1.5s cubic-bezier(.15,.9,.25,1) forwards}
@keyframes slam{0%{opacity:0;transform:scale(2.8);filter:blur(10px)}12%{opacity:1;transform:scale(.93);filter:blur(0)}18%{transform:scale(1.03)}24%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08) translateY(-10px)}}
#kbanner{top:14vh;text-align:right;padding-right:5vw}
#kbanner .bn{font-size:clamp(40px,7vw,96px)}
#kbanner .bn span{background:linear-gradient(180deg,#fff 0%,#c7f4ff 35%,#5aa6d6 70%,#24577e 100%);-webkit-background-clip:text;background-clip:text}
#kbanner.show{animation:kslam 1.2s cubic-bezier(.15,.9,.25,1) forwards}
@keyframes kslam{0%{opacity:0;transform:translateX(40vw)}14%{opacity:1;transform:translateX(-1vw)}22%,78%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(-4vw)}}
#goal{top:28vh}
#goal .g{display:inline-block;font:400 clamp(90px,19vw,250px)/1 'Bangers',sans-serif;letter-spacing:.04em;color:#fff6a8;-webkit-text-stroke:.035em #0c1424;text-shadow:0 .06em 0 #ff8a1f,0 .1em 0 #0c1424,0 0 .4em rgba(255,200,60,.8);transform:rotate(-6deg)}
#goal .gs{display:block;margin-top:.3em;font:900 clamp(18px,2.6vw,34px)/1.2 'Noto Sans TC',sans-serif;color:#fff;text-shadow:0 2px 0 #0c1424,0 0 12px #2f9bff}
#goal.show{animation:gpop 2.2s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes gpop{0%{opacity:0;transform:scale(.2)}14%{opacity:1;transform:scale(1.1)}22%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
#toast{top:40vh;font:900 clamp(26px,4vw,48px)/1 'Noto Sans TC',sans-serif;text-shadow:0 3px 0 #0c1424,0 0 14px rgba(0,0,0,.4)}
#toast.show{animation:toast 1.3s ease forwards}
@keyframes toast{0%{opacity:0;transform:translateY(16px)}15%,75%{opacity:1;transform:none}100%{opacity:0}}
/* HUD */
#hud{transition:opacity .25s}
#hud.hide{opacity:0}
#score{position:fixed;top:16px;left:16px;display:flex;gap:8px;align-items:stretch}
.pill{background:rgba(12,20,36,.78);border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;line-height:1.25;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.pill b{display:block;font:400 28px/1 'Bangers',sans-serif;letter-spacing:.04em;color:#fff6a8}
.pill small{color:#9fb4cf;font-size:11px;letter-spacing:.08em}
#gaugeBox{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));text-align:center}
#gLabel{font-weight:900;font-size:13px;letter-spacing:.2em;color:#e9f3ff;text-shadow:0 1px 2px rgba(0,0,0,.6);margin-bottom:6px}
#gauge{height:16px;border-radius:9px;background:rgba(12,20,36,.78);padding:3px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#gFill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#2d8dff,#8fe3ff);transition:width .12s}
#gaugeBox.full #gFill{background:linear-gradient(90deg,#8fe3ff,#fff,#8fe3ff);background-size:200% 100%;animation:shine .8s linear infinite;box-shadow:0 0 14px #6fd6ff}
#gaugeBox.full #gLabel{color:#fff;animation:pulse .7s ease-in-out infinite alternate}
@keyframes shine{to{background-position:-200% 0}}
@keyframes pulse{from{text-shadow:0 0 4px #2f9bff}to{text-shadow:0 0 16px #8fe3ff,0 0 4px #fff}}
#charge{height:6px;margin:6px auto 0;width:60%;border-radius:3px;background:rgba(12,20,36,.6);overflow:hidden;opacity:0;transition:opacity .1s}
#charge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd34d,#ff7a2f)}
#keys{position:fixed;right:16px;top:16px;text-align:right;font-size:12px;line-height:1.9;color:#eaf2ff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
#keys kbd{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:5px;background:rgba(12,20,36,.78);font:700 11px/20px 'Noto Sans TC',sans-serif;text-align:center;text-shadow:none}
/* touch */
#touch{display:none}
body.touch #touch{display:block}
body.touch #keys{display:none}
#stick{position:fixed;left:22px;bottom:64px;width:130px;height:130px;border-radius:50%;background:rgba(12,20,36,.35);border:2px solid rgba(255,255,255,.35);pointer-events:auto}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
.tbtn{position:fixed;width:84px;height:84px;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#0c1424;box-shadow:0 3px 0 rgba(0,0,0,.3)}
#bShoot{right:22px;bottom:70px;background:#ffd34d}
#bSpecial{right:118px;bottom:118px;background:#8fe3ff;width:72px;height:72px;font-size:14px}
body.touch #gaugeBox{bottom:12px}
</style>

<div id="app"></div>
<div id="tint" class="layer"></div>

<path id="sw1" d="M-8 78 C 20 50, 55 30, 108 12" stroke="url(#sg)" stroke-width="9" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
<path id="sw2" d="M-8 100 C 30 78, 66 66, 108 44" stroke="url(#sg)" stroke-width="5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
</svg></div>
<div id="bars" class="layer"></div>
<div id="banner" class="banner"><div class="bn" data-t="冰河皇帝砲"><span>冰河皇帝砲</span></div><span class="sub">GLACIER EMPEROR CANNON</span></div>
<div id="kbanner" class="banner"><div class="bn" data-t="千年冰壁"><span>千年冰壁</span></div></div>
<div id="goal" class="banner"><div class="g">GOAL!!</div><span class="gs" id="goalSub"></span></div>
<div id="toast" class="banner"></div>
<div id="flash" class="layer"></div>
<div id="hud" class="layer">
  <div id="score">
    <div class="pill"><small>進球</small><b id="sGoal">0</b></div>
    <div class="pill"><small>必殺技進球</small><b id="sSpecial">0</b></div>
  </div>
  <div id="keys">
    移動<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><br>
    蓄力射門（按住放開）<kbd>空白鍵</kbd><br>
    必殺技（量表滿）<kbd>E</kbd>
  </div>
  <div id="gaugeBox">
    <div id="gLabel">必殺技量表 — 帶球跑動來累積</div>
    <div id="gauge"><div id="gFill"></div></div>
    <div id="charge"><i id="cFill"></i></div>
  </div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <div id="bShoot" class="tbtn">射門</div>
    <div id="bSpecial" class="tbtn">必殺</div>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ---------- basics ----------
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIn = t => Math.pow(clamp(t, 0, 1), 2);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const elastic = t => { t = clamp(t, 0, 1); return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1; };
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const errors = [];
addEventListener('error', e => errors.push(String(e.message)));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
$('#app').appendChild(renderer.domElement);
const canvasEl = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  sizeSpeed();
});

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

// sky
scene.background = canvasTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#3f8fe0'); gr.addColorStop(0.55, '#9fd2f5'); gr.addColorStop(1, '#e6f5ff');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
scene.fog = new THREE.Fog(0xd6ecfa, 70, 170);

scene.add(new THREE.HemisphereLight(0xe4f3ff, 0x5c8a4a, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.position.set(14, 28, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 90 });
sun.shadow.bias = -0.0005;
sun.target.position.set(0, 0, -12);
scene.add(sun, sun.target);

// toon helpers
const gradData = new Uint8Array([70, 150, 220, 255]);
const grad = new THREE.DataTexture(gradData, 4, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, ...extra });
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x0c1424, side: THREE.BackSide });
const sphereGeo = new THREE.SphereGeometry(1, 28, 20);
function part(geo, mat, parent, pos, scale, outline = 1.07) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.copy(pos);
  if (scale) m.scale.copy(scale);
  m.castShadow = true;
  if (outline) { const o = new THREE.Mesh(geo, outlineMat); o.scale.setScalar(outline); m.add(o); }
  parent.add(m);
  return m;
}

// ---------- pitch ----------
const FIELD = { x0: -20, x1: 20, z0: -36, z1: 14 };
const GOAL_Z = -30, POST_X = 3.6, BAR_Y = 2.4, NET_Z = -32;
const pitchTex = canvasTex(1024, 1280, (g, w, h) => {
  const sx = w / 40, sz = h / 50;
  const P = (x, z) => [(x + 20) * sx, (z + 36) * sz];
  g.fillStyle = '#3f9443'; g.fillRect(0, 0, w, h);
  for (let z = -30, i = 0; z < 14; z += 3.5, i++) {
    const [, v0] = P(0, z), [, v1] = P(0, Math.min(z + 3.5, 14));
    const [u0] = P(-17, 0), [u1] = P(17, 0);
    g.fillStyle = i % 2 ? '#56b44f' : '#4aa846'; g.fillRect(u0, v0, u1 - u0, v1 - v0);
  }
  // subtle noise
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.strokeStyle = 'rgba(255,255,255,.92)'; g.lineWidth = 0.14 * sx;
  const line = (pts) => { g.beginPath(); pts.forEach(([x, z], i) => { const [u, v] = P(x, z); i ? g.lineTo(u, v) : g.moveTo(u, v); }); g.stroke(); };
  line([[-17, 14], [-17, -30], [17, -30], [17, 14]]);
  line([[-17, 12], [17, 12]]);
  line([[-10.5, -30], [-10.5, -19.5], [10.5, -19.5], [10.5, -30]]);
  line([[-5.5, -30], [-5.5, -26.5], [5.5, -26.5], [5.5, -30]]);
  const arc = (x, z, r, a0, a1) => { const [u, v] = P(x, z); g.beginPath(); g.arc(u, v, r * sx, a0, a1); g.stroke(); };
  arc(0, 12, 6, Math.PI, Math.PI * 2);
  arc(0, -23, 6, 0.93, Math.PI - 0.93);
  g.fillStyle = '#fff'; const [pu, pv] = P(0, -23); g.beginPath(); g.arc(pu, pv, 0.2 * sx, 0, 7); g.fill();
  arc(-17, -30, 1, 0, Math.PI / 2); arc(17, -30, 1, Math.PI / 2, Math.PI);
});
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(40, 50), new THREE.MeshLambertMaterial({ map: pitchTex }));
pitch.rotation.x = -Math.PI / 2; pitch.position.set(0, 0, -11); pitch.receiveShadow = true;
scene.add(pitch);
const outer = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), new THREE.MeshLambertMaterial({ color: 0x3a7d3d }));
outer.rotation.x = -Math.PI / 2; outer.position.y = -0.02; outer.receiveShadow = true; scene.add(outer);

// goal
const goal = new THREE.Group(); scene.add(goal);
const postMat = toon(0xffffff);
const postGeo = new THREE.CylinderGeometry(0.08, 0.08, BAR_Y, 12);
for (const sx of [-1, 1]) part(postGeo, postMat, goal, V(sx * POST_X, BAR_Y / 2, GOAL_Z), null, 1.25);
const bar = part(new THREE.CylinderGeometry(0.08, 0.08, POST_X * 2 + 0.16, 12), postMat, goal, V(0, BAR_Y, GOAL_Z), null, 1.25);
bar.rotation.z = Math.PI / 2;
const netMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.55 });
const netBack = new THREE.Mesh(new THREE.PlaneGeometry(POST_X * 2, BAR_Y, 28, 10), netMat);
netBack.position.set(0, BAR_Y / 2, NET_Z); goal.add(netBack);
const netBase = netBack.geometry.attributes.position.array.slice();
const netOff = new Float32Array(netBase.length / 3);
for (const sx of [-1, 1]) {
  const side = new THREE.Mesh(new THREE.PlaneGeometry(2, BAR_Y, 8, 10), netMat);
  side.rotation.y = Math.PI / 2; side.position.set(sx * POST_X, BAR_Y / 2, (GOAL_Z + NET_Z) / 2); goal.add(side);
}
const netTop = new THREE.Mesh(new THREE.PlaneGeometry(POST_X * 2, 2, 28, 8), netMat);
netTop.rotation.x = Math.PI / 2; netTop.position.set(0, BAR_Y, (GOAL_Z + NET_Z) / 2); goal.add(netTop);
function bulgeNet(x, y, amt) {
  const p = netBase;
  for (let i = 0; i < netOff.length; i++) {
    const dx = p[i * 3] - x, dy = (p[i * 3 + 1] + BAR_Y / 2) - y;
    netOff[i] = Math.max(netOff[i], amt * Math.exp(-(dx * dx + dy * dy) / 0.9));
  }
}
function updateNet(dt) {
  const a = netBack.geometry.attributes.position;
  for (let i = 0; i < netOff.length; i++) { netOff[i] *= Math.exp(-2.2 * dt); a.array[i * 3 + 2] = netBase[i * 3 + 2] - netOff[i]; }
  a.needsUpdate = true;
}

// stands + crowd
const standMat = toon(0x6f86a6), standMat2 = toon(0x5a6f8c);
const crowdGeo = new THREE.BoxGeometry(0.42, 0.55, 0.42);
const crowdMat = new THREE.MeshLambertMaterial();
const crowdSpots = [];
function stand(cx, cz, len, alongX, dir) {
  for (let t = 0; t < 7; t++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(alongX ? len : 1.6, 0.9, alongX ? 1.6 : len), t % 2 ? standMat : standMat2);
    const off = dir * (t * 1.6);
    m.position.set(cx + (alongX ? 0 : off), 0.45 + t * 0.9, cz + (alongX ? off : 0));
    m.receiveShadow = true; scene.add(m);
    for (let k = 0; k < len / 0.62; k++) {
      if (Math.random() < 0.12) continue;
      const a = -len / 2 + 0.3 + k * 0.62;
      crowdSpots.push(V(cx + (alongX ? a : off), 0.9 + t * 0.9 + 0.27, cz + (alongX ? off : a)));
    }
  }
}
stand(-23, -11, 50, false, -1); stand(23, -11, 50, false, 1); stand(0, -38.5, 44, true, -1);
const crowd = new THREE.InstancedMesh(crowdGeo, crowdMat, crowdSpots.length);
const crowdCols = [0xff5d5d, 0x2d8dff, 0xffd34d, 0xffffff, 0x1d2333, 0x8fe3ff, 0xff9a3c, 0x7bd66b];
const crowdPhase = [];
const _m = new THREE.Matrix4(), _c = new THREE.Color();
crowdSpots.forEach((p, i) => {
  _m.makeTranslation(p.x, p.y, p.z); crowd.setMatrixAt(i, _m);
  crowd.setColorAt(i, _c.setHex(crowdCols[(Math.random() * crowdCols.length) | 0]));
  crowdPhase.push(Math.random() * 6.28);
});
scene.add(crowd);
let cheer = 0;
function updateCrowd(t, dt) {
  cheer = Math.max(0, cheer - dt * 0.35);
  const amp = 0.05 + cheer * 0.45;
  for (let i = 0; i < crowdSpots.length; i++) {
    const p = crowdSpots[i];
    _m.makeTranslation(p.x, p.y + Math.abs(Math.sin(t * (4 + cheer * 6) + crowdPhase[i])) * amp, p.z);
    crowd.setMatrixAt(i, _m);
  }
  crowd.instanceMatrix.needsUpdate = true;
}
// LED boards
const boardTex = canvasTex(1024, 64, (g, w, h) => {
  g.fillStyle = '#0d2a63'; g.fillRect(0, 0, w, h);
  g.font = '900 38px "Noto Sans TC", sans-serif'; g.textBaseline = 'middle';
  g.textAlign = 'center';
  for (let i = 0; i < 2; i++) { g.fillStyle = i % 2 ? '#8fe3ff' : '#fff6a8'; g.fillText(i % 2 ? 'ICE LEAGUE' : 'PENGUIN CUP', 256 + i * 512, h / 2 + 2); }
});
boardTex.wrapS = THREE.RepeatWrapping;
const boardMat = new THREE.MeshBasicMaterial({ map: boardTex });
function board(x, z, len, rotY) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(len, 0.8, 0.15), [toon(0x0c1424), toon(0x0c1424), toon(0x0c1424), toon(0x0c1424), boardMat, boardMat]);
  b.position.set(x, 0.4, z); b.rotation.y = rotY; scene.add(b);
}
board(0, -34.5, 40, 0); board(-18.6, -11, 46, Math.PI / 2); board(18.6, -11, 46, -Math.PI / 2);

// snow
const dotTex = canvasTex(64, 64, (g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,.7)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, w);
});
const starTex = canvasTex(64, 64, (g, w) => {

  // input
  let ix = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0) + stickV.x;
  let iz = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0) + stickV.y;
  const il = Math.hypot(ix, iz);
  if (il > 1) { ix /= il; iz /= il; }
  if (shootHeld) charge = Math.min(1, charge + dt * 1.3);
  player.stun = Math.max(0, player.stun - dt);
  const maxSpd = ball.owner === player ? 5.4 : 6.2;
  const targetSpd = player.stun > 0 ? 0 : Math.min(1, il) * maxSpd * (shootHeld ? 0.55 : 1);
  player.spd = lerp(player.spd, targetSpd, 1 - Math.exp(-10 * dt));
  if (il > 0.1 && player.stun <= 0) {
    const want = Math.atan2(ix, iz);
    let d = want - player.face; d = Math.atan2(Math.sin(d), Math.cos(d));
    player.face += d * (1 - Math.exp(-14 * dt));
  }
  const pf = fwd(player.face);
  const before = player.p.clone();
  if (il > 0.1) player.p.addScaledVector(V(ix, 0, iz).normalize(), player.spd * dt);
  player.p.x = clamp(player.p.x, -18.5, 18.5); player.p.z = clamp(player.p.z, -31.5, 13.5);
  if (ball.owner === player) gauge = Math.min(100, gauge + player.p.distanceTo(before) * 3.6);

  // special trigger
  if (specialPressed) {
    specialPressed = false;
    if (ball.owner === player && gauge >= 100) { startSpecial(); return; }
    else if (gauge < 100) toast('必殺技量表還沒滿！', '#bfe6ff');
    else toast('要先拿到球！', '#bfe6ff');
  }

  // ball
  if (ball.owner === player) {
    const target = player.p.clone().addScaledVector(pf, 0.58);
    ball.p.x = lerp(ball.p.x, target.x, 1 - Math.exp(-25 * dt));
    ball.p.z = lerp(ball.p.z, target.z, 1 - Math.exp(-25 * dt));
    ball.p.y = BALL_R;
    const roll = player.spd * dt / BALL_R;
    ballMesh.rotateOnWorldAxis(V(pf.z, 0, -pf.x).normalize(), roll);
    ball.v.set(0, 0, 0);
  } else {
    stepBall(dt);
    // pickup
    if (player.stun <= 0 && gameT - ball.lastKick > 0.25) {
      const fp = player.p.clone().addScaledVector(pf, 0.4);
      const hd = Math.hypot(fp.x - ball.p.x, fp.z - ball.p.z);
      if (hd < 0.75 && ball.p.y < 0.7 && ball.v.length() < 13) { ball.owner = player; }
    }
  }

  // defenders
  for (const d of defenders) {
    d.cd = Math.max(0, d.cd - dt);
    if (d.knocked) { d.knocked -= dt * 0.5; updateKnocked(d, dt); if (d.knocked <= 0) { d.knocked = 0; resetPose(d.pg); d.pg.root.position.y = 0; } continue; }
    let target;
    const bd = Math.hypot(ball.p.x - d.p.x, ball.p.z - d.p.z);
    if (ball.owner === player) {
      // press the carrier if close, otherwise hold a line between ball and goal
      const toGoal = V(0, 0, GOAL_Z).sub(ball.p).setY(0).normalize();
      target = bd < 6.5 ? ball.p.clone() : ball.p.clone().addScaledVector(toGoal, 4.5).add(V(d.home.x * 0.35, 0, 0));
    } else if (!ball.owner && bd < 6 && ball.v.length() < 10) target = ball.p.clone();
    else target = d.home.clone().add(V(ball.p.x * 0.25, 0, 0));
    if (target.z > -2) target.z = -2;
    const to = target.sub(d.p).setY(0); const dist = to.length();
    const spd = d.cd > 0 ? 2.2 : (ball.owner === player ? 4.3 : 4.8);
    d.spd = lerp(d.spd, dist > 0.15 ? spd : 0, 1 - Math.exp(-8 * dt));
    if (dist > 0.05) { d.p.addScaledVector(to.normalize(), Math.min(dist, d.spd * dt)); d.face = Math.atan2(to.x, to.z); }
    // tackle
    if (d.cd <= 0 && ball.owner === player && bd < 0.7) {
      const away = ball.p.clone().sub(d.p).setY(0).normalize();
      kick(away.add(V(rand(-0.5, 0.5), 0, 0.6)), 8, 2.5);
      player.stun = 0.55; d.cd = 1.6;
      toast('被抄截了！', '#ffc4c4');
    }
    // clear loose ball
    if (d.cd <= 0 && !ball.owner && bd < 0.55 && ball.p.y < 0.8) {
      kick(V(rand(-0.4, 0.4), 0, 1), 13, 4.5); d.cd = 1.2;
    }
  }
  // separation
  const all = [player, ...defenders, keeper];
  for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) {
    const a = all[i], b = all[j]; const dx = b.p.x - a.p.x, dz = b.p.z - a.p.z; const dd = Math.hypot(dx, dz);
    if (dd > 0.001 && dd < 0.85) { const push = (0.85 - dd) / 2; a.p.x -= dx / dd * push; a.p.z -= dz / dd * push; b.p.x += dx / dd * push; b.p.z += dz / dd * push; }
  }

  updateKeeper(dt);

  // camera
  setCam(V(player.p.x * 0.8, 7.2, player.p.z + 10.5), V(player.p.x * 0.85, 0.6, player.p.z - 6.5), 50);
}

function stepBall(dt) {
  const prevZ = ball.p.z;
  ball.v.y -= 18 * dt;
  ball.p.addScaledVector(ball.v, dt);
  if (ball.p.y < BALL_R) { ball.p.y = BALL_R; if (ball.v.y < -1.5) ball.v.y *= -0.45; else ball.v.y = 0; }
  if (ball.p.y <= BALL_R + 0.01) { const f = Math.exp(-1.3 * dt); ball.v.x *= f; ball.v.z *= f; }
  const hs = Math.hypot(ball.v.x, ball.v.z);
  if (hs > 0.01) ballMesh.rotateOnWorldAxis(V(ball.v.z, 0, -ball.v.x).normalize(), hs * dt / BALL_R);
  // posts
  for (const sx of [-1, 1]) {
    const dx = ball.p.x - sx * POST_X, dz = ball.p.z - GOAL_Z, d = Math.hypot(dx, dz);
    if (d < BALL_R + 0.08 && ball.p.y < BAR_Y) {
      const nx = dx / d, nz = dz / d, vn = ball.v.x * nx + ball.v.z * nz;
      if (vn < 0) { ball.v.x -= 1.7 * vn * nx; ball.v.z -= 1.7 * vn * nz; shake = 0.25; toast('中柱！', '#fff'); }
    }
  }
  // crossbar
  if (Math.abs(ball.p.x) < POST_X && Math.abs(ball.p.z - GOAL_Z) < BALL_R + 0.08 && Math.abs(ball.p.y - BAR_Y) < BALL_R + 0.08) {
    if (ball.v.z < 0) { ball.v.z *= -0.6; ball.v.y = Math.abs(ball.v.y) * 0.5; shake = 0.25; toast('中楣！', '#fff'); }
  }
  // goal?
  if (state === 'play' && prevZ >= GOAL_Z && ball.p.z < GOAL_Z && Math.abs(ball.p.x) < POST_X - BALL_R && ball.p.y < BAR_Y - BALL_R) {
    state = 'goal'; stateT = 0; goals++; updateScore(); cheer = 1; shake = 0.4;
    showGoal('漂亮的射門！');
  }
  // inside net
  if (ball.p.z < GOAL_Z && Math.abs(ball.p.x) < POST_X && ball.p.y < BAR_Y) {
    if (ball.p.z < NET_Z + BALL_R) { bulgeNet(ball.p.x, ball.p.y, Math.min(1, Math.abs(ball.v.z) * 0.06)); ball.p.z = NET_Z + BALL_R; ball.v.z *= -0.15; ball.v.x *= 0.4; }
    if (Math.abs(ball.p.x) > POST_X - BALL_R) { ball.p.x = Math.sign(ball.p.x) * (POST_X - BALL_R); ball.v.x *= -0.3; }
    if (ball.p.y > BAR_Y - BALL_R) { ball.p.y = BAR_Y - BALL_R; ball.v.y = 0; }
  }
  // out of play
  if (state === 'play') {
    const out = Math.abs(ball.p.x) > 17.3 || ball.p.z > 14 || (ball.p.z < GOAL_Z - 0.3 && !(Math.abs(ball.p.x) < POST_X && ball.p.y < BAR_Y));
    if (out) { ball.out += dt; if (ball.out > 0.6) resetPlay(ball.p.z < GOAL_Z ? '球門球，重新開始' : '出界，重新開始'); }
    else ball.out = 0;
  }
  if (!Number.isFinite(ball.p.x + ball.p.y + ball.p.z)) { errors.push('ball NaN'); ball.p.set(0, BALL_R, 0); ball.v.set(0, 0, 0); }
}

function updateKeeper(dt) {
  const kp = keeper;
  if (kp.knocked) return;
  const incoming = !ball.owner && ball.v.z < -6 && ball.p.z < -12 && ball.p.z > GOAL_Z;
  if (incoming && !kp.decided) {
    kp.decided = true;
    const tt = (ball.p.z - GOAL_Z) / -ball.v.z;
    const cx = ball.p.x + ball.v.x * tt;
    let cy = ball.p.y + ball.v.y * tt - 9 * tt * tt; cy = Math.max(BALL_R, cy);
    const onTarget = Math.abs(cx) < POST_X && cy < BAR_Y;
    const spd = ball.v.length();
    let chance = clamp(1.25 - spd / 30, 0.12, 0.85);
    if (Math.abs(cx) > 2.4) chance *= 0.55;
    if (cy > 1.7) chance *= 0.7;
    kp.save = onTarget && Math.random() < chance;
    kp.tx = kp.save ? cx : cx - Math.sign(cx || 1) * rand(0.9, 1.5);
    kp.diveDir = Math.sign(kp.tx - kp.p.x) || 1;
    kp.dive = Math.abs(kp.tx - kp.p.x) > 0.7 ? 0.0001 : 0;
  }
  if (!incoming && ball.v.z > -2) kp.decided = false;
  if (kp.dive > 0) {
    kp.dive += dt;
    const k = clamp(kp.dive / 0.35, 0, 1);
    kp.p.x = lerp(kp.p.x, kp.tx, 1 - Math.exp(-14 * dt));
    kp.pg.root.position.y = Math.sin(k * Math.PI) * 0.5;
    kp.pg.root.rotation.z = -kp.diveDir * easeOut(k) * 1.3;
    if (kp.dive > 1.1) { kp.dive = 0; kp.pg.root.rotation.z = 0; kp.pg.root.position.y = 0; }
  } else {
    const tx = clamp(ball.p.x * 0.45, -2.6, 2.6);
    kp.p.x = lerp(kp.p.x, tx, 1 - Math.exp(-4 * dt));
  }
  kp.p.z = -29.3;
  // save contact
  if (!ball.owner && kp.save && ball.v.z < 0) {
    const kx = kp.p.x, dx = Math.abs(ball.p.x - kx), dz = Math.abs(ball.p.z - kp.p.z);
    if (dz < 0.5 && dx < 1.5 && ball.p.y < 2.2) {
      ball.v.set(rand(-4, 4), 4, Math.abs(ball.v.z) * 0.35); kp.save = false; kp.decided = true;
      toast('被撲出去了！', '#ffe9a8'); gauge = Math.min(100, gauge + 14); shake = 0.2;
    }
  }
}

function updateScore() { $('#sGoal').textContent = goals; $('#sSpecial').textContent = specialGoals; }

// ---------- main loop ----------
const clock = new THREE.Clock();
let fpsAcc = 0, fpsN = 0, fps = 60;
function frame() {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, clock.getDelta());
  fpsAcc += rdt; fpsN++; if (fpsAcc > 1) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  let dt = rdt;
  gameT += rdt;
  if (state !== 'play') specialPressed = false;
  if (state === 'special') { dt = rdt * specialRate(S.t); S.t += dt; updateSpecial(dt); }
  else if (state === 'play') updatePlay(dt);
  else if (state === 'goal') {
    stateT += dt; stepBall(dt);
    setCam(V(player.p.x * 0.5, 5, -17), V(ball.p.x * 0.5, 0.8, -29), 50);
    if (stateT > 2.4) resetPlay();
  }
  // penguin visuals (non-scripted)
  if (state !== 'special') {
    const pg = player.pg; pg.root.position.copy(player.p); pg.root.rotation.y = player.face; animPenguin(pg, dt, player.spd);
    if (player.stun > 0) pg.pivot.rotation.z = Math.sin(gameT * 30) * 0.25;
    for (const d of defenders) if (!d.knocked) { d.pg.root.position.copy(d.p); d.pg.root.rotation.y = d.face; animPenguin(d.pg, dt, d.spd); }
    const kp = keeper.pg; kp.root.position.x = keeper.p.x; kp.root.position.z = keeper.p.z; kp.root.rotation.y = 0; animPenguin(kp, dt, 0.5);
    kp.flippers[0].rotation.z = -0.9; kp.flippers[1].rotation.z = 0.9;
  } else {
    for (const d of defenders) if (!d.knocked) { d.pg.root.position.copy(d.p); animPenguin(d.pg, 0, 0); }
  }
  ballMesh.position.copy(ball.p);
  ballShadow.position.set(ball.p.x, 0.012, ball.p.z);
  ballShadow.material.opacity = 0.3 / (1 + ball.p.y * 0.8);
  glow.update(dt); stars.update(dt); updateShards(dt); updateRings(dt); updateNet(rdt);
  if (crack.visible) { crack.material.opacity = Math.max(0, crack.material.opacity - dt * (state === 'special' && S.t < 3 ? 0.05 : 0.6)); if (crack.material.opacity <= 0) crack.visible = false; }
  updateSnow(dt, gameT); updateCrowd(gameT, rdt);
  if (state !== 'special') speedI = Math.max(0, speedI - rdt * 3);
  drawSpeed(rdt);
  // camera
  shake = Math.max(0, shake - rdt * 2.2);
  const cut = state === 'special';
  const k = cut ? 1 : 1 - Math.exp(-6 * rdt);
  camera.position.lerp(camPos, k);
  if (!camera.userData.look) camera.userData.look = camLook.clone();
  camera.userData.look.lerp(camLook, k);
  const sh = shake * shake * 0.35;
  camera.position.add(V(rand(-sh, sh), rand(-sh, sh), rand(-sh, sh)));
  camera.lookAt(camera.userData.look);
  // HUD
  $('#gFill').style.width = gauge + '%';
  const full = gauge >= 100;
  $('#gaugeBox').classList.toggle('full', full);
  $('#gLabel').textContent = full ? (document.body.classList.contains('touch') ? '必殺技準備完成！按「必殺」' : '必殺技準備完成！按 E 發動【冰河皇帝砲】') : '必殺技量表 — 帶球跑動來累積';
  $('#charge').style.opacity = shootHeld && state === 'play' ? 1 : 0;
  $('#cFill').style.width = (charge * 100) + '%';
  renderer.render(scene, camera);
}
resetPlay();
camera.position.copy(camPos); camera.lookAt(camLook);
frame();

// debug / test hooks
window.__pk = {
  get state() { return state; }, get st() { return S.t; }, get gauge() { return gauge; }, get goals() { return goals; }, get specialGoals() { return specialGoals; },
  get fps() { return fps; }, errors, ball, player,
  fill() { gauge = 100; }, special() { gauge = 100; ball.owner = player; specialPressed = true; },
  give() { ball.owner = player; },
};
</script>
</body>
</html>
