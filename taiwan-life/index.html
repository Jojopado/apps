<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣人生模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：上方人生紀錄（逐年往下長）；遇到抉擇時，年齡停下，選擇卡從下方滑上來（左／右／下三個選項），選完顯示結果再繼續 */
:root{
  --board:#17423f;      /* 教室黑板綠 */
  --board-2:#1f544f;
  --board-3:#2a6660;
  --paper:#fbfaf5;
  --paper-2:#eef1ec;
  --ink:#1d2b2a;
  --ink-soft:#5d6f6c;
  --chalk:#d9e6e2;
  --chalk-dim:#8fb0aa;
  --taxi:#f2c230;       /* 計程車黃 */
  --danger:#ef7a64;
  --good:#2f8f6b;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--chalk);font-family:var(--f-body);font-size:14px;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px;position:relative}

.who-am-i{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--chalk-dim)}
.who-am-i b{font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--paper)}

/* 人生紀錄 */
.feed{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;scroll-behavior:smooth}
.yr{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.yr .a{font-family:var(--f-display);font-size:15px;color:var(--taxi);text-align:right;font-variant-numeric:tabular-nums;padding-top:1px;line-height:1.2}
.yr .a small{display:block;font-size:10px;color:var(--chalk-dim);font-family:var(--f-body)}
.yr .t{display:flex;flex-direction:column;gap:3px;line-height:1.55;min-width:0}
.yr .t span.big{color:var(--paper);font-weight:700}
.yr .t span.stat{font-size:12px;color:var(--chalk-dim)}
.yr .t span.sad{color:var(--danger)}
.yr .t span.hist{color:#9fd3c7}
.yr .t span.why{font-size:12px;color:var(--taxi)}
.yr .t span.pick{color:var(--paper)}
.yr .t span.pick::before{content:"✔ ";color:var(--taxi)}
.ahead{color:var(--taxi);font-size:13px;padding-left:58px;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}

/* 年齡進度條 */
.clock{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--board-2);border-radius:16px;padding:10px 12px}
.clock .age{font-family:var(--f-display);font-size:28px;color:var(--paper);font-variant-numeric:tabular-nums;min-width:70px;line-height:1.1}
.clock .age small{font-size:13px;color:var(--chalk-dim);margin-left:2px}
.clock .age i{display:block;font-style:normal;font-size:11px;color:var(--chalk-dim);font-family:var(--f-body)}
.track{position:relative;height:10px;border-radius:5px;background:var(--board)}
.track b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--taxi);transition:width .4s linear}
.track i{position:absolute;top:-3px;width:2px;height:16px;background:var(--chalk-dim);opacity:.6}
.track em{position:absolute;top:14px;font-size:10px;color:var(--chalk-dim);font-style:normal;transform:translateX(-50%);white-space:nowrap}
.ctrl{display:flex;gap:6px}
.ctrl button{font:inherit;font-size:13px;border:0;border-radius:10px;padding:8px 10px;background:var(--board-3);color:var(--paper);cursor:pointer;min-width:40px}
.ctrl button.on{background:var(--taxi);color:var(--ink)}
button:focus-visible{outline:3px solid var(--taxi);outline-offset:2px}

/* 下方抉擇區（取代年齡條） */
.sheet-wrap{flex:0 0 auto;height:min(60%,430px);display:flex;align-items:stretch;justify-content:center;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.card{position:relative;width:100%;background:var(--paper);color:var(--ink);
  border-radius:20px;box-shadow:0 -6px 26px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;
  cursor:grab;display:grid;grid-template-columns:52px 1fr 52px;grid-template-rows:1fr auto;will-change:transform}
.card.dragging{cursor:grabbing}
.opt{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;line-height:1.35;color:var(--ink);
  padding:8px 4px;border-radius:12px;margin:6px;transition:background .12s,opacity .12s;cursor:pointer;text-align:center;background:var(--paper-2)}
.opt .arr{font-weight:700}
.opt .hint{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
.opt.d{grid-column:1/4;grid-row:2;flex-direction:column;gap:0}
.opt.l,.opt.r{grid-row:1;flex-direction:column;gap:6px}
.opt.l .lab,.opt.r .lab{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.05em}
.opt.l .hint,.opt.r .hint{writing-mode:horizontal-tb;font-size:10px;line-height:1.3}
.opt.l{grid-column:1}
.opt.r{grid-column:3}
.card.peek .opt{opacity:.35}
.opt.on{background:var(--taxi);opacity:1!important;font-weight:700}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.body{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:14px 2px 4px;min-width:0}
.face{font-size:46px;line-height:1}
.who{font-family:var(--f-display);font-size:14px;background:var(--board);color:var(--paper);padding:3px 12px;border-radius:999px}
.say{font-family:var(--f-display);font-size:17px;line-height:1.5;text-wrap:balance}
.fact{font-size:11px;color:var(--ink-soft);line-height:1.45}
.result{width:100%;background:var(--paper);color:var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 26px rgba(0,0,0,.35);overflow:auto}
.result .k{font-size:12px;letter-spacing:.12em;color:var(--ink-soft)}
.result .picked{font-family:var(--f-display);font-size:19px}
.result .out{font-size:15px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink)}
.chip.up{background:#dcefe5;color:#1d5b44}
.chip.down{background:#f6ddd6;color:#8a3420}
.chip.luck{background:#f7ecc4;color:#6b5306}
.result .later{font-size:12px;color:var(--ink-soft);line-height:1.5}
.result button{margin-top:auto;flex:0 0 auto}

/* 全頁畫面 */
.screen{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.panel h1,.panel h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.panel h1{font-size:28px}
.panel h2{font-size:20px}
.panel p{margin:0;line-height:1.65}
.kicker{font-size:12px;letter-spacing:.15em;color:var(--ink-soft)}
.eras{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.era{font:inherit;text-align:left;border:1.5px solid var(--paper-2);background:var(--paper-2);border-radius:14px;padding:12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.era b{font-family:var(--f-display);font-weight:400;font-size:20px}
.era span{font-size:12px;color:var(--ink-soft);line-height:1.45}
.era:hover{border-color:var(--taxi)}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;border:1.5px dashed var(--ink-soft);border-radius:12px;padding:12px 14px;margin:0}
.idcard dt{color:var(--ink-soft)}
.idcard dd{margin:0;font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button.big{font-family:var(--f-display);font-size:17px;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--taxi);color:var(--ink);flex:1;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink-soft)}
.cmp{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.cmp li{display:grid;grid-template-columns:64px 1fr;gap:10px;font-size:14px;line-height:1.55}
.cmp li b{color:var(--ink-soft);font-weight:700;font-size:13px}
.cmp li small{display:block;color:var(--ink-soft);font-size:12px}
.people{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.people li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;font-size:14px;line-height:1.5}
.people li .ic{font-size:24px;line-height:1.2}
.people li small{display:block;color:var(--ink-soft);font-size:12px}
.alt{border-radius:14px;background:var(--paper-2);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.alt .q{font-size:13px;color:var(--ink-soft)}
.alt .q b{color:var(--ink)}
.alt .sum{font-family:var(--f-display);font-size:16px;line-height:1.5}
.alt ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55;color:var(--ink)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.timeline li{display:grid;grid-template-columns:40px 1fr;gap:8px;line-height:1.5}
.timeline .y{font-variant-numeric:tabular-nums;color:var(--ink-soft);text-align:right}
.src{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.55}
.src a{color:#1f6f66;word-break:break-all}
.small{font-size:13px;color:var(--ink-soft)}
.title-badge{align-self:flex-start;background:var(--board);color:var(--paper);font-family:var(--f-display);padding:4px 12px;border-radius:999px;font-size:15px}
@media (prefers-reduced-motion:reduce){.yr,.sheet-wrap,.ahead{animation:none}.track b{transition:none}.feed{scroll-behavior:auto}}
</style>
</head>

// ---- 讀資料的小工具（找不到就用預設值，並記下來顯示在資料來源頁） ----
const MISSING=new Set();
function V(key,def){const o=DATA[key];if(o&&o.value!=null)return o.value;MISSING.add(key);return def}
function srcOf(key){const o=DATA[key];return o?{year:o.year,source:o.source,url:o.url,estimate:o.estimate,note:o.note}:null}

const $=s=>document.querySelector(s);
const rnd=Math.random;
const pick=a=>a[Math.floor(rnd()*a.length)];
const arr=x=>x==null?[]:Array.isArray(x)?x:[x];
const val=(x,...a)=>typeof x==='function'?x(...a):x;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>(x*100).toFixed(x<0.1?1:0)+'%';
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const strip=s=>String(s).replace(/<[^>]+>/g,'');
function weighted(list,key='share'){const tot=list.reduce((t,x)=>t+(x[key]||0),0);let r=rnd()*tot;for(const x of list){r-=x[key]||0;if(r<=0)return x}return list[list.length-1]}

/* ======= 出生年代 =======
 * 年代會改變：升學考試名稱（高中聯考→基測→會考；大學聯考→學測指考→學測分科）、兵役年限、
 * 會遇到的歷史事件。生命表、死因等統計一律用最新一年（簡化，資料來源頁有註明）。 */
const ERAS=[
 {y:1950,blurb:'九年國教還沒開始，小學畢業要考初中；長大遇上經濟起飛。'},
 {y:1970,blurb:'國中畢業考高中聯考、大學聯考；29 歲遇上 921 大地震。'},
 {y:1990,blurb:'國三考基測、高三考學測指考；畢業時遇上金融海嘯。'},
 {y:2010,blurb:'國三考會考、高三考學測分科；今日的台灣。'},
];
const NAMES={ // 各年代隨機取名用（只是常見名字，不代表統計排名）
 1950:{m:['志明','俊雄','文雄','金龍','明德','國華'],f:['美玲','秀英','淑貞','玉蘭','麗華','月娥']},
 1970:{m:['志偉','建宏','俊傑','家明','志豪','文彬'],f:['淑芬','雅惠','美惠','靜宜','惠雯','佩君']},
 1990:{m:['家豪','冠宇','承翰','宗翰','冠廷','柏翰'],f:['怡君','雅婷','佳穎','欣怡','郁婷','詩涵']},
 2010:{m:['承恩','宥廷','品睿','宇恩','柏宇','睿恩'],f:['品妍','子涵','詠晴','宜蓁','芯語','語彤']},
};
const SURN=['陳','林','黃','張','李','王','吳','劉','蔡','楊','許','鄭','謝','郭'];
function newName(year,sex){const k=year<1960?1950:year<1980?1970:year<2000?1990:2010;return pick(SURN)+pick(NAMES[k][sex==='男'?'m':'f'])}
const given=n=>n.slice(1);

// ---- 從統計資料推出來的數字 ----
function qx(sex,age){
  const t=V('life_table',null);
  const a=Math.min(Math.max(age,0),100);
  if(t&&t[sex==='男'?'male':'female']) return t[sex==='男'?'male':'female'][a]??0.5;
  return Math.min(0.6,0.00005*Math.exp(0.09*a)+(a===0?0.004:0));
}
function survival(sex,age){let s=1;for(let a=0;a<age;a++)s*=1-qx(sex,a);return s}
function lifeExp(sex){const e=V('life_expectancy',{male:77.4,female:84.0,total:80.6});return sex==='男'?e.male:e.female}
function neverMarried(sex,age){
  const t=V('never_married_by_age',null);if(!t)return null;
  const g=t[sex==='男'?'male':'female'];const k=Object.keys(g).find(r=>{const [a,b]=r.split('-').map(Number);return age>=a&&age<=b});
  return k?g[k]:null;
}
// 每年「開始一段認真感情」的機率：用各年齡層未婚比例的下降速度換算；早年代的人比較早結婚，往前挪幾歲
function meetHazard(G){
  const shift=G.birthYear<1960?5:G.birthYear<1980?3:0;
  const age=G.age+shift,sex=G.sex;
  const t=V('never_married_by_age',null);
  if(t){
    const g=t[sex==='男'?'male':'female'];const ks=Object.keys(g).sort();
    for(let i=0;i<ks.length-1;i++){const [a,b]=ks[i].split('-').map(Number);
      if(age>=a-3&&age<=b-3){const h=1-Math.pow(g[ks[i+1]]/g[ks[i]],1/5);return Math.min(.5,Math.max(.03,h*2.2))}}
  }
  return age<22?.06:age<35?.15:age<45?.07:.03;
}
function salaryFor(G){
  const s=V('salary',{median_annual_total_salary:520000});
  const base=s.median_annual_total_salary||520000;
  const m={none:.75,uni:1,master:1.3,phd:1.4}[G.edu]||1;
  return base*m*(G.flags.has('tech')?1.4:1)*(G.flags.has('civil')?1.05:1);
}

function cancerRate(age){
  const c=V('cancer',{new_cases_per_year:130000});
  const base=(c.new_cases_per_year||130000)/23300000;
  return Math.min(.04,base*(age<40?.25:age<50?.7:age<60?1.4:age<70?2.4:3.2));
}

function meet(G,role,rel,opts={}){
  if(G.chars[role]) return G.chars[role];
  const sex=opts.sex||(opts.opposite?(G.sex==='男'?'女':'男'):(rnd()<.5?'男':'女'));
  G.chars[role]={role,rel,name:opts.name||newName(G.birthYear+(opts.dy||0),sex),sex,ageDiff:opts.ageDiff??0,metAt:G.age};
  return G.chars[role];
}

// 官方死因名稱太長，顯示時拿掉括號說明
const cleanCause=c=>/惡性腫瘤/.test(c)?'癌症':c.replace(/[（(].*?[)）]/g,'');
function deathCause(G){
  if(G.flags.has('cancer')&&rnd()<.6) return '癌症';
  if(G.age<35&&rnd()<.6) return '事故傷害';
  const list=V('death_causes',null);
  if(!list) return pick(['心臟疾病','肺炎','腦血管疾病','糖尿病']);
  // 癌症另外用「確診癌症」事件模擬，所以這裡不再抽到癌症
  const ok=list.filter(x=>!/自殺|自傷|惡性腫瘤/.test(x.cause)&&x.cause!=='其他');
  return cleanCause(weighted(ok).cause);
}
function newLife(era){
  const c=weighted(cityList());
  const sr=V('sex_ratio_at_birth',107);
  const sex=rnd()<sr/(sr+100)?'男':'女';
  const fam=pick(['富裕','小康','小康','辛苦']);
  const birthYear=era+Math.floor(rnd()*10);
  const G={age:-1,birthYear,era,city:c.city.replace(/臺/g,'台'),sex,fam,flags:[],once:[],log:[],choices:[],why:{},chars:{},
     healthMul:1,payMul:1,wealth:fam==='富裕'?2:fam==='辛苦'?-1:0,edu:'none',kids:0,kidNames:[],lastKidAt:-9,kidAt:null};
  const momAt=Math.round(V('fertility',{mean_age_first_birth_mother:31.8}).mean_age_first_birth_mother-(era<1980?6:0)+(rnd()+rnd()+rnd()-1.5)*5);
  G.parents=[{name:'媽媽',sex:'女',age0:momAt},{name:'爸爸',sex:'男',age0:momAt+pick([0,1,2,2,3,4])}];
  return revive(G);
}
// structuredClone 之後把陣列換回 Set
function revive(G){G.flags=new Set(G.flags);G.once=new Set(G.once);if(G.fam==='辛苦')G.flags.add('poor');return G}
function cloneG(G){const c=structuredClone({...G,flags:[...G.flags],once:[...G.once]});return revive(c)}

// 這一年發生的事：回傳自動事件的文字、要玩家選的抉擇
function yearEvents(G){
  const lines=[],choices=[];
  for(const e of EV){
    if(e.once&&G.once.has(e.once)) continue;
    if(!e.at(G)) continue;
    if(e.p!=null&&rnd()>=val(e.p,G)) continue;
    if(e.once) G.once.add(e.once);
    if(e.choice){if(e.set)arr(e.set).forEach(f=>G.flags.add(f));choices.push(e);continue}
    const out=val(e.log,G);
    if(e.set) arr(e.set).forEach(f=>G.flags.add(f));
    if(e.unset) arr(e.unset).forEach(f=>G.flags.delete(f));
    if(e.fx) e.fx(G);
    lines.push(out);
  }
  return {lines:lines.flat().filter(Boolean),choices};
}
function hasNeed(G,n){return typeof n==='function'?n(G):G.flags.has(n)}
function resolveOpt(G,o){if(!o)return null;if(o.need&&!hasNeed(G,o.need))o=o.alt;return o}
function choiceOf(G,e){return val(e.choice,G)}
// 套用選項：回傳寫進紀錄的文字
function applyOpt(G,o){
  const p=o.chance?val(o.chance.p,G):1;
  const r=o.chance?(rnd()<p?o.chance.ok:o.chance.ng):o;
  const t=strip(val(o.t,G));
  const before=new Set(G.flags);
  if(o.chance){arr(o.set).forEach(f=>G.flags.add(f));if(o.fx)o.fx(G)}
  arr(r.set).forEach(f=>G.flags.add(f));
  arr(r.unset).forEach(f=>G.flags.delete(f));
  const line=val(r.log,G);   // 先寫紀錄再套效果，讓「第一個孩子」等文字正確
  if(r.fx) r.fx(G);
  for(const f of G.flags) if(!before.has(f)&&!G.why[f]) G.why[f]={age:G.age,t};
  G.choices.push({age:G.age,t});
  return line;
}
function deadThisYear(G){
  let q=qx(G.sex,G.age)*G.healthMul;
  if(G.age<1) q=Math.min(q,0.004);
  return rnd()<q||G.age>=110;
}
// 從某個時間點開始，不經畫面一路模擬到死（平行人生用；之後的抉擇隨機選）
function simulateRest(G){
  for(let guard=0;guard<130;guard++){
    if(deadThisYear(G)){G.cause=deathCause(G);G.deathAge=G.age;return G}
    G.age++;
    const {lines,choices}=yearEvents(G);
    lines.forEach(l=>G.log.push({age:G.age,t:strip(l)}));
    for(const e of choices){const ch=choiceOf(G,e);if(ch.pre)ch.pre(G);if(e.pre)e.pre(G);val(ch.say,G);const o=resolveOpt(G,ch[pick(['l','r','d'])]);G.log.push({age:G.age,t:strip(applyOpt(G,o))})}
  }
  G.cause='衰老';G.deathAge=G.age;return G;
}

/* ======= 選項影響的小標籤 ======= */
const FLAG_LABEL={hs:'📘 普通高中',voc:'🔧 高職',jc:'📗 五專',jhs:'📘 念初中',uni:'🎓 上大學',master_ing:'🎓 讀研究所',phd_ing:'🎓 讀博士',done:'💼 開始工作',worker:'💼 提早賺錢',
  tech:'💻 科技業',civil:'🏛️ 公務員',prof:'🎓 教授',army:'🪖 當兵',soldier:'🎖️ 職業軍人',career_mil:'🎖️ 長期從軍',police:'👮 警察',partner:'💞 交往',married:'💍 結婚',
  house:'🏠 有房',car:'🚗 有車',abroad:'✈️ 出國經驗',cat:'🐱 養貓',dog:'🐶 養狗',skill:'🔧 一技之長',english:'🗣️ 英文',coder:'💻 寫程式',gym:'💪 運動習慣',scooter:'🛵 機車',
  nokid:'🚫 不生小孩',divorced:'💔 離婚',manager:'📈 升官',shop:'🏪 開店',boss:'🏢 當老闆',brave:'🦸 勇敢',honest:'😇 誠實',leader:'📣 當幹部',firstlove:'💌 初戀',
  closeKid:'🤗 親子關係變好',coldKid:'🧊 親子關係變差',mountain:'⛰️ 爬山',speech:'🏅 得獎',early:'🏭 提早出社會',family:'🏡 幫家裡',retired:'🎣 退休生活',myopia:'👓 近視',sci:'🧪 自然組',cram:'📚 補習'};
const LOSS_LABEL={partner:'💔 分手',married:'💔 婚姻結束',soldier:'🎖️ 退伍'};
function diffChips(a,b){
  const out=[];
  for(const f of b.flags) if(!a.flags.has(f)&&FLAG_LABEL[f]) out.push({t:FLAG_LABEL[f],c:'up'});
  for(const f of a.flags) if(!b.flags.has(f)&&LOSS_LABEL[f]) out.push({t:LOSS_LABEL[f],c:'down'});
  const h=b.healthMul/a.healthMul;
  if(h<.995) out.push({t:'❤️ 健康變好',c:'up'}); else if(h>1.5) out.push({t:'⚠️ 健康大幅變差',c:'down'}); else if(h>1.005) out.push({t:'🩹 健康變差',c:'down'});
  const p=b.payMul/a.payMul; if(p>1.005) out.push({t:'💵 收入變多',c:'up'}); else if(p<.995) out.push({t:'💵 收入變少',c:'down'});
  const w=b.wealth-a.wealth; if(w>0) out.push({t:'💰 存款變多',c:'up'}); else if(w<0) out.push({t:'💸 存款變少',c:'down'});
  if(b.kids>a.kids) out.push({t:'👶 多了一個孩子',c:'up'});
  if(b.edu!==a.edu&&b.edu!=='none') out.push({t:{uni:'🎓 學士',master:'🎓 碩士',phd:'🎓 博士'}[b.edu],c:'up'});
  return out;
}
// 選之前預覽：碰運氣的選項顯示機率；其他的實際試算一次
function previewChips(G,o){
  if(o.chance){const p=val(o.chance.p,G);const pre=arr(o.set).filter(f=>FLAG_LABEL[f]).map(f=>({t:FLAG_LABEL[f],c:'up'}));return [{t:`🎲 ${Math.round(p*100)}% 成功`,c:'luck'},...pre]}
  const g=cloneG(G);applyOpt(g,o);
  const d=diffChips(G,g);
  return d.length?d:[{t:'📝 留下回憶',c:''}];
}

/* ======= 畫面與節奏 ======= */
let G=null,pending=[],cur=null,locked=false,paused=false,speed=1,tickTimer=null,keySnaps=[];
const SPEEDS=[{n:'1x',ms:900},{n:'2x',ms:450},{n:'4x',ms:200}];
function schedule(ms){clearTimeout(tickTimer);if(paused)return;tickTimer=setTimeout(tick,ms??SPEEDS[speed-1].ms)}
function stopTicking(){clearTimeout(tickTimer);tickTimer=null}

function addYear(age,lines,cls){
  lines=arr(lines).flat().filter(Boolean);
  if(!lines.length) return;
  const feed=$('#feed');if(!feed) return;
  let row=feed.querySelector(`[data-age="${age}"]`);
  if(!row){row=document.createElement('div');row.className='yr';row.dataset.age=age;row.innerHTML=`<div class="a">${age}<small>${G.birthYear+age}</small></div><div class="t"></div>`;feed.appendChild(row)}
  const t=row.querySelector('.t');
  lines.forEach(l=>{const s=document.createElement('span');if(/^<span/.test(l))s.innerHTML=l;else{s.textContent=strip(l);if(cls)s.className=cls}t.appendChild(s)});
  feed.scrollTop=feed.scrollHeight;
  lines.forEach(l=>{const p=strip(l);if(!/^📊/.test(p)&&!/^📎/.test(p))G.log.push({age,t:p})});
}

function tick(){
  if(paused||cur||locked) return;
  G.age++;
  paintClock();
  const {lines,choices}=yearEvents(G);
  addYear(G.age,lines);
  if(choices.length){
    pending=choices;
    // 先讓玩家看完這一年，再跳出抉擇
    const feed=$('#feed');const h=document.createElement('div');h.className='ahead';h.id='ahead';h.textContent='⚡ 人生抉擇⋯⋯';feed.appendChild(h);feed.scrollTop=feed.scrollHeight;
    locked=true;setTimeout(()=>{locked=false;const a=$('#ahead');if(a)a.remove();nextChoice()},1300);
    return;
  }
  endOfYear();
}
function endOfYear(){
  if(deadThisYear(G)) return die();
  schedule();
}
function nextChoice(){
  if(!pending.length){endOfYear();return}
  const e=pending.shift();
  const ch=choiceOf(G,e);
  if(ch.pre)ch.pre(G);if(e.pre)e.pre(G);
  if(e.key) keySnaps.push({snap:cloneG(G),e,ch,age:G.age});
  showChoice(e,ch);
}

function showChoice(e,ch){
  const say=val(ch.say,G),who=val(ch.who,G),fact=val(ch.fact,G);
  const opts={l:resolveOpt(G,ch.l),r:resolveOpt(G,ch.r),d:resolveOpt(G,ch.d)};
  cur={e,ch,opts};
  const hint=o=>previewChips(G,o).filter(c=>c.c).slice(0,3).map(c=>c.t).join('　');
  const lab=(k,a)=>`<div class="opt ${k}" data-k="${k}" tabindex="0"><span class="lab"><span class="arr">${a}</span> ${esc(strip(val(opts[k].t,G)))}</span><span class="hint">${esc(hint(opts[k]))}</span></div>`;
  $('#clock').hidden=true;
  const w=$('#sheet');w.hidden=false;
  w.innerHTML=`<div class="card" id="card">${lab('l','←')}
    <div class="body"><div class="face">${ch.face}</div><div class="who">${esc(who)}</div><div class="say">${esc(say)}</div>${fact?`<div class="fact">${esc(fact)}</div>`:''}</div>
    ${lab('r','→')}${lab('d','↓')}</div>`;
  w.classList.remove('sheet-wrap');void w.offsetWidth;w.classList.add('sheet-wrap');
  bindCard($('#card'));
}
function bindCard(el){
  let sx=0,sy=0,dragging=false,dir=null;
  const TH=36,GO=90;
  const setPeek=k=>{dir=k;el.classList.toggle('peek',!!k);el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.dataset.k===k))};
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.opt')&&e.pointerType==='mouse') return;
    dragging=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.classList.add('dragging');el.style.transition='none';
  });
  el.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const dx=e.clientX-sx,dy=Math.max(0,e.clientY-sy); // 不能往上滑
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/22}deg)`;
    let k=null;
    if(Math.hypot(dx,dy)>TH) k=Math.abs(dx)>=dy?(dx<0?'l':'r'):'d';
    if(k!==dir) setPeek(k);
  });
  const up=e=>{
    if(!dragging) return;
    dragging=false;el.classList.remove('dragging');
    const dx=e.clientX-sx,dy=Math.max(0,e.clientY-sy);
    if(dir&&Math.hypot(dx,dy)>GO){choose(dir);return}
    el.style.transition='transform .2s';el.style.transform='';setPeek(null);
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.querySelectorAll('.opt[data-k]').forEach(o=>{
    o.addEventListener('mouseenter',()=>setPeek(o.dataset.k));
    o.addEventListener('mouseleave',()=>setPeek(null));
    o.addEventListener('click',()=>choose(o.dataset.k));
    o.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(o.dataset.k)}});
  });
}
function choose(k){
  if(!cur||locked||!cur.opts[k]) return;
  locked=true;
  const o=cur.opts[k];
  const before=cloneG(G);
  const line=applyOpt(G,o);
  const chips=diffChips(before,G);
  const snap=keySnaps.length&&keySnaps[keySnaps.length-1];
  if(snap&&snap.e===cur.e&&snap.picked==null) snap.picked=k;
  const el=$('#card');
  const v={l:[-1,0],r:[1,0],d:[0,1]}[k];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.style.transition=reduce?'none':'transform .25s ease-in,opacity .25s';
  el.style.transform=`translate(${v[0]*600}px,${v[1]*500}px) rotate(${v[0]*20}deg)`;el.style.opacity='0';
  const picked=strip(val(o.t,G));
  cur=null;
  setTimeout(()=>{
    addYear(G.age,[`<span class="pick">${esc(strip(line))}</span>`]);
    showResult(picked,line,chips);
  },reduce?0:260);
}
function showResult(picked,line,chips){
  const w=$('#sheet');
  w.innerHTML=`<div class="result" role="dialog" aria-label="選擇結果">
    <div class="k">${G.age} 歲・你選了</div>
    <div class="picked">「${esc(picked)}」</div>
    <div class="out">${esc(strip(line))}</div>
    <div class="chips">${(chips.length?chips:[{t:'📝 留下一段回憶',c:''}]).map(c=>`<span class="chip ${c.c}">${esc(c.t)}</span>`).join('')}</div>
    <div class="later">這個選擇會影響之後遇到的事、回顧裡的人生，也會出現在「平行人生」裡。</div>
    <button class="big" id="cont">繼續 ▶</button></div>`;
  w.classList.remove('sheet-wrap');void w.offsetWidth;w.classList.add('sheet-wrap');
  const go=()=>{w.hidden=true;w.innerHTML='';$('#clock').hidden=false;locked=false;
    if(pending.length){setTimeout(nextChoice,350)}else endOfYear()};
  $('#cont').onclick=go;$('#cont').focus();
}

function die(){
  stopTicking();
  G.cause=deathCause(G);G.deathAge=G.age;
  addYear(G.age,[`<span class="sad">${G.age} 歲，你因為${G.cause}離開了人世。</span>`]);
  setTimeout(showReview,1800);
}

function paintClock(){
  $('#age').innerHTML=`${Math.max(0,G.age)}<small>歲</small><i>${G.birthYear+Math.max(0,G.age)} 年</i>`;
  $('#bar').style.width=Math.min(100,Math.max(0,G.age))+'%';
}

/* ======= 人生回顧 ======= */
function lifeTitle(G){
  const F=G.flags;
  if(F.has('career_mil')) return '保家衛國的軍人';
  if(F.has('prof')) return '教授人生';
  if(F.has('police')) return '人民保母';
  if(F.has('boss')) return '白手起家的老闆';
  if(F.has('civil')) return '安穩的公務員人生';
  if(F.has('early')&&F.has('house')) return '從學徒拚出一個家';
  if(F.has('tech')&&G.kids>=2) return '竹科工程師爸媽';
  if(F.has('tech')) return '科技業打拚的一生';
  if(F.has('abroad')&&!F.has('married')) return '說走就走的旅人';
  if(F.has('skill')) return '靠手藝吃飯的職人';
  if(G.kids>=3) return '熱鬧的大家庭';
  if(F.has('widowed')) return '思念另一半的晚年';
  if(F.has('married')&&G.kids>0) return '平凡而完整的一生';
  if(F.has('divorced')) return '跌倒又站起來的人生';
  if(!F.has('married')) return '自在的單身人生';
  return '台灣人的一生';
}
function eduName(g){const F=g.flags;if(g.edu!=='none')return {uni:'大學畢業',master:'碩士',phd:'博士'}[g.edu];if(F.has('early'))return F.has('jhs')?'初中畢業':'小學畢業就出社會';return F.has('jc')?'五專畢業':F.has('voc')?'高職畢業':'高中畢業'}
function summary(g){
  const edu=eduName(g);
  const bits=[edu];
  if(g.flags.has('boss'))bits.push('當了老闆');else if(g.flags.has('tech'))bits.push('科技業');else if(g.flags.has('civil'))bits.push('公務員');else if(g.flags.has('career_mil'))bits.push('職業軍人');
  if(g.marriedAt!=null)bits.push(`${g.marriedAt} 歲結婚`);else bits.push('沒有結婚');
  bits.push(g.kids?`${g.kids} 個孩子`:'沒有孩子');
  bits.push(g.flags.has('house')?'有房':'租屋');
  return `${bits.join('、')}，享年 ${g.deathAge} 歲（${g.cause}）`;
}
// 平行人生：挑 3 個關鍵抉擇，換另一個選項重新活一次
function parallelLives(){
  const done=keySnaps.filter(s=>s.picked);
  if(!done.length) return [];
  // 盡量挑不同人生階段：早、中、晚各一個
  const pickIdx=done.length<=3?done.map((_,i)=>i):[0,Math.floor(done.length/2),done.length-1];
  return [...new Set(pickIdx)].map(i=>{
    const s=done[i];
    const others=['l','r','d'].filter(k=>k!==s.picked);
    const g0=cloneG(s.snap);
    // 找一個「結果跟你選的最不一樣」的選項
    let alt=others[0],best=-1;
    for(const k of others){const o=resolveOpt(g0,s.ch[k]);const n=previewChips(g0,o).length;if(n>best){best=n;alt=k}}
    const g=cloneG(s.snap);const o=resolveOpt(g,s.ch[alt]);
    const first=strip(applyOpt(g,o));
    g.log=[];simulateRest(g);
    const mine=strip(val(resolveOpt(s.snap,s.ch[s.picked]).t,s.snap));
    const big=g.log.filter(l=>/結婚|出生了|錄取|考上|博士|碩士|科技業|老闆|創業|買了房|癌症|離婚|分手|阿公|打工度假|公務員|失業|崩盤|倒會/.test(l.t)).slice(0,4);
    return {age:s.age,mine,alt:strip(val(o.t,g)),first,sum:summary(g),big};
  });
}
function showReview(){
  stopTicking();
  const F=G.flags,sex=G.sex,age=G.deathAge;
  const e=lifeExp(sex);
  const longer=1-survival(sex,age+1);
  const eduTxt=eduName(G);
  const years=F.has('job')?Math.max(0,Math.min(age,65)-(G.jobAt??25)):0;
  const items=[];
  items.push(['享年',`${age} 歲（${G.birthYear}～${G.birthYear+age}）`,`台灣${sex}性平均壽命 ${e} 歲；你比約 ${pct(longer)} 的台灣${sex}性活得久。`]);
  items.push(['死因',G.cause,statLine('death_causes',l=>{const x=l.find(c=>cleanCause(c.cause)===G.cause);return x?`這個死因占台灣死亡人數約 ${pct(x.share)}`:''}).replace(/^📊 /,'')]);
  items.push(['學歷',eduTxt,statLine('higher_education',h=>`今日台灣約 ${pct(h.university_entry_rate)} 的人會念大學或四技`).replace(/^📊 /,'')]);
  if(years>0) items.push(['工作',`工作約 ${years} 年${F.has('boss')?'，後來當了老闆':F.has('tech')?'，在科技業':''}`,'']);
  if(G.marriedAt!=null) items.push(['婚姻',`${G.marriedAt} 歲和${N(G,'partner')}結婚${F.has('divorced')?'，後來離婚':F.has('widowed')?'，另一半先走了':''}`,statLine('first_marriage_age',m=>`今日台灣平均初婚年齡：男 ${m.male}、女 ${m.female} 歲`).replace(/^📊 /,'')]);
  else items.push(['婚姻',F.has('divorced')?'離過婚':'一輩子沒有結婚',(()=>{const nm=neverMarried(sex,50);return nm!=null?`今日台灣 50 歲出頭的${sex}性約 ${pct(nm)} 從未結婚。`:''})()]);
  items.push(['子女',G.kids?`${G.kids} 個孩子：${G.kidNames.join('、')}`:'沒有孩子',statLine('fertility',f=>`今日台灣總生育率約 ${f.total_fertility_rate}`).replace(/^📊 /,'')]);
  items.push(['住房',F.has('house')?'有自己的家':'一輩子租屋',statLine('home_ownership_rate',v=>`今日台灣自有住宅率約 ${pct(v)}`).replace(/^📊 /,'')]);
  // 重要的人
  const people=[];
  G.parents.forEach(p=>people.push({ic:p.sex==='女'?'👩':'👨',n:p.name,s:p.dead?`在你 ${p.deadAt} 歲時過世，享年 ${p.age0+p.deadAt} 歲`:'比你長壽'}));
  const C=G.chars,icon={friend:'🧒',crush:'💌',partner:'💍',ally:'🦸',colleague:'💼',ex:'💔'};
  for(const c of Object.values(C)){
    if(!c)continue;
    let s=c.rel+`，${c.metAt} 歲認識`;
    if(c.role==='friend')s=`從小學就認識的好朋友${(c.bond||0)>=2?'，你們感情一直很好':''}`;
    if(c.role==='crush')s=G.flags.has('crushpartner')?'初戀，後來成了你的另一半':'14 歲時的初戀';
    if(c.role==='partner')s=G.flags.has('divorced')?`前任配偶，${c.metAt} 歲認識`:G.flags.has('married')||G.flags.has('widowed')?`你的另一半，${c.metAt} 歲認識`:`交往的對象，${c.metAt} 歲認識`;
    if(c.role==='ally')s='國中時被你保護過的同學';
    if(c.dead)s+=`；在你 ${c.deadAt} 歲時過世`;
    people.push({ic:icon[c.role]||'🙂',n:c.name,s});
  }
  G.kidNames.forEach(n=>people.push({ic:'👶',n,s:'你的孩子'}));
  const alts=parallelLives();
  const highlights=G.log.filter(l=>/結婚|出生了|孩子|錄取|考上|畢業|入伍|志願役|正職|買了房|癌症|退休|阿公|失智|離婚|分手|在一起|打工度假|車禍|詐騙|過世|📰|創業|老闆/.test(l.t));
  $('#app').innerHTML=`<div class="screen"><div class="panel">
    <div class="kicker">人生回顧・${G.birthYear} 年生・${esc(G.city)}・${G.sex}・家境${G.fam}</div>
    <h1>${age} 歲的一生</h1>
    <span class="title-badge">${lifeTitle(G)}</span>
    <ul class="cmp">${items.map(([k,v,s])=>`<li><b>${k}</b><span>${esc(v)}${s?`<small>${esc(s)}</small>`:''}</span></li>`).join('')}</ul>
    <div class="btns"><button class="big" id="again">再活一次</button></div>
    <div class="btns"><button class="big ghost" id="srcb">資料來源</button></div>
  </div>
  ${alts.length?`<div class="panel"><h2>平行人生</h2><p class="small">如果在關鍵時刻選了另一條路，另一個你會怎麼過？（之後的選擇隨機，每次看都可能不一樣）</p>
    ${alts.map(a=>`<div class="alt"><div class="q">${a.age} 歲，你選了「${esc(a.mine)}」。如果選了 <b>「${esc(a.alt)}」</b>⋯⋯</div><div class="sum">${esc(a.sum)}</div>${a.big.length?`<ul>${a.big.map(b=>`<li>${b.age} 歲：${esc(b.t)}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`:''}
  <div class="panel"><h2>這一生重要的人</h2><ul class="people">${people.map(p=>`<li><span class="ic">${p.ic}</span><span><b>${esc(p.n)}</b><small>${esc(p.s)}</small></span></li>`).join('')}</ul></div>
  <div class="panel"><h2>人生大事</h2><ol class="timeline">${highlights.map(l=>`<li><span class="y">${l.age}</span><span>${esc(l.t)}</span></li>`).join('')}</ol></div>
  <div class="panel"><h2>你做過的選擇</h2><ol class="timeline">${G.choices.map(l=>`<li><span class="y">${l.age}</span><span>${esc(l.t)}</span></li>`).join('')}</ol></div>
  </div>`;
  const html=$('#app').innerHTML;
  const bind=()=>{$('#again').onclick=showIntro;$('#srcb').onclick=()=>showSources(()=>{$('#app').innerHTML=html;bind()})};
  bind();
}
