<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣人生模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：單一畫面遊戲；上方四項數值、中間一張紙卡（四邊是四個選項，左右直書），下方提示 */
:root{
  --board:#17423f;      /* 教室黑板綠 */
  --board-2:#1f544f;
  --paper:#fbfaf5;
  --ink:#1d2b2a;
  --ink-soft:#5d6f6c;
  --chalk:#d9e6e2;
  --chalk-dim:#8fb0aa;
  --taxi:#f2c230;       /* 計程車黃 */
  --danger:#e5583f;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--chalk);font-family:var(--f-body);font-size:14px;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.dot{height:12px;display:flex;align-items:center;justify-content:center}
.dot i{display:block;border-radius:50%;background:var(--taxi)}
.dot i.q{background:none;color:var(--taxi);font-style:normal;font-size:12px;font-weight:700}
.stat .ico{font-size:22px;line-height:1}
.stat .name{font-size:11px;color:var(--chalk-dim);letter-spacing:.1em}
.bar{width:100%;max-width:64px;height:6px;border-radius:3px;background:var(--board-2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--chalk);transition:width .35s}
.bar b.low{background:var(--danger)}
.bar b.high{background:var(--taxi)}

.meta{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);gap:8px}
.meta .age{font-size:26px;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta .stage{font-size:13px;color:var(--chalk-dim);text-align:right}

.table{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.card{position:relative;width:100%;max-width:360px;height:100%;max-height:470px;background:var(--paper);color:var(--ink);
  border-radius:20px;box-shadow:0 14px 30px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;
  cursor:grab;display:grid;grid-template-columns:44px 1fr 44px;grid-template-rows:auto 1fr auto;will-change:transform}
.card.dragging{cursor:grabbing}
.card.enter{animation:enter .28s ease-out}
@keyframes enter{from{transform:scale(.92) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.opt{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;line-height:1.35;color:var(--ink-soft);
  padding:10px 6px;border-radius:12px;margin:6px;transition:background .12s,color .12s,opacity .12s;cursor:pointer;text-align:center}
.opt .arr{font-weight:700;color:var(--ink)}
.opt.u{grid-column:1/4;grid-row:1}
.opt.d{grid-column:1/4;grid-row:3}
.opt.l,.opt.r{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.05em;padding:8px 4px;grid-row:2}
.opt.l{grid-column:1}
.opt.r{grid-column:3}
.card.peek .opt{opacity:.35}
.opt.on{background:var(--taxi);color:var(--ink);opacity:1!important;font-weight:700}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.body{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:4px 2px;min-width:0}
.face{font-size:60px;line-height:1}
.who{font-family:var(--f-display);font-size:15px;background:var(--board);color:var(--paper);padding:3px 12px;border-radius:999px}
.say{font-family:var(--f-display);font-size:18px;line-height:1.55;text-wrap:balance}
.fact{font-size:11px;color:var(--ink-soft);line-height:1.4}

.hint{text-align:center;font-size:12px;color:var(--chalk-dim)}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--taxi);color:var(--ink);font-weight:700;
  padding:8px 14px;border-radius:10px;font-size:14px;z-index:5;max-width:90%;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}

.screen{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.sheet h1,.sheet h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.sheet h1{font-size:30px}
.sheet h2{font-size:22px}
.sheet p{margin:0;line-height:1.6}
.kicker{font-size:12px;letter-spacing:.15em;color:var(--ink-soft)}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;border:1.5px dashed var(--ink-soft);border-radius:12px;padding:12px 14px;margin:0}
.idcard dt{color:var(--ink-soft)}
.idcard dd{margin:0;font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button.big{font-family:var(--f-display);font-size:17px;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--taxi);color:var(--ink);flex:1;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink-soft)}
button:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.timeline li{display:grid;grid-template-columns:44px 1fr;gap:8px}
.timeline .y{font-variant-numeric:tabular-nums;color:var(--ink-soft);text-align:right}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex div{border-radius:10px;padding:10px 6px;text-align:center;font-size:13px;background:#eef1ec;min-height:44px;display:flex;align-items:center;justify-content:center}
.dex div.lock{color:#9aa7a4}
.src{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.55}
.src a{color:#1f6f66;word-break:break-all}
.small{font-size:13px;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.card.enter{animation:none}.bar b{transition:none}}
</style>
</head>

 {t:'撥 1966 申請長照服務；外籍看護常以巴氏量表評估',s:'聯合報',u:'https://udn.com/news/story/7243/9468536'},
 {t:'年滿 65 歲雇主可以強制退休',s:'勞動基準法第 54 條',u:''},
];

// ---- 小工具 ----
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=v=>Math.max(0,Math.min(100,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const arr=x=>x==null?[]:Array.isArray(x)?x:[x];
const val=(x,G)=>typeof x==='function'?x(G):x;
function loadDex(){try{return JSON.parse(localStorage.getItem('twlife-dex')||'[]')}catch(e){return[]}}
function saveDex(d){try{localStorage.setItem('twlife-dex',JSON.stringify(d))}catch(e){}}

let G=null;   // 這一世的狀態
let cur=null; // 目前卡片

function newLife(){
  const cityObj=pick(CITIES),fam=pick(FAMS),sex=Math.random()<.5?'男':'女';
  G={stats:[fam.m,50,50,50],cityObj,city:cityObj.n,fam:fam.n,sex,flags:new Set(),log:[],age:6,used:new Set(),plan:new Map()};
  if(fam.n==='辛苦'){G.flags.add('poor');G.stats[3]+=5}
  // 這一世會遇到哪些事、大約幾歲遇到
  CARDS.forEach((c,i)=>{
    if(c.sex&&c.sex!==sex) return;
    if(c.must||Math.random()<(c.p??.6)) G.plan.set(i,rint(c.age[0],c.age[1]));
  });
}
function eligible(c){
  return arr(c.req).every(f=>G.flags.has(f))&&!arr(c.not).some(f=>G.flags.has(f))&&(!c.cond||c.cond(G));
}
function nextCard(){
  let best=null,bestAge=Infinity;
  for(const [i,target] of G.plan){
    if(G.used.has(i)) continue;
    const c=CARDS[i];
    if(c.age[1]<G.age||!eligible(c)) continue;
    const a=Math.max(target,G.age);
    if(a<bestAge||(a===bestAge&&Math.random()<.5)){best=i;bestAge=a}
  }
  if(best==null) return null;
  G.used.add(best);G.age=bestAge;
  return {card:CARDS[best],age:bestAge};
}
// 依旗標決定選項（need/alt），再把函式型文字、數值算出來
function resolve(o){
  if(!o) return null;
  if(o.need&&!G.flags.has(o.need)) o=o.alt;
  return o;
}

function stageName(a){
  return a<=12?'童年':a<=15?'國中':a<=18?'高中職':a<=24?'青年':a<=34?'出社會':a<=44?'成家立業':a<=64?'中年':'退休';
}

// ---- 畫面 ----
function statsHTML(){
  return `<div class="stats">${STATS.map((s,i)=>`<div class="stat"><div class="dot" id="dot${i}"></div><div class="ico">${s.ico}</div><div class="bar"><b id="bar${i}"></b></div><div class="name">${s.name}</div></div>`).join('')}</div>`;
}
function paintStats(){
  G.stats.forEach((v,i)=>{const b=$('#bar'+i);if(!b)return;b.style.width=v+'%';b.className=v<=20?'low':v>=80?'high':''});
}
function paintDots(o){
  for(let i=0;i<4;i++){
    const d=$('#dot'+i);if(!d)continue;
    if(!o){d.innerHTML='';continue}
    if(o.chance){d.innerHTML=(o.chance.ok.e[i]||o.chance.ng.e[i])?'<i class="q">?</i>':'';continue}
    const e=val(o.e,G);const v=Math.abs(e[i]);const px=v===0?0:v<=5?6:v<=10?9:12;
    d.innerHTML=px?`<i style="width:${px}px;height:${px}px"></i>`:'';
  }
}

function showIntro(){
  newLife();
  $('#app').innerHTML=`<div class="screen"><div class="sheet">
    <div class="kicker">出生證明</div>
    <h1>恭喜，你出生了！</h1>
    <dl class="idcard"><dt>出生地</dt><dd>${G.city}</dd><dt>家境</dt><dd>${G.fam}</dd><dt>性別</dt><dd>${G.sex}</dd></dl>
    <p class="small">往四個方向拖曳卡片來做選擇（電腦可用方向鍵）。錢、健康、快樂、人際任何一項歸零或爆表，人生就結束了。</p>
    <p class="small">年齡、升學、兵役、薪水、房價等設定都有查證，來源列在「資料來源」。</p>
    <div class="btns"><button class="big" id="go">開始人生</button></div>
    <div class="btns"><button class="big ghost" id="dexb">結局圖鑑</button><button class="big ghost" id="srcb">資料來源</button></div>
  </div></div>`;
  $('#go').onclick=startPlay;
  $('#dexb').onclick=()=>showDex(showIntro);
  $('#srcb').onclick=()=>showSources(showIntro);
}

function startPlay(){
  $('#app').innerHTML=`${statsHTML()}
    <div class="meta"><span class="age" id="age"></span><span class="stage" id="stg"></span></div>
    <div class="table" id="table"></div>
    <div class="hint">拖曳卡片偷看選項，拖到底就決定・電腦可按方向鍵</div>`;
  paintStats();
  advance();
}

function advance(toast){
  cur=nextCard();
  if(!cur) return endLife(null,toast);
  const c=cur.card;
  cur.opts={};
  ['u','d','l','r'].forEach(k=>cur.opts[k]=resolve(c[k]));
  $('#age').textContent=cur.age+' 歲';
  $('#stg').textContent=stageName(cur.age)+'・'+G.city+'出生';
  const fact=val(c.fact,G);
  const lab=(k,a)=>`<div class="opt ${k}" data-k="${k}" tabindex="0"><span class="arr">${a}</span><span>${esc(cur.opts[k].t)}</span></div>`;
  $('#table').innerHTML=`${toast?`<div class="toast">${esc(toast)}</div>`:''}
    <div class="card enter" id="card">
      ${lab('u','↑')}${lab('l','←')}
      <div class="body"><div class="face">${c.face}</div><div class="who">${esc(c.who)}</div><div class="say">${esc(val(c.say,G))}</div>${fact?`<div class="fact">📌 ${esc(fact)}</div>`:''}</div>
      ${lab('r','→')}${lab('d','↓')}
    </div>`;
  if(toast) setTimeout(()=>{const t=document.querySelector('.toast');if(t)t.remove()},2200);
  bindCard($('#card'));
}

function bindCard(el){
  let sx=0,sy=0,dragging=false,dir=null;
  const TH=36,GO=100;
  const setPeek=k=>{
    dir=k;
    el.classList.toggle('peek',!!k);
    el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.dataset.k===k));
    paintDots(k?cur.opts[k]:null);
  };
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.opt')&&e.pointerType==='mouse') return; // 滑鼠點選項＝直接選
    dragging=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.classList.add('dragging');el.style.transition='none';
  });
  el.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    let k=null;
    if(Math.hypot(dx,dy)>TH){k=Math.abs(dx)>Math.abs(dy)?(dx<0?'l':'r'):(dy<0?'u':'d')}
    if(k!==dir) setPeek(k);
  });
  const up=e=>{
    if(!dragging) return;
    dragging=false;el.classList.remove('dragging');
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(dir&&Math.hypot(dx,dy)>GO){choose(dir);return}
    el.style.transition='transform .2s';el.style.transform='';setPeek(null);
  };
  el.addEventListener('pointerup',up);
  el.addEventListener('pointercancel',up);
  el.querySelectorAll('.opt[data-k]').forEach(o=>{
    o.addEventListener('mouseenter',()=>setPeek(o.dataset.k));
    o.addEventListener('mouseleave',()=>setPeek(null));
    o.addEventListener('click',()=>choose(o.dataset.k));
    o.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(o.dataset.k)}});
  });
}

// 套用選項效果（模擬測試也用這個）
function apply(o){
  let eff=val(o.e,G),toast=null,logT=o.t;
  if(o.chance){const r=Math.random()<o.chance.p?o.chance.ok:o.chance.ng;eff=r.e;toast=r.t;logT=o.t+'（'+r.t+'）'}
  // 一生約 30 張卡，效果打 75 折，避免亂選也太快結束
  G.stats=G.stats.map((v,i)=>clamp(v+Math.round((eff[i]||0)*.75)));
  arr(o.set).forEach(f=>G.flags.add(f));
  arr(o.unset).forEach(f=>G.flags.delete(f));
  if(o.fx) o.fx(G);
  return {toast,logT};
}

let busy=false;
function choose(k){
  if(busy||!cur||!cur.opts[k]) return;
  busy=true;
  const {toast,logT}=apply(cur.opts[k]);
  G.log.push({age:cur.age,t:logT,who:cur.card.who});
  paintStats();paintDots(null);
  const el=$('#card');
  const v={l:[-1,0],r:[1,0],u:[0,-1],d:[0,1]}[k];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.style.transition=reduce?'none':'transform .25s ease-in,opacity .25s';
  el.style.transform=`translate(${v[0]*600}px,${v[1]*700}px) rotate(${v[0]*25}deg)`;
  el.style.opacity='0';
  setTimeout(()=>{
    busy=false;
    const dead=G.stats.findIndex(s=>s<=0||s>=100);
    if(dead>=0) return endLife(dead+'-'+(G.stats[dead]>=100?1:0),toast);
    advance(toast);
  },reduce?0:260);
}

let endHTML='';
function endLife(extKey,toast){
  let id,title,desc,age;
  if(extKey){
    id=extKey;title=EXT[extKey].t;desc=EXT[extKey].d;age=G.age;
  }else{
    const hi=G.stats.indexOf(Math.max(...G.stats));
    const n=NAT[hi];id=n.id;title=n.t;desc=n.d;
    age=Math.max(G.age+1,Math.round(74+G.stats[1]/6+Math.random()*6));
  }
  const dex=loadDex();const isNew=!dex.includes(id);
  if(isNew){dex.push(id);saveDex(dex)}
  const F=G.flags,facts=[];
  if(F.has('phd'))facts.push('博士');else if(F.has('master'))facts.push('碩士');else if(F.has('uni'))facts.push('大學畢業');else facts.push('高中職畢業');
  if(F.has('tech'))facts.push('科技業');
  if(F.has('army')&&G.soldierAt!=null)facts.push('當過志願役');else if(F.has('army'))facts.push('當過兵');
  if(F.has('married'))facts.push('已婚');
  if(F.has('kid'))facts.push('有小孩');
  if(F.has('house'))facts.push('有房');
  $('#app').innerHTML=`<div class="screen"><div class="sheet">
    <div class="kicker">享年 ${age} 歲・${G.city}出生・家境${G.fam}</div>
    <h1>${esc(title)}</h1>
    ${toast?`<p class="small">最後一件事：${esc(toast)}</p>`:''}
    <p>${esc(desc)}</p>
    <p class="small">這一生：${facts.join('、')}</p>
    <p class="small">結局圖鑑 ${dex.length} / ${ALL_ENDINGS.length}${isNew?'・新結局！':''}</p>
    <div class="btns"><button class="big" id="again">再活一次</button></div>
    <div class="btns"><button class="big ghost" id="dexb">結局圖鑑</button><button class="big ghost" id="srcb">資料來源</button></div>
  </div>
  <div class="sheet"><h2>人生年表</h2><ol class="timeline">${G.log.map(l=>`<li><span class="y">${l.age}</span><span>${esc(l.who)}：${esc(l.t)}</span></li>`).join('')}</ol></div>
  </div>`;
  endHTML=$('#app').innerHTML;
  bindEnd();
}
function bindEnd(){
  $('#again').onclick=showIntro;
  $('#dexb').onclick=()=>showDex(backToEnd);
  $('#srcb').onclick=()=>showSources(backToEnd);
}
function backToEnd(){$('#app').innerHTML=endHTML;bindEnd()}

function showDex(back){
  const dex=loadDex();
  $('#app').innerHTML=`<div class="screen"><div class="sheet">
    <h2>結局圖鑑</h2><p class="small">已解鎖 ${dex.length} / ${ALL_ENDINGS.length}</p>
    <div class="dex">${ALL_ENDINGS.map(e=>dex.includes(e.id)?`<div>${esc(e.t)}</div>`:`<div class="lock">？？？</div>`).join('')}</div>
    <div class="btns"><button class="big" id="back">返回</button></div>
  </div></div>`;
  $('#back').onclick=back;
}
function showSources(back){
  $('#app').innerHTML=`<div class="screen"><div class="sheet">
    <h2>資料來源</h2>
    <p class="small">遊戲裡跟現實有關的設定，都是依照下面的資料寫的。數值變化與結局是遊戲設計，不是統計結果。</p>
    <ol class="src">${SOURCES.map(s=>`<li>${esc(s.t)}<br><span class="small">${esc(s.s)}</span>${s.u?`<br><a href="${s.u}" target="_blank" rel="noopener">${esc(s.u)}</a>`:''}</li>`).join('')}</ol>
    <div class="btns"><button class="big" id="back">返回</button></div>
  </div></div>`;
  $('#back').onclick=back;
}

addEventListener('keydown',e=>{
  if(!cur||!$('#card')) return;
  const k={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'}[e.key];
  if(k){e.preventDefault();choose(k)}
});

showIntro();
</script>
