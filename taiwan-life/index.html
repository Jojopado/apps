<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台灣人生模擬器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：上方人生紀錄（逐年往下長），遇到選擇時跳出紙卡（左／右／下三個選項），最下方是年齡進度條 */
:root{
  --board:#17423f;      /* 教室黑板綠 */
  --board-2:#1f544f;
  --board-3:#2a6660;
  --paper:#fbfaf5;
  --ink:#1d2b2a;
  --ink-soft:#5d6f6c;
  --chalk:#d9e6e2;
  --chalk-dim:#8fb0aa;
  --taxi:#f2c230;       /* 計程車黃 */
  --danger:#ef7a64;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--board);color:var(--chalk);font-family:var(--f-body);font-size:14px;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px;position:relative}

.who-am-i{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--chalk-dim)}
.who-am-i b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--paper)}

/* 人生紀錄 */
.feed{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;scroll-behavior:smooth}
.yr{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.yr .a{font-family:var(--f-display);font-size:15px;color:var(--taxi);text-align:right;font-variant-numeric:tabular-nums;padding-top:1px}
.yr .t{display:flex;flex-direction:column;gap:3px;line-height:1.55}
.yr .t span.big{color:var(--paper);font-weight:700}
.yr .t span.stat{font-size:12px;color:var(--chalk-dim)}
.yr .t span.sad{color:var(--danger)}

/* 年齡進度條 */
.clock{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--board-2);border-radius:16px;padding:10px 12px}
.clock .age{font-family:var(--f-display);font-size:30px;color:var(--paper);font-variant-numeric:tabular-nums;min-width:74px}
.clock .age small{font-size:14px;color:var(--chalk-dim);margin-left:2px}
.track{position:relative;height:10px;border-radius:5px;background:var(--board);overflow:visible}
.track b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--taxi);transition:width .4s linear}
.track i{position:absolute;top:-3px;width:2px;height:16px;background:var(--chalk-dim);opacity:.6}
.track em{position:absolute;top:14px;font-size:10px;color:var(--chalk-dim);font-style:normal;transform:translateX(-50%)}
.ctrl{display:flex;gap:6px}
.ctrl button{font:inherit;font-size:13px;border:0;border-radius:10px;padding:8px 10px;background:var(--board-3);color:var(--paper);cursor:pointer;min-width:40px}
.ctrl button.on{background:var(--taxi);color:var(--ink)}
button:focus-visible{outline:3px solid var(--taxi);outline-offset:2px}

/* 選擇卡 */
.veil{position:absolute;inset:0;background:rgba(10,30,28,.55);display:flex;align-items:center;justify-content:center;z-index:5;padding:30px 0 96px}
.card{position:relative;width:100%;max-width:360px;height:100%;max-height:440px;background:var(--paper);color:var(--ink);
  border-radius:20px;box-shadow:0 14px 30px rgba(0,0,0,.4);touch-action:none;user-select:none;-webkit-user-select:none;
  cursor:grab;display:grid;grid-template-columns:46px 1fr 46px;grid-template-rows:1fr auto;will-change:transform;animation:enter .28s ease-out}
.card.dragging{cursor:grabbing}
@keyframes enter{from{transform:scale(.92) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.opt{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;line-height:1.35;color:var(--ink-soft);
  padding:10px 6px;border-radius:12px;margin:6px;transition:background .12s,color .12s,opacity .12s;cursor:pointer;text-align:center}
.opt .arr{font-weight:700;color:var(--ink)}
.opt.d{grid-column:1/4;grid-row:2}
.opt.l,.opt.r{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.05em;padding:8px 4px;grid-row:1}
.opt.l{grid-column:1}
.opt.r{grid-column:3}
.card.peek .opt{opacity:.35}
.opt.on{background:var(--taxi);color:var(--ink);opacity:1!important;font-weight:700}
.opt:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.body{grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:14px 2px 4px;min-width:0}
.face{font-size:56px;line-height:1}
.who{font-family:var(--f-display);font-size:15px;background:var(--board);color:var(--paper);padding:3px 12px;border-radius:999px}
.say{font-family:var(--f-display);font-size:18px;line-height:1.55;text-wrap:balance}
.fact{font-size:11px;color:var(--ink-soft);line-height:1.45}

/* 全頁畫面 */
.screen{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet{background:var(--paper);color:var(--ink);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.sheet h1,.sheet h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
.sheet h1{font-size:30px}
.sheet h2{font-size:21px}
.sheet p{margin:0;line-height:1.65}
.kicker{font-size:12px;letter-spacing:.15em;color:var(--ink-soft)}
.idcard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;border:1.5px dashed var(--ink-soft);border-radius:12px;padding:12px 14px;margin:0}
.idcard dt{color:var(--ink-soft)}
.idcard dd{margin:0;font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button.big{font-family:var(--f-display);font-size:17px;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--taxi);color:var(--ink);flex:1;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink-soft)}
.cmp{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.cmp li{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:14px;line-height:1.55}
.cmp li b{color:var(--ink-soft);font-weight:700;font-size:13px}
.cmp li small{display:block;color:var(--ink-soft);font-size:12px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.timeline li{display:grid;grid-template-columns:40px 1fr;gap:8px;line-height:1.5}
.timeline .y{font-variant-numeric:tabular-nums;color:var(--ink-soft);text-align:right}
.src{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px;font-size:13px;line-height:1.55}
.src a{color:#1f6f66;word-break:break-all}
.small{font-size:13px;color:var(--ink-soft)}
.title-badge{align-self:flex-start;background:var(--board);color:var(--paper);font-family:var(--f-display);padding:4px 12px;border-radius:999px;font-size:15px}
@media (prefers-reduced-motion:reduce){.yr,.card{animation:none}.track b{transition:none}.feed{scroll-behavior:auto}}
</style>
</head>

// ---- 讀資料的小工具（找不到就用預設值，並記下來顯示在資料來源頁） ----
const MISSING=new Set();
function V(key,def){const o=DATA[key];if(o&&o.value!=null)return o.value;MISSING.add(key);return def}
function srcOf(key){const o=DATA[key];return o?{year:o.year,source:o.source,url:o.url,estimate:o.estimate,note:o.note}:null}

const $=s=>document.querySelector(s);
const rnd=Math.random;
const pick=a=>a[Math.floor(rnd()*a.length)];
const arr=x=>x==null?[]:Array.isArray(x)?x:[x];
const val=(x,...a)=>typeof x==='function'?x(...a):x;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=x=>(x*100).toFixed(x<0.1?1:0)+'%';
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
function weighted(list,key='share'){const tot=list.reduce((t,x)=>t+(x[key]||0),0);let r=rnd()*tot;for(const x of list){r-=x[key]||0;if(r<=0)return x}return list[list.length-1]}

// ---- 從統計資料推出來的數字 ----
function qx(sex,age){
  const t=V('life_table',null);
  const a=Math.min(age,100);
  if(t&&t[sex==='男'?'male':'female']) return t[sex==='男'?'male':'female'][a]??0.5;
  // 預設：粗略的 Gompertz 曲線（只在資料缺漏時使用）
  return Math.min(0.6,0.00005*Math.exp(0.09*a)+(a===0?0.004:0));
}
function survival(sex,age){let s=1;for(let a=0;a<age;a++)s*=1-qx(sex,a);return s}
function lifeExp(sex){const e=V('life_expectancy',{male:77.4,female:84.0,total:80.6});return sex==='男'?e.male:e.female}
function neverMarried(sex,age){
  const t=V('never_married_by_age',null);if(!t)return null;
  const g=t[sex==='男'?'male':'female'];const k=Object.keys(g).find(r=>{const [a,b]=r.split('-').map(Number);return age>=a&&age<=b});
  return k?g[k]:null;
}
// 每年「開始一段認真感情」的機率：用各年齡層未婚比例的下降速度換算
function meetHazard(sex,age){
  const t=V('never_married_by_age',null);
  if(t){
    const g=t[sex==='男'?'male':'female'];const ks=Object.keys(g).sort();
    for(let i=0;i<ks.length-1;i++){const [a,b]=ks[i].split('-').map(Number);
      if(age>=a-3&&age<=b-3){const h=1-Math.pow(g[ks[i+1]]/g[ks[i]],1/5);return Math.min(.5,Math.max(.03,h*2.2))}}
  }
  return age<22?.06:age<35?.15:age<45?.07:.03;
}
function salaryFor(G){
  const s=V('salary',{median_annual_total_salary:520000});
  const base=s.median_annual_total_salary||520000;
  const m={none:.75,uni:1,master:1.3,phd:1.4}[G.edu]||1;
  return base*m*(G.flags.has('tech')?1.4:1)*(G.flags.has('civil')?1.05:1);
}
function cityList(){return V('population_by_city',[{city:'新北市',share:.17},{city:'台中市',share:.12},{city:'高雄市',share:.12},{city:'台北市',share:.11},{city:'桃園市',share:.10},{city:'台南市',share:.08},{city:'其他縣市',share:.30}])}
function housePer(G){
  const t=V('house_price_per_ping_by_city',{});
  const key=Object.keys(t).find(k=>k.replace(/臺/g,'台')===G.city);
  return key?t[key]:null;
}

   r:{t:'環島旅行',log:'退休後，開著車環島一圈。',set:'retired'},
   d:{t:'學跳廣場舞',log:'退休後學跳廣場舞，交了一群朋友。',set:'retired',fx:G=>G.healthMul*=.97}}},
 {at:G=>G.age>=70,p:.06,once:'dementia',log:G=>['<span class="sad">你開始常常忘記事情，醫生說是失智症初期。</span>',stat('dementia_or_longterm_care',v=>`台灣 65 歲以上約 ${pct(v.dementia_prevalence_65plus)} 有失智症。`)],fx:G=>G.healthMul*=1.3},

 // ---- 生活小事 ----
 {at:G=>G.age>=6&&G.age<=60,p:.06,log:'颱風來了，放了一天颱風假。'},
 {at:G=>G.age>=20,p:.04,log:'統一發票中了 1000 元。'},
 {at:G=>G.age>=20&&G.age<=70,p:.04,log:'半夜地震，搖得你從床上跳起來。'},
];

function cancerRate(age){
  const c=V('cancer',{new_cases_per_year:130000});
  const base=(c.new_cases_per_year||130000)/23300000; // 平均每人每年
  return Math.min(.04,base*(age<40?.25:age<50?.7:age<60?1.4:age<70?2.4:3.2));
}

// ---- 死因 ----
// 官方名稱太長，顯示時拿掉括號說明，例如「心臟疾病(高血壓性疾病除外)」→「心臟疾病」、「惡性腫瘤(癌症)」→「癌症」
const cleanCause=c=>/惡性腫瘤/.test(c)?'癌症':c.replace(/[（(].*?[)）]/g,'');
function deathCause(G){
  if(G.flags.has('cancer')&&rnd()<.6) return '癌症';
  if(G.age<35&&rnd()<.6) return '事故傷害';
  const list=V('death_causes',null);
  if(!list) return pick(['癌症','心臟疾病','肺炎','腦血管疾病','糖尿病']);
  // 癌症另外用「確診癌症」事件模擬，所以這裡不再抽到癌症
  const ok=list.filter(x=>!/自殺|自傷|惡性腫瘤/.test(x.cause)&&x.cause!=='其他');
  return cleanCause(weighted(ok).cause);
}

/* ======= 遊戲狀態 ======= */
let G=null,timer=null,speed=1,paused=false,pendingChoices=[],cur=null,locked=false; // locked：選擇卡飛走動畫中，年齡不能前進
function stat(key,f){const v=V(key,null);if(v==null)return '';const s=f(v);return s?`<span class="stat">📊 ${s}</span>`:''}
function statLine(key,f){const v=V(key,null);if(v==null)return '';return '📊 '+f(v)}

function newLife(){
  const c=weighted(cityList());
  const sr=V('sex_ratio_at_birth',107);
  const sex=rnd()<sr/(sr+100)?'男':'女';
  const fam=pick(['富裕','小康','小康','辛苦']);
  G={age:-1,city:c.city.replace('臺','台'),sex,fam,flags:new Set(),once:new Set(),log:[],big:[],
     healthMul:1,payMul:1,wealth:fam==='富裕'?2:fam==='辛苦'?-1:0,edu:'none',kids:0,lastKidAt:-9,kidAt:null};
  if(fam==='辛苦') G.flags.add('poor');
}

function addYear(age,lines){
  lines=lines.flat().filter(Boolean);
  if(!lines.length) return;
  const feed=$('#feed');if(!feed) return;
  let row=feed.querySelector(`[data-age="${age}"]`);
  if(!row){row=document.createElement('div');row.className='yr';row.dataset.age=age;row.innerHTML=`<div class="a">${age}</div><div class="t"></div>`;feed.appendChild(row)}
  const t=row.querySelector('.t');
  lines.forEach(l=>{const s=document.createElement('span');s.innerHTML=l;if(!/<span/.test(l))s.textContent=l.replace(/<[^>]+>/g,'');t.appendChild(s)});
  feed.scrollTop=feed.scrollHeight;
  lines.forEach(l=>{const plain=l.replace(/<[^>]+>/g,'');if(!/^📊/.test(plain))G.log.push({age,t:plain})});
}

function tick(){
  if(paused||cur||locked) return;
  G.age++;
  paintClock();
  // 先發生這一年的事件
  const lines=[];
  for(const e of EV){
    if(e.once&&G.once.has(e.once)) continue;
    if(!e.at(G)) continue;
    if(e.p!=null&&rnd()>=val(e.p,G)) continue;
    if(e.once) G.once.add(e.once);
    if(e.choice){if(e.set)arr(e.set).forEach(f=>G.flags.add(f));pendingChoices.push(e.choice);continue}
    const out=val(e.log,G);
    if(e.set) arr(e.set).forEach(f=>G.flags.add(f));
    if(e.unset) arr(e.unset).forEach(f=>G.flags.delete(f));
    if(e.fx) e.fx(G);
    lines.push(out);
  }
  addYear(G.age,lines);
  // 一般性的事件寫完，再處理需要玩家選擇的
  if(pendingChoices.length){showChoice(pendingChoices.shift());return}
  endOfYear();
}
function endOfYear(){
  // 依生命表決定這一年會不會離開
  let q=qx(G.sex,G.age)*G.healthMul;
  if(G.age<1) q=Math.min(q,0.004);
  if(rnd()<q) return die();
  if(G.age>=110) return die();
}

function die(){
  stop();
  const cause=deathCause(G);
  G.cause=cause;G.deathAge=G.age;
  addYear(G.age,[`<span class="sad">${G.age} 歲，你因為${cause}離開了人世。</span>`]);
  setTimeout(showReview,1600);
}

/* ======= 選擇卡 ======= */
function resolveOpt(o){if(!o)return null;if(o.need&&!G.flags.has(o.need))o=o.alt;return o}
function showChoice(ch){
  const old=$('#veil');if(old)old.remove(); // 保險：畫面上永遠只有一張選擇卡
  cur={ch,opts:{l:resolveOpt(ch.l),r:resolveOpt(ch.r),d:resolveOpt(ch.d)}};
  const fact=val(ch.fact,G);
  const lab=(k,a)=>`<div class="opt ${k}" data-k="${k}" tabindex="0"><span class="arr">${a}</span><span>${esc(cur.opts[k].t)}</span></div>`;
  const v=document.createElement('div');v.className='veil';v.id='veil';
  v.innerHTML=`<div class="card" id="card">${lab('l','←')}
    <div class="body"><div class="face">${ch.face}</div><div class="who">${esc(ch.who)}</div><div class="say">${esc(val(ch.say,G))}</div>${fact?`<div class="fact">${esc(fact)}</div>`:''}</div>
    ${lab('r','→')}${lab('d','↓')}</div>`;
  $('#app').appendChild(v);
  bindCard($('#card'));
}
function bindCard(el){
  let sx=0,sy=0,dragging=false,dir=null;
  const TH=36,GO=95;
  const setPeek=k=>{dir=k;el.classList.toggle('peek',!!k);el.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.dataset.k===k))};
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.opt')&&e.pointerType==='mouse') return;
    dragging=true;sx=e.clientX;sy=e.clientY;el.setPointerCapture(e.pointerId);el.classList.add('dragging');el.style.transition='none';
  });
  el.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const dx=e.clientX-sx,dy=Math.max(0,e.clientY-sy); // 不能往上滑
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    let k=null;
    if(Math.hypot(dx,dy)>TH) k=Math.abs(dx)>=dy?(dx<0?'l':'r'):'d';
    if(k!==dir) setPeek(k);
  });
  const up=e=>{
    if(!dragging) return;
    dragging=false;el.classList.remove('dragging');
    const dx=e.clientX-sx,dy=Math.max(0,e.clientY-sy);
    if(dir&&Math.hypot(dx,dy)>GO){choose(dir);return}
    el.style.transition='transform .2s';el.style.transform='';setPeek(null);
  };
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.querySelectorAll('.opt[data-k]').forEach(o=>{
    o.addEventListener('mouseenter',()=>setPeek(o.dataset.k));
    o.addEventListener('mouseleave',()=>setPeek(null));
    o.addEventListener('click',()=>choose(o.dataset.k));
    o.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(o.dataset.k)}});
  });
}
// 套用選項（模擬測試也用這個）
function applyOpt(o){
  const r=o.chance?(rnd()<o.chance.p?o.chance.ok:o.chance.ng):o;
  if(o.chance){arr(o.set).forEach(f=>G.flags.add(f));if(o.fx)o.fx(G)}
  arr(r.set).forEach(f=>G.flags.add(f));
  arr(r.unset).forEach(f=>G.flags.delete(f));
  const line=val(r.log,G);   // 先寫紀錄再套效果，讓「第一個孩子」等文字正確
  if(r.fx) r.fx(G);
  G.choices=(G.choices||[]);G.choices.push({age:G.age,t:o.t});
  return line;
}
function choose(k){
  if(!cur||locked||!cur.opts[k]) return;
  locked=true;
  const o=cur.opts[k];
  const line=applyOpt(o);
  const el=$('#card');
  const v={l:[-1,0],r:[1,0],d:[0,1]}[k];
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.style.transition=reduce?'none':'transform .25s ease-in,opacity .25s';
  el.style.transform=`translate(${v[0]*600}px,${v[1]*700}px) rotate(${v[0]*25}deg)`;el.style.opacity='0';
  cur=null;
  setTimeout(()=>{
    locked=false;
    const veil=$('#veil');if(veil)veil.remove();
    addYear(G.age,[line]);
    if(pendingChoices.length){showChoice(pendingChoices.shift());return}
    endOfYear();
  },reduce?0:260);
}

/* ======= 畫面 ======= */
function paintClock(){
  $('#age').innerHTML=`${Math.max(0,G.age)}<small>歲</small>`;
  $('#bar').style.width=Math.min(100,Math.max(0,G.age))+'%';
}
const SPEEDS=[{n:'1x',ms:900},{n:'2x',ms:450},{n:'4x',ms:200}];
function start(){stop();timer=setInterval(tick,SPEEDS[speed-1].ms)}
function stop(){if(timer)clearInterval(timer);timer=null}

function showIntro(){
  stop();newLife();
  $('#app').innerHTML=`<div class="screen"><div class="sheet">
    <div class="kicker">出生證明</div>
    <h1>你即將出生在台灣</h1>
    <dl class="idcard"><dt>出生地</dt><dd>${esc(G.city)}</dd><dt>性別</dt><dd>${G.sex}</dd><dt>家境</dt><dd>${G.fam}</dd></dl>
    <p class="small">出生地和性別是照台灣真實的人口比例抽出來的。按下開始後，年齡會一年一年往前走，人生事件會依真實統計的機率發生。遇到重要決定時會跳出卡片，往左、往右或往下拖曳來選擇。</p>
    <div class="btns"><button class="big" id="go">開始人生</button></div>
    <div class="btns"><button class="big ghost" id="srcb">資料來源</button></div>
  </div></div>`;
  $('#go').onclick=startPlay;
  $('#srcb').onclick=()=>showSources(showIntro);
}

function startPlay(){
  const marks=[[6,'國小'],[18,'成年'],[65,'退休']];
  $('#app').innerHTML=`
    <div class="who-am-i"><b>${esc(G.city)}・${G.sex}・家境${G.fam}</b><span>平均壽命 ${lifeExp(G.sex)} 歲</span></div>
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="clock">
      <div class="age" id="age">0<small>歲</small></div>
      <div class="track"><b id="bar" style="width:0"></b>${marks.map(([a,n])=>`<i style="left:${a}%"></i><em style="left:${a}%">${n}</em>`).join('')}</div>
      <div class="ctrl"><button id="pp" aria-label="暫停">⏸</button><button id="sp">1x</button></div>
    </div>`;
  paused=false;speed=1;pendingChoices=[];cur=null;locked=false;
  $('#pp').onclick=()=>{paused=!paused;$('#pp').textContent=paused?'▶':'⏸';$('#pp').classList.toggle('on',paused)};
  $('#sp').onclick=()=>{speed=speed%3+1;$('#sp').textContent=SPEEDS[speed-1].n;start()};
  start();
  tick();
}

/* ======= 人生回顧 ======= */
function lifeTitle(G){
  const F=G.flags;
  if(F.has('career_mil')) return '保家衛國的軍人';
  if(F.has('prof')) return '教授人生';
  if(F.has('police')) return '人民保母';
  if(F.has('civil')) return '安穩的公務員人生';
  if(F.has('shop')) return '博士咖啡店老闆';
  if(F.has('tech')&&G.kids>=2) return '竹科工程師爸媽';
  if(F.has('tech')) return '科技業打拚的一生';
  if(F.has('abroad')&&!F.has('married')) return '說走就走的旅人';
  if(F.has('skill')) return '靠手藝吃飯的職人';
  if(G.kids>=3) return '熱鬧的大家庭';
  if(F.has('married')&&G.kids>0) return '平凡而完整的一生';
  if(F.has('divorced')) return '跌倒又站起來的人生';
  if(!F.has('married')) return '自在的單身人生';
  return '台灣人的一生';
}
function showReview(){
  stop();
  const F=G.flags,sex=G.sex,age=G.deathAge;
  const e=lifeExp(sex);
  const longer=1-survival(sex,age+1); // 同性別在你之前離開的比例
  const eduTxt={none:'高中職畢業',uni:'大學畢業',master:'碩士',phd:'博士'}[G.edu];
  const years=G.flags.has('job')?Math.max(0,Math.min(age,65)-(G.jobAt||25)):0;
  const income=salaryFor(G)*G.payMul*years;
  const items=[];
  items.push(['享年',`${age} 歲`,`台灣${sex}性平均壽命 ${e} 歲；你比約 ${pct(longer)} 的台灣${sex}性活得久。`]);
  items.push(['死因',G.cause,statLine('death_causes',l=>{const x=l.find(c=>cleanCause(c.cause)===G.cause);return x?`這個死因占台灣死亡人數約 ${pct(x.share)}`:''}).replace('📊 ','')]);
  items.push(['學歷',eduTxt,statLine('higher_education',h=>`台灣約 ${pct(h.university_entry_rate)} 的人會念大學或四技`).replace('📊 ','')]);
  if(years>0) items.push(['工作',`工作約 ${years} 年，一生薪水約 ${fmt(income/10000)} 萬`,'用台灣全年總薪資中位數、依學歷與行業粗估。']);
  if(G.marriedAt!=null) items.push(['婚姻',`${G.marriedAt} 歲結婚${F.has('divorced')?'，後來離婚':''}`,statLine('first_marriage_age',m=>`台灣平均初婚年齡：男 ${m.male}、女 ${m.female} 歲`).replace('📊 ','')]);
  else items.push(['婚姻',F.has('divorced')?'離過婚':'一輩子沒有結婚',(()=>{const nm=neverMarried(sex,50);return nm!=null?`台灣 50 歲出頭的${sex}性約 ${pct(nm)} 從未結婚。`:''})()]);
  items.push(['子女',G.kids?`${G.kids} 個孩子`:'沒有孩子',statLine('fertility',f=>`台灣總生育率約 ${f.total_fertility_rate}`).replace('📊 ','')]);
  items.push(['住房',F.has('house')?'有自己的家':'一輩子租屋',statLine('home_ownership_rate',v=>`台灣自有住宅率約 ${pct(v)}`).replace('📊 ','')]);
  const highlights=G.log.filter(l=>/結婚|出生|孩子|錄取|考上|畢業|入伍|志願役|工作|買了房|癌症|退休|阿公|失智|離婚|分手|在一起|打工度假|車禍|詐騙/.test(l.t));
  $('#app').innerHTML=`<div class="screen"><div class="sheet">
    <div class="kicker">人生回顧・${esc(G.city)}出生・${G.sex}・家境${G.fam}</div>
    <h1>${age} 歲的一生</h1>
    <span class="title-badge">${lifeTitle(G)}</span>
    <ul class="cmp">${items.map(([k,v,s])=>`<li><b>${k}</b><span>${esc(v)}${s?`<small>${esc(s)}</small>`:''}</span></li>`).join('')}</ul>
    <div class="btns"><button class="big" id="again">再活一次</button></div>
    <div class="btns"><button class="big ghost" id="srcb">資料來源</button></div>
  </div>
  <div class="sheet"><h2>人生大事</h2><ol class="timeline">${highlights.map(l=>`<li><span class="y">${l.age}</span><span>${esc(l.t)}</span></li>`).join('')}</ol></div>
  <div class="sheet"><h2>你做過的選擇</h2><ol class="timeline">${(G.choices||[]).map(l=>`<li><span class="y">${l.age}</span><span>${esc(l.t)}</span></li>`).join('')}</ol></div>
  </div>`;
  const html=$('#app').innerHTML;
  const bind=()=>{$('#again').onclick=showIntro;$('#srcb').onclick=()=>showSources(()=>{$('#app').innerHTML=html;bind()})};
  bind();
}

const EXTRA_SOURCES=[
 {t:'義務役 1 年（94 年次以後出生）；替代役只保留家庭、宗教因素',s:'公視新聞',u:'https://news.pts.org.tw/article/616470'},
 {t:'學測在高三寒假（1 月）、統測 4 月底～5 月初',s:'大學問',u:'https://www.unews.com.tw/News/Info/10307'},
 {t:'打工度假年齡 18～30 歲',s:'104 職場力（整理外交部規定）',u:'https://blog.104.com.tw/work-and-travel-japan/'},
 {t:'免費成人健檢：40～64 歲每 3 年一次',s:'TVBS 健康 2.0（國健署）',u:'https://health.tvbs.com.tw/medical/353395'},
 {t:'撥 1966 申請長照服務',s:'聯合報',u:'https://udn.com/news/story/7243/9468536'},
 {t:'年滿 65 歲雇主可以強制退休',s:'勞動基準法第 54 條',u:''},
];
const LABEL={population_by_city:'各縣市人口比例（決定出生地）',sex_ratio_at_birth:'出生性別比（決定性別）',life_table:'簡易生命表：每個年齡的死亡機率',life_expectancy:'平均壽命',death_causes:'十大死因',senior_high_tracks:'高一新生就讀類型比例',higher_education:'大學升學率',first_marriage_age:'平均初婚年齡',never_married_by_age:'各年齡層未婚比例（決定遇到另一半的機率）',divorce:'結婚與離婚對數',fertility:'生育率與生第一胎年齡',salary:'薪資（中位數、起薪、基本工資）',unemployment_rate:'失業率',home_ownership_rate:'自有住宅率',house_price_per_ping_by_city:'各縣市每坪房價',fraud:'詐騙案件數與損失',traffic_deaths_per_year:'交通事故死亡人數',cancer:'癌症新發人數（癌症時鐘）',pets_household_share:'家庭養寵物比例',dementia_or_longterm_care:'失智症盛行率'};
function showSources(back){
  const rows=Object.keys(LABEL).filter(k=>DATA[k]).map(k=>{const s=srcOf(k);return `<li>${esc(LABEL[k])}（${esc(s.year||'')}）${s.estimate?'・<b>估計值</b>':''}<br><span class="small">${esc(s.source||'')}${s.note?'：'+esc(s.note):''}</span>${s.url?`<br><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a>`:''}</li>`});
  $('#app').innerHTML=`<div class="screen"><div class="sheet">
    <h2>資料來源</h2>
    <p class="small">事件發生的機率、壽命、回顧裡的比較，都是用下面的官方統計算出來的。劇情文字和選項結果是遊戲設計。</p>
    <ol class="src">${rows.join('')}${EXTRA_SOURCES.map(s=>`<li>${esc(s.t)}<br><span class="small">${esc(s.s)}</span>${s.u?`<br><a href="${s.u}" target="_blank" rel="noopener">${esc(s.u)}</a>`:''}</li>`).join('')}</ol>
    ${MISSING.size?`<p class="small">缺少的資料（暫用粗估值）：${[...MISSING].map(k=>LABEL[k]||k).join('、')}</p>`:''}
    <div class="btns"><button class="big" id="back">返回</button></div>
  </div></div>`;
  $('#back').onclick=back;
}

addEventListener('keydown',e=>{
  if(!cur) return;
  const k={ArrowLeft:'l',ArrowRight:'r',ArrowDown:'d'}[e.key];
  if(k){e.preventDefault();choose(k)}
});

showIntro();
