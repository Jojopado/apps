<style>

<body>
<canvas id="view"></canvas>
<div id="btns">
  <div class="b" id="parry">PARRY<small>彈反</small></div>
  <div class="b" id="attack">ATTACK<small>攻擊</small></div>
  <div class="b" id="def">DEF<small>長按防禦</small></div>
</div>
<script src="game.js?v=3"></script>
<script>
(function(){
'use strict';
const { Game, ATTACKS, STRIKE_MS, SWING_MS, PARRY_WINDOW } = window.CanYouParryMe;
const game = new Game();

// ---------- canvas setup (low-res pixel buffer) ----------
const view = document.getElementById('view');
const vctx = view.getContext('2d');
const buf = document.createElement('canvas');
const ctx = buf.getContext('2d');
const W = 240; let H = 426;
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  view.width = Math.round(innerWidth*dpr); view.height = Math.round(innerHeight*dpr);
  H = Math.max(360, Math.min(560, Math.round(W*innerHeight/innerWidth)));
  buf.width = W; buf.height = H; ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize); resize();
const BTN = () => Math.round(H*0.21); // button area height in buffer px

// ---------- audio ----------
let AC = null;
function audioInit(){ if (AC) return; try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
function noise(dur, vol, hp){
  if (!AC) return; const n = AC.sampleRate*dur, b = AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type=hp?'highpass':'lowpass'; f.frequency.value=hp||600;
  const g=AC.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(AC.destination); s.start();
}
function tone(freq, dur, vol, type, slide){
  if (!AC) return; const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'square'; o.frequency.value=freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, AC.currentTime+dur);
  g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
}
const sfx = {
  clang(){ noise(0.12,0.5,3000); tone(1800,0.18,0.25,'triangle',900); tone(2600,0.1,0.15,'square'); },
  thud(){ noise(0.18,0.6); tone(90,0.25,0.5,'sawtooth',40); },
  chip(){ noise(0.08,0.3,1200); tone(400,0.08,0.2,'square',200); },
  whoosh(){ noise(0.16,0.25,900); },
  hit(){ noise(0.1,0.4,500); tone(220,0.12,0.3,'square',120); },
  stagger(){ tone(500,0.4,0.3,'square',250); tone(750,0.4,0.2,'square',375); },
  tick(kind){ tone(kind==='purple'?140:kind==='gold'?660:330,0.08,0.18,'square'); },
  swish(){ noise(0.08,0.35,2000); },
  crack(){ noise(0.3,0.6,200); tone(60,0.4,0.5,'sawtooth',30); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.25,0.25,'square'),i*120)); },
  lose(){ [300,250,200,150].forEach((f,i)=>setTimeout(()=>tone(f,0.3,0.25,'sawtooth'),i*180)); },
  start(){ tone(440,0.1,0.2,'square'); setTimeout(()=>tone(880,0.15,0.2,'square'),100); },
  guard(){ noise(0.07,0.35,2500); tone(1300,0.08,0.15,'triangle',800); },
  finisher(){ noise(0.35,0.7,800); tone(160,0.5,0.5,'sawtooth',40); setTimeout(()=>{ noise(0.2,0.5,4000); tone(2400,0.3,0.2,'triangle',1200); },90); },
};
function buzz(ms){ try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} }

// ---------- visual state ----------
const fx = { slash:0, shake:0, flash:0, flashColor:'#fff', red:0, floats:[], sparks:[], hint:null, intro:null, clear:null, parryAt:-9, swingAt:-9, stars:0 };
let armParryUntil = 0, armSwingStart = -9999;
function addFloat(text, x, y, color, size, life){ fx.floats.push({text,x,y,color,size:size||12,life:life||900,t:0,vy:-0.02}); }
function addSparks(x,y,n,color){ for(let i=0;i<n;i++){ const a=Math.random()*6.28, v=0.08+Math.random()*0.2; fx.sparks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-0.05,t:0,life:300+Math.random()*300,color}); } }

function handleEvent(ev){
  const e = game.enemy;
  switch(ev.type){
    case 'perfect': sfx.clang(); buzz(25); fx.flash=0.5; fx.flashColor='#fff7d0'; fx.shake=3; addSparks(120,H*0.56,18,'#ffe680'); addFloat('PERFECT',120,H*0.42,'#ffe066',20,800); break;
    case 'hurt': sfx.thud(); buzz(70); fx.red=0.7; fx.shake=7; addFloat('-'+ev.amount,120,H*0.5,'#ff5a5a',16,900); if (ev.text) addFloat(ev.text,120,H*0.6,'#ff8a8a',11,1400); break;
    case 'chip': sfx.chip(); fx.shake=2; addFloat('-'+ev.amount,100,H*0.62,'#8fc4ff',11,700); break;
    case 'block': addSparks(120,H*0.64,6,'#9ccbff'); break;
    case 'guardBreak': sfx.crack(); fx.red=0.9; fx.shake=9; break;
    case 'whiff': sfx.whoosh(); addFloat('揮空！',150,H*0.52,'#ff6b6b',14,900); break;
    case 'swing': sfx.swish(); armSwingStart = game.ft; break;
    case 'parryPress': armParryUntil = game.ft + 170; break;
    case 'enemyHit': sfx.hit(); buzz(15); fx.shake=3; addFloat('-'+ev.amount,120+(Math.random()*30-15),H*0.38,ev.combo>=3?'#ffd23c':'#fff',ev.combo?12+ev.combo*2:12,700); addSparks(120,H*0.45,8,'#ff9c9c'); break;
    case 'stagger': sfx.stagger(); buzz([30,40,30]); addFloat('架勢崩潰！',120,H*0.3,'#ffd23c',18,1200); fx.flash=0.3; fx.flashColor='#ffd23c'; break;
    case 'enemyBlock': sfx.guard(); fx.shake=1.5; addSparks(126,H*0.42,6,'#fff2b0'); addFloat('格開',150,H*0.36,'#cfd6e0',10,500); break;
    case 'finisher': sfx.finisher(); buzz([60,30,90]); fx.flash=0.85; fx.flashColor='#ffffff'; fx.shake=10; fx.slash=1; addSparks(120,H*0.45,30,'#ff4a4a'); addFloat(ev.last?'一閃・斬殺':'一閃！',120,H*0.3,'#ff4a4a',24,1300); break;
    case 'lifeLost': addFloat('還沒倒下…',120,H*0.38,'#ddd',11,1200); break;
    case 'windup': sfx.tick(ev.kind); break;
    case 'strikeStart': sfx.swish(); break;
    case 'hint': fx.hint = {text:ev.text, until:game.rt+5000}; break;
    case 'intro': fx.intro = {name:ev.name, text:ev.text, wave:ev.wave}; break;
    case 'fightStart': fx.intro = null; sfx.start(); break;
    case 'enemyDead': sfx.win(); buzz(40); fx.clear = {name:ev.name}; fx.flash=0.4; fx.flashColor='#fff'; break;
    case 'win': sfx.win(); break;
    case 'lose': sfx.lose(); buzz(200); fx.red=1; break;
    case 'phase2': fx.flash=0.5; fx.flashColor='#b14cff'; fx.shake=6; break;
    case 'taunt': tone(880,0.06,0.15,'square'); setTimeout(()=>tone(660,0.06,0.15,'square'),80); break;
  }
}

// ---------- drawing helpers ----------
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function poly(pts,c,stroke){ ctx.beginPath(); ctx.moveTo(Math.round(pts[0][0])+0.5,Math.round(pts[0][1])+0.5); for(let i=1;i<pts.length;i++) ctx.lineTo(Math.round(pts[i][0])+0.5,Math.round(pts[i][1])+0.5); ctx.closePath(); if(c){ctx.fillStyle=c;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();} }
function text(s,x,y,c,size,align,bold){ ctx.font=(bold===false?'':'bold ')+(size||10)+'px "Microsoft JhengHei","PingFang TC",system-ui,sans-serif'; ctx.textAlign=align||'center'; ctx.textBaseline='middle'; ctx.fillStyle='#000'; ctx.fillText(s,Math.round(x)+1,Math.round(y)+1); ctx.fillStyle=c; ctx.fillText(s,Math.round(x),Math.round(y)); }
function wrapText(str,maxW,size){ ctx.font='bold '+size+'px "Microsoft JhengHei","PingFang TC",system-ui,sans-serif'; const out=[]; let cur=''; for (const ch of str){ if (ctx.measureText(cur+ch).width>maxW && cur){ out.push(cur); cur=ch; } else cur+=ch; } if(cur) out.push(cur); return out; }
function thickLine(x1,y1,x2,y2,w1,w2,c,stroke){ const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l; poly([[x1+nx*w1,y1+ny*w1],[x2+nx*w2,y2+ny*w2],[x2-nx*w2,y2-ny*w2],[x1-nx*w1,y1-ny*w1]],c,stroke); }
// ---------- crisp pixel primitives (no anti-aliasing) ----------
const OUT = '#0d0a12';
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function bayer(x,y){ return (BAYER[(y&3)*4+(x&3)]+0.5)/16; }
function hex2rgb(h){ const n=parseInt(h.slice(1),16); return [n>>16,(n>>8)&255,n&255]; }
function lerp(a,b,t){ return a+(b-a)*t; }
function stamp(x1,y1,x2,y2,w1,w2,c){
  const dx=x2-x1, dy=y2-y1, n=Math.max(1,Math.ceil(Math.hypot(dx,dy)*1.4));
  ctx.fillStyle=c;
  for(let i=0;i<=n;i++){ const t=i/n, w=Math.max(1,Math.round(w1+(w2-w1)*t));
    ctx.fillRect(Math.round(x1+dx*t-w/2),Math.round(y1+dy*t-w/2),w,w); }
}
function disc(cx,cy,r,c){ ctx.fillStyle=c; cx=Math.round(cx); cy=Math.round(cy); r=Math.max(1,Math.round(r));
  for(let y=-r;y<=r;y++){ const w=Math.floor(Math.sqrt(r*r-y*y+r*0.6)); ctx.fillRect(cx-w,cy+y,w*2+1,1); } }
function circle(x,y,r,c){ disc(x,y,r,c); }
function ring(cx,cy,r,c,dash){ ctx.fillStyle=c; cx=Math.round(cx); cy=Math.round(cy); let x=Math.round(r),y=0,err=1-x,k=0;
  while(x>=y){ if(!dash||((k>>1)&1)===0){ for(const [a,b] of [[x,y],[y,x],[-y,x],[-x,y],[-x,-y],[-y,-x],[y,-x],[x,-y]]) ctx.fillRect(cx+a,cy+b,1,1); }
    y++; k++; if(err<0) err+=2*y+1; else { x--; err+=2*(y-x)+1; } } }
function ditherEllipse(cx,cy,rx,ry,c,dens){ ctx.fillStyle=c; cx=Math.round(cx); cy=Math.round(cy);
  for(let y=-ry;y<=ry;y++) for(let x=-rx;x<=rx;x++){ const q=(x*x)/(rx*rx)+(y*y)/(ry*ry); if(q<=1 && bayer(cx+x,cy+y) < dens*(1-q*0.7)) ctx.fillRect(cx+x,cy+y,1,1); } }
function pip(x,y,pts){ let ins=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }
function segDist(px_,py_,x1,y1,x2,y2){ const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy||1; let t=((px_-x1)*dx+(py_-y1)*dy)/l; t=Math.max(0,Math.min(1,t)); return Math.hypot(px_-(x1+dx*t),py_-(y1+dy*t)); }
const KIND_COLOR = { red:'#ff3b3b', purple:'#b14cff', gold:'#ffd23c' };
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b)); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); }

// ---------- sprite builder: shapes -> material grid -> shaded pixel art with outline ----------
function makeSprite(w,h,build){
  const M=new Int16Array(w*h).fill(-1), D=new Array(w*h), pals=[];
  const inb=(x,y)=>x>=0&&y>=0&&x<w&&y<h;
  const S={
    mat(dark,mid,light){ pals.push([dark,mid,light].map(hex2rgb)); return pals.length-1; },
    set(x,y,m){ x=Math.floor(x); y=Math.floor(y); if(inb(x,y)) M[y*w+x]=m; },
    get(x,y){ x=Math.floor(x); y=Math.floor(y); return inb(x,y)?M[y*w+x]:-1; },
    rect(x,y,ww,hh,m){ x=Math.round(x); y=Math.round(y); for(let j=0;j<Math.round(hh);j++) for(let i=0;i<Math.round(ww);i++) S.set(x+i,y+j,m); },
    ell(cx,cy,rx,ry,m){ for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++) for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){ const a=(x+0.5-cx)/rx,b=(y+0.5-cy)/ry; if(a*a+b*b<=1) S.set(x,y,m); } },
    poly(pts,m){ let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const p of pts){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
      for(let y=Math.floor(y0);y<=Math.ceil(y1);y++) for(let x=Math.floor(x0);x<=Math.ceil(x1);x++) if(pip(x+0.5,y+0.5,pts)) S.set(x,y,m); },
    line(x1,y1,x2,y2,wd,m){ const r=wd/2; for(let y=Math.floor(Math.min(y1,y2)-r);y<=Math.ceil(Math.max(y1,y2)+r);y++) for(let x=Math.floor(Math.min(x1,x2)-r);x<=Math.ceil(Math.max(x1,x2)+r);x++) if(segDist(x+0.5,y+0.5,x1,y1,x2,y2)<=r) S.set(x,y,m); },
    dot(x,y,c){ x=Math.floor(x); y=Math.floor(y); if(inb(x,y)) D[y*w+x]=hex2rgb(c); },
    dotIf(x,y,m,c){ if(S.get(x,y)===m) S.dot(x,y,c); },
  };
  build(S);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const c=cv.getContext('2d'), img=c.createImageData(w,h), d=img.data, O=hex2rgb(OUT);
  for(let y=0;y<h;y++){
    let x=0;
    while(x<w){
      const m=M[y*w+x]; let e=x; while(e+1<w && M[y*w+e+1]===m) e++;
      for(let k=x;k<=e;k++){
        let col=null;
        if(m<0){ if(S.get(k-1,y)>=0||S.get(k+1,y)>=0||S.get(k,y-1)>=0||S.get(k,y+1)>=0) col=O; }
        else {
          const p=pals[m], run=e-x+1, t=(k-x+0.5)/run; let tone=1;
          if(run>=4){ if(t>0.74) tone=0; else if(t>0.6 && ((k+y)&1)) tone=0; else if(t<0.22) tone=2; }
          const up=S.get(k,y-1), dn=S.get(k,y+1);
          if(up!==m && tone>0) tone=2;
          if(dn>=0 && dn!==m) tone=0;
          col=p[tone];
        }
        if(D[y*w+k] && (m>=0 || col)) col=D[y*w+k];
        if(col){ const i=(y*w+k)*4; d[i]=col[0]; d[i+1]=col[1]; d[i+2]=col[2]; d[i+3]=255; }
      }
      x=e+1;
    }
  }
  c.putImageData(img,0,0);
  return cv;
}
function tinted(cv,color){ cv._t=cv._t||{}; if(cv._t[color]) return cv._t[color];
  const t=document.createElement('canvas'); t.width=cv.width; t.height=cv.height; const c=t.getContext('2d');
  c.drawImage(cv,0,0); c.globalCompositeOperation='source-in'; c.fillStyle=color; c.fillRect(0,0,t.width,t.height); return (cv._t[color]=t); }

// ---------- enemy art (samurai set) ----------
const ART = {
  // 野武士: straw kasa hat, worn kimono + hakama, rusty katana
  goblin: { base:42, w:64, h:68, cy:36, eye:'#ffe9a0', skin:'#a8704f', sleeve:'#5e4a34',
    shoulders:[[-0.26,-0.14],[0.26,-0.14]], eyes:[[-0.08,-0.31],[0.04,-0.31]],
    blade:{steel:'#a9a394',edge:'#e8e2d0',handle:'#2a1c18',tsuba:'#5a4a30',w:2,curve:1.5},
    build(S,cx,cy,s){
      const straw=S.mat('#6e5024','#b08a3c','#dcbc66'), kim=S.mat('#3a2c22','#5e4a34','#7d6548'),
        hak=S.mat('#20202a','#383846','#52526a'), obi=S.mat('#561616','#8c2626','#b84040'),
        skin=S.mat('#6a4030','#a8704f','#c99070'), inner=S.mat('#8a8070','#c8bca4','#e8dcc4'),
        hair=S.mat('#0c0a10','#1c1822','#2c2634'), sheath=S.mat('#120d10','#2a1e22','#463036');
      S.line(cx+0.04*s,cy-0.42*s,cx+0.3*s,cy-0.12*s,3,hair);                         // ponytail
      S.poly([[cx-0.24*s,cy+0.1*s],[cx+0.24*s,cy+0.1*s],[cx+0.37*s,cy+0.6*s],[cx+0.05*s,cy+0.6*s],[cx,cy+0.4*s],[cx-0.05*s,cy+0.6*s],[cx-0.37*s,cy+0.6*s]],hak);
      S.rect(cx-0.33*s,cy+0.6*s,0.2*s,2,skin); S.rect(cx+0.13*s,cy+0.6*s,0.2*s,2,skin); // feet
      S.poly([[cx-0.3*s,cy-0.2*s],[cx+0.3*s,cy-0.2*s],[cx+0.26*s,cy+0.13*s],[cx-0.26*s,cy+0.13*s]],kim);
      S.poly([[cx-0.11*s,cy-0.2*s],[cx+0.11*s,cy-0.2*s],[cx,cy+0.0*s]],inner);
      S.poly([[cx-0.06*s,cy-0.2*s],[cx+0.06*s,cy-0.2*s],[cx,cy-0.08*s]],skin);
      S.rect(cx-0.27*s,cy+0.05*s,0.54*s,0.08*s,obi);
      S.line(cx-0.02*s,cy+0.09*s,cx-0.5*s,cy+0.3*s,3,sheath);
      S.ell(cx,cy-0.29*s,0.13*s,0.13*s,skin);
      S.poly([[cx-0.58*s,cy-0.35*s],[cx+0.58*s,cy-0.35*s],[cx+0.09*s,cy-0.64*s],[cx-0.09*s,cy-0.64*s]],straw);
      S.ell(cx,cy-0.64*s,0.1*s,0.05*s,straw);
      for(let i=-4;i<=4;i++){ const x2=cx+i*0.13*s, n=14; for(let k=1;k<n;k+=2){ const t=k/n; S.dotIf(lerp(cx,x2,t),lerp(cy-0.63*s,cy-0.36*s,t),straw,'#8a6a30'); } }

  const ft=game.ft; let lx=cx+0.06*s, ly=cy-0.3*s;
  const pts=[[lx,ly]]; for(let i=1;i<=9;i++) pts.push([lx+i*0.07*s, ly+i*0.035*s+Math.sin(ft*0.009-i*0.8)*i*0.35]);
  for(let i=0;i<pts.length-1;i++){ const w=Math.max(2,5-i*0.35); stamp(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],w+2,w+1,OUT); }
  for(let i=0;i<pts.length-1;i++){ const w=Math.max(1,3-i*0.25); stamp(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],w,w,col); }
}
function drawEnemy(e){
  const g = enemyGeom(e), {s,cx,cy} = g, d = e.def, ft = game.ft, a = ART[d.id]||ART.goblin;
  const k = s/a.base, spr = enemySprite(d.id);
  const dw = Math.round(a.w*k), dh = Math.round(a.h*k), x0 = Math.round(cx-a.w/2*k), y0 = Math.round(cy-a.cy*k);
  const winding = (e.state==='windup'||e.state==='pause') && e.attack;
  if (winding){
    const col = KIND_COLOR[e.attack.kind], r = Math.round(s*(1.35 - 0.75*g.windP));
    ring(cx,cy,r,col,e.state==='pause'); ring(cx,cy,r+1,col,e.state==='pause');
    if (g.windP>0.8 && e.state==='windup'){ ctx.globalAlpha=(g.windP-0.8)*5; ring(cx,cy,r,'#fff'); ctx.globalAlpha=1; }
  }
  const alpha = e.state==='dead' ? Math.max(0,1-(ft-e.deadAt)/1100) : 1;
  ctx.globalAlpha = alpha;
  ditherEllipse(cx, cy+0.63*s, Math.round(0.48*s), 4, '#000', 0.7);
  if (a.scarf) drawScarf(cx,cy,s,e.phase===2?'#d040ff':'#7a4fd1');
  const oc = e.state==='stagger' ? '#ffd23c' : e.state==='recover' ? '#6cff8a' : null;
  if (oc && (Math.floor(ft/120)&1 || e.state==='stagger')){ const t=tinted(spr,oc); for(const [ox,oy] of [[-1,0],[1,0],[0,-1],[0,1],[-2,0],[2,0]]) ctx.drawImage(t,x0+ox,y0+oy,dw,dh); }
  if (e.phase===2){ const t=tinted(spr,'#b14cff'); ctx.globalAlpha=alpha*0.5; for(const [ox,oy] of [[-1,0],[1,0],[0,-1]]) ctx.drawImage(t,x0+ox,y0+oy,dw,dh); ctx.globalAlpha=alpha; }
  ctx.drawImage(spr,x0,y0,dw,dh);
  if (ft < e.flinchUntil){ ctx.globalAlpha=alpha*0.75; ctx.drawImage(tinted(spr,'#ffffff'),x0,y0,dw,dh); ctx.globalAlpha=alpha; }
  // eyes
  const ec = winding ? KIND_COLOR[e.attack.kind] : (e.phase===2 ? '#ff5aff' : a.eye);
  const blink = !winding && (ft % 3200) < 110;
  for (const [ex,ey] of a.eyes){ const x=cx+ex*s, y=cy+ey*s; if(!blink){ px(x,y,winding?3:2,winding?2:1,ec); if (winding){ ctx.globalAlpha=alpha*0.45; px(x-1,y-1,5,4,ec); ctx.globalAlpha=alpha; } } }
  // arms + katana
  const wp = weaponPoints(e,g);
  const kind = e.attack && (winding || e.state==='strike') ? e.attack.kind : null;
  const wdx=wp.t[0]-wp.h[0], wdy=wp.t[1]-wp.h[1], wl=Math.hypot(wdx,wdy)||1, ux=wdx/wl, uy=wdy/wl;
  const h1=[wp.h[0]+ux*2, wp.h[1]+uy*2], h2=[wp.h[0]+ux*6, wp.h[1]+uy*6];
  const sh=a.shoulders.map(([sx,sy])=>[cx+sx*s, cy+sy*s]);
  const aw = Math.max(3, Math.round(0.09*s));
  for (const [S,Hd] of [[sh[0],h1],[sh[1],h2]]){ stamp(S[0],S[1],Hd[0],Hd[1],aw+2,aw+1,OUT); }
  for (const [S,Hd] of [[sh[0],h1],[sh[1],h2]]){ stamp(S[0],S[1],Hd[0],Hd[1],aw,aw-1,a.sleeve); }
  const bw = e.state==='strike' ? a.blade.w + Math.round(6*g.strikeP) : a.blade.w;
  drawKatana(wp.h[0]-ux*5, wp.h[1]-uy*5, wp.t[0], wp.t[1], Object.assign({}, a.blade, {w:bw, hf:0.2,
    glow: kind?KIND_COLOR[kind]:null, glowA: kind?(0.35+0.5*(e.state==='strike'?1:g.windP)):0}));
  for (const Hd of [h1,h2]){ disc(Hd[0],Hd[1],3,OUT); disc(Hd[0],Hd[1],2,a.skin); }
  if (e.state==='strike' && kind){ ctx.globalAlpha=alpha*0.3; stamp(wp.h[0],wp.h[1],wp.t[0]+(cx-wp.t[0])*0.3,wp.t[1]+(cy-wp.t[1])*0.3,bw+2,bw+2,KIND_COLOR[kind]); ctx.globalAlpha=alpha; }
  if (e.state==='stagger'){ for(let i=0;i<3;i++){ const an=ft*0.006+i*2.09; px(cx+Math.cos(an)*0.5*s-2,cy-0.85*s+Math.sin(an)*4-2,3,3,'#ffd23c'); px(cx+Math.cos(an)*0.5*s-1,cy-0.85*s+Math.sin(an)*4-1,1,1,'#fff'); } }
  ctx.globalAlpha = 1;
  if (e.wary && e.state==='idle') text('…',cx+0.5*s,cy-0.9*s,'#ccc',12);
}

// ---------- player: two-handed katana ----------
function playerPose(sp, base){
  if (sp<0.3){ const t=sp/0.3; return {hx:lerp(190,200,t), hy:lerp(base-36,base-72,t), ang:lerp(-1.78,-1.2,t)}; }
  const t=(sp-0.3)/0.7, e=1-Math.pow(1-t,3);
  return {hx:lerp(200,100,e), hy:lerp(base-72,base-10,e), ang:lerp(-1.2,-3.55,e)};
}
function drawSleeve(x1,y1,x2,y2,w1,w2){
  stamp(x1,y1,x2,y2,w1+2,w2+2,OUT); stamp(x1,y1,x2,y2,w1,w2,'#2b3554');
  const dx=x2-x1, dy=y2-y1, l=Math.hypot(dx,dy)||1, nx=-dy/l, ny=dx/l;
  stamp(x1+nx*w1*0.25,y1+ny*w1*0.25,x2+nx*w2*0.25,y2+ny*w2*0.25,Math.max(1,w1*0.25),1,'#3e4c78');
  for (let i=0;i<6;i++){ const t=0.15+i*0.12; px(x1+dx*t-nx*w1*0.2, y1+dy*t-ny*w1*0.2, 1,1,'#1c2238'); }
  const cx=x1+dx*0.9, cy=y1+dy*0.9; stamp(cx,cy,x1+dx*0.97,y1+dy*0.97,w2+1,w2,'#d8d0bc'); // under-kimono cuff
}
function drawFist(x,y){ disc(x,y,5,OUT); disc(x,y,4,'#d8a07a'); px(x-2,y-2,3,1,'#f0c49c'); px(x-3,y+1,6,1,'#a8704f'); }
function drawArms(){
  const p = game.player, ft = game.ft, base = H - BTN() - 14;
  let sp = (ft - armSwingStart)/SWING_MS; if (sp<0||sp>1) sp=-1;
  const parrying = ft < armParryUntil, defending = p.defHeld && !parrying && ft>=p.swingUntil, stunned = game.rt < p.stunUntil;
  const breath = Math.sin(ft*0.003)*1.5;
  let pose = {hx:190, hy:base-36+breath, ang:-1.78};
  if (sp>=0) pose = playerPose(sp, base);
  else if (parrying) pose = {hx:162, hy:base-48, ang:-2.5};
  else if (defending) pose = {hx:198, hy:base-62+breath*0.4, ang:-3.04};
  else if (stunned) pose = {hx:186, hy:base-14, ang:-2.3};
  if (p.guard<30 && sp<0) pose.hx += Math.round(Math.sin(ft*0.05));
  const L = 112, ux = Math.cos(pose.ang), uy = Math.sin(pose.ang);
  const {hx,hy} = pose, fhx = hx+ux*13, fhy = hy+uy*13;
  // swing trail
  if (sp>=0.3){ for (let i=6;i>=1;i--){ const q=playerPose(Math.max(0.3,sp-i*0.035),base); const tx=q.hx+Math.cos(q.ang)*L, ty=q.hy+Math.sin(q.ang)*L, mx=q.hx+Math.cos(q.ang)*L*0.6, my=q.hy+Math.sin(q.ang)*L*0.6;
    ctx.globalAlpha=0.12+0.05*(6-i); stamp(mx,my,tx,ty,3,2,'#e8f4ff'); } ctx.globalAlpha=1; }
  drawSleeve(252, base+30, hx, hy, 24, 11);
  drawSleeve(150, base+36, fhx, fhy, 22, 10);
  const r = drawKatana(hx-ux*10, hy-uy*10, hx+ux*L, hy+uy*L, {steel: p.guard<30?'#a8aeb8':'#c8d0dc', edge:'#ffffff', handle:'#1e1828', wrap:'#cfc6b0', tsuba:'#b08a3a', tsubaR:5, w:4, hf:0.25, curve:3,
    glow: defending?'#5aa0e8':parrying?'#ffe680':null, glowA: defending?0.45:0.7, notch: p.guard<40});
  drawFist(hx,hy); drawFist(fhx,fhy);
  if (parrying){ const [mx,my]=r.mid; const t=(armParryUntil-ft)/170, rr=Math.round(4+8*(1-t)); stamp(mx-rr,my,mx+rr,my,1,1,'#fff6c0'); stamp(mx,my-rr,mx,my+rr,1,1,'#fff6c0'); px(mx-1,my-1,3,3,'#ffffff'); }
  if (stunned){ text('暈眩',120,base-60,'#ff9c9c',14); }
  if (ft < p.exposedUntil){ ctx.globalAlpha = 0.5+0.5*Math.sin(ft*0.03); text('破綻中',120,base-50,'#ff6b6b',11); ctx.globalAlpha=1; }
}

// ---------- HUD ----------
function bar(x,y,w,h,v,max,c,bg){ px(x-1,y-1,w+2,h+2,OUT); px(x,y,w,h,bg||'#000'); const fw=Math.round(w*Math.max(0,Math.min(1,v/max))); px(x,y,fw,h,c); ctx.globalAlpha=0.35; px(x,y,fw,1,'#fff'); ctx.globalAlpha=0.3; px(x,y+h-1,fw,1,'#000'); ctx.globalAlpha=1; }
function drawHUD(){
  const e = game.enemy, p = game.player, base = H - BTN();
  // wave dots
  for(let i=0;i<3;i++) px(W-12-i*7,31,4,4,i<=game.wave?'#ffd23c':'#444');
  if (e){
    text(e.def.name,8,10,'#fff',10,'left');
    bar(8,16,W-16,6,e.hp,e.maxHp,'#e04848','#2a1414');
    bar(8,24,W-16,3,e.posture,e.postureMax,'#ffd23c','#2a2414');
    if (e.phase===2) text('II',W-30,10,'#ff5aff',9);
    for (let i=0;i<e.livesMax;i++){ const x=W-14-i*9; disc(x,11,3,OUT); disc(x,11,2,i<e.lives?'#ff3b3b':'#3a2a2a'); }
    if (e.state==='stagger' && Math.floor(game.rt/140)%2===0){ px(30,H*0.2-9,W-60,18,'rgba(60,0,0,0.85)'); text('ATTACK 一閃！',120,H*0.2,'#ff6a6a',13); }
  }
  // taunt (enemy thought)
  if (game.taunt && game.ft < game.taunt.until){
    const a = Math.min(1,(game.taunt.until-game.ft)/500);
    ctx.globalAlpha=a; px(10,32,W-20,16,'#1c1826'); px(10,32,W-20,1,'#5a4a7a'); px(10,47,W-20,1,'#5a4a7a');
    text(game.taunt.text,120,40,'#dcb8ff',10); ctx.globalAlpha=1;
  }
  // hint
  if (fx.hint && game.rt < fx.hint.until && game.state==='fight'){
    px(10,base-44,W-20,14,'rgba(0,0,0,0.75)'); text(fx.hint.text,120,base-37,'#ffe680',10);
  }
  // player bars
  bar(8,base-24,W-16,7,p.hp,p.maxHp,p.hp<30?'#ff5a5a':'#5ad66a','#142a18');
  bar(8,base-15,W-16,4,p.guard,p.guardMax,'#5aa0e8','#14202a');
  text('HP',4,base-20,'#fff',7,'left');
}

function drawFloats(dt){
  for (let i=fx.floats.length-1;i>=0;i--){ const f=fx.floats[i]; f.t+=dt; if(f.t>f.life){fx.floats.splice(i,1);continue;} const a=f.t<f.life*0.7?1:1-(f.t-f.life*0.7)/(f.life*0.3); ctx.globalAlpha=a; const sc = f.size>=16 && f.t<120 ? 1+ (120-f.t)/120*0.6 : 1; text(f.text,f.x,f.y+f.vy*f.t,f.color,Math.round(f.size*sc)); ctx.globalAlpha=1; }
  for (let i=fx.sparks.length-1;i>=0;i--){ const s=fx.sparks[i]; s.t+=dt; if(s.t>s.life){fx.sparks.splice(i,1);continue;} s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=0.0004*dt; px(s.x,s.y,2,2,s.color); }
}

// ---------- screens ----------
function drawTitle(){
  drawDungeon();
  px(0,0,W,H,'rgba(0,0,0,0.45)');
  const y = H*0.22;
  text('CAN YOU',120,y,'#fff',22); text('PARRY ME?',120,y+26,'#ffe066',26);
  text('一把刀・讀招・不能亂揮',120,y+52,'#bbb',10);
  const ly = H*0.47;
  px(20,ly-14,W-40,86,'rgba(10,8,16,0.85)');
  text('紅光 → 命中前一刻按 PARRY',120,ly,'#ff8a8a',10);
  text('紫光 → 不能彈反，長按 DEF',120,ly+16,'#d8a8ff',10);
  text('金光 → 防不住，只能 PARRY',120,ly+32,'#ffe680',10);
  text('綠框 → 破綻，快 ATTACK',120,ly+48,'#9cffb0',10);
  text('黃色架勢條滿 → ATTACK 一閃斬殺',120,ly+64,'#ffd23c',9);
  if (Math.sin(game.rt*0.005)>-0.2) text('點畫面開始',120,H*0.72,'#fff',12);
  text('砍進它出招中＝挨打｜它會記住你的習慣',120,H*0.77,'#8a7aa8',9);
}
function drawIntro(){
  const i = fx.intro; if(!i) return;
  const lines = wrapText(i.text, W-24, 9);
  px(0,H*0.3,W,62+lines.length*12,'rgba(0,0,0,0.78)');
  text('第 '+(i.wave+1)+' 波',120,H*0.3+14,'#ffd23c',10);
  text(i.name,120,H*0.3+34,'#fff',18);
  lines.forEach((l,k)=>text(l,120,H*0.3+56+k*12,'#ccc',9));
}
function drawEnd(){
  const win = game.state==='win'; const s = game.stats;
  px(14,H*0.18,W-28,H*0.5,'rgba(10,8,16,0.92)');
  text(win?'討伐成功！':'被打倒了…',120,H*0.18+24,win?'#ffe066':'#ff7a7a',20);
  if (win) text('評價 '+game.rank(),120,H*0.18+48,'#fff',16);
  const rows = [['完美彈反',s.perfect],['一閃斬殺',s.finishers],['被擊中',s.hits],['揮空',s.whiffs],['承受傷害',s.damageTaken],['時間',Math.round(s.time/1000)+'s']];
  rows.forEach((r,k)=>{ const y=H*0.18+68+k*14; text(r[0],60,y,'#aaa',10,'left'); text(String(r[1]),W-60,y,'#fff',10,'right'); });
  // adaptive summary
  const pr = game.profile; const notes=[];
  if (pr.defEMA>0.45) notes.push('你太常長按 Def');
  if (pr.attempts>=3 && pr.earlyMiss/pr.attempts>0.3) notes.push('你常提早按 Parry');
  if (s.whiffs>=4) notes.push('你亂揮太多次');
  if (!notes.length && !win) notes.push('多看武器的光，再按');
  if (notes.length) text('怪物的觀察：'+notes.join('、'),120,H*0.18+160,'#dcb8ff',9);
  if (Math.sin(game.rt*0.006)>-0.2) text('點畫面再來一次',120,H*0.18+H*0.5-16,'#fff',12);
}

// ---------- main loop ----------
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt = now - last; last = now; if (dt>100) dt=100;
  torchT += dt;
  game.step(dt);
  for (const ev of game.events.splice(0)) handleEvent(ev);

  // decay fx
  fx.shake *= Math.pow(0.85, dt/16); fx.flash *= Math.pow(0.8, dt/16); fx.red *= Math.pow(0.9, dt/16);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  const sx = fx.shake>0.3 ? Math.round((Math.random()-0.5)*fx.shake*2) : 0, sy = fx.shake>0.3 ? Math.round((Math.random()-0.5)*fx.shake*2) : 0;
  ctx.translate(sx,sy);
  if (game.state==='title'){ drawTitle(); }
  else {
    drawDungeon();
    if (game.enemy) drawEnemy(game.enemy);
    drawArms();
    drawFloats(dt);
    drawHUD();
    if (game.state==='intro') drawIntro();
    if (game.state==='clear' && fx.clear) text('擊倒！',120,H*0.3,'#ffe066',22);
    if (game.state==='win'||game.state==='lose') drawEnd();
  }
  ctx.setTransform(1,0,0,1,0,0);
  fx.slash *= Math.pow(0.88, dt/16);
  if (fx.slash>0.05){ ctx.globalAlpha=Math.min(1,fx.slash*1.5); const k=1-fx.slash; stamp(10,H*0.25+k*20,230,H*0.6-k*20,4,2,'#ffffff'); stamp(10,H*0.25+k*20+3,230,H*0.6-k*20+3,2,1,'#ff3b3b'); ctx.globalAlpha=1; }
  if (fx.flash>0.02){ ctx.globalAlpha=fx.flash; px(0,0,W,H,fx.flashColor); ctx.globalAlpha=1; }
  if (fx.red>0.02){ ctx.globalAlpha=fx.red*0.5; px(0,0,W,H,'#f00'); ctx.globalAlpha=1; }
  // slow-mo vignette
  if (game.rt < game.slowUntil){ ctx.globalAlpha=0.25; px(0,0,W,4,'#fff'); px(0,H-4,W,4,'#fff'); ctx.globalAlpha=1; }
  // blit
  vctx.imageSmoothingEnabled = false;
  vctx.clearRect(0,0,view.width,view.height);
  vctx.drawImage(buf,0,0,W,H,0,0,view.width,view.height);
}
requestAnimationFrame(frame);

// ---------- input ----------
function startOrRestart(){ audioInit(); if (AC && AC.state==='suspended') AC.resume(); if (game.state==='title'||game.state==='win'||game.state==='lose'){ fx.floats=[]; fx.sparks=[]; fx.hint=null; game.start(); } }
view.addEventListener('pointerdown', (e)=>{ e.preventDefault(); startOrRestart(); });
function bindBtn(id, name){
  const el = document.getElementById(id);
  const down = (e)=>{ e.preventDefault(); audioInit(); if (AC && AC.state==='suspended') AC.resume(); el.classList.add('on');
    if (game.state!=='fight' && game.state!=='intro'){ startOrRestart(); return; }
    if (name==='def') game.input('def', true); else game.input(name); };
  const up = (e)=>{ el.classList.remove('on'); if (name==='def') game.input('def', false); };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', e=>e.preventDefault());
}
bindBtn('parry','parry'); bindBtn('attack','attack'); bindBtn('def','def');
addEventListener('keydown', (e)=>{ if (e.repeat) return; if (e.key==='j'||e.key==='J'){ document.getElementById('parry').dispatchEvent(new PointerEvent('pointerdown')); } if (e.key==='k'||e.key==='K'){ document.getElementById('attack').dispatchEvent(new PointerEvent('pointerdown')); } if (e.key==='l'||e.key==='L'){ document.getElementById('def').dispatchEvent(new PointerEvent('pointerdown')); } if (e.key===' '||e.key==='Enter') startOrRestart(); });
addEventListener('keyup', (e)=>{ if (e.key==='j'||e.key==='J') document.getElementById('parry').dispatchEvent(new PointerEvent('pointerup')); if (e.key==='k'||e.key==='K') document.getElementById('attack').dispatchEvent(new PointerEvent('pointerup')); if (e.key==='l'||e.key==='L') document.getElementById('def').dispatchEvent(new PointerEvent('pointerup')); });

// ---------- debug bot (?bot=perfect|masher|idle&wave=N&ff=ms) ----------
(function(){
  const q = new URLSearchParams(location.search); const mode = q.get('bot'); if (!mode) return;
  const wave = parseInt(q.get('wave')||'0'), ff = parseInt(q.get('ff')||'0');
  let lastAtk=-1, next=0, el=0;
  function botStep(dt){
    el += dt;
    const e=game.enemy; if(!e||game.state!=='fight') return;
    if (mode==='perfect'){
      if (e.attack && (e.state==='windup'||e.state==='pause'||e.state==='strike')){
        if (e.attack.unparryable) game.input('def',true); else { game.input('def',false); const id=e.attack.windupStart+':'+e.attack.hitIndex; if(id!==lastAtk && game.impactTime()-game.ft<=90){ lastAtk=id; game.input('parry'); } }
      } else { game.input('def',false); if ((e.state==='recover'||(e.state==='stagger'&&game.player.combo<3)) && game.ft>=game.player.swingUntil) game.input('attack'); }
    } else if (mode==='masher'){ if (el>next){ const r=Math.random(); if(r<0.4)game.input('parry'); else if(r<0.75)game.input('attack'); else game.input('def',Math.random()<0.5); next=el+40+Math.random()*200; } }
  }
  game.start(wave);
  if (ff){ for (let t=0;t<ff;t+=16){ botStep(16); game.step(16); for (const ev of game.events.splice(0)) { if (ev.type==='intro'||ev.type==='hint'||ev.type==='taunt'||ev.type==='fightStart'||ev.type==='enemyDead') handleEvent(ev); } } window.__ffDone = true; }
  const tick = ()=>{ requestAnimationFrame(tick); if (!ff) botStep(16); };
  if (!ff) requestAnimationFrame(tick); else { game.step = ()=>{}; }
})();
window.__game = game;
})();
</script>
