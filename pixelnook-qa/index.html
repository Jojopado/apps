<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>像素小窩測試清單</title>
<style>
:root{
  --bg:#f6f1e7;--card:#fffdf8;--ink:#2d2a26;--sub:#6f685d;--line:#e3dac8;
  --acc:#e0782f;--acc2:#fff0e2;--ok:#2f9a5a;--okbg:#e5f5ea;--bad:#d2453b;--badbg:#fdecea;--skip:#8a8470;--skipbg:#efebe1;
  --chip:#f1e9da;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1a17;--card:#262320;--ink:#efe9de;--sub:#a59d8f;--line:#3a352e;
  --acc:#f0904a;--acc2:#3a2a1c;--ok:#5cc485;--okbg:#1f3427;--bad:#f06a5f;--badbg:#3c2220;--skip:#a8a291;--skipbg:#302d27;--chip:#322e28;
}}
:root[data-theme="dark"]{
  --bg:#1c1a17;--card:#262320;--ink:#efe9de;--sub:#a59d8f;--line:#3a352e;
  --acc:#f0904a;--acc2:#3a2a1c;--ok:#5cc485;--okbg:#1f3427;--bad:#f06a5f;--badbg:#3c2220;--skip:#a8a291;--skipbg:#302d27;--chip:#322e28;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:22px;margin:4px 0 2px}
.lead{color:var(--sub);margin:0 0 14px;font-size:14px}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stats{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:6px;align-items:center}
.stats b{color:var(--ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.phase{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc2);color:var(--acc);font-weight:700;display:grid;place-items:center}
.ph .t{flex:1;min-width:0}
.ph .t b{display:block;font-size:16px}
.ph .t span{font-size:12.5px;color:var(--sub)}
.mini{flex:none;font-size:12px;color:var(--sub);text-align:right}
.mini .dots{display:flex;gap:3px;justify-content:flex-end;margin-top:3px;flex-wrap:wrap;max-width:110px}
.mini .dots i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.skip{background:var(--skip)}
.chev{flex:none;color:var(--sub);transition:transform .15s}
.phase.open .chev{transform:rotate(90deg)}
.body{display:none;padding:0 14px 12px}
.phase.open .body{display:block}
.how{font-size:13px;color:var(--sub);background:var(--chip);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.case{border-top:1px dashed var(--line);padding:10px 0}
.case.ok{background:linear-gradient(90deg,var(--okbg),transparent 60%)}
.case.bad{background:linear-gradient(90deg,var(--badbg),transparent 60%)}
.case.skip{opacity:.65}
.cid{font-size:12px;font-weight:700;color:var(--acc);margin-right:6px}
.ct{font-weight:600}
.cd{font-size:13.5px;color:var(--sub);margin:3px 0 0}
.cd em{font-style:normal;color:var(--ink)}
.acts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.acts button{padding:5px 10px;font-size:13.5px}
.acts button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.acts button.on.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.acts button.on.skip{background:var(--skip);border-color:var(--skip);color:#fff}
textarea{width:100%;margin-top:7px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--bg);color:var(--ink);min-height:54px;resize:vertical}
.case:not(.bad) textarea.note:placeholder-shown{display:none}
.case.shownote textarea.note{display:block!important}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--chip);color:var(--sub);margin-left:4px;vertical-align:1px}
.tag.cloud{background:#e6eefc;color:#3b63b8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.cloud{background:#22304a;color:#9fb8ea}}
:root[data-theme="dark"] .tag.cloud{background:#22304a;color:#9fb8ea}
.report{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.report.show{display:flex}
.report .box{background:var(--card);width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;display:flex;flex-direction:column}
.report textarea{flex:1;min-height:240px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.legend{font-size:12.5px;color:var(--sub);margin:6px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>像素小窩・測試清單</h1>
  <p class="lead">從開場照順序玩，一關一關測。每項按 ✅ 正常／❌ 有問題／⏭ 先跳過，有問題就寫一句發生什麼事。全部記錄只存在這支手機的瀏覽器。測完按「複製問題回報」貼給我。<br>遊戲：<a href="https://jojopado.github.io/apps/pixelnook/" target="_blank" rel="noopener">jojopado.github.io/apps/pixelnook/</a></p>

  <div class="top">
    <div class="bar" id="bar"></div>
    <div class="stats" id="stats"></div>
    <div class="btns">
      <button class="pri" id="bReport">📋 複製問題回報</button>
      <button id="bNext">⬇ 跳到下一項沒測的</button>
      <button id="bReset">清除全部記錄</button>
    </div>
  </div>

  <div id="list"></div>
  <p class="legend"><span class="tag cloud">雲端</span> 要連網路，會讀寫線上資料。 <span class="tag">隔天</span> 要等到隔天（或改手機日期）才能測。</p>
</div>

<div class="report" id="report"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>問題回報（已複製）</b><button id="rClose">關閉</button></div>
  <textarea id="rText" readonly></textarea>
</div></div>

<script>
// 測試項目：照玩家實際會碰到的順序排
const PHASES = [
 { n:'開場與建立角色', sub:'第一次打開遊戲', how:'建議用「無痕視窗」或清除網站資料，才能看到第一次進遊戲的畫面。', cases:[
  ['讀取與畫面比例','打開網址，等畫面出來。直式手機會提示轉橫；按「直的也沒關係」也能玩。','畫面不會是空白、不會跑版、字不會被切掉'],
  ['建立角色','第一次進來會跳出角色視窗：取名字、換膚色、髮型、髮色、衣服、褲子、鞋子，按「好了！」。','預覽小人跟著變；◀ ▶ 能轉向；四個方向的臉、手、腳方向一致'],
  ['角色的層級','在預覽裡把四個方向都看一遍。','頭、手、腳沒有互相穿透或透視（後面那隻手不會蓋到身體前面）'],
  ['「我有存檔碼」按鈕','先別按，看到就好（第 8 關才測還原）。','建立角色視窗左下有這個按鈕'],
 ]},
 { n:'我的房間', sub:'佈置、商店、坐下', how:'進遊戲後在自己房間。點地板可以走路。', cases:[
  ['走路','點地板不同位置，也點家具後面、牆邊。','角色會繞過家具走過去，不會穿過家具；走路有動畫'],
  ['坐下／躺','點椅子、沙發、床。','會走過去坐下，方向正確，身體不會陷進家具裡'],
  ['商店購買','按 🛒 商店，各分頁看一看，買一件買得起的家具。','金幣正確扣掉；錢不夠的買不了；買的東西放進收納'],
  ['擺放家具','按 🛠 佈置，從下方選家具，點地板放下。','綠色＝可以放、紅色＝不行；不能疊在別的家具或擋住門口'],
  ['旋轉／收起／移動','點已經放好的家具 → ↻ 旋轉、📦 收起；拖曳換位置。','旋轉後占的格子跟著變；收起後回到收納；拖曳很順'],
  ['牆面物品','佈置 → 牆面分頁，放畫、時鐘、窗戶等。','只能掛在牆上，不會掛到門上'],
  ['壁紙與地板','佈置 → 壁紙、地板各換一次。','整面換掉，花紋沒有破圖'],
  ['家具層級','把幾件家具擺得很近（前後左右都有），角色在中間走來走去。','前面的東西蓋住後面的；角色走到家具後面會被遮住，走到前面會蓋住家具；沒有閃爍'],
  ['舒適度','擺越多家具，看畫面上的舒適度（❤）。','數字會跟著變'],
  ['重新整理還在','按「完成」後重新整理網頁。','房間、金幣、角色都還在'],
 ]},
 { n:'出門：城市三個區域', sub:'中央廣場・商業街・公園', how:'按 🚪 出門。', cases:[
  ['出門到中央廣場','按 🚪 出門。','淡出淡入，角色從自己家門口出來；主線任務「歡迎來到小鎮」自動完成、拿到金幣'],
  ['城市走路與鏡頭','點遠處地面，走到地圖邊緣。','鏡頭跟著角色，不會看到地圖外的黑邊太多；角色不會穿過建築、樹、噴水池'],
  ['城市的層級','走到房子、樹、路燈、公布欄的後面和前面。','前後遮擋正確，不會出現人站在屋頂上的感覺'],
  ['到商業街','走到中央廣場右邊的出口。','切換到商業街，從左邊入口出來；看得到咖啡廳、麵包店、超市'],
  ['到公園','回中央廣場，走到下方出口。','切換到城市公園；有池塘、涼亭、樹'],
  ['回家','在城市裡按 🏠 回家，或走回自己家門口點門。','回到房間；主線「回家看看」完成（如果輪到這一步）'],
 ]},
 { n:'咖啡廳與 Mia', sub:'第一份工作', how:'商業街 → 點咖啡廳的門進去。', cases:[
  ['進出室內','點咖啡廳門口進去，再從門口出來。','進去後角色站在門內；出來回到商業街咖啡廳門口'],
  ['跟 Mia 說話','點櫃台後的 Mia。','頭像正常（臉不會被切掉）；第一次是自我介紹，之後有選項'],
  ['坐咖啡廳椅子','點室內的椅子。','可以坐下'],
  ['咖啡廳打工','跟 Mia 選打工。照客人的單：先選杯子（熱／冰），再照順序加料，送出。','做對有分數、做錯會扣；時間到結算薪水；畫面在手機上按得到所有按鈕'],
  ['薪水與次數','同一天打工超過 3 次。','前 3 次有薪水，之後會說今天薪水次數用完（還是可以練習）'],
  ['熟練度升級','多做幾次，累積經驗。','升級後解鎖新飲料（卡布奇諾、焦糖拿鐵）'],
 ]},
 { n:'任務與金幣', sub:'主線・每日・每週', how:'畫面上方的「📋 任務」按鈕會顯示目前任務，點它打開任務清單。', cases:[
  ['主線照順序跑','照提示做：廣場 → Mia → 打工 → 回家 → 買家具 → 公園 → 收藏 3 種 → Leo → Nora → 完成一個委託。','每完成一步自動領獎並跳下一步；提示文字看得懂該去哪'],
  ['每日任務','打開任務清單看每日任務，做完一個。','進度數字會增加，完成後能領金幣'],
  ['每週任務','看每週任務（打工 10 次、參觀 5 間、參加主題）。','進度有累積'],
  ['每日刷新','隔天再打開。','每日任務換新的；昨天的進度歸零'],
 ]},
 { n:'公園與探索', sub:'Oliver・閃光物品・採集・調查・背包', how:'中央廣場往下走到公園。', cases:[
  ['跟 Oliver 說話','點公園裡的 Oliver。','有對話；選清理公園可以開始'],
  ['清理公園打工','接下後地圖上出現垃圾，走過去點它們撿起來，時間內撿完。','垃圾不會出現在樹或建築後面看不到的地方；撿完或時間到會結算薪水'],
  ['閃光物品','在三個區域找地上閃閃發亮的點，點它撿起來。','撿到收藏品或材料、有提示；同一天撿過的不會一直重新出現'],
  ['採集','點公園的花叢、草叢等可以採的東西。','拿到材料；同一個地方一天只能採一次，隔天重置'],
  ['調查','點可以調查的地方（樹洞、長椅等）。','偶爾找到東西；有文字回饋'],
  ['背包與圖鑑','按 🎒 背包，看收藏圖鑑和材料兩個分頁。','拿到的收藏品亮起來；集滿一個系列有獎勵'],
 ]},
 { n:'麵包店・超市・居民委託', sub:'Leo・Nora・Ethan・外送', how:'都在商業街。', cases:[
  ['麵包店分類打工','進麵包店，跟 Leo 選分類。輸送帶上的麵包放進對的籃子。','放對加分、放錯有提示；結算薪水'],
  ['外送','跟 Leo 選外送，接單後走到指定地點，點地上的包裹標記。','有倒數時間；送到後拿到外送費；超時會失敗'],
  ['超市收銀打工','進超市，跟 Nora 選結帳。點每樣商品算總價，再用硬幣找零。','找對錢才能下一位；低等級會顯示該找多少'],
  ['Ethan 的位置','白天到公園、晚上 5 點後到中央廣場找 Ethan。','位置會隨時間換；可以對話'],
  ['居民委託','跟任一位居民選「有什麼需要幫忙的嗎？」接委託，收集材料後再回去交。','材料夠才能交；交了會扣材料、拿到專屬家具；同一位不會重複'],
 ]},
 { n:'參觀與社群', sub:'別人的房間・讚・收藏・本週主題', how:'回到房間，按 👀 參觀。這一關會讀寫雲端。', cases:[
  ['發布自己的房間','先在房間佈置一下（改動後會自動上傳）。','別人能在「最新」看到你'],
  ['參觀列表','👀 參觀 → 最新、本週人氣、隨機各點一次。','列表會載入，點一間能進去看'],
  ['參觀別人的房間','進去後到處點。','只能看、不能改；可以走路；按 🏠 回家能回來'],
  ['按讚','在別人房間按 👍 按讚。','變成「已讚過」；同一間不能重複讚'],
  ['收藏房間','按 ☆ 收藏，再到參觀的「⭐ 收藏」分頁。','收藏的房間出現在列表；再按一次可以取消'],
  ['本週主題參賽','參觀 → 🏆 本週主題 → 提交我的房間參賽。','出現在列表；第一次參賽拿 50 金幣；再按是更新'],
  ['投票','在本週主題投別人一票（測試時可用第二支手機或無痕視窗投你自己的）。','每週 3 票；不能投自己；同一間不能投兩次'],
 ]},
 { n:'存檔碼與換手機', sub:'備份・還原', how:'按右上 ⚙ 設定。', cases:[
  ['看到存檔碼','打開 ⚙ 設定。','有一組 XXXX-XXXX-XXXX-XXXX 的碼和最近備份時間'],
  ['複製與立即備份','按 📋 複製、☁ 立即備份。','有提示；備份時間更新'],
  ['在別的瀏覽器還原','用無痕視窗或另一支手機打開遊戲 → 建立角色視窗按「我有存檔碼」→ 貼上 → 還原 → 確定還原。','先顯示找到的存檔（名字、金幣、時間）讓你確認；還原後房間、金幣、任務、背包都一樣'],
  ['打錯碼','故意輸入錯的存檔碼。','顯示找不到，不會把目前進度清掉'],
 ]},
 { n:'聲音・App 化・耐玩度', sub:'最後整體檢查', how:'', cases:[
  ['音效與音樂','⚙ 設定裡開關音效、背景音樂。','點按鈕、拿錢有音效；開關會記住'],
  ['加入主畫面','iPhone Safari：分享 → 加入主畫面。從主畫面打開。','圖示正常；全螢幕打開，沒有網址列'],
  ['離線打開','開過一次後，開飛航模式再打開。','還是能進遊戲玩自己的房間（參觀、雲端功能會提示連不上）'],
  ['亂點測試','像小朋友一樣狂點按鈕、快速開關視窗、走路中切區域、打工中按返回。','不會卡死、不會黑畫面、金幣不會變負的或亂跳'],
  ['流暢度','在城市裡走一陣子。','不會明顯卡頓或發燙'],
  ['整體感覺','玩 15～20 分鐘後的感想：哪裡無聊、哪裡看不懂、想加什麼。','在備註寫下來就好'],
 ]},
];
const TAGS = { '本週主題參賽':'cloud','投票':'cloud','發布自己的房間':'cloud','參觀列表':'cloud','按讚':'cloud','在別的瀏覽器還原':'cloud','複製與立即備份':'cloud','每日刷新':'day' };
const KEY = 'pixelnook.qa.v1';
let S = {}; try { S = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { S = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const L = 'ABCDEFGHIJ';
const all = []; PHASES.forEach((p, pi) => p.cases.forEach((c, ci) => all.push({ id: L[pi] + (ci + 1), pi, c })));
let openSet = new Set(); try { openSet = new Set(JSON.parse(localStorage.getItem(KEY + '.open') || '[0]')); } catch (e) { openSet = new Set([0]); }
const saveOpen = () => { try { localStorage.setItem(KEY + '.open', JSON.stringify([...openSet])); } catch (e) {} };

function render() {
  const list = $('#list'); list.innerHTML = '';
  PHASES.forEach((p, pi) => {
    const el = document.createElement('section'); el.className = 'phase' + (openSet.has(pi) ? ' open' : ''); el.id = 'p' + pi;
    const ids = p.cases.map((_, ci) => L[pi] + (ci + 1));
    const done = ids.filter(id => S[id] && S[id].s).length, bad = ids.filter(id => S[id] && S[id].s === 'bad').length;
    el.innerHTML = `<div class="ph"><div class="num">${L[pi]}</div><div class="t"><b>${esc(p.n)}</b><span>${esc(p.sub)}</span></div>
      <div class="mini">${done}/${ids.length}${bad ? ` · <span style="color:var(--bad)">❌${bad}</span>` : ''}<div class="dots">${ids.map(id => `<i class="${(S[id] && S[id].s) || ''}"></i>`).join('')}</div></div><div class="chev">▶</div></div>
      <div class="body">${p.how ? `<div class="how">${esc(p.how)}</div>` : ''}</div>`;
    el.querySelector('.ph').onclick = () => { el.classList.toggle('open'); el.classList.contains('open') ? openSet.add(pi) : openSet.delete(pi); saveOpen(); };
    const body = el.querySelector('.body');
    p.cases.forEach((c, ci) => {
      const id = L[pi] + (ci + 1), r = S[id] || {};
      const tag = TAGS[c[0]] === 'cloud' ? '<span class="tag cloud">雲端</span>' : TAGS[c[0]] === 'day' ? '<span class="tag">隔天</span>' : '';
      const d = document.createElement('div'); d.className = 'case ' + (r.s || '') + (r.note ? ' shownote' : ''); d.id = 'c-' + id;
      d.innerHTML = `<div><span class="cid">${id}</span><span class="ct">${esc(c[0])}</span>${tag}</div>
        <p class="cd">${esc(c[1])}</p><p class="cd">👉 <em>${esc(c[2])}</em></p>
        <div class="acts"><button data-s="ok" class="ok">✅ 正常</button><button data-s="bad" class="bad">❌ 有問題</button><button data-s="skip" class="skip">⏭ 跳過</button><button data-s="note">✏ 備註</button></div>
        <textarea class="note" placeholder="發生什麼事？在哪裡？（例：坐沙發時腳穿進椅墊）">${esc(r.note || '')}</textarea>`;
      d.querySelectorAll('.acts button').forEach(b => {
        if (b.dataset.s === r.s) b.classList.add('on');
        b.onclick = () => {
          const v = b.dataset.s;
          if (v === 'note') { d.classList.add('shownote'); d.querySelector('textarea').focus(); return; }
          S[id] = S[id] || {}; S[id].s = S[id].s === v ? '' : v; save();
          d.className = 'case ' + (S[id].s || '') + (S[id].note || S[id].s === 'bad' ? ' shownote' : '');
          d.querySelectorAll('.acts button').forEach(x => x.classList.toggle('on', x.dataset.s === S[id].s));
          if (S[id].s === 'bad') d.querySelector('textarea').focus();
          head(); renderMini(pi);
        };
      });
      d.querySelector('textarea').oninput = e => { S[id] = S[id] || {}; S[id].note = e.target.value; save(); };
      body.appendChild(d);
    });
    list.appendChild(el);
  });
  head();
}
function renderMini(pi) {
  const p = PHASES[pi], el = $('#p' + pi), ids = p.cases.map((_, ci) => L[pi] + (ci + 1));
  const done = ids.filter(id => S[id] && S[id].s).length, bad = ids.filter(id => S[id] && S[id].s === 'bad').length;
  el.querySelector('.mini').innerHTML = `${done}/${ids.length}${bad ? ` · <span style="color:var(--bad)">❌${bad}</span>` : ''}<div class="dots">${ids.map(id => `<i class="${(S[id] && S[id].s) || ''}"></i>`).join('')}</div>`;
}
function head() {
  const n = all.length, c = k => all.filter(a => S[a.id] && S[a.id].s === k).length;
  const ok = c('ok'), bad = c('bad'), skip = c('skip'), left = n - ok - bad - skip;
  $('#bar').innerHTML = `<i style="width:${ok / n * 100}%;background:var(--ok)"></i><i style="width:${bad / n * 100}%;background:var(--bad)"></i><i style="width:${skip / n * 100}%;background:var(--skip)"></i>`;
  $('#stats').innerHTML = `<span>共 <b>${n}</b> 項</span><span>✅ <b>${ok}</b></span><span>❌ <b>${bad}</b></span><span>⏭ <b>${skip}</b></span><span>還沒測 <b>${left}</b></span>`;
}
function reportText() {
  const lines = ['像素小窩 測試回報 ' + new Date().toLocaleString()];
  const n = all.length, c = k => all.filter(a => S[a.id] && S[a.id].s === k).length;
  lines.push(`正常 ${c('ok')}／有問題 ${c('bad')}／跳過 ${c('skip')}／還沒測 ${n - c('ok') - c('bad') - c('skip')}（共 ${n}）`, '');
  PHASES.forEach((p, pi) => {
    const rows = p.cases.map((cc, ci) => ({ id: L[pi] + (ci + 1), c: cc })).filter(a => S[a.id] && (S[a.id].s === 'bad' || (S[a.id].note || '').trim()));
    if (!rows.length) return;
    lines.push(`【${L[pi]} ${p.n}】`);
    rows.forEach(a => { const r = S[a.id]; lines.push(`${r.s === 'bad' ? '❌' : r.s === 'ok' ? '✅' : r.s === 'skip' ? '⏭' : '・'} ${a.id} ${a.c[0]}：${(r.note || '（沒寫備註）').trim()}`); });
    lines.push('');
  });
  if (lines.length <= 3) lines.push('目前沒有記錄到問題。');
  return lines.join('\n');
}
$('#bReport').onclick = async () => {
  const t = reportText(); $('#rText').value = t; $('#report').classList.add('show');
  try { await navigator.clipboard.writeText(t); } catch (e) { $('#rText').select(); }
};
$('#rClose').onclick = () => $('#report').classList.remove('show');
$('#report').onclick = e => { if (e.target.id === 'report') $('#report').classList.remove('show'); };
$('#bNext').onclick = () => {
  const a = all.find(x => !(S[x.id] && S[x.id].s)); if (!a) { alert('全部都測過了！'); return; }
  const el = $('#p' + a.pi); if (!el.classList.contains('open')) { el.classList.add('open'); openSet.add(a.pi); saveOpen(); }
  const c = $('#c-' + a.id); c.scrollIntoView({ behavior: 'smooth', block: 'center' });
};
$('#bReset').onclick = () => { if (confirm('確定清除全部測試記錄？')) { S = {}; save(); render(); } };
render();
</script>
</body>
</html>
